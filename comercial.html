<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nutríssima — Comercial</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --cacau:#33200F; --leite:#FFFDF9; --casca:#EFE7DC; --linha:#DCD2C4;
  --pist:#3E7C45; --pist-esc:#2E5F34; --mor:#C63A3A; --mel:#B8862B; --lar:#D9772B;
  --ard:#22303A; --tinta2:#7A6A57; --raio:14px;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;min-width:0}
html{overflow-x:hidden}
body{font-family:-apple-system,system-ui,'Segoe UI',sans-serif;background:var(--leite);
     color:var(--cacau);min-height:100vh;overflow-x:hidden}
.mono{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:90px}
img,svg{max-width:100%}

/* trilha comercial + topo (padrao do ERP) */
.trilha{display:flex;gap:4px;overflow-x:auto;padding:10px 16px;background:var(--cacau);scrollbar-width:none}
.trilha::-webkit-scrollbar{display:none}
.trilha span{flex:none;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
             color:#B9A896;padding:5px 10px;border-radius:99px;border:1px solid #5A4630}
.trilha span.atual{background:var(--pist);border-color:var(--pist);color:#fff}
.topo{padding:16px;display:flex;align-items:center;gap:12px}
.topo .voltar{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--linha);
              background:#fff;font-size:20px;cursor:pointer;color:var(--cacau);flex:none}
.topo h1{font-size:24px;font-weight:900;line-height:1.15}
.topo p,.sub{font-size:13.5px;color:var(--tinta2)}
main{padding:4px 16px}
.quem{margin-left:auto;font-size:11px;color:var(--tinta2);text-align:right;line-height:1.3;flex:none}
.quem b{display:block;font-weight:700;font-size:11.5px}

/* menu de acoes */
.pergunta{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
          color:#8A7A64;margin:14px 0 8px}
.acoes{display:grid;gap:12px}
.acoes button{display:flex;align-items:center;gap:14px;padding:18px;border-radius:var(--raio);
              border:1.5px solid var(--linha);background:#fff;cursor:pointer;text-align:left;
              min-height:72px;font-family:inherit;width:100%}
.acoes .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
            font-size:22px;flex:none}
.acoes b{font-size:18px;display:block;color:var(--cacau)}
.acoes small{font-size:13px;color:var(--tinta2)}

/* cartoes com tarja de urgencia (padrao de relatorios) */
.card{background:#fff;border:1.5px solid var(--linha);border-left:7px solid var(--u,var(--linha));
      border-radius:var(--raio);padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:16px;font-weight:900}

/* KPIs */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1.5px solid var(--linha);border-radius:var(--raio);padding:14px;text-align:center}
.kpi .r{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--tinta2)}
.kpi .v{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;display:block;
        line-height:1.1;margin-top:3px;font-family:ui-monospace,Menlo,monospace}
.kpi .n{font-size:12px;color:var(--tinta2);margin-top:3px}
.kpi.ruim{border-color:#E8B9B9;background:#FDF7F7}
.kpi.ruim .v{color:var(--mor)}
.kpi.bom .v{color:var(--pist)}

/* conta aberta */
.conta{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;
       background:#F6F1E8;border:1.5px solid var(--linha);border-radius:var(--raio);
       padding:13px 15px;font-size:14px;margin:10px 0;overflow-x:auto;white-space:nowrap}
.conta .m{color:var(--mor);font-weight:700}
.conta .p{color:var(--pist);font-weight:700}

/* linhas e tabelas */
.tw{border:1.5px solid var(--linha);border-radius:var(--raio);background:#fff;overflow-x:auto;
    -webkit-overflow-scrolling:touch;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#F6F1E8;text-align:left;padding:10px 12px;font-size:10.5px;text-transform:uppercase;
   letter-spacing:.06em;white-space:nowrap;font-weight:800;color:var(--tinta2)}
td{padding:11px 12px;border-top:1px solid var(--linha);vertical-align:top}
td.n{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;
     text-align:right;white-space:nowrap;font-weight:700}

/* controles */
label{display:block;font-size:13px;font-weight:700;color:var(--tinta2);margin:12px 0 5px}
input:not([type=checkbox]):not([type=radio]),select{
  width:100%;padding:13px 14px;font-size:17px;border:1.5px solid var(--linha);
  border-radius:12px;font-family:inherit;background:#fff;color:var(--cacau)}
input:not([type=checkbox]):not([type=radio]):focus,select:focus{outline:none;border-color:var(--pist)}
input[type=checkbox],input[type=radio]{width:26px;height:26px;accent-color:var(--pist);flex:none;margin:0}
button.b{width:100%;min-height:58px;font-size:18px;font-weight:900;border:none;border-radius:16px;
         background:var(--pist);color:#fff;cursor:pointer;font-family:inherit;margin-top:10px}
button.b:disabled{background:#C8C0B4}
button.s{min-height:44px;font-size:15px;font-weight:700;border:1.5px solid var(--linha);
         border-radius:12px;background:#fff;cursor:pointer;font-family:inherit;color:var(--cacau);
         padding:10px 16px}
button.s:hover{background:#F6F1E8}
button:focus-visible{outline:2px solid var(--pist);outline-offset:2px}
.drop{border:2px dashed var(--linha);border-radius:var(--raio);padding:26px 16px;text-align:center;
      background:#fff;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--pist);background:#F4F8F4}
.drop b{display:block;font-size:17px;margin-bottom:4px}
.drop span{color:var(--tinta2);font-size:13.5px}

/* chips e avisos */
.tag{display:inline-block;padding:4px 11px;border-radius:99px;font-size:11px;font-weight:800;
     text-transform:uppercase;letter-spacing:.04em;color:#fff}
.msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--cacau);
     color:#fff;padding:14px 22px;border-radius:14px;font-weight:700;font-size:15px;z-index:99;
     max-width:90%;text-align:center;box-shadow:0 6px 24px #0004}
.msg.erro{background:var(--mor)}
.vazio{text-align:center;color:#8A7A64;padding:30px 12px;font-size:15px}
.bar{height:7px;background:#EFE7DC;border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--pist)}

/* login */
.login{max-width:380px;margin:9vh auto;padding:0 16px}
.login .cx{background:#fff;border:1.5px solid var(--linha);border-radius:16px;padding:22px}
.login h1{font-size:23px;margin:0 0 4px;font-weight:900}
.login p{color:var(--tinta2);font-size:14px;margin:0 0 6px}

/* tabela vira cartao no celular */
/* celular estreito: tabela vira cartão empilhado, sem rolagem lateral */
@media(max-width:619px){
  table.cards thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  table.cards,table.cards tbody,table.cards tr,table.cards td{display:block;width:100%}
  .tw:has(table.cards){border:none;background:transparent;overflow:visible}
  table.cards tr{background:#fff;border:1.5px solid var(--linha);border-radius:12px;
                 padding:12px 14px;margin-bottom:10px}
  table.cards td{border:none;padding:3px 0;text-align:left}
  table.cards td:first-child{font-weight:900;font-size:15.5px;padding-bottom:6px}
  table.cards td[data-r]:not(:empty)::before{content:attr(data-r) " · ";color:var(--tinta2);
    font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:800}
  table.cards td:last-child{padding-top:10px}
  table.cards td:last-child button{width:100%}
  /* topo não pode estourar em tela de 320-360px: título quebra, e-mail encolhe */
  .topo{flex-wrap:wrap}
  .topo h1{font-size:20px}
  .quem{font-size:10px;max-width:120px}
  .quem b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acoes button{padding:15px}
  .conta{white-space:normal;line-height:1.6;font-size:13.5px}
}
@media(min-width:400px){ .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))} }

/* tablet/desktop — mesmos degraus do restante do ERP (index.html), pra não
   ficar uma coluna de celular perdida no meio de uma tela grande */
@media(min-width:820px){
  #app{max-width:900px}
  main{padding:8px 28px}
  .topo{padding:20px 28px}
  .topo h1{font-size:27px}
  .topo p,.sub{font-size:14px}
  .pergunta{margin:18px 0 10px}
  .acoes{grid-template-columns:1fr 1fr;gap:14px}
  .acoes button{min-height:76px;padding:18px}
  .card{padding:18px 20px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  button.b{max-width:340px}
}
@media(min-width:1200px){
  #app{max-width:1040px}
  .acoes{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:1440px){
  #app{max-width:1300px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
"use strict";

var URL_SB = "https://nfzospymzvlwzlcpgolm.supabase.co";

/* ================= utilitários ================= */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function brl(v){
  var n = Number(v)||0;
  return n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function inte(v){ return (Number(v)||0).toLocaleString("pt-BR"); }
function dataBR(d){
  if(!d) return "—";
  var p = String(d).slice(0,10).split("-");
  return p[2]+"/"+p[1]+"/"+p[0];
}
function digitos(s){ return String(s==null?"":s).replace(/\D/g,""); }
function msg(txt, erro){
  var d = document.createElement("div");
  d.className = "msg" + (erro ? " erro" : "");
  d.textContent = txt;
  document.body.appendChild(d);
  setTimeout(function(){ d.remove(); }, erro ? 5200 : 3400);
}

/* ================= leitura da NF-e ================= */
function elProgresso(){ return document.getElementById("res"); }
/* tenta de novo em falha de rede (celular oscila); erro do banco não é retentado */
async function comRetentativa(fn, tentativas){
  tentativas = tentativas || 3;
  var ultimoErro;
  for(var t=1; t<=tentativas; t++){
    try {
      var r = await fn();
      if(r && r.error){
        var m = String(r.error.message||"");
        var eRede = /load failed|fetch|network|timeout|aborted/i.test(m);
        if(!eRede || t === tentativas) return r;
        ultimoErro = r;
      } else {
        return r;
      }
    } catch(e){
      ultimoErro = { error: { message: e.message || String(e) } };
      if(t === tentativas) return ultimoErro;
    }
    await new Promise(function(res){ setTimeout(res, 800 * t); });
  }
  return ultimoErro;
}
async function expandirArquivos(arquivos, onProgress){
  var out = [];
  for(var i=0; i<arquivos.length; i++){
    var f = arquivos[i];
    var nome = f.name || "arquivo";
    if(/\.zip$/i.test(nome)){
      if(typeof JSZip === "undefined") throw new Error("biblioteca de .zip não carregou — confira a internet e recarregue a página");
      if(onProgress) onProgress("Descompactando "+nome+"…");
      var zip = await JSZip.loadAsync(f);
      var entradas = Object.keys(zip.files).filter(function(k){
        return /\.xml$/i.test(k) && !zip.files[k].dir;
      });
      for(var j=0; j<entradas.length; j++){
        if(onProgress && j % 500 === 0) onProgress("Descompactando "+nome+"… "+j+" de "+entradas.length);
        var texto = await zip.files[entradas[j]].async("string");
        out.push({ name: entradas[j].split("/").pop(), texto: texto });
      }
    } else if(/\.xml$/i.test(nome)){
      var t;
      try { t = await f.text(); } catch(e){ continue; }
      out.push({ name: nome, texto: t });
    }
    // outros tipos de arquivo são ignorados silenciosamente
  }
  return out;
}
function tag(el, nome){
  if(!el) return null;
  var n = el.getElementsByTagNameNS("*", nome)[0];
  return n ? n.textContent.trim() : null;
}
function bloco(el, nome){
  if(!el) return null;
  return el.getElementsByTagNameNS("*", nome)[0] || null;
}
var CFOP_BONIF = ["5910","6910","5911","6911","5912","6912","5913","6913"];

function lerNFe(texto, nomeArquivo){
  var doc = new DOMParser().parseFromString(texto, "application/xml");
  if(doc.getElementsByTagName("parsererror").length){
    return { erro:"arquivo não é um XML válido" };
  }
  var inf = doc.getElementsByTagNameNS("*","infNFe")[0];
  if(!inf) return { erro:"não encontrei a nota dentro do arquivo" };

  var chave = String(inf.getAttribute("Id")||"").replace(/^NFe/,"");
  if(chave.length !== 44) return { erro:"chave da nota com formato inesperado" };

  var ide = bloco(inf,"ide"), emit = bloco(inf,"emit"), dest = bloco(inf,"dest");
  var ender = bloco(dest,"enderDest"), tot = bloco(inf,"ICMSTot"), adic = bloco(inf,"infAdic");
  if(!ide || !emit || !dest) return { erro:"nota sem emitente ou destinatário" };

  var cpl = tag(adic,"infCpl") || "";
  var achouPedido = cpl.match(/Pedido\s*:?\s*(\d+)/i);

  var itens = [], dets = inf.getElementsByTagNameNS("*","det");
  for(var i=0; i<dets.length; i++){
    var d = dets[i], p = bloco(d,"prod");
    if(!p) continue;
    var cfop = tag(p,"CFOP");
    itens.push({
      n_item: Number(d.getAttribute("nItem")) || (i+1),
      codigo: tag(p,"cProd"),
      descricao: tag(p,"xProd"),
      cfop: cfop,
      ncm: tag(p,"NCM"),
      unidade: tag(p,"uCom"),
      qtd: Number(tag(p,"qCom")) || 0,
      v_un: Number(tag(p,"vUnCom")) || 0,
      v_prod: Number(tag(p,"vProd")) || 0,
      v_desc: Number(tag(p,"vDesc")) || 0,
      bonificacao: CFOP_BONIF.indexOf(cfop) >= 0
    });
  }
  if(!itens.length) return { erro:"nota sem itens" };

  return {
    chave: chave,
    arquivo: nomeArquivo,
    emitente_cnpj: digitos(tag(emit,"CNPJ")),
    emitente_nome: tag(emit,"xNome"),
    numero: tag(ide,"nNF"),
    serie: tag(ide,"serie"),
    emissao: String(tag(ide,"dhEmi")||"").slice(0,10),
    dh_emissao: tag(ide,"dhEmi"),
    nat_op: tag(ide,"natOp"),
    tp_nf: tag(ide,"tpNF"),
    fin_nfe: tag(ide,"finNFe"),
    dest_documento: digitos(tag(dest,"CNPJ") || tag(dest,"CPF")),
    dest_tipo: tag(dest,"CNPJ") ? "CNPJ" : "CPF",
    dest_nome: tag(dest,"xNome"),
    dest_ie: tag(dest,"IE"),
    dest_logradouro: tag(ender,"xLgr"),
    dest_numero: tag(ender,"nro"),
    dest_bairro: tag(ender,"xBairro"),
    dest_municipio: tag(ender,"xMun"),
    dest_uf: tag(ender,"UF"),
    dest_cep: digitos(tag(ender,"CEP")),
    v_prod: Number(tag(tot,"vProd")) || 0,
    v_desc: Number(tag(tot,"vDesc")) || 0,
    v_frete: Number(tag(tot,"vFrete")) || 0,
    v_outro: Number(tag(tot,"vOutro")) || 0,
    v_ipi: Number(tag(tot,"vIPI")) || 0,
    v_st: Number(tag(tot,"vST")) || 0,
    v_nf: Number(tag(tot,"vNF")) || 0,
    v_icms: Number(tag(tot,"vICMS")) || 0,
    v_pis: Number(tag(tot,"vPIS")) || 0,
    v_cofins: Number(tag(tot,"vCOFINS")) || 0,
    pedido_numero: achouPedido ? achouPedido[1] : null,
    itens: itens
  };
}

/* ================= navegação ================= */
var TELAS = {
  inicio:      { rotulo:"CRM Comercial",  sub:"Clientes, faturamento e funil", fn:telaInicio, etapa:"" },
  ficha:       { rotulo:"Ficha do cliente", sub:"Carteira, notas, contatos e histórico", fn:telaFicha, etapa:"Clientes" },
  agenda:      { rotulo:"Agenda",         sub:"Interações e o que precisa de retorno", fn:telaAgenda, etapa:"Contato" },

  resumo:      { rotulo:"Resumo",         sub:"Faturamento, ticket e concentração", fn:telaResumo, etapa:"Pedido" },
  faturamento: { rotulo:"Faturamento",    sub:"O que já saiu em nota fiscal", fn:telaFaturamento, etapa:"Pedido" },
  clientes:    { rotulo:"Clientes",       sub:"Cadastro e quanto cada um comprou", fn:telaClientes, etapa:"Clientes" },
  representantes:{ rotulo:"Representantes", sub:"Cadastro básico", fn:telaRepres, etapa:"Clientes" },
  importar:    { rotulo:"Importar NF-e",  sub:"Ler XML e alimentar o faturamento", fn:telaImportar, etapa:"Pedido" },
  pendencias:  { rotulo:"Pendências",     sub:"Códigos de NF sem produto cadastrado", fn:telaPendencias, etapa:"Pedido" },
  controladoria:{ rotulo:"Controladoria", sub:"DRE e apuração fiscal (e-commerce)", fn:telaControladoria, etapa:"" }
};
var telaAtual = "inicio";

/* trilha comercial — mesma ideia da trilha de produção do ERP */
function trilha(atual){
  var etapas = ["Clientes","Contato","Proposta","Pedido"];
  return '<div class="trilha">'+etapas.map(function(e){
    return '<span class="'+(e===atual?"atual":"")+'">'+esc(e)+'</span>';
  }).join("")+'</div>';
}
function telaBase(){ return ST.papel.comercial ? "inicio" : "controladoria"; }
function topo(t, sub, voltar){
  return '<div class="topo">'+
    (voltar ? '<button class="voltar" onclick="ir(\''+telaBase()+'\')" aria-label="Voltar">←</button>' : '')+
    '<div><h1>'+esc(t)+'</h1><p>'+esc(sub||"")+'</p></div>'+
    '<div class="quem"><b>'+esc(ST.email)+'</b>'+
      '<button class="s" style="margin-top:4px;min-height:32px;padding:5px 11px;font-size:12px" onclick="sair()">Sair</button>'+
    '</div></div>';
}
function moldura(conteudo){
  var t = TELAS[telaAtual] || TELAS.inicio;
  return trilha(t.etapa)+topo(t.rotulo, t.sub, telaAtual !== telaBase())+
         '<main id="corpo">'+conteudo+'</main>';
}
function ir(k){
  telaAtual = k;
  $("app").innerHTML = moldura('<div class="vazio">Carregando…</div>');
  TELAS[k].fn();
}

/* tela inicial — menu em botões grandes, padrão do ERP */
var MENU = [
  ["ficha",        "🪪","#E4EDF2",""],
  ["resumo",       "📈","#E4EDF2",""],
  ["agenda",       "🗓️","#F6ECD6",""],
  ["oportunidades","🎯","#EAF3EA",""],
  ["contatos",     "👥","#EFE7DC",""],
  ["faturamento",  "📊","#E4EDF2",""],
  ["clientes",     "🏢","#EAF3EA",""],
  ["representantes","🤝","#F3EAD8",""],
  ["importar",     "📥","#E7F0E4",""],
  ["pendencias",   "⚠️","#FBEAEA",""],
  ["controladoria","🧮","#EFE0D8",""]
];
async function telaInicio(){
  if(!ST.papel.comercial){ return ir("controladoria"); }
  var alerta = "";
  try{
    var r = await sb.schema("crm").from("interacoes")
      .select("data_proximo_passo").eq("concluido", false).not("proximo_passo","is",null);
    var hj = hojeISO();
    var atras = (r.data||[]).filter(function(x){ return x.data_proximo_passo && x.data_proximo_passo < hj; }).length;
    var hoje  = (r.data||[]).filter(function(x){ return x.data_proximo_passo === hj; }).length;
    if(atras || hoje) alerta = (atras?atras+" atrasado(s)":"")+(atras&&hoje?" · ":"")+(hoje?hoje+" para hoje":"");
  }catch(e){}
  var h = '<p class="pergunta">O que você vai fazer agora?</p><div class="acoes">'+
    MENU.map(function(m){
      var t = TELAS[m[0]];
      var sub = (m[0]==="agenda" && alerta) ? alerta : t.sub;
      return '<button onclick="ir(\''+m[0]+'\')">'+

async function entrar(){

async function carregarPapel(){

/* ================= resumo (painel de faturamento) ================= */
async function telaResumo(){
  var r = await sb.from("v_faturamento").select("*");
  if(r.error) return pinta('<div class="card" style="--u:#C63A3A">Não consegui ler o faturamento: '+esc(r.error.message)+'</div>');
  var L = r.data || [];

  var pend = await sb.from("nf_venda_item").select("v_liquido,qtd").is("produto_acabado_id", null);
  var semSku = (pend.data||[]).reduce(function(a,x){ return a + (Number(x.v_liquido)||0); }, 0);
  var semSkuN = (pend.data||[]).length;

  if(!L.length){
    return pinta(
      '<div class="card" style="--u:#3E7C45"><h3>Comece pela importação</h3>'+
      '<p>Envie os XMLs das notas fiscais e o faturamento aparece aqui, por produto, cliente e marca.</p>'+
      '<button class="b" style="margin-top:8px" onclick="ir(\'importar\')">Importar NF-e</button></div>');
  }

  var liq=0, un=0, cli={}, notas={}, porEmit={}, porMarca={}, porCliente={}, porSku={};
  L.forEach(function(x){
    var v = Number(x.v_liquido)||0, q = Number(x.qtd)||0;
    liq += v; un += q;
    if(x.cliente_id) cli[x.cliente_id]=1;
    notas[x.nf_id]=1;
    porEmit[x.emitente||"—"] = (porEmit[x.emitente||"—"]||0) + v;
    porMarca[x.marca||"— sem cadastro"] = (porMarca[x.marca||"— sem cadastro"]||0) + v;
    var nc = x.cliente||"—";
    porCliente[nc] = (porCliente[nc]||0) + v;
    var ns = x.sku || ("["+(x.codigo||"?")+"] "+(x.descricao||""));
    if(!porSku[ns]) porSku[ns] = {v:0,q:0};
    porSku[ns].v += v; porSku[ns].q += q;
  });
  var nNotas = Object.keys(notas).length;
  var nCli = Object.keys(cli).length;
  var ticket = nNotas ? liq/nNotas : 0;

  function ranking(obj, valorDe, n){
    return Object.keys(obj).map(function(k){ return {k:k, v:valorDe(obj[k])}; })
      .sort(function(a,b){ return b.v-a.v; }).slice(0, n||8);
  }
  var topCli = ranking(porCliente, function(v){return v;}, 6);
  var topSku = ranking(porSku, function(o){return o.v;}, 8);
  var maior = topCli.length ? topCli[0].v : 0;

  var datas = L.map(function(x){ return x.emissao; }).filter(Boolean).sort();
  var periodo = datas.length ? dataBR(datas[0])+" a "+dataBR(datas[datas.length-1]) : "—";

  var h = '';

  h += '<div class="kpis">'+
    '<div class="kpi bom"><div class="r">Faturamento líquido</div><div class="v">R$ '+brl(liq)+'</div>'+
      '<div class="n">'+inte(nNotas)+' notas</div></div>'+
    '<div class="kpi"><div class="r">Unidades</div><div class="v">'+inte(un)+'</div>'+
      '<div class="n">potes faturados</div></div>'+
    '<div class="kpi"><div class="r">Clientes</div><div class="v">'+inte(nCli)+'</div>'+
      '<div class="n">com compra no período</div></div>'+
    '<div class="kpi"><div class="r">Ticket por nota</div><div class="v">R$ '+brl(ticket)+'</div>'+
      '<div class="n">média do período</div></div>'+
    (semSkuN ? '<div class="kpi ruim"><div class="r">Sem cadastro</div><div class="v">R$ '+brl(semSku)+'</div>'+
      '<div class="n">'+inte(semSkuN)+' itens fora das análises</div></div>' : "")+
  '</div>';

  var emits = Object.keys(porEmit);
  if(emits.length > 1){
    h += '<div class="card" style="--u:#22303A"><h3>Por emitente</h3>'+
      emits.map(function(e){
        return '<div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0">'+
          '<span>'+esc(e)+'</span><b class="mono">R$ '+brl(porEmit[e])+'</b></div>';
      }).join("")+'</div>';
  }

  h += '<div class="card" style="--u:#3E7C45"><h3>Concentração por cliente</h3>'+
    topCli.map(function(c){
      var pct = liq ? (c.v/liq*100) : 0;
      return '<div style="margin-bottom:9px">'+
        '<div style="display:flex;justify-content:space-between;gap:10px;font-size:13.5px">'+
          '<span>'+esc(c.k)+'</span>'+
          '<b class="mono">R$ '+brl(c.v)+' · '+pct.toFixed(1)+'%</b></div>'+
        '<div class="bar"><i style="width:'+(maior? (c.v/maior*100):0)+'%"></i></div></div>';
    }).join("")+'</div>';

  h += '<h3 style="margin:18px 0 8px;font-size:15px">Mais vendidos</h3><div class="tw"><table>'+
    '<thead><tr><th>Produto</th><th style="text-align:right">Un</th>'+
    '<th style="text-align:right">Líquido</th><th style="text-align:right">Preço médio</th></tr></thead><tbody>'+
    topSku.map(function(s){
      var o = porSku[s.k];
      return '<tr><td>'+esc(s.k)+'</td><td class="n">'+inte(o.q)+'</td>'+
        '<td class="n">'+brl(o.v)+'</td><td class="n">'+(o.q? brl(o.v/o.q) : "—")+'</td></tr>';
    }).join("")+'</tbody></table></div>';

  if(semSkuN){
    h += '<div class="card" style="--u:#D9772B;margin-top:16px"><h3>'+inte(semSkuN)+
      ' itens ainda sem cadastro</h3>'+
      '<p>Esse valor está no banco, mas fica fora das análises por produto e por marca.</p>'+
      '<div class="conta"><span class="p">R$ '+brl(liq)+'</span> em análise '+
      '&nbsp;+&nbsp; <span class="m">R$ '+brl(semSku)+'</span> sem cadastro '+
      '&nbsp;=&nbsp; R$ '+brl(liq+semSku)+' faturado</div>'+
      '<button class="s" onclick="ir(\'pendencias\')">Ver o que falta cadastrar</button></div>';
  }
  pinta(h);
}

async function telaFaturamento(){

        '<td>'+esc(n.emitente||"—")+'</td>'+
        '<td class="n">'+n.itens+'</td><td class="n">'+inte(n.q)+'</td>'+

var CLASS_ROTULO = { base:"Base", prospeccao:"Prospecção", lead:"Lead" };
var CLASS_COR = { base:"#3E7C45", prospeccao:"#D9772B", lead:"#7A6A57" };
async function telaClientes(){
  var rc = await sb.from("clientes").select("*").order("razao_social");
  if(rc.error) return pinta('<div class="card" style="--u:#C63A3A">'+esc(rc.error.message)+'</div>');
  var C = rc.data || [];
  var rf = await sb.from("v_faturamento").select("cliente_id,v_liquido,emissao");
  var acum = {};
  (rf.data||[]).forEach(function(x){
    if(!x.cliente_id) return;
    if(!acum[x.cliente_id]) acum[x.cliente_id] = { v:0, ultima:null };
    acum[x.cliente_id].v += Number(x.v_liquido)||0;
    if(!acum[x.cliente_id].ultima || x.emissao > acum[x.cliente_id].ultima){
      acum[x.cliente_id].ultima = x.emissao;
    }
  });
  ST.cache.clientes = C.map(function(c){

  }).sort(function(a,b){ return b._v - a._v; });

    '</div></div>';
}
async function salvarCliente(){
  var id = $("clId").value.trim();
  var doc = $("clDoc").value.replace(/\D/g,"");
  var razao = $("clRazao").value.trim();
  if(!razao) return msg("Razão social é obrigatória", true);
  if(!doc) return msg("Documento é obrigatório", true);

  // Antes de criar, avisa se já existe outro cliente com o mesmo CNPJ/CPF
  // (evita duplicar quando o cadastro veio de um import sem documento)
  var existente = (ST.cache.clientes||[]).find(function(x){
    return (x.documento||"").replace(/\D/g,"") === doc && x.id !== id;
  });
  if(existente && !id){
    if(!confirm('Já existe um cliente com esse documento: "'+existente.razao_social+'". Deseja editar aquele registro em vez de criar um novo?')) return;
    id = existente.id;
  }

  var dados = {
    tipo_doc: $("clTipo").value,
    documento: doc,
    razao_social: razao,
    nome_fantasia: $("clFantasia").value.trim() || null,
    municipio: $("clMunicipio").value.trim() || null,
    uf: $("clUf").value.trim().toUpperCase() || null,
    segmento: $("clSegmento").value || null,
    classificacao: $("clClassificacao").value || null,
    representante_id: $("clRepresentante").value || null,
    observacao: $("clObs").value.trim() || null
  };

  var r;
  if(id){
    r = await sb.from("clientes").update(dados).eq("id", id);
  } else {
    dados.criado_por = ST.email;
    r = await sb.from("clientes").insert(dados);
  }
  if(r.error) return msg("Não deu para salvar: "+r.error.message, true);
  msg(id ? "Cliente atualizado" : "Cliente cadastrado");
  telaClientes();
}
function editarCliente(id){
  pinta(
    formCliente(id)+
    barraFiltrosClientes()+
    '<div id="lista" style="margin-top:12px"></div>');
  filtraClientes();
  var el = $("clRazao"); if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
}
function filtraClientes(){
  var q = ($("busca") ? $("busca").value : "").toLowerCase().trim();
  var qDigitos = q.replace(/\D/g,"");
  var fUf = $("filtroUf") ? $("filtroUf").value : "";
  var fSeg = $("filtroSegmento") ? $("filtroSegmento").value : "";
  var fClass = $("filtroClassificacao") ? $("filtroClassificacao").value : "";
  var L = (ST.cache.clientes||[]).filter(function(c){
    if(fUf && c.uf !== fUf) return false;
    if(fSeg && c.segmento !== fSeg) return false;
    if(fClass && c.classificacao !== fClass) return false;
    if(!q) return true;
    var casaNome = (c.razao_social||"").toLowerCase().indexOf(q) >= 0
        || (c.nome_fantasia||"").toLowerCase().indexOf(q) >= 0;
    var casaCidade = (c.municipio||"").toLowerCase().indexOf(q) >= 0;
    var casaDoc = qDigitos.length > 0 && (c.documento||"").indexOf(qDigitos) >= 0;
    return casaNome || casaCidade || casaDoc;
  });
  if(!L.length) return $("lista").innerHTML = '<div class="vazio">Nenhum cliente com esse filtro.</div>';
  $("lista").innerHTML = '<div class="tw"><table><thead><tr>'+
    '<th>Cliente</th><th>Cidade</th><th>UF</th><th>Documento</th><th>Classificação</th>'+
    '<th style="text-align:right">Comprado</th><th>Última</th><th></th>'+
    '</tr></thead><tbody>'+
    L.map(function(c){
      return '<tr><td>'+esc(c.razao_social)+'</td>'+
        '<td>'+esc(c.municipio||"—")+'</td><td>'+esc(c.uf||"—")+'</td>'+
        '<td class="mono">'+esc(c.documento)+'</td>'+
        '<td>'+(c.classificacao?'<span class="tag" style="background:'+CLASS_COR[c.classificacao]+'">'+CLASS_ROTULO[c.classificacao]+'</span>':"—")+'</td>'+
        '<td class="n">'+brl(c._v)+'</td>'+
        '<td class="mono">'+dataBR(c._ultima)+'</td>'+
        '<td><button onclick="editarCliente(\''+c.id+'\')">✏️ editar</button></td></tr>';
    }).join("")+'</tbody></table></div>';
}

    .select("titulo,etapa,valor_estimado,previsao_fechamento").eq("cliente_id", cid);

  var cart = rCart.data || [], nfs = rNf.data || [];
  var cts = rCt.data || [], ints = rIn.data || [], ops = rOp.data || [];

  function vl(x){ return (Number(x.qtd)||0) * (Number(x.valor_unitario)||0); }
  var abertos = cart.filter(function(x){ return x.status === 'aberto'; });
  var vAberto = abertos.reduce(function(a,x){ return a + vl(x); }, 0);
  var vTotal  = cart.reduce(function(a,x){ return a + vl(x); }, 0);
  var faturado = nfs.filter(function(n){ return n.classificacao === 'venda'; })
                    .reduce(function(a,n){ return a + (Number(n.v_prod)||0); }, 0);
  var ultimaNf = nfs.length ? nfs[0].emissao : null;
  var ultimoPed = cart.reduce(function(a,x){
    return (x.emissao && (!a || x.emissao > a)) ? x.emissao : a; }, null);
  var diasSemComprar = ultimoPed ? -diasAte(ultimoPed) : null;

  var h = '';
  /* cabeçalho do cliente */
  h += '<div class="card" style="--u:#22303A"><h3>'+esc(c.razao_social)+'</h3>'+
    '<div style="font-size:13.5px;color:var(--tinta2)">'+
      (c.municipio ? esc(c.municipio)+(c.uf?'/'+esc(c.uf):'')+' · ' : '')+
      (c.documento ? '<span class="mono">'+esc(c.documento)+'</span>'
                   : '<span style="color:var(--lar)">sem CNPJ — ainda não faturado</span>')+
      (c.segmento ? ' · <span class="tag" style="background:'+
        (c.segmento==='varejo'?'#3E7C45':c.segmento==='marketplace'?'#D9772B':
         c.segmento==='terceirizacao'?'#B8862B':'#7A6A57')+'">'+
        esc(SEG_ROTULO[c.segmento]||c.segmento)+'</span>' : '')+
    '</div></div>';

  if(c.segmento === 'marketplace' || c.segmento === 'terceirizacao'){
    h += '<div class="card" style="--u:#D9772B">Este cadastro é um '+
      esc(SEG_ROTULO[c.segmento])+', não um cliente final — os números abaixo '+
      'agregam vários compradores ou um contrato industrial.</div>';
  }

  /* KPIs */
  h += '<div class="kpis">'+
    '<div class="kpi'+(vAberto>0?'':'')+'"><div class="r">Em carteira</div><div class="v">R$ '+brl(vAberto)+'</div>'+
      '<div class="n">'+inte(abertos.length)+' linha(s) em aberto</div></div>'+
    '<div class="kpi bom"><div class="r">Já faturado</div><div class="v">R$ '+brl(faturado)+'</div>'+
      '<div class="n">'+inte(nfs.length)+' nota(s)</div></div>'+
    '<div class="kpi'+(diasSemComprar !== null && diasSemComprar > 60 ? ' ruim':'')+'">'+
      '<div class="r">Último pedido</div><div class="v">'+
      (diasSemComprar === null ? '—' : inte(diasSemComprar)+'d')+'</div>'+
      '<div class="n">'+(ultimoPed ? dataBR(ultimoPed) : 'nunca')+'</div></div>'+
    '<div class="kpi"><div class="r">Última NF</div><div class="v mono" style="font-size:16px">'+
      dataBR(ultimaNf)+'</div><div class="n">'+(ultimaNf?'faturamento':'sem faturamento')+'</div></div>'+
    '</div>';

  h += '<div class="conta">R$ '+brl(vTotal)+' pedido no total &nbsp;−&nbsp; '+
       '<span class="p">R$ '+brl(vTotal - vAberto)+'</span> já baixado &nbsp;=&nbsp; '+
       '<b>R$ '+brl(vAberto)+' em aberto</b></div>';

  /* contatos */
  h += secaoFicha('Contatos', cts.length, cts.map(function(x){
    return '<div class="card" style="--u:'+(x.decisor?'#B8862B':'#DCD2C4')+'">'+
      '<b>'+esc(x.nome)+'</b>'+(x.decisor?' <span class="tag" style="background:#B8862B">decisor</span>':'')+
      '<div style="font-size:13.5px;color:var(--tinta2);margin-top:4px">'+
        (x.cargo?esc(x.cargo)+' · ':'')+
        (x.telefone?'<span class="mono">'+esc(x.telefone)+'</span> · ':'')+
        esc(x.email||'')+'</div></div>';
  }).join(""), 'Nenhum contato cadastrado.');

  /* carteira em aberto */
  h += secaoFicha('Em carteira', abertos.length,
    abertos.length ? '<div class="tw"><table class="cards"><thead><tr>'+
      '<th>Pedido</th><th>Produto</th><th style="text-align:right">Qtd</th>'+
      '<th style="text-align:right">Valor</th><th>Entrega</th></tr></thead><tbody>'+
      abertos.map(function(x){
        var d = diasAte(x.entrega);
        var atras = d !== null && d < 0;
        return '<tr><td class="mono">'+esc(x.pedido_numero||'—')+'</td>'+
          '<td data-r="Produto">'+esc(x.produto_nome||'—')+'</td>'+
          '<td data-r="Qtd" class="n">'+inte(x.qtd)+
            (Number(x.qtd_separada)>0?' <span style="color:var(--pist)">('+inte(x.qtd_separada)+' sep.)</span>':'')+'</td>'+
          '<td data-r="Valor" class="n">'+brl(vl(x))+'</td>'+
          '<td data-r="Entrega" class="mono"'+(atras?' style="color:var(--mor);font-weight:700"':'')+'>'+
            dataBR(x.entrega)+(atras?' ⚠':'')+'</td></tr>';
      }).join("")+'</tbody></table></div>' : '', 'Nada em aberto.');

  /* oportunidades */
  h += secaoFicha('Oportunidades', ops.length, ops.map(function(x){
    var fechada = x.etapa.indexOf('fechado') === 0;
    return '<div class="card" style="--u:'+(x.etapa==='fechado_ganho'?'#3E7C45':
            x.etapa==='fechado_perdido'?'#C63A3A':'#B8862B')+'">'+
      '<b>'+esc(x.titulo)+'</b>'+
      '<div style="font-size:13.5px;color:var(--tinta2);margin-top:4px">'+
        esc(ETAPA_ROTULO[x.etapa]||x.etapa)+
        (x.valor_estimado!=null?' · R$ '+brl(x.valor_estimado):'')+
        (x.previsao_fechamento&&!fechada?' · previsão '+dataBR(x.previsao_fechamento):'')+
      '</div></div>';
  }).join(""), 'Nenhuma oportunidade.');

  /* histórico de interações */
  h += secaoFicha('Histórico de contato', ints.length, ints.slice(0,15).map(function(x){
    var pend = x.proximo_passo && !x.concluido;
    return '<div class="card" style="--u:'+(pend?'#D9772B':'#DCD2C4')+'">'+
      '<div style="font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--tinta2);font-weight:700">'+
        esc(x.tipo)+' · '+dataBR(x.data_interacao)+'</div>'+
      '<div style="margin-top:4px">'+esc(x.resumo)+'</div>'+
      (pend?'<div class="conta"><b>Pendente:</b> '+esc(x.proximo_passo)+
            (x.data_proximo_passo?' · '+dataBR(x.data_proximo_passo):'')+'</div>':'')+
      '</div>';
  }).join(""), 'Nenhuma interação registrada.');

  /* notas fiscais */
  if(nfs.length){
    h += secaoFicha('Notas fiscais', nfs.length,
      '<div class="tw"><table class="cards"><thead><tr>'+
      '<th>Número</th><th>Emissão</th><th style="text-align:right">Valor</th><th>Tipo</th>'+
      '</tr></thead><tbody>'+
      nfs.map(function(n){
        return '<tr><td class="mono">'+esc(n.numero)+'</td>'+
          '<td data-r="Emissão" class="mono">'+dataBR(n.emissao)+'</td>'+
          '<td data-r="Valor" class="n">'+brl(n.v_prod)+'</td>'+
          '<td data-r="Tipo">'+esc(n.classificacao)+'</td></tr>';
      }).join("")+'</tbody></table></div>', '');
  }

  h += '<div class="conta" style="margin-top:18px;white-space:normal">'+
    '<b>Como ler:</b> "Em carteira" = pedido lançado e ainda não baixado (fonte: carteira LBR). '+
    '"Já faturado" = soma do valor da mercadoria das NF-e de venda — exclui sell-in e bonificação. '+
    '"Último pedido" conta os dias desde a emissão mais recente; fica vermelho acima de 60 dias. '+
    'Clientes sem CNPJ vieram da carteira e ainda não foram faturados.</div>';

  alvo.innerHTML = h;
}
function secaoFicha(titulo, n, conteudo, vazio){
  return '<h3 style="margin:22px 0 8px;font-size:14px;text-transform:uppercase;'+
    'letter-spacing:.09em;color:var(--tinta2)">'+esc(titulo)+' · '+inte(n)+'</h3>'+
    (n ? conteudo : '<div class="vazio" style="padding:18px">'+esc(vazio)+'</div>');
}

/* ================= CRM: seletor de cliente com busca ================= */
/* Reaproveitado por Contatos, Agenda e Oportunidades. Mesmos critérios da
   tela Clientes: nome, cidade ou documento. */
function campoBuscaCliente(idBusca, idSelect){
  return '<label for="'+idBusca+'">Buscar cliente</label>'+
    '<input id="'+idBusca+'" placeholder="Nome, cidade ou CNPJ" '+
      'oninput="filtraSelectCliente(\''+idBusca+'\',\''+idSelect+'\')">';
}
function opcoesCliente(L){
  return '<option value="">Selecione o cliente…</option>' +
    (L||[]).map(function(c){
      return '<option value="'+c.id+'">'+esc(c.razao_social)+
             (c.municipio ? ' — '+esc(c.municipio)+(c.uf?'/'+esc(c.uf):'') : '')+'</option>';
    }).join("");
}
function filtraSelectCliente(idBusca, idSelect){
  var campo = $(idBusca), sel = $(idSelect);
  if(!campo || !sel) return;
  var q = campo.value.toLowerCase().trim();
  var qNum = q.replace(/\D/g,"");
  var L = (ST.cache.clientesSelect||[]).filter(function(c){
    if(!q) return true;
    return (c.razao_social||"").toLowerCase().indexOf(q) >= 0
        || (c.municipio||"").toLowerCase().indexOf(q) >= 0
        || (qNum && (c.documento||"").indexOf(qNum) >= 0);
  });
  var selecionado = sel.value;
  sel.innerHTML = opcoesCliente(L);
  // preserva a escolha se ela continuar na lista filtrada
  if(selecionado && L.some(function(c){ return c.id === selecionado; })) sel.value = selecionado;
  if(q && L.length === 1) sel.value = L[0].id;
  if(sel.onchange) sel.onchange();
}

/* ================= CRM: contatos ================= */
async function telaContatos(){
  var rc = await sb.from("clientes").select("id,razao_social,municipio,uf,documento").order("razao_social");
  var clientesL = rc.data || [];
  ST.cache.clientesSelect = clientesL;

  var opcoes = opcoesCliente(clientesL);

  var h = 
    '<div class="card" style="--u:#3E7C45"><h3>Cadastrar contato</h3>'+
    campoBuscaCliente("ctBuscaCli","ctCliente")+
    '<label for="ctCliente">Cliente</label><select id="ctCliente">'+opcoes+'</select>'+
    '<label for="ctNome">Nome</label><input id="ctNome" placeholder="Nome do contato">'+
    '<label for="ctCargo">Cargo (opcional)</label><input id="ctCargo" placeholder="Ex.: Comprador">'+
    '<label for="ctTelefone">Telefone (opcional)</label><input id="ctTelefone" placeholder="(00) 00000-0000">'+
    '<label for="ctEmail">E-mail (opcional)</label><input id="ctEmail" type="email">'+
    '<label style="display:flex;align-items:center;gap:8px;margin-top:14px;text-transform:none;letter-spacing:0;font-size:14px;font-weight:500">'+
      '<input type="checkbox" id="ctDecisor" style="width:auto"> É decisor de compra'+
    '</label>'+
    '<label for="ctObs">Observações (opcional)</label><input id="ctObs" placeholder="Anotação livre">'+
    '<button class="b" style="margin-top:14px" onclick="salvarContato()">Cadastrar</button></div>'+
    '<input id="ctBusca" placeholder="Buscar por nome ou cliente" oninput="filtraContatos()">'+
    '<div id="ctLista" style="margin-top:12px"></div>';
  pinta(h);
  carregarContatos();
}
async function carregarContatos(){
  var r = await sb.schema("crm").from("contatos")
    .select("id,cliente_id,nome,cargo,telefone,email,decisor,ativo")
    .order("nome");
  var lista = $("ctLista");
  if(r.error){
    if(lista) lista.innerHTML = '<div class="card" style="--u:#C63A3A">Não consegui ler os contatos: '+esc(r.error.message)+'</div>';
    return;
  }
  var porCliente = {};
  (ST.cache.clientesSelect||[]).forEach(function(c){ porCliente[c.id] = c.razao_social; });
  ST.cache.contatos = (r.data||[]).map(function(x){
    x._cliente = porCliente[x.cliente_id] || "—";
    return x;
  });
  filtraContatos();
}
function filtraContatos(){
  var q = ($("ctBusca") ? $("ctBusca").value : "").toLowerCase().trim();
  var L = (ST.cache.contatos||[]).filter(function(x){
    if(!x.ativo) return false;
    if(!q) return true;
    return (x.nome||"").toLowerCase().indexOf(q) >= 0
        || (x._cliente||"").toLowerCase().indexOf(q) >= 0;
  });
  var lista = $("ctLista");
  if(!lista) return;
  if(!L.length){ lista.innerHTML = '<div class="vazio">Nenhum contato encontrado.</div>'; return; }
  lista.innerHTML = '<div class="tw"><table class="cards"><thead><tr>'+
    '<th>Nome</th><th>Cliente</th><th>Cargo</th><th>Telefone</th><th>E-mail</th><th></th>'+
    '</tr></thead><tbody>'+
    L.map(function(x){
      return '<tr><td>'+esc(x.nome)+(x.decisor?' <span class="tag" style="background:#B8862B">decisor</span>':'')+'</td>'+
        '<td data-r="Cliente">'+esc(x._cliente)+'</td>'+
        '<td data-r="Cargo">'+esc(x.cargo||"—")+'</td>'+
        '<td data-r="Telefone" class="mono">'+esc(x.telefone||"—")+'</td>'+
        '<td data-r="E-mail">'+esc(x.email||"—")+'</td>'+
        '<td><button class="s" onclick="inativarContato(\''+x.id+'\')">Inativar</button></td></tr>';
    }).join("")+'</tbody></table></div>';
}
async function salvarContato(){
  var clienteId = $("ctCliente").value;
  var nome = $("ctNome").value.trim();
  if(!clienteId) return msg("Escolha o cliente", true);
  if(!nome) return msg("O nome é obrigatório", true);
  var r = await sb.schema("crm").from("contatos").insert({
    cliente_id: clienteId,
    nome: nome,
    cargo: $("ctCargo").value.trim() || null,
    telefone: $("ctTelefone").value.trim() || null,
    email: $("ctEmail").value.trim() || null,
    decisor: $("ctDecisor").checked,
    observacoes: $("ctObs").value.trim() || null,
    criado_por: ST.email
  });
  if(r.error) return msg("Não deu para cadastrar: "+r.error.message, true);
  msg("Contato cadastrado");
  $("ctNome").value=""; $("ctCargo").value=""; $("ctTelefone").value="";
  $("ctEmail").value=""; $("ctDecisor").checked=false; $("ctObs").value="";
  carregarContatos();
}
async function inativarContato(id){
  var r = await sb.schema("crm").from("contatos").update({ativo:false}).eq("id", id);
  if(r.error) return msg("Não deu para inativar: "+r.error.message, true);
  msg("Contato inativado");
  carregarContatos();
}

/* ================= CRM: agenda / interações ================= */
function hojeISO(){
  var d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function diasAte(dataISO){
  if(!dataISO) return null;
  var h = new Date(hojeISO()+"T00:00:00");
  var d = new Date(String(dataISO).slice(0,10)+"T00:00:00");
  return Math.round((d - h) / 86400000);
}
async function telaAgenda(){
  var rc = await sb.from("clientes").select("id,razao_social,municipio,uf,documento").order("razao_social");
  ST.cache.clientesSelect = rc.data || [];
  var rk = await sb.schema("crm").from("contatos").select("id,cliente_id,nome").eq("ativo", true).order("nome");
  ST.cache.contatosTodos = rk.data || [];

  var opcoes = opcoesCliente(ST.cache.clientesSelect);

  pinta(
    '<div class="card" style="--u:#3E7C45"><h3>Registrar interação</h3>'+
    campoBuscaCliente("agBuscaCli","agCliente")+
    '<label for="agCliente">Cliente</label><select id="agCliente" onchange="agContatosDoCliente()">'+opcoes+'</select>'+
    '<label for="agContato">Contato (opcional)</label><select id="agContato"><option value="">—</option></select>'+
    '<label for="agTipo">Tipo</label><select id="agTipo">'+
      '<option value="visita">Visita</option><option value="ligacao">Ligação</option>'+
      '<option value="mensagem">Mensagem</option><option value="email">E-mail</option>'+
      '<option value="reuniao">Reunião</option><option value="outro">Outro</option></select>'+
    '<label for="agData">Data da interação</label><input id="agData" type="date" value="'+hojeISO()+'">'+
    '<label for="agResumo">O que foi conversado</label><input id="agResumo" placeholder="Resumo da conversa">'+
    '<label for="agPasso">Próximo passo (opcional)</label><input id="agPasso" placeholder="Ex.: enviar tabela de preços">'+
    '<label for="agPassoData">Quando</label><input id="agPassoData" type="date">'+
    '<button class="b" style="margin-top:14px" onclick="salvarInteracao()">Registrar</button></div>'+
    '<div id="agLista"></div>');
  carregarAgenda();
}
function agContatosDoCliente(){
  var cid = $("agCliente").value;
  var L = (ST.cache.contatosTodos||[]).filter(function(x){ return x.cliente_id === cid; });
  $("agContato").innerHTML = '<option value="">—</option>' +
    L.map(function(x){ return '<option value="'+x.id+'">'+esc(x.nome)+'</option>'; }).join("");
}
async function carregarAgenda(){
  var r = await sb.schema("crm").from("interacoes")
    .select("id,cliente_id,contato_id,tipo,data_interacao,resumo,proximo_passo,data_proximo_passo,concluido")
    .order("data_interacao", {ascending:false});
  var lista = $("agLista");
  if(!lista) return;
  if(r.error){
    lista.innerHTML = '<div class="card" style="--u:#C63A3A">Não consegui ler a agenda: '+esc(r.error.message)+'</div>';
    return;
  }
  var nomeCliente = {}, nomeContato = {};
  (ST.cache.clientesSelect||[]).forEach(function(c){ nomeCliente[c.id] = c.razao_social; });
  (ST.cache.contatosTodos||[]).forEach(function(c){ nomeContato[c.id] = c.nome; });

  var todas = r.data || [];
  var pendentes = todas.filter(function(x){ return x.proximo_passo && !x.concluido; });

  // agrupamento pela decisão: o que precisa de ação, por urgência do retorno
  var grupos = [
    { t:"Atrasado",        cor:"#C63A3A", f:function(d){ return d !== null && d < 0; } },
    { t:"Hoje",            cor:"#D9772B", f:function(d){ return d === 0; } },
    { t:"Próximos 7 dias", cor:"#B8862B", f:function(d){ return d !== null && d >= 1 && d <= 7; } },
    { t:"Mais adiante",    cor:"#3E7C45", f:function(d){ return d !== null && d > 7; } },
    { t:"Sem data marcada",cor:"#7A6A57", f:function(d){ return d === null; } }
  ];

  var h = "";
  var atrasados = pendentes.filter(function(x){ var d=diasAte(x.data_proximo_passo); return d!==null && d<0; }).length;
  var deHoje = pendentes.filter(function(x){ return diasAte(x.data_proximo_passo) === 0; }).length;

  h += '<div class="kpis">'+
    '<div class="kpi'+(atrasados?' ruim':'')+'"><div class="r">Atrasado</div><div class="v">'+inte(atrasados)+'</div>'+
      '<div class="n">retorno vencido</div></div>'+
    '<div class="kpi"><div class="r">Para hoje</div><div class="v">'+inte(deHoje)+'</div>'+
      '<div class="n">próximo passo marcado</div></div>'+
    '<div class="kpi"><div class="r">Em aberto</div><div class="v">'+inte(pendentes.length)+'</div>'+
      '<div class="n">de '+inte(todas.length)+' interações</div></div>'+
    '</div>';

  h += '<div class="conta">'+inte(todas.length)+' interações &nbsp;−&nbsp; '+
    inte(todas.length - pendentes.length)+' já resolvidas &nbsp;=&nbsp; '+
    '<b>'+inte(pendentes.length)+' aguardando retorno</b></div>';

  grupos.forEach(function(g){
    var L = pendentes.filter(function(x){ return g.f(diasAte(x.data_proximo_passo)); })
                     .sort(function(a,b){
                       return String(a.data_proximo_passo||"9999").localeCompare(String(b.data_proximo_passo||"9999"));
                     });
    if(!L.length) return;
    h += '<h3 style="margin:20px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.09em;color:var(--tinta2)">'+
         esc(g.t)+' · '+inte(L.length)+'</h3>';
    L.forEach(function(x){
      var d = diasAte(x.data_proximo_passo);
      var quando = x.data_proximo_passo
        ? dataBR(x.data_proximo_passo) + (d < 0 ? ' · '+Math.abs(d)+' dia(s) atrás'
                                        : d === 0 ? ' · hoje' : ' · em '+d+' dia(s)')
        : "sem data";
      h += '<div class="card" style="--u:'+g.cor+'">'+
        '<h3>'+esc(nomeCliente[x.cliente_id] || "—")+'</h3>'+
        '<div style="font-size:13.5px;color:var(--tinta2);margin-bottom:6px">'+
          esc(x.tipo)+' em '+dataBR(x.data_interacao)+
          (x.contato_id && nomeContato[x.contato_id] ? ' · '+esc(nomeContato[x.contato_id]) : '')+
        '</div>'+
        '<div style="margin-bottom:8px">'+esc(x.resumo)+'</div>'+
        '<div class="conta"><b>Próximo passo:</b> '+esc(x.proximo_passo)+' &nbsp;·&nbsp; '+esc(quando)+'</div>'+
        '<button class="s" style="margin-top:8px" onclick="concluirInteracao(\''+x.id+'\')">Marcar como feito</button>'+
        '</div>';
    });
  });

  var semPasso = todas.filter(function(x){ return !x.proximo_passo || x.concluido; });
  if(semPasso.length){

async function carregarOportunidades(){
  var r = await sb.schema("crm").from("oportunidades")
    .select("id,cliente_id,titulo,produto_acabado_id,valor_estimado,etapa,probabilidade,previsao_fechamento,motivo_perda")
    .order("previsao_fechamento", {ascending:true, nullsFirst:false});
  var lista = $("opLista");
  if(!lista) return;
  if(r.error){
    lista.innerHTML = '<div class="card" style="--u:#C63A3A">Não consegui ler as oportunidades: '+esc(r.error.message)+'</div>';
    return;
  }
  var nomeCliente = {}, nomeProd = {};
  (ST.cache.clientesSelect||[]).forEach(function(c){ nomeCliente[c.id] = c.razao_social; });
  (ST.cache.produtos||[]).forEach(function(p){ nomeProd[p.id] = p.nome; });

  var todas = r.data || [];
  if(!todas.length){
    lista.innerHTML = '<div class="vazio">Nenhuma oportunidade cadastrada ainda.</div>';
    return;
  }
  var abertas = todas.filter(function(x){ return x.etapa.indexOf("fechado") !== 0; });
  var ganhas  = todas.filter(function(x){ return x.etapa === "fechado_ganho"; });
  var perdidas= todas.filter(function(x){ return x.etapa === "fechado_perdido"; });

  function soma(L){ return L.reduce(function(a,x){ return a + (Number(x.valor_estimado)||0); }, 0); }
  // ponderado: valor × probabilidade da etapa (o que se espera fechar de fato)
  function somaPond(L){
    return L.reduce(function(a,x){
      var e = ETAPAS.filter(function(g){ return g.k === x.etapa; })[0];
      var p = (x.probabilidade != null ? x.probabilidade : (e ? e.prob : 0)) / 100;
      return a + (Number(x.valor_estimado)||0) * p;
    }, 0);
  }
  var vAberto = soma(abertas), vPond = somaPond(abertas), vGanho = soma(ganhas);
  var taxa = (ganhas.length + perdidas.length) > 0
    ? (ganhas.length / (ganhas.length + perdidas.length) * 100) : null;

  var h = '<div class="kpis">'+
    '<div class="kpi"><div class="r">Funil aberto</div><div class="v">R$ '+brl(vAberto)+'</div>'+
      '<div class="n">em '+inte(abertas.length)+' oportunidades</div></div>'+
    '<div class="kpi bom"><div class="r">Ponderado</div><div class="v">R$ '+brl(vPond)+'</div>'+
      '<div class="n">valor × probabilidade</div></div>'+
    '<div class="kpi bom"><div class="r">Ganho</div><div class="v">R$ '+brl(vGanho)+'</div>'+
      '<div class="n">'+inte(ganhas.length)+' fechadas</div></div>'+
    '<div class="kpi'+(taxa !== null && taxa < 50 ? ' ruim' : '')+'"><div class="r">Taxa de ganho</div>'+
      '<div class="v">'+(taxa === null ? '—' : taxa.toFixed(0)+'%')+'</div>'+
      '<div class="n">'+inte(ganhas.length)+' ganhas / '+inte(perdidas.length)+' perdidas</div></div>'+
    '</div>';

  h += '<div class="conta">R$ '+brl(vAberto)+' no funil &nbsp;×&nbsp; probabilidade por etapa &nbsp;=&nbsp; '+
       '<span class="p">R$ '+brl(vPond)+'</span> esperado</div>';

  ETAPAS.forEach(function(e){
    var L = abertas.filter(function(x){ return x.etapa === e.k; });
    if(!L.length) return;
    h += '<h3 style="margin:20px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.09em;color:var(--tinta2)">'+
         esc(e.r)+' · '+inte(L.length)+' · R$ '+brl(soma(L))+'</h3>';
    L.forEach(function(x){
      var d = diasAte(x.previsao_fechamento);
      var prev = x.previsao_fechamento
        ? dataBR(x.previsao_fechamento) + (d < 0 ? ' · vencida há '+Math.abs(d)+' dia(s)'
                                          : d === 0 ? ' · hoje' : ' · em '+d+' dia(s)')
        : 'sem previsão';
      var corCard = (d !== null && d < 0) ? '#C63A3A' : e.cor;
      h += '<div class="card" style="--u:'+corCard+'">'+
        '<h3>'+esc(nomeCliente[x.cliente_id]||"—")+'</h3>'+
        '<div style="margin-bottom:6px">'+esc(x.titulo)+'</div>'+
        '<div style="font-size:13.5px;color:var(--tinta2);margin-bottom:8px">'+
          (x.produto_acabado_id && nomeProd[x.produto_acabado_id] ? esc(nomeProd[x.produto_acabado_id])+' · ' : '')+
          esc(prev)+'</div>'+
        (x.valor_estimado != null
          ? '<div class="conta">R$ '+brl(x.valor_estimado)+' estimado &nbsp;×&nbsp; '+
            (x.probabilidade != null ? x.probabilidade : e.prob)+'% &nbsp;=&nbsp; '+
            '<span class="p">R$ '+brl((Number(x.valor_estimado)||0) * ((x.probabilidade != null ? x.probabilidade : e.prob)/100))+'</span></div>'
          : '')+
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">'+
          '<button class="s" onclick="moverEtapa(\''+x.id+'\',1)">Avançar etapa</button>'+
          '<button class="s" onclick="fecharOportunidade(\''+x.id+'\',true)">Ganhou</button>'+
          '<button class="s" onclick="fecharOportunidade(\''+x.id+'\',false)">Perdeu</button>'+
        '</div></div>';
    });
  });

  var fechadas = ganhas.concat(perdidas);
  if(fechadas.length){
    h += '<h3 style="margin:24px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.09em;color:var(--tinta2)">'+
         'Fechadas · '+inte(fechadas.length)+'</h3>'+
         '<div class="tw"><table class="cards"><thead><tr>'+
         '<th>Cliente</th><th>Oportunidade</th><th>Resultado</th><th style="text-align:right">Valor</th><th>Motivo</th>'+
         '</tr></thead><tbody>'+
      fechadas.map(function(x){
        var ganhou = x.etapa === "fechado_ganho";
        return '<tr><td>'+esc(nomeCliente[x.cliente_id]||"—")+'</td>'+
          '<td data-r="Oportunidade">'+esc(x.titulo)+'</td>'+
          '<td data-r="Resultado"><span class="tag" style="background:'+(ganhou?'#3E7C45':'#C63A3A')+'">'+
            (ganhou?'ganho':'perdido')+'</span></td>'+
          '<td data-r="Valor" class="n">'+(x.valor_estimado != null ? brl(x.valor_estimado) : "—")+'</td>'+
          '<td data-r="Motivo">'+esc(x.motivo_perda||"—")+'</td></tr>';
      }).join("")+'</tbody></table></div>';
  }
  lista.innerHTML = h;
}
async function salvarOportunidade(){
  var cid = $("opCliente").value;
  var titulo = $("opTitulo").value.trim();
  if(!cid) return msg("Escolha o cliente", true);
  if(!titulo) return msg("Descreva a oportunidade", true);
  var valor = $("opValor").value;
  var prodId = $("opProduto").value;
  var linha = null;
  if(prodId){
    var p = (ST.cache.produtos||[]).filter(function(y){ return y.id === prodId; })[0];
    if(p) linha = p.linha || null;
  }
  var r = await sb.schema("crm").from("oportunidades").insert({
    cliente_id: cid,
    titulo: titulo,
    produto_acabado_id: prodId || null,
    linha: linha,
    valor_estimado: valor !== "" ? Number(valor) : null,
    etapa: $("opEtapa").value,
    previsao_fechamento: $("opPrevisao").value || null,
    observacoes: $("opObs").value.trim() || null
  });
  if(r.error) return msg("Não deu para cadastrar: "+r.error.message, true);
  msg("Oportunidade cadastrada");
  $("opTitulo").value=""; $("opValor").value=""; $("opPrevisao").value=""; $("opObs").value="";
  carregarOportunidades();
}
async function moverEtapa(id, passo){
  var atual = null;
  var r0 = await sb.schema("crm").from("oportunidades").select("etapa").eq("id", id).single();
  if(r0.error) return msg("Não consegui ler a etapa: "+r0.error.message, true);
  atual = r0.data.etapa;
  var idx = -1;
  ETAPAS.forEach(function(e, i){ if(e.k === atual) idx = i; });
  if(idx < 0) return msg("Essa oportunidade já está fechada", true);
  var novo = idx + passo;
  if(novo >= ETAPAS.length) return msg("Última etapa antes de fechar — use Ganhou ou Perdeu", true);
  if(novo < 0) return msg("Já está na primeira etapa", true);
  var r = await sb.schema("crm").from("oportunidades")
    .update({ etapa: ETAPAS[novo].k, atualizado_em: new Date().toISOString() }).eq("id", id);
  if(r.error) return msg("Não deu para mover: "+r.error.message, true);
  msg("Movida para "+ETAPAS[novo].r);
  carregarOportunidades();
}
async function fecharOportunidade(id, ganhou){
  var motivo = null;
  if(!ganhou){
    motivo = prompt("Por que perdeu? (preço, prazo, concorrente, sem resposta…)");
    if(motivo === null) return;
    motivo = motivo.trim() || null;
  }
  var r = await sb.schema("crm").from("oportunidades").update({
    etapa: ganhou ? "fechado_ganho" : "fechado_perdido",
    motivo_perda: motivo,
    atualizado_em: new Date().toISOString()
  }).eq("id", id);
  if(r.error) return msg("Não deu para fechar: "+r.error.message, true);
  msg(ganhou ? "Marcada como ganha" : "Marcada como perdida");
  carregarOportunidades();
}

/* ================= importar ================= */
function telaImportar(){
  pinta(
    ''+
    '<div class="drop" id="drop" onclick="document.getElementById(\'arq\').click()">'+
      '<b>Escolher arquivos XML ou .zip</b><span>ou arraste os arquivos para cá — pode mandar vários de uma vez, ou um .zip com tudo dentro</span>'+
    '</div>'+
    '<input id="arq" type="file" accept=".xml,.zip,text/xml,application/xml,application/zip" multiple '+
      'style="position:absolute;left:-9999px" onchange="importar(this.files)">'+
    '<div id="res" style="margin-top:16px"></div>');
  var d = $("drop");
  ["dragenter","dragover"].forEach(function(e){
    d.addEventListener(e, function(ev){ ev.preventDefault(); d.classList.add("over"); });
  });
  ["dragleave","drop"].forEach(function(e){
    d.addEventListener(e, function(ev){ ev.preventDefault(); d.classList.remove("over"); });
  });
  d.addEventListener("drop", function(ev){
    if(ev.dataTransfer && ev.dataTransfer.files) importar(ev.dataTransfer.files);
  });
}

async function importar(files, opts){
  opts = opts || {};
  var criarClientes = opts.criarClientes !== false; // default true (fluxo comercial/B2B, comportamento original)
  var arrOriginal = Array.prototype.slice.call(files || []);
  if(!arrOriginal.length) return;

  /* 0. expandir .zip em .xml (assim não precisa descompactar antes de subir) */
  $("res").innerHTML = '<div class="card"><h3>Preparando arquivos…</h3></div>';
  var arr;
  try {
    arr = await expandirArquivos(arrOriginal, function(msg){
      $("res").innerHTML = '<div class="card"><h3>'+esc(msg)+'</h3></div>';
    });
  } catch(e){
    return $("res").innerHTML = erroCartao("não consegui ler os arquivos (zip corrompido?): "+e.message);
  }
  if(!arr.length) return $("res").innerHTML = '<div class="card" style="--u:#D9772B"><h3>Nenhum XML encontrado</h3><p>Confira se o .zip contém arquivos .xml.</p></div>';
  $("res").innerHTML = '<div class="card"><h3>Lendo '+arr.length+' arquivo(s)…</h3></div>';

  /* 1. ler os XMLs */
  var lidas = [], falhas = [], vistas = {};
  for(var i=0; i<arr.length; i++){
    if(i % 500 === 0) $("res").innerHTML = '<div class="card"><h3>Lendo… '+i+' de '+arr.length+'</h3></div>';
    var texto = arr[i].texto;
    var nf = lerNFe(texto, arr[i].name);
    if(nf.erro){ falhas.push({ arq:arr[i].name, motivo:nf.erro }); continue; }
    if(vistas[nf.chave]){ continue; }
    vistas[nf.chave] = 1;
    lidas.push(nf);
  }
  if(!lidas.length){
    return $("res").innerHTML = cartaoFalhas(falhas, 0, 0);
  }

  /* 2. emitentes conhecidos */
  var re = await sb.from("emitentes").select("*");
  if(re.error) return $("res").innerHTML = erroCartao(re.error.message);
  var emitMap = {}, distribuidores = [];
  (re.data||[]).forEach(function(e){
    emitMap[e.cnpj] = e;
    if(e.distribuidor) distribuidores.push(e.cnpj);
  });
  var semEmitente = {};
  lidas = lidas.filter(function(nf){
    if(!emitMap[nf.emitente_cnpj]){
      semEmitente[nf.emitente_cnpj] = nf.emitente_nome;
      return false;
    }
    return true;
  });
  if(!lidas.length){
    return $("res").innerHTML = cartaoEmitente(semEmitente);
  }

  /* 3. notas que já existem — consultado em blocos (URL tem limite de tamanho) */
  var chaves = lidas.map(function(n){ return n.chave; });
  var jaTem = {};
  for(var c0=0; c0<chaves.length; c0+=200){
    if(elProgresso()) elProgresso().innerHTML = '<div class="card"><h3>Conferindo o que já existe… '+c0+' de '+chaves.length+'</h3></div>';
    var rx = await comRetentativa(function(){ return sb.from("nf_venda").select("chave").in("chave", chaves.slice(c0, c0+200)); });
    if(rx.error) return $("res").innerHTML = erroCartao(rx.error.message);
    (rx.data||[]).forEach(function(x){ jaTem[x.chave] = 1; });
  }
  var novas = lidas.filter(function(n){ return !jaTem[n.chave]; });
  var repetidas = lidas.length - novas.length;

  if(!novas.length){
    return $("res").innerHTML =
      '<div class="card" style="--u:#B8862B"><h3>Nada novo para gravar</h3>'+
      '<p>As '+repetidas+' nota(s) enviada(s) já estavam importadas. Nenhum valor foi duplicado.</p></div>'+
      cartaoFalhas(falhas, 0, repetidas);
  }

  /* 4. clientes — só no fluxo comercial (B2B). E-commerce/marketplace é consumidor
     final avulso e NÃO deve virar cadastro de cliente (poluiria o CRM comercial). */
  var cliId = {};
  var porDoc = {};
  if(criarClientes){
    novas.forEach(function(n){
      if(!n.dest_documento) return;
      porDoc[n.dest_documento] = {
        documento: n.dest_documento, tipo_doc: n.dest_tipo,
        razao_social: n.dest_nome, ie: n.dest_ie,
        logradouro: n.dest_logradouro, numero: n.dest_numero, bairro: n.dest_bairro,
        municipio: n.dest_municipio, uf: n.dest_uf, cep: n.dest_cep,
        criado_por: ST.email
      };
    });
    var listaCli = Object.keys(porDoc).map(function(k){ return porDoc[k]; });
    if(listaCli.length){
      for(var u0=0; u0<listaCli.length; u0+=200){
        var rc = await comRetentativa(function(){ return sb.from("clientes").upsert(listaCli.slice(u0, u0+200), { onConflict:"documento", ignoreDuplicates:true }); });
        if(rc.error) return $("res").innerHTML = erroCartao(rc.error.message);
      }
    }
    var cliDocs = Object.keys(porDoc);
    for(var d0=0; d0<cliDocs.length; d0+=200){
      var rcl = await comRetentativa(function(){ return sb.from("clientes").select("id,documento").in("documento", cliDocs.slice(d0, d0+200)); });
      if(rcl.error) return $("res").innerHTML = erroCartao(rcl.error.message);
      (rcl.data||[]).forEach(function(c){ cliId[c.documento] = c.id; });
    }
  }

  /* 5. de-para de produtos */
  var rd = await sb.from("depara_sku").select("codigo,produto_acabado_id");
  var skuDe = {};
  (rd.data||[]).forEach(function(d){ if(d.produto_acabado_id) skuDe[String(d.codigo)] = d.produto_acabado_id; });

  /* 6. gravar notas */
  var linhasNota = novas.map(function(n){
    var em = emitMap[n.emitente_cnpj];
    var todosBonif = n.itens.every(function(i){ return i.bonificacao; });
    var classif = "venda";
    if(todosBonif) classif = "bonificacao";
    else if(em.proprio && distribuidores.indexOf(n.dest_documento) >= 0) classif = "sell_in";
    return {
      chave:n.chave, emitente_cnpj:n.emitente_cnpj, numero:n.numero, serie:n.serie,
      emissao:n.emissao, dh_emissao:n.dh_emissao, nat_op:n.nat_op,
      tp_nf:n.tp_nf, fin_nfe:n.fin_nfe,
      cliente_id: cliId[n.dest_documento] || null,
      dest_documento:n.dest_documento, dest_nome:n.dest_nome,
      dest_municipio:n.dest_municipio, dest_uf:n.dest_uf,
      v_prod:n.v_prod, v_desc:n.v_desc, v_frete:n.v_frete, v_outro:n.v_outro,
      v_ipi:n.v_ipi, v_st:n.v_st, v_nf:n.v_nf,
      v_icms:n.v_icms, v_pis:n.v_pis, v_cofins:n.v_cofins,
      pedido_numero:n.pedido_numero, classificacao:classif,
      arquivo:n.arquivo, criado_por:ST.email
    };
  });
  /* gravar as notas em blocos — mandar tudo de uma vez estoura a conexão no celular */
  var idPorChave = {};
  for(var b0=0; b0<linhasNota.length; b0+=200){
    if(elProgresso()) elProgresso().innerHTML = '<div class="card"><h3>Gravando notas… '+b0+' de '+linhasNota.length+'</h3></div>';
    var rn = await comRetentativa(function(){ return sb.from("nf_venda").insert(linhasNota.slice(b0, b0+200)).select("id,chave"); });
    if(rn.error) return $("res").innerHTML = erroCartao(rn.error.message);
    (rn.data||[]).forEach(function(x){ idPorChave[x.chave] = x.id; });
  }

  /* 7. gravar itens */
  var linhasItem = [], naoMapeados = {};
  novas.forEach(function(n){
    var nfId = idPorChave[n.chave];
    if(!nfId) return;
    n.itens.forEach(function(i){
      var pa = skuDe[String(i.codigo)] || null;
      if(!pa){
        if(!naoMapeados[i.codigo]) naoMapeados[i.codigo] = { codigo:i.codigo, descricao:i.descricao, qtd:0, valor:0 };
        naoMapeados[i.codigo].qtd += i.qtd;
        naoMapeados[i.codigo].valor += (i.v_prod - i.v_desc);
      }
      linhasItem.push({
        nf_id:nfId, n_item:i.n_item, codigo:i.codigo, descricao:i.descricao,
        produto_acabado_id:pa, cfop:i.cfop, ncm:i.ncm, unidade:i.unidade,
        qtd:i.qtd, v_un:i.v_un, v_prod:i.v_prod, v_desc:i.v_desc,
        bonificacao:i.bonificacao
      });
    });
  });
  for(var k=0; k<linhasItem.length; k+=200){
    if(elProgresso()) elProgresso().innerHTML = '<div class="card"><h3>Gravando itens… '+k+' de '+linhasItem.length+'</h3></div>';
    var ri = await comRetentativa(function(){ return sb.from("nf_venda_item").insert(linhasItem.slice(k, k+200)); });
    if(ri.error) return $("res").innerHTML = erroCartao(ri.error.message);
  }

  /* 8. registrar a importação */
  var somaProd = novas.reduce(function(a,n){ return a + n.v_prod; }, 0);
  var somaDesc = novas.reduce(function(a,n){ return a + n.v_desc; }, 0);
  var listaNM = Object.keys(naoMapeados).map(function(k){ return naoMapeados[k]; });
  await sb.from("importacoes").insert({
    tipo:"nfe", arquivos:arr.length, lidos:lidas.length,
    gravados:novas.length, ignorados:repetidas,
    nao_mapeados: listaNM,
    resultado: { itens:linhasItem.length, v_prod:somaProd, v_desc:somaDesc, falhas:falhas },
    criado_por: ST.email
  });

  /* 9. resultado na tela */
  var h = '<div class="card" style="--u:#3E7C45"><h3>'+novas.length+' nota(s) importada(s)</h3>'+
    '<div class="conta"><span class="p">R$ '+brl(somaProd)+'</span> mercadoria '+
    '&nbsp;−&nbsp; <span class="m">R$ '+brl(somaDesc)+'</span> desconto '+
    '&nbsp;=&nbsp; <b>R$ '+brl(somaProd-somaDesc)+'</b> líquido</div>'+
    '<p style="font-size:13.5px;color:#7A6A57">'+linhasItem.length+' itens'+
    (criarClientes ? ' · '+Object.keys(porDoc).length+' cliente(s) no arquivo' : ' · e-commerce, sem cadastro de cliente')+
    (repetidas ? ' · '+repetidas+' nota(s) já existiam e foram ignoradas' : '')+'</p>'+
    '<button class="b" style="margin-top:6px" onclick="ir(\''+(criarClientes?"inicio":"controladoria")+'\')">Ver o resultado</button></div>';

  if(listaNM.length){
    var somaNM = listaNM.reduce(function(a,x){ return a + x.valor; }, 0);
    h += '<div class="card" style="--u:#D9772B"><h3>'+listaNM.length+
      ' código(s) sem cadastro — R$ '+brl(somaNM)+'</h3>'+
      '<p>As notas foram gravadas por inteiro. Estes itens só não entram nas análises por produto até serem ligados a um SKU.</p>'+
      '<div class="tw" style="margin-top:8px"><table><thead><tr><th>Código</th><th>Produto</th>'+
      '<th style="text-align:right">Un</th><th style="text-align:right">Líquido</th></tr></thead><tbody>'+
      listaNM.sort(function(a,b){ return b.valor-a.valor; }).map(function(x){
        return '<tr><td class="mono">'+esc(x.codigo)+'</td><td>'+esc(x.descricao)+'</td>'+
          '<td class="n">'+inte(x.qtd)+'</td><td class="n">'+brl(x.valor)+'</td></tr>';
      }).join("")+'</tbody></table></div>'+
      '<button class="s" style="margin-top:10px" onclick="ir(\'pendencias\')">Cadastrar agora</button></div>';
  }
  if(Object.keys(semEmitente).length) h += cartaoEmitente(semEmitente);
  h += cartaoFalhas(falhas, novas.length, repetidas);
  $("res").innerHTML = h;
  msg(novas.length+" nota(s) importada(s)");
}

function erroCartao(m){
  return '<div class="card" style="--u:#C63A3A"><h3>O banco recusou a gravação</h3>'+
    '<p class="mono" style="font-size:12.5px">'+esc(m)+'</p>'+
    '<p>Nada foi gravado pela metade — pode tentar de novo com os mesmos arquivos.</p></div>';
}
function cartaoFalhas(falhas){
  if(!falhas || !falhas.length) return "";
  return '<div class="card" style="--u:#C63A3A"><h3>'+falhas.length+' arquivo(s) não foram lidos</h3>'+
    falhas.map(function(f){
      return '<div style="font-size:13.5px;padding:3px 0"><b>'+esc(f.arq)+'</b> — '+esc(f.motivo)+'</div>';
    }).join("")+'</div>';
}
function cartaoEmitente(mapa){
  var cnpjs = Object.keys(mapa);
  if(!cnpjs.length) return "";
  return '<div class="card" style="--u:#C63A3A"><h3>Emitente não cadastrado</h3>'+
    '<p>Estas notas foram deixadas de fora porque o sistema ainda não sabe se o emitente é a fábrica ou um distribuidor — e essa diferença decide se o valor entra no faturamento ou não.</p>'+
    cnpjs.map(function(c){
      return '<div class="mono" style="font-size:13px;padding:3px 0">'+esc(c)+' · '+esc(mapa[c]||"")+'</div>';
    }).join("")+
    '<p style="margin-top:8px">Peça o cadastro desse emitente antes de importar de novo.</p></div>';
}

/* ================= pendências ================= */
async function telaPendencias(){
  var r = await sb.from("nf_venda_item")
    .select("codigo,descricao,qtd,v_liquido").is("produto_acabado_id", null);
  if(r.error) return pinta('<div class="card" style="--u:#C63A3A">'+esc(r.error.message)+'</div>');
  var agg = {};
  (r.data||[]).forEach(function(x){
    var k = String(x.codigo);
    if(!agg[k]) agg[k] = { codigo:k, descricao:x.descricao, qtd:0, valor:0, linhas:0 };
    agg[k].qtd += Number(x.qtd)||0;
    agg[k].valor += Number(x.v_liquido)||0;
    agg[k].linhas++;
  });
  var L = Object.keys(agg).map(function(k){ return agg[k]; })
    .sort(function(a,b){ return b.valor - a.valor; });

  if(!L.length){
    return pinta(
      '<div class="card" style="--u:#3E7C45"><h3>Nada pendente</h3>'+
      '<p>Todo item faturado está ligado a um produto do cadastro.</p></div>');
  }

  var rs = await sb.from("produto_acabado").select("id,nome,linha")
    .eq("ativo", true).order("linha").order("nome");
  ST.cache.skus = rs.data || [];
  var total = L.reduce(function(a,x){ return a + x.valor; }, 0);

  var opts = '<option value="">— escolher produto —</option>' +
    ST.cache.skus.map(function(s){
      return '<option value="'+s.id+'">'+esc(s.linha+" · "+s.nome)+'</option>';
    }).join("");

  pinta(
    ''+
    '<div class="kpis"><div class="kpi ruim"><div class="r">Fora das análises</div>'+
      '<div class="v">R$ '+brl(total)+'</div><div class="n">em '+L.length+' códigos</div></div></div>'+
    L.map(function(x, idx){
      return '<div class="card" style="--u:#D9772B">'+
        '<h3><span class="mono">'+esc(x.codigo)+'</span> · '+esc(x.descricao||"sem descrição")+'</h3>'+
        '<div class="conta">'+inte(x.qtd)+' un &nbsp;·&nbsp; <span class="m">R$ '+brl(x.valor)+
        '</span> fora das análises &nbsp;·&nbsp; '+x.linhas+' linha(s) de nota</div>'+
        '<label for="s'+idx+'">Ligar a um produto já cadastrado</label>'+
        '<select id="s'+idx+'">'+opts+'</select>'+
        '<button class="b" style="margin-top:10px" onclick="ligarCodigo(\''+
          esc(x.codigo)+'\', \'s'+idx+'\', \''+esc(x.descricao||"")+'\')">Ligar código</button>'+
      '</div>';
    }).join("")+
    '<div class="card" style="--u:#7A6A57"><h3>E se o produto não existir na lista?</h3>'+
    '<p>Alguns desses códigos são produtos que nunca foram cadastrados — Pistache 100%, ganaches La Ben, balde de 3 kg. '+
    'Criar SKU novo é decisão de cadastro e afeta receita e MRP, então isso é feito junto com a fábrica, não por aqui.</p></div>');
}

async function ligarCodigo(codigo, selectId, descricao){
  var sel = $(selectId);
  var pa = sel ? sel.value : "";
  if(!pa) return msg("Escolha o produto antes de ligar", true);

  var rex = await sb.from("depara_sku").select("id").eq("codigo", codigo);
  if(rex.error) return msg("Não consegui conferir o de-para: "+rex.error.message, true);

  if(rex.data && rex.data.length){
    var ru = await sb.from("depara_sku").update({ produto_acabado_id: pa }).eq("codigo", codigo);
    if(ru.error) return msg("Não deu para atualizar: "+ru.error.message, true);
  } else {
    var ri = await sb.from("depara_sku").insert({
      codigo: codigo, plataforma: "Varejo", nome_anuncio: descricao || null,
      produto_acabado_id: pa, criado_por: ST.email
    });
    if(ri.error) return msg("Não deu para gravar: "+ri.error.message, true);
  }

  var rr = await sb.from("nf_venda_item").update({ produto_acabado_id: pa })
    .eq("codigo", codigo).is("produto_acabado_id", null);
  if(rr.error) return msg("Código ligado, mas as notas antigas não foram atualizadas: "+rr.error.message, true);

  msg("Código "+codigo+" ligado ao produto");
  telaPendencias();
}

/* ================= controladoria (DRE) ================= */
async function telaControladoria(){
  pinta('<div class="vazio">Carregando…</div>');
  var r = await sb.from("v_dre_notas").select("*").eq("classificacao","venda").order("emissao");
  if(r.error) return pinta('<div class="card" style="--u:#C63A3A">'+esc(r.error.message)+'</div>');
  var N = r.data || [];

  var porMes = {};
  N.forEach(function(n){
    var k = String(n.mes).slice(0,7);
    if(!porMes[k]) porMes[k] = { mes:k, notas:0, bruta:0, liquida:0, icms:0, pis:0, cofins:0 };
    porMes[k].notas++;
    porMes[k].bruta += Number(n.v_nf)||0;
    porMes[k].liquida += Number(n.v_liquido_nf)||0;
    porMes[k].icms += Number(n.v_icms)||0;
    porMes[k].pis += Number(n.v_pis)||0;
    porMes[k].cofins += Number(n.v_cofins)||0;
  });
  var meses = Object.keys(porMes).sort();
  var totalBruta = N.reduce(function(a,n){ return a+(Number(n.v_nf)||0); },0);
  var totalLiquida = N.reduce(function(a,n){ return a+(Number(n.v_liquido_nf)||0); },0);
  var cargaEfetiva = totalBruta ? (100*(totalBruta-totalLiquida)/totalBruta) : 0;

  var h = '<div class="card" style="--u:#22303A"><h3>Importar e-commerce (série UpSeller/marketplace)</h3>'+
    '<p style="font-size:13.5px;color:#7A6A57">Estas notas NÃO criam cadastro de cliente — são consumidor final avulso, ficam só aqui na apuração fiscal.</p>'+
    '<input type="file" id="arqEcommerce" multiple accept=".xml,.zip,application/zip" style="margin-top:10px" onchange="importar(this.files,{criarClientes:false})">'+
    '<p style="font-size:12.5px;color:#7A6A57;margin-top:6px">Aceita .xml soltos ou um .zip com todos dentro — não precisa descompactar antes. Lotes grandes podem levar alguns minutos.</p>'+
    '<div id="res" style="margin-top:10px"></div></div>';

  h += '<div class="card" style="--u:#3E7C45"><h3>DRE — visão consolidada</h3>'+
    '<p class="r">Receita bruta</p><p class="v">R$ '+brl(totalBruta)+'</p>'+
    '<div class="conta">R$ '+brl(totalBruta)+' bruta &nbsp;−&nbsp; R$ '+brl(totalBruta-totalLiquida)+' ICMS+PIS+COFINS &nbsp;=&nbsp; <b>R$ '+brl(totalLiquida)+'</b> líquida</div>'+
    '<p style="font-size:13.5px;color:#7A6A57;margin-top:8px">Carga tributária efetiva: <b>'+cargaEfetiva.toFixed(2)+'%</b> · '+N.length+' nota(s) no total (todas as séries, exclui sell-in e bonificação)</p></div>';

  if(meses.length){
    h += '<div class="tw"><table><thead><tr><th>Mês</th><th style="text-align:right">Notas</th>'+
      '<th style="text-align:right">Bruta</th><th style="text-align:right">ICMS+PIS+COFINS</th>'+
      '<th style="text-align:right">Líquida</th><th style="text-align:right">Carga</th></tr></thead><tbody>'+
      meses.map(function(k){
        var m = porMes[k];
        var imp = m.icms+m.pis+m.cofins;
        var carga = m.bruta ? (100*imp/m.bruta) : 0;
        return '<tr><td class="mono">'+k+'</td><td class="n">'+m.notas+'</td>'+
          '<td class="n">R$ '+brl(m.bruta)+'</td><td class="n">R$ '+brl(imp)+'</td>'+
          '<td class="n">R$ '+brl(m.liquida)+'</td><td class="n">'+carga.toFixed(1)+'%</td></tr>';
      }).join("")+'</tbody></table></div>';
  } else {
    h += '<div class="vazio">Nenhuma nota de venda apurada ainda. Suba os XMLs de e-commerce acima.</div>';
  }

  h += '<p style="font-size:12.5px;color:#7A6A57;margin-top:14px"><b>Como ler:</b> "Bruta" = valor total da nota (vNF). '+
    '"Líquida" = bruta menos ICMS, PIS e COFINS (não desconta IPI/ST, que são repasse, não receita da empresa). '+
    '"Carga tributária efetiva" = imposto pago ÷ receita bruta das notas já importadas — não é alíquota nominal.<br>'+
    '<b>Cobertura:</b> só o que já foi importado aqui aparece; XMLs ainda não subidos não entram na conta.</p>';

  pinta(h);
}

/* ================= partida ================= */
(async function(){
  if(typeof supabase === "undefined" || !supabase.createClient){
    $("app").innerHTML = '<div class="login"><div class="cx">'+
      '<h1>Sem conexão</h1><p>Não consegui carregar a biblioteca do banco. '+
      'Confira a internet e recarregue a página.</p></div></div>';
    return;
  }
  sb = supabase.createClient(URL_SB, KEY_SB);
  var s = await sb.auth.getSession();
  if(s.data && s.data.session){
    ST.email = s.data.session.user.email || "";
    await carregarPapel();
    ir(ST.papel.comercial ? "inicio" : "controladoria");
  } else {
    telaLogin();
  }
})();
