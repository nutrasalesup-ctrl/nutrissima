<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="app-version" content="2026-08-21T14:28Z">
<title>Nutríssima — Comercial</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --cacau:#33200F; --leite:#FFFDF9; --casca:#EFE7DC; --linha:#DCD2C4;
  --pist:#3E7C45; --pist-esc:#2E5F34; --mor:#C63A3A; --mel:#B8862B; --lar:#D9772B;
  --ard:#22303A; --tinta2:#7A6A57; --raio:14px;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;min-width:0}
html{overflow-x:hidden}
body{font-family:-apple-system,system-ui,'Segoe UI',sans-serif;background:var(--leite);
     color:var(--cacau);min-height:100vh;overflow-x:hidden}
.mono{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:90px}
img,svg{max-width:100%}

/* trilha comercial + topo (padrao do ERP) */
.trilha{display:flex;gap:4px;overflow-x:auto;padding:10px 16px;background:var(--cacau);scrollbar-width:none}
.trilha::-webkit-scrollbar{display:none}
.trilha span{flex:none;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
             color:#B9A896;padding:5px 10px;border-radius:99px;border:1px solid #5A4630}
.trilha span.atual{background:var(--pist);border-color:var(--pist);color:#fff}
.topo{padding:16px;display:flex;align-items:center;gap:12px}
.topo .voltar{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--linha);
              background:#fff;font-size:20px;cursor:pointer;color:var(--cacau);flex:none}
.topo h1{font-size:24px;font-weight:900;line-height:1.15}
.topo p,.sub{font-size:13.5px;color:var(--tinta2)}
main{padding:4px 16px}
.quem{margin-left:auto;font-size:11px;color:var(--tinta2);text-align:right;line-height:1.3;flex:none}
.quem b{display:block;font-weight:700;font-size:11.5px}

/* menu de acoes */
.pergunta{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
          color:#8A7A64;margin:14px 0 8px}
.acoes{display:grid;gap:12px}
.acoes button{display:flex;align-items:center;gap:14px;padding:18px;border-radius:var(--raio);
              border:1.5px solid var(--linha);background:#fff;cursor:pointer;text-align:left;
              min-height:72px;font-family:inherit;width:100%}
.acoes .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
            font-size:22px;flex:none}
.acoes b{font-size:18px;display:block;color:var(--cacau)}
.acoes small{font-size:13px;color:var(--tinta2)}

/* cartoes com tarja de urgencia (padrao de relatorios) */
.card{background:#fff;border:1.5px solid var(--linha);border-left:7px solid var(--u,var(--linha));
      border-radius:var(--raio);padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:16px;font-weight:900}

/* KPIs */
.cockpit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.painel{display:block;background:#fff;border:1px solid var(--linha);border-left:5px solid var(--u,var(--linha));
  box-shadow:0 1px 4px rgba(51,32,15,.05);
  border-radius:10px;padding:10px;text-decoration:none;color:inherit;transition:transform .12s}
.painel:hover{transform:translateY(-2px)}
.painel-ic{font-size:15px;line-height:1}
.painel-t{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--tinta2);margin-top:5px}
.painel-v{font-size:15px;font-weight:900;margin-top:1px}
.painel-s{font-size:10.5px;color:var(--tinta2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:600px){ .cockpit{grid-template-columns:repeat(4,1fr)} }
@media(min-width:900px){ .cockpit{grid-template-columns:repeat(7,1fr)} }
.ficha-cols{display:flex;flex-direction:column;gap:8px}
@media(min-width:900px){ .ficha-cols{display:grid;grid-template-columns:1.35fr 1fr;align-items:start;gap:12px} }
.mini{min-height:26px!important;padding:3px 9px!important;font-size:11px!important;border-radius:7px!important;
  font-weight:700!important;line-height:1.3}
.mini i{font-size:12px;vertical-align:-1px}
.ficha-card{background:#fff;border:1px solid var(--linha);box-shadow:0 1px 5px rgba(51,32,15,.05);
  border-radius:12px;padding:11px 13px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--linha);box-shadow:0 1px 4px rgba(51,32,15,.05);
     border-radius:10px;padding:10px;text-align:center}
.kpi .r{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--tinta2)}
.kpi .v{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;display:block;
        line-height:1.15;margin-top:2px;font-family:ui-monospace,Menlo,monospace}
.kpi .n{font-size:10.5px;color:var(--tinta2);margin-top:2px}
.kpi.ruim{border-color:#E8B9B9;background:#FDF7F7}
.kpi.ruim .v{color:var(--mor)}
.kpi.bom .v{color:var(--pist)}

/* quadro do dia (agenda) — grade de notas coloridas por tipo de interação */
.quadro-dia{margin-bottom:18px}
.quadro-titulo{font-size:14px;font-weight:900;margin-bottom:10px;display:flex;align-items:baseline;gap:8px}
.quadro-titulo .n{font-size:11.5px;font-weight:700;color:var(--tinta2)}
.quadro-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:380px){ .quadro-grid{grid-template-columns:1fr} }
.nota{border-radius:12px;padding:12px 13px;box-shadow:0 1px 4px rgba(51,32,15,.08);min-height:96px;
      display:flex;flex-direction:column;gap:6px}
.nota .tipo{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
            display:flex;align-items:center;gap:5px;opacity:.75}
.nota .cliente{font-size:14px;font-weight:900;line-height:1.2}
.nota .passo{font-size:12.5px;color:var(--cacau);line-height:1.3;flex:1}
.nota .contato{font-size:11px;color:var(--tinta2)}
.nota .acoes{display:flex;gap:6px;margin-top:2px;flex-wrap:wrap}
.nota .acoes button{border:none;background:rgba(255,255,255,.6);border-radius:8px;padding:5px 9px;
                     font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--cacau)}
.nota .acoes button:active{background:rgba(255,255,255,.9)}
.quadro-ver-tudo{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:700;
                  color:var(--tinta2);text-decoration:none;border-bottom:1.5px dotted var(--tinta2)}

/* conta aberta */
.conta{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;
       background:#F6F1E8;border:1.5px solid var(--linha);border-radius:var(--raio);
       padding:13px 15px;font-size:14px;margin:10px 0;overflow-x:auto;white-space:nowrap}
.conta .m{color:var(--mor);font-weight:700}
.conta .p{color:var(--pist);font-weight:700}

/* linhas e tabelas */
.tw{border:1.5px solid var(--linha);border-radius:var(--raio);background:#fff;overflow-x:auto;
    -webkit-overflow-scrolling:touch;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#F6F1E8;text-align:left;padding:10px 12px;font-size:10.5px;text-transform:uppercase;
   letter-spacing:.06em;white-space:nowrap;font-weight:800;color:var(--tinta2)}
td{padding:11px 12px;border-top:1px solid var(--linha);vertical-align:top}
td.n{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;
     text-align:right;white-space:nowrap;font-weight:700}

/* controles */
label{display:block;font-size:13px;font-weight:700;color:var(--tinta2);margin:12px 0 5px}
input:not([type=checkbox]):not([type=radio]),select{
  width:100%;padding:13px 14px;font-size:17px;border:1.5px solid var(--linha);
  border-radius:12px;font-family:inherit;background:#fff;color:var(--cacau)}
input:not([type=checkbox]):not([type=radio]):focus,select:focus{outline:none;border-color:var(--pist)}
input[type=checkbox],input[type=radio]{width:26px;height:26px;accent-color:var(--pist);flex:none;margin:0}
button.b{width:100%;min-height:58px;font-size:18px;font-weight:900;border:none;border-radius:16px;
         background:var(--pist);color:#fff;cursor:pointer;font-family:inherit;margin-top:10px}
button.b:disabled{background:#C8C0B4}
button.s{min-height:44px;font-size:15px;font-weight:700;border:1.5px solid var(--linha);
         border-radius:12px;background:#fff;cursor:pointer;font-family:inherit;color:var(--cacau);
         padding:10px 16px}
button.s:hover{background:#F6F1E8}
button:focus-visible{outline:2px solid var(--pist);outline-offset:2px}
.drop{border:2px dashed var(--linha);border-radius:var(--raio);padding:26px 16px;text-align:center;
      background:#fff;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--pist);background:#F4F8F4}
.drop b{display:block;font-size:17px;margin-bottom:4px}
.drop span{color:var(--tinta2);font-size:13.5px}

/* chips e avisos */
.tag{display:inline-block;padding:4px 11px;border-radius:99px;font-size:11px;font-weight:800;
     text-transform:uppercase;letter-spacing:.04em;color:#fff}
.msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--cacau);
     color:#fff;padding:14px 22px;border-radius:14px;font-weight:700;font-size:15px;z-index:99;
     max-width:90%;text-align:center;box-shadow:0 6px 24px #0004}
.msg.erro{background:var(--mor)}
.vazio{text-align:center;color:#8A7A64;padding:30px 12px;font-size:15px}
.bar{height:7px;background:#EFE7DC;border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--pist)}

/* dashboard gerencial: filtros e barras empilhadas */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:99px;border:1.5px solid var(--linha);background:#fff;
      font-size:13px;font-weight:800;color:var(--tinta2);cursor:pointer;font-family:inherit}
.chip.ativo{background:var(--ard);border-color:var(--ard);color:#fff}
.filtros2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.filtros2 label{margin:0 0 4px}
.bar2{height:10px;background:#EFE7DC;border-radius:99px;overflow:hidden;margin-top:5px;display:flex}
.bar2 i{display:block;height:100%}
.linkavel{cursor:pointer}
.linkavel:active{opacity:.65}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tinta2);margin:8px 0 4px}
.legenda span{display:inline-flex;align-items:center;gap:5px}
.legenda i{width:10px;height:10px;border-radius:3px;display:inline-block}
.delta{font-size:12px;font-weight:800;margin-top:2px}
.delta.pos{color:var(--pist)}
.delta.neg{color:var(--mor)}

/* kanban de oportunidades */
.kanban{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch;
        scroll-snap-type:x proximity}
.kanban-col{flex:0 0 82vw;max-width:320px;scroll-snap-align:start;background:#F6F1E8;
            border:1.5px solid var(--linha);border-radius:var(--raio);display:flex;flex-direction:column}
.kanban-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;
             border-bottom:3px solid var(--u,var(--linha));border-radius:var(--raio) var(--raio) 0 0;
             font-weight:900;font-size:13.5px;text-transform:uppercase;letter-spacing:.04em}
.kanban-head b{font-family:ui-monospace,Menlo,monospace;background:var(--u,var(--tinta2));color:#fff;
               padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:700}
.kanban-body{padding:10px;flex:1;display:flex;flex-direction:column;gap:10px;min-height:60px;
             transition:background .1s}
.kanban-body.sobre{background:#E2EFE2}
.kanban-card{background:#fff;border:1.5px solid var(--linha);border-left:6px solid var(--u,var(--linha));
             border-radius:12px;padding:12px 13px;cursor:grab}
.kanban-card.arrastando{opacity:.35}
.kc-cliente{font-weight:900;font-size:14.5px;margin-bottom:2px}
.kc-titulo{font-size:13.5px;margin-bottom:6px}
.kc-meta{font-size:12px;color:var(--tinta2);margin-bottom:8px}
.kc-vlr{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;font-size:12px;
        background:#F6F1E8;border-radius:8px;padding:6px 8px;margin-bottom:8px;white-space:normal}
.kc-acoes{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.kc-mv{min-height:34px;min-width:34px;border:1.5px solid var(--linha);border-radius:9px;background:#fff;
       font-weight:900;font-size:16px;cursor:pointer;color:var(--cacau)}
.kc-mv-off{min-height:34px;min-width:34px;display:inline-flex;align-items:center;justify-content:center;
           color:#C8C0B4;font-size:16px}
.kc-win,.kc-lose{min-height:34px;border:none;border-radius:9px;font-weight:800;font-size:11.5px;
                 padding:0 10px;cursor:pointer;color:#fff}
.kc-win{background:var(--pist)}
.kc-lose{background:var(--mor)}
.kc-prop{min-height:34px;border:1.5px solid var(--linha);border-radius:9px;background:#fff;
        font-weight:800;font-size:11.5px;padding:0 10px;cursor:pointer;color:var(--cacau)}
.kc-badge{display:inline-block;background:#F6F1E8;border:1px solid var(--linha);border-radius:99px;
        padding:2px 9px;font-size:11px;font-weight:700;color:var(--tinta2);cursor:pointer;margin-bottom:6px}
@keyframes kcFlash{ 0%,100%{ box-shadow:0 0 0 0 rgba(184,134,43,0) } 20%,60%{ box-shadow:0 0 0 4px rgba(184,134,43,.55) } }
.kc-flash{ animation:kcFlash 1.6s ease-in-out 2 }
@media(min-width:820px){ .kanban-col{flex:0 0 260px} }
@media(min-width:1200px){ .kanban-col{flex:0 0 288px} }

/* login */
.login{max-width:380px;margin:9vh auto;padding:0 16px}
.login .cx{background:#fff;border:1.5px solid var(--linha);border-radius:16px;padding:22px}
.login h1{font-size:23px;margin:0 0 4px;font-weight:900}
.login p{color:var(--tinta2);font-size:14px;margin:0 0 6px}

/* tabela vira cartao no celular */
/* celular estreito: tabela vira cartão empilhado, sem rolagem lateral */
@media(max-width:619px){
  table.cards thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  table.cards,table.cards tbody,table.cards tr,table.cards td{display:block;width:100%}
  .tw:has(table.cards){border:none;background:transparent;overflow:visible}
  table.cards tr{background:#fff;border:1.5px solid var(--linha);border-radius:12px;
                 padding:12px 14px;margin-bottom:10px}
  table.cards td{border:none;padding:3px 0;text-align:left}
  table.cards td:first-child{font-weight:900;font-size:15.5px;padding-bottom:6px}
  table.cards td[data-r]:not(:empty)::before{content:attr(data-r) " · ";color:var(--tinta2);
    font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:800}
  table.cards td:last-child{padding-top:10px}
  table.cards td:last-child button{width:100%}
  /* topo não pode estourar em tela de 320-360px: título quebra, e-mail encolhe */
  .topo{flex-wrap:wrap}
  .topo h1{font-size:20px}
  .quem{font-size:10px;max-width:120px}
  .quem b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acoes button{padding:15px}
  .conta{white-space:normal;line-height:1.6;font-size:13.5px}
}
@media(min-width:400px){ .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))} }

/* tablet/desktop — mesmos degraus do restante do ERP (index.html), pra não
   ficar uma coluna de celular perdida no meio de uma tela grande */
@media(min-width:820px){
  #app{max-width:900px}
  main{padding:8px 28px}
  .topo{padding:20px 28px}
  .topo h1{font-size:27px}
  .topo p,.sub{font-size:14px}
  .pergunta{margin:18px 0 10px}
  .acoes{grid-template-columns:1fr 1fr;gap:14px}
  .acoes button{min-height:76px;padding:18px}
  .card{padding:18px 20px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  button.b{max-width:340px}
  button.b{min-height:40px;font-size:14px;border-radius:10px}
  button.s{min-height:32px;font-size:12.5px;padding:6px 13px;border-radius:9px}
}
@media(min-width:1200px){
  #app{max-width:1040px}
  .acoes{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:1440px){
  #app{max-width:1300px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="vazio">Carregando…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script>
"use strict";

var URL_SB = "https://nfzospymzvlwzlcpgolm.supabase.co";
var KEY_SB = "sb_publishable_tNe4G9C0re2YDN9lsnRQXg_zQgFLmzn";
var sb = null;
var ST = { email:"", periodo:"todos", cache:{}, papel:{ comercial:false, controladoria:false } };

/* ================= utilitários ================= */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
/* pra embutir texto livre (ex.: título de oportunidade) como argumento de string
   dentro de um onclick="...('...')" sem quebrar por causa de aspas simples */
function jsAttr(s){
  return esc(String(s==null?"":s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"));
}
function brl(v){
  var n = Number(v)||0;
  return n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function inte(v){ return (Number(v)||0).toLocaleString("pt-BR"); }
function dataBR(d){
  if(!d) return "—";
  var p = String(d).slice(0,10).split("-");
  return p[2]+"/"+p[1]+"/"+p[0];
}
function digitos(s){ return String(s==null?"":s).replace(/\D/g,""); }
function msg(txt, erro){
  var d = document.createElement("div");
  d.className = "msg" + (erro ? " erro" : "");
  d.textContent = txt;
  document.body.appendChild(d);
  setTimeout(function(){ d.remove(); }, erro ? 5200 : 3400);
}

/* ================= leitura da NF-e ================= */
function elProgresso(){ return document.getElementById("res"); }
/* tenta de novo em falha de rede (celular oscila); erro do banco não é retentado */
async function comRetentativa(fn, tentativas){
  tentativas = tentativas || 3;
  var ultimoErro;
  for(var t=1; t<=tentativas; t++){
    try {
      var r = await fn();
      if(r && r.error){
        var m = String(r.error.message||"");
        var eRede = /load failed|fetch|network|timeout|aborted/i.test(m);
        if(!eRede || t === tentativas) return r;
        ultimoErro = r;
      } else {
        return r;
      }
    } catch(e){
      ultimoErro = { error: { message: e.message || String(e) } };
      if(t === tentativas) return ultimoErro;
    }
    await new Promise(function(res){ setTimeout(res, 800 * t); });
  }
  return ultimoErro;
}
async function expandirArquivos(arquivos, onProgress){
  var out = [];
  for(var i=0; i<arquivos.length; i++){
    var f = arquivos[i];
    var nome = f.name || "arquivo";
    if(/\.zip$/i.test(nome)){
      if(typeof JSZip === "undefined") throw new Error("biblioteca de .zip não carregou — confira a internet e recarregue a página");
      if(onProgress) onProgress("Descompactando "+nome+"…");
      var zip = await JSZip.loadAsync(f);
      var entradas = Object.keys(zip.files).filter(function(k){
        return /\.xml$/i.test(k) && !zip.files[k].dir;
      });
      for(var j=0; j<entradas.length; j++){
        if(onProgress && j % 500 === 0) onProgress("Descompactando "+nome+"… "+j+" de "+entradas.length);
        var texto = await zip.files[entradas[j]].async("string");
        out.push({ name: entradas[j].split("/").pop(), texto: texto });
      }
    } else if(/\.xml$/i.test(nome)){
      var t;
      try { t = await f.text(); } catch(e){ continue; }
      out.push({ name: nome, texto: t });
    }
    // outros tipos de arquivo são ignorados silenciosamente
  }
  return out;
}
function tag(el, nome){
  if(!el) return null;
  var n = el.getElementsByTagNameNS("*", nome)[0];
  return n ? n.textContent.trim() : null;
}
function bloco(el, nome){
  if(!el) return null;
  return el.getElementsByTagNameNS("*", nome)[0] || null;
}
var CFOP_BONIF = ["5910","6910","5911","6911","5912","6912","5913","6913"];

function lerNFe(texto, nomeArquivo){
  var doc = new DOMParser().parseFromString(texto, "application/xml");
  if(doc.getElementsByTagName("parsererror").length){
    return { erro:"arquivo não é um XML válido" };
  }
  var inf = doc.getElementsByTagNameNS("*","infNFe")[0];
  if(!inf) return { erro:"não encontrei a nota dentro do arquivo" };

  var chave = String(inf.getAttribute("Id")||"").replace(/^NFe/,"");
  if(chave.length !== 44) return { erro:"chave da nota com formato inesperado" };

  var ide = bloco(inf,"ide"), emit = bloco(inf,"emit"), dest = bloco(inf,"dest");
  var ender = bloco(dest,"enderDest"), tot = bloco(inf,"ICMSTot"), adic = bloco(inf,"infAdic");
  if(!ide || !emit || !dest) return { erro:"nota sem emitente ou destinatário" };

  var cpl = tag(adic,"infCpl") || "";
  var achouPedido = cpl.match(/Pedido\s*:?\s*(\d+)/i);

  var itens = [], dets = inf.getElementsByTagNameNS("*","det");
  for(var i=0; i<dets.length; i++){
    var d = dets[i], p = bloco(d,"prod");
    if(!p) continue;
    var cfop = tag(p,"CFOP");
    itens.push({
      n_item: Number(d.getAttribute("nItem")) || (i+1),
      codigo: tag(p,"cProd"),
      descricao: tag(p,"xProd"),
      cfop: cfop,
      ncm: tag(p,"NCM"),
      unidade: tag(p,"uCom"),
      qtd: Number(tag(p,"qCom")) || 0,
      v_un: Number(tag(p,"vUnCom")) || 0,
      v_prod: Number(tag(p,"vProd")) || 0,
      v_desc: Number(tag(p,"vDesc")) || 0,
      bonificacao: CFOP_BONIF.indexOf(cfop) >= 0
    });
  }
  if(!itens.length) return { erro:"nota sem itens" };

  return {
    chave: chave,
    arquivo: nomeArquivo,
    emitente_cnpj: digitos(tag(emit,"CNPJ")),
    emitente_nome: tag(emit,"xNome"),
    numero: tag(ide,"nNF"),
    serie: tag(ide,"serie"),
    emissao: String(tag(ide,"dhEmi")||"").slice(0,10),
    dh_emissao: tag(ide,"dhEmi"),
    nat_op: tag(ide,"natOp"),
    tp_nf: tag(ide,"tpNF"),
    fin_nfe: tag(ide,"finNFe"),
    dest_documento: digitos(tag(dest,"CNPJ") || tag(dest,"CPF")),
    dest_tipo: tag(dest,"CNPJ") ? "CNPJ" : "CPF",
    dest_nome: tag(dest,"xNome"),
    dest_ie: tag(dest,"IE"),
    dest_logradouro: tag(ender,"xLgr"),
    dest_numero: tag(ender,"nro"),
    dest_bairro: tag(ender,"xBairro"),
    dest_municipio: tag(ender,"xMun"),
    dest_uf: tag(ender,"UF"),
    dest_cep: digitos(tag(ender,"CEP")),
    v_prod: Number(tag(tot,"vProd")) || 0,
    v_desc: Number(tag(tot,"vDesc")) || 0,
    v_frete: Number(tag(tot,"vFrete")) || 0,
    v_outro: Number(tag(tot,"vOutro")) || 0,
    v_ipi: Number(tag(tot,"vIPI")) || 0,
    v_st: Number(tag(tot,"vST")) || 0,
    v_nf: Number(tag(tot,"vNF")) || 0,
    v_icms: Number(tag(tot,"vICMS")) || 0,
    v_pis: Number(tag(tot,"vPIS")) || 0,
    v_cofins: Number(tag(tot,"vCOFINS")) || 0,
    pedido_numero: achouPedido ? achouPedido[1] : null,
    itens: itens
  };
}

var CORES_EMIT = { "Nutríssima":"#3E7C45", "LBR":"#22303A" };

function gerEstadoPadrao(){
  if(!ST.ger) ST.ger = { preset:"mes", desde:null, ate:null, emitente:"todos", marca:"todos" };
}
function gerHoje(){ return hojeISO(); }
function gerIsoData(d){ return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function gerPeriodo(preset, desdeManual, ateManual){
  var hoje = gerHoje();
  if(preset === "custom") return { desde: desdeManual||null, ate: ateManual||hoje };
  if(preset === "tudo") return { desde:null, ate:null };
  if(preset === "ano") return { desde: hoje.slice(0,4)+"-01-01", ate: hoje };
  if(preset === "3m"){
    var d = new Date(hoje+"T00:00:00"); d.setMonth(d.getMonth()-2); d.setDate(1);
    return { desde: gerIsoData(d), ate: hoje };
  }
  return { desde: hoje.slice(0,7)+"-01", ate: hoje }; // 'mes'
}
function gerPeriodoAnterior(desde, ate){
  if(!desde || !ate) return { desde:null, ate:null };
  var dd = new Date(desde+"T00:00:00"), da = new Date(ate+"T00:00:00");
  var dias = Math.round((da-dd)/86400000) + 1;
  var prevAte = new Date(dd.getTime() - 86400000);
  var prevDesde = new Date(prevAte.getTime() - (dias-1)*86400000);
  return { desde: gerIsoData(prevDesde), ate: gerIsoData(prevAte) };
}
function gerFiltrarL(L, desde, ate, emitente, marca){
  return L.filter(function(x){
    if(desde && (!x.emissao || x.emissao < desde)) return false;
    if(ate && (!x.emissao || x.emissao > ate)) return false;
    if(emitente !== "todos" && x.emitente !== emitente) return false;
    var mk = x.marca || "— sem cadastro";
    if(marca !== "todos" && mk !== marca) return false;
    return true;
  });
}
function gerTotais(rows){
  var liq=0, un=0, notas={};
  rows.forEach(function(x){
    liq += Number(x.v_liquido)||0; un += Number(x.qtd)||0; notas[x.nf_id]=1;
  });
  var n = Object.keys(notas).length;
  return { liq:liq, un:un, notas:n, ticket: n ? liq/n : 0 };
}
function gerPorMes(L, emitente, marca){
  var rows = gerFiltrarL(L, null, null, emitente, marca);
  var por = {};
  rows.forEach(function(x){
    if(!x.emissao) return;
    var mk = x.emissao.slice(0,7);
    if(!por[mk]) por[mk] = {};
    var e = x.emitente || "—";
    por[mk][e] = (por[mk][e]||0) + (Number(x.v_liquido)||0);
  });
  return por;
}
function mesRotulo(mk){
  var meses=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  var p = mk.split("-");
  return meses[parseInt(p[1],10)-1]+"/"+p[0].slice(2);
}
function gerConcentracaoCliente(rows, n){
  var por = {};
  rows.forEach(function(x){
    if(!x.cliente_id) return; // e-commerce/consumidor final não vira "cliente" cadastrado
    var k = x.cliente_id;
    if(!por[k]) por[k] = { v:0, nome:x.cliente||"—" };
    por[k].v += Number(x.v_liquido)||0;
  });
  return Object.keys(por).map(function(k){ return {id:k, nome:por[k].nome, v:por[k].v}; })
    .sort(function(a,b){ return b.v-a.v; }).slice(0, n||10);
}
function gerEcommerce(rows){
  var liq=0, notas={};
  rows.forEach(function(x){
    if(x.cliente_id) return;
    liq += Number(x.v_liquido)||0; notas[x.nf_id]=1;
  });
  return { liq:liq, notas:Object.keys(notas).length };
}
function gerPorMarca(rows){
  var por = {};
  rows.forEach(function(x){
    var k = x.marca || "— sem cadastro";
    if(!por[k]) por[k] = {v:0,q:0};
    por[k].v += Number(x.v_liquido)||0; por[k].q += Number(x.qtd)||0;
  });
  return Object.keys(por).map(function(k){ return {k:k, v:por[k].v, q:por[k].q}; })
    .sort(function(a,b){ return b.v-a.v; });
}
function gerPorUf(rows){
  var por = {};
  rows.forEach(function(x){ if(x.uf) por[x.uf] = (por[x.uf]||0) + (Number(x.v_liquido)||0); });
  return Object.keys(por).map(function(k){ return {k:k, v:por[k]}; })
    .sort(function(a,b){ return b.v-a.v; }).slice(0,6);
}
function gerDeltaHtml(atual, anterior){
  if(anterior === null) return "";
  if(!anterior) return '<div class="delta">sem período anterior comparável</div>';
  var pct = ((atual-anterior)/anterior)*100;
  var cls = pct >= 0 ? "pos" : "neg";
  var seta = pct >= 0 ? "▲" : "▼";
  return '<div class="delta '+cls+'">'+seta+' '+Math.abs(pct).toFixed(1)+'% vs. período anterior</div>';
}

function gerRender(){
  var L = ST.cache.gerL || [];
  var per = gerPeriodo(ST.ger.preset, ST.ger.desde, ST.ger.ate);
  var desde = per.desde, ate = per.ate;
  var prev = gerPeriodoAnterior(desde, ate);

  var rowsAtual = gerFiltrarL(L, desde, ate, ST.ger.emitente, ST.ger.marca);
  var rowsAnterior = (prev.desde && prev.ate) ? gerFiltrarL(L, prev.desde, prev.ate, ST.ger.emitente, ST.ger.marca) : null;
  var tAtual = gerTotais(rowsAtual);
  var tAnterior = rowsAnterior ? gerTotais(rowsAnterior) : null;

  // por emitente, sempre os dois lado a lado (ignora o filtro de emitente de propósito)
  var rowsPeriodoTodosEmit = gerFiltrarL(L, desde, ate, "todos", ST.ger.marca);
  var porEmitPeriodo = {};
  rowsPeriodoTodosEmit.forEach(function(x){
    var e = x.emitente||"—"; porEmitPeriodo[e] = (porEmitPeriodo[e]||0) + (Number(x.v_liquido)||0);
  });
  var totalEmit = Object.keys(porEmitPeriodo).reduce(function(a,k){return a+porEmitPeriodo[k];},0);

  var marcas = {};
  L.forEach(function(x){ marcas[x.marca||"— sem cadastro"]=1; });
  var listaMarcas = Object.keys(marcas).sort();

  var porMes = gerPorMes(L, ST.ger.emitente, ST.ger.marca);
  var mesesOrdenados = Object.keys(porMes).sort();
  var maiorMes = 0;
  mesesOrdenados.forEach(function(mk){
    var soma = Object.keys(porMes[mk]).reduce(function(a,e){return a+porMes[mk][e];},0);
    if(soma > maiorMes) maiorMes = soma;
  });

  var topCli = gerConcentracaoCliente(rowsAtual, 10);
  var maiorCli = topCli.length ? topCli[0].v : 0;
  var ecom = gerEcommerce(rowsAtual);
  var porMarca = gerPorMarca(rowsAtual);
  var maiorMarca = porMarca.length ? porMarca[0].v : 0;
  var porUf = gerPorUf(rowsAtual);
  var maiorUf = porUf.length ? porUf[0].v : 0;

  var semSku = ST.cache.gerSemSku || {n:0,v:0};
  var cart = ST.cache.gerCarteira || {pedidos:0,valor:0};

  var rotuloPeriodo = (desde && ate) ? (dataBR(desde)+" a "+dataBR(ate))
    : (ate ? "até "+dataBR(ate) : "todo o histórico");

  var h = "";

/* ================= faturamento ================= */
async function telaFaturamento(){
  var r = await sb.from("v_faturamento").select("*").order("emissao",{ascending:false});
  if(r.error) return pinta('<div class="card" style="--u:#C63A3A">'+esc(r.error.message)+'</div>');
  var L = r.data || [];
  if(!L.length) return pinta('<div class="vazio">Nada importado ainda.</div>');

  var porNota = {};
  L.forEach(function(x){
    if(!porNota[x.nf_id]){
      porNota[x.nf_id] = { chave:x.chave, emissao:x.emissao, emitente:x.emitente,
        cliente:x.cliente, uf:x.uf, pedido:x.pedido_numero, v:0, q:0, itens:0 };
    }
    var n = porNota[x.nf_id];
    n.v += Number(x.v_liquido)||0; n.q += Number(x.qtd)||0; n.itens++;
  });
  var notas = Object.keys(porNota).map(function(k){ return porNota[k]; })
    .sort(function(a,b){ return (a.emissao<b.emissao)?1:-1; });

  var h = 
    '<div class="tw"><table><thead><tr>'+
    '<th>Emissão</th><th>Cliente</th><th>UF</th><th>Emitente</th>'+
    '<th style="text-align:right">Itens</th><th style="text-align:right">Un</th>'+
    '<th style="text-align:right">Líquido</th><th>Pedido</th>'+
    '</tr></thead><tbody>'+
    notas.map(function(n){
      return '<tr><td class="mono">'+dataBR(n.emissao)+'</td>'+
        '<td>'+esc(n.cliente||"—")+'</td><td>'+esc(n.uf||"—")+'</td>'+
        '<td>'+esc(n.emitente||"—")+'</td>'+
        '<td class="n">'+n.itens+'</td><td class="n">'+inte(n.q)+'</td>'+
        '<td class="n">'+brl(n.v)+'</td>'+
        '<td class="mono">'+esc(n.pedido||"—")+'</td></tr>';
    }).join("")+'</tbody></table></div>';
  pinta(h);
}

var CLASS_ROTULO = { base:"Base", prospeccao:"Prospecção", lead:"Lead" };
var CLASS_COR = { base:"#3E7C45", prospeccao:"#D9772B", lead:"#7A6A57" };
var CREDITO_ROTULO = { nao_necessario:"Não necessário", pendente:"Pendente", aprovado:"Aprovado" };
var CREDITO_COR = { nao_necessario:"#7A6A57", pendente:"#D9772B", aprovado:"#3E7C45" };
async function telaClientes(){
  var rc = await sb.from("clientes").select("*").order("razao_social");
  if(rc.error) return pinta('<div class="card" style="--u:#C63A3A">'+esc(rc.error.message)+'</div>');
  var C = rc.data || [];
  var rf = await sb.from("v_faturamento").select("cliente_id,v_liquido,emissao");
  var acum = {};
  (rf.data||[]).forEach(function(x){
    if(!x.cliente_id) return;
    if(!acum[x.cliente_id]) acum[x.cliente_id] = { v:0, ultima:null };
    acum[x.cliente_id].v += Number(x.v_liquido)||0;
    if(!acum[x.cliente_id].ultima || x.emissao > acum[x.cliente_id].ultima){
      acum[x.cliente_id].ultima = x.emissao;
    }
  });
  ST.cache.clientes = C.map(function(c){
    var a = acum[c.id] || { v:0, ultima:null };
    c._v = a.v; c._ultima = a.ultima; return c;
  }).sort(function(a,b){ return b._v - a._v; });

  var rr = await sb.from("representantes").select("id,nome").order("nome");
  ST.cache.representantes = rr.data || [];

  pinta(
    formCliente()+
    barraFiltrosClientes()+
    '<div id="lista" style="margin-top:12px"></div>');
  filtraClientes();
}

  var ufOpcoes = ufs.map(function(u){ return '<option value="'+u+'">'+u+'</option>'; }).join("");
  var segOpcoes = ["varejo","marketplace","terceirizacao","representante"].map(function(s){
    return '<option value="'+s+'">'+SEG_ROTULO[s]+'</option>';
  }).join("");
  var classOpcoes = ["base","prospeccao","lead"].map(function(k){
    return '<option value="'+k+'">'+CLASS_ROTULO[k]+'</option>';
  }).join("");

    '<input id="busca" placeholder="Buscar por nome, cidade ou CNPJ" oninput="filtraClientes()">'+
    '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">'+
      '<select id="filtroUf" style="flex:1;min-width:120px" onchange="filtraClientes()"><option value="">Todos os estados</option>'+ufOpcoes+'</select>'+
      '<select id="filtroSegmento" style="flex:1;min-width:160px" onchange="filtraClientes()"><option value="">Todos os segmentos</option>'+segOpcoes+'</select>'+
      '<select id="filtroClassificacao" style="flex:1;min-width:160px" onchange="filtraClientes()"><option value="">Todas as classificações</option>'+classOpcoes+'</select>'+
    '</div></div>';

      (c?'<button onclick="telaClientes()">Cancelar edição</button>':"")+
    '</div></div>'+
    (c ? blocoContatosCliente(c.id) : '');
}
async function salvarCliente(){
  var id = $("clId").value.trim();
  var doc = $("clDoc").value.replace(/\D/g,"");
  var razao = $("clRazao").value.trim();
  if(!razao) return msg("Razão social é obrigatória", true);
  if(!doc) return msg("Documento é obrigatório", true);

  // Antes de criar, avisa se já existe outro cliente com o mesmo CNPJ/CPF
  // (evita duplicar quando o cadastro veio de um import sem documento)
  var existente = (ST.cache.clientes||[]).find(function(x){
    return (x.documento||"").replace(/\D/g,"") === doc && x.id !== id;
  });
  if(existente && !id){
    if(!confirm('Já existe um cliente com esse documento: "'+existente.razao_social+'". Deseja editar aquele registro em vez de criar um novo?')) return;
    id = existente.id;
  }

  var dados = {
    tipo_doc: $("clTipo").value,
    documento: doc,
    razao_social: razao,
    nome_fantasia: $("clFantasia").value.trim() || null,
    municipio: $("clMunicipio").value.trim() || null,
    uf: $("clUf").value.trim().toUpperCase() || null,
    segmento: $("clSegmento").value || null,
    classificacao: $("clClassificacao").value || null,
    representante_id: $("clRepresentante").value || null,
    observacao: $("clObs").value.trim() || null
  };

  var r, novoId = null;
  if(id){
    r = await sb.from("clientes").update(dados).eq("id", id);
  } else {
    dados.criado_por = ST.email;
    r = await sb.from("clientes").insert(dados).select("id").single();
    novoId = r.data && r.data.id;
  }
  if(r.error) return msg("Não deu para salvar: "+r.error.message, true);
  if(novoId){
    // cliente novo: já entra na edição dele, com o quadro de contatos pronto —
    // cadastro de cliente e de contato ficam na mesma tela, sem trocar de aba
    msg("Cliente cadastrado — adicione os contatos abaixo, se quiser");
    await telaClientes();
    editarCliente(novoId);
  } else {
    msg("Cliente atualizado");
    telaClientes();
  }
}
function editarCliente(id){
  pinta(
    formCliente(id)+
    barraFiltrosClientes()+
    '<div id="lista" style="margin-top:12px"></div>');
  filtraClientes();
  carregarContatosCliente(id);
  var el = $("clRazao"); if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
}
function filtraClientes(){
  var q = ($("busca") ? $("busca").value : "").toLowerCase().trim();
  var qDigitos = q.replace(/\D/g,"");
  var fUf = $("filtroUf") ? $("filtroUf").value : "";
  var fSeg = $("filtroSegmento") ? $("filtroSegmento").value : "";
  var fClass = $("filtroClassificacao") ? $("filtroClassificacao").value : "";
  var L = (ST.cache.clientes||[]).filter(function(c){
    if(fUf && c.uf !== fUf) return false;
    if(fSeg && c.segmento !== fSeg) return false;
    if(fClass && c.classificacao !== fClass) return false;
    if(!q) return true;
    var casaNome = (c.razao_social||"").toLowerCase().indexOf(q) >= 0
        || (c.nome_fantasia||"").toLowerCase().indexOf(q) >= 0;
    var casaCidade = (c.municipio||"").toLowerCase().indexOf(q) >= 0;
    var casaDoc = qDigitos.length > 0 && (c.documento||"").indexOf(qDigitos) >= 0;
    return casaNome || casaCidade || casaDoc;
  });
  if(!L.length) return $("lista").innerHTML = '<div class="vazio">Nenhum cliente com esse filtro.</div>';
  $("lista").innerHTML = '<div class="tw"><table><thead><tr>'+
    '<th>Cliente</th><th>Cidade</th><th>UF</th><th>Documento</th><th>Classificação</th>'+
    '<th style="text-align:right">Comprado</th><th>Última</th><th></th>'+
    '</tr></thead><tbody>'+
    L.map(function(c){
      return '<tr><td>'+esc(c.razao_social)+'</td>'+
        '<td>'+esc(c.municipio||"—")+'</td><td>'+esc(c.uf||"—")+'</td>'+
        '<td class="mono">'+esc(c.documento)+'</td>'+
        '<td>'+(c.classificacao?'<span class="tag" style="background:'+CLASS_COR[c.classificacao]+'">'+CLASS_ROTULO[c.classificacao]+'</span>':"—")+'</td>'+
        '<td class="n">'+brl(c._v)+'</td>'+
        '<td class="mono">'+dataBR(c._ultima)+'</td>'+
        '<td><button onclick="editarCliente(\''+c.id+'\')">✏️ editar</button></td></tr>';
    }).join("")+'</tbody></table></div>';
}

/* ---- Contatos do cliente, cadastrados direto aqui na tela Clientes ----     */
/* ---- (centralizado — não precisa ir na aba Contatos), em quadro-grid,      */
/* ---- mesmo modelo visual do "Quadro do dia" da Agenda (.quadro-grid/.nota) */
var CONTATO_COR_QUADRO = {
  decisor: {tarja:"#B8862B", fundo:"#F5EAD4", ic:"⭐"},
  padrao:  {tarja:"#7A6A57", fundo:"#EFE9E1", ic:"👤"}
};
function notaContatoCliente(x){
  var cor = x.decisor ? CONTATO_COR_QUADRO.decisor : CONTATO_COR_QUADRO.padrao;
  var acoes = '';
  if(x.telefone) acoes += '<button onclick="abrirWhatsApp(\''+esc(x.telefone)+'\')">💬 WhatsApp</button>';
  if(x.email) acoes += '<button onclick="window.location.href=\'mailto:'+esc(x.email)+'\'">✉️ E-mail</button>';
  acoes += '<button onclick="inativarContatoDoCliente(\''+x.id+'\',\''+x.cliente_id+'\')">🗑️ Inativar</button>';
  return '<div class="nota" style="background:'+cor.fundo+';border-left:5px solid '+cor.tarja+'">'+
    '<div class="tipo">'+cor.ic+' '+(x.decisor?'Decisor':'Contato')+'</div>'+
    '<div class="cliente">'+esc(x.nome)+'</div>'+
    '<div class="passo">'+(x.cargo?esc(x.cargo):'sem cargo informado')+'</div>'+
    (x.telefone||x.email ? '<div class="contato">'+[x.telefone,x.email].filter(Boolean).map(esc).join(' · ')+'</div>' : '')+
    '<div class="acoes">'+acoes+'</div>'+
    '</div>';
}
function blocoContatosCliente(clienteId){
  return '<div class="card" style="--u:#B8862B;margin-top:12px"><h3>Contatos deste cliente</h3>'+
    '<div id="clContatosGrid"><div class="vazio">Carregando…</div></div>'+
    '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--linha)">'+
      '<label for="ccNome">Nome do novo contato</label><input id="ccNome" placeholder="Nome">'+
      '<div style="display:flex;gap:8px">'+
        '<div style="flex:1"><label for="ccCargo">Cargo (opcional)</label><input id="ccCargo" placeholder="Ex.: Comprador"></div>'+
        '<div style="flex:1"><label for="ccTelefone">Telefone (opcional)</label><input id="ccTelefone" placeholder="(00) 00000-0000"></div>'+
      '</div>'+
      '<label for="ccEmail">E-mail (opcional)</label><input id="ccEmail" type="email">'+
      '<label style="display:flex;align-items:center;gap:8px;margin-top:14px;text-transform:none;letter-spacing:0;font-size:14px;font-weight:500">'+
        '<input type="checkbox" id="ccDecisor" style="width:auto"> É decisor de compra'+
      '</label>'+
      '<button class="b" style="margin-top:14px" onclick="salvarContatoDoCliente(\''+clienteId+'\')">+ Adicionar contato</button>'+
    '</div></div>';
}
async function carregarContatosCliente(clienteId){
  var grid = $("clContatosGrid");
  if(!grid) return;
  var r = await sb.schema("crm").from("contatos")
    .select("id,cliente_id,nome,cargo,telefone,email,decisor")
    .eq("cliente_id", clienteId).eq("ativo", true)
    .order("decisor", {ascending:false}).order("nome");
  if(r.error){ grid.innerHTML = '<div class="vazio">Não consegui ler os contatos: '+esc(r.error.message)+'</div>'; return; }
  var L = r.data || [];
  grid.innerHTML = L.length
    ? '<div class="quadro-grid">'+L.map(notaContatoCliente).join("")+'</div>'
    : '<div class="vazio">Nenhum contato cadastrado ainda.</div>';
}
async function salvarContatoDoCliente(clienteId){
  var nome = $("ccNome").value.trim();
  if(!nome) return msg("O nome do contato é obrigatório", true);
  var r = await sb.schema("crm").from("contatos").insert({
    cliente_id: clienteId,
    nome: nome,
    cargo: $("ccCargo").value.trim() || null,
    telefone: $("ccTelefone").value.trim() || null,
    email: $("ccEmail").value.trim() || null,
    decisor: $("ccDecisor").checked,
    criado_por: ST.email
  });
  if(r.error) return msg("Não deu para cadastrar o contato: "+r.error.message, true);
  msg("Contato cadastrado");
  $("ccNome").value=""; $("ccCargo").value=""; $("ccTelefone").value="";
  $("ccEmail").value=""; $("ccDecisor").checked=false;
  carregarContatosCliente(clienteId);
}
async function inativarContatoDoCliente(id, clienteId){
  var r = await sb.schema("crm").from("contatos").update({ativo:false}).eq("id", id);
  if(r.error) return msg("Não deu para inativar: "+r.error.message, true);
  msg("Contato inativado");
  carregarContatosCliente(clienteId);
}

/* ---- helpers do cockpit ---- */
function estrelasHtml(n){
  n = Number(n)||0;
  var s = '';
  for(var i=1;i<=5;i++){ s += (i<=n?'★':'☆'); }
  return s;
}
function mesAnoBR(chaveISO){ // "2026-06" -> "06/2026"
  var p = chaveISO.split("-");
  return p[1]+"/"+p[0];
}
function abrirWhatsApp(tel){
  if(!tel){ msg("Este contato não tem telefone cadastrado.", true); return; }
  var d = digitos(tel);
  if(!d){ msg("Telefone inválido.", true); return; }
  if(d.length <= 11) d = "55"+d; // assume BR quando não vem DDI
  window.open("https://wa.me/"+d, "_blank");
}
function irParaOportunidade(id){
  ST.oportunidadeAlvo = id; // carregarOportunidades() lê isso pra rolar até o card e destacar
  ir("oportunidades");
}
function painelCockpit(id, cor, icone, titulo, valor, sub){
  return '<a href="#'+id+'" class="painel" style="--u:'+cor+'">'+
    '<div class="painel-ic">'+icone+'</div>'+
    '<div class="painel-t">'+esc(titulo)+'</div>'+
    '<div class="painel-v">'+valor+'</div>'+
    (sub?'<div class="painel-s">'+esc(sub)+'</div>':'')+
    '</a>';
}

async function abrirFicha(){
  var cid = $("fiCliente").value;
  var alvo = $("fiCorpo");
  if(!alvo) return;
  if(!cid){ alvo.innerHTML = '<div class="vazio">Escolha um cliente para ver a ficha.</div>'; return; }
  alvo.innerHTML = '<div class="vazio">Carregando…</div>';

  var c = (ST.cache.clientesSelect||[]).filter(function(x){ return x.id === cid; })[0];
  if(!c){ alvo.innerHTML = '<div class="vazio">Cliente não encontrado.</div>'; return; }
  ST.cache.fichaClienteAtual = c;

  var rCart = await sb.from("vendas_pedidos")
    .select("pedido_numero,produto_nome,qtd,qtd_separada,valor_unitario,emissao,entrega,status")
    .eq("cliente_id", cid).order("entrega", {ascending:true, nullsFirst:false});
  var rNf = await sb.from("nf_venda")
    .select("id,numero,emissao,v_prod,classificacao").eq("cliente_id", cid)
    .order("emissao", {ascending:false});
  var rCt = await sb.schema("crm").from("contatos")
    .select("id,nome,cargo,telefone,email,decisor").eq("cliente_id", cid).eq("ativo", true);
  var rIn = await sb.schema("crm").from("interacoes")
    .select("id,tipo,data_interacao,resumo,proximo_passo,data_proximo_passo,concluido,contato_id")
    .eq("cliente_id", cid).order("data_interacao", {ascending:false});
  var rOp = await sb.schema("crm").from("oportunidades")
    .select("id,titulo,etapa,valor_estimado,previsao_fechamento").eq("cliente_id", cid);
  var rDoc = await sb.schema("crm").from("documentos_cliente")
    .select("id,nome,storage_path,tipo,criado_em").eq("cliente_id", cid)
    .order("criado_em", {ascending:false});

  var cart = rCart.data || [], nfs = rNf.data || [];
  var cts = rCt.data || [], ints = rIn.data || [], ops = rOp.data || [], docs = rDoc.data || [];

  var itensPorNf = {};
  if(nfs.length){
    var rItens = await sb.from("nf_venda_item")
      .select("nf_id,descricao,qtd,v_un,v_liquido")
      .in("nf_id", nfs.map(function(n){ return n.id; }));
    (rItens.data||[]).forEach(function(it){
      if(!itensPorNf[it.nf_id]) itensPorNf[it.nf_id] = [];
      itensPorNf[it.nf_id].push(it);
    });
  }

  function vl(x){ return (Number(x.qtd)||0) * (Number(x.valor_unitario)||0); }
  var abertos = cart.filter(function(x){ return x.status === 'aberto'; });
  var vAberto = abertos.reduce(function(a,x){ return a + vl(x); }, 0);
  var vTotal  = cart.reduce(function(a,x){ return a + vl(x); }, 0);
  var vendasNf = nfs.filter(function(n){ return n.classificacao === 'venda'; });
  var faturado = vendasNf.reduce(function(a,n){ return a + (Number(n.v_prod)||0); }, 0);
  var ultimaNf = nfs.length ? nfs[0].emissao : null;
  var ultimoPed = cart.reduce(function(a,x){
    return (x.emissao && (!a || x.emissao > a)) ? x.emissao : a; }, null);
  var diasSemComprar = ultimoPed ? -diasAte(ultimoPed) : null;

  /* histórico de compras mês a mês (últimos 6 meses com nota), com produtos por mês */
  var porMes = {};
  vendasNf.forEach(function(n){
    var chave = String(n.emissao).slice(0,7);
    if(!porMes[chave]) porMes[chave] = { valor:0, n:0, produtos:{} };
    porMes[chave].valor += Number(n.v_prod)||0;
    porMes[chave].n += 1;
    (itensPorNf[n.id]||[]).forEach(function(it){
      var nome = it.descricao || "—";
      if(!porMes[chave].produtos[nome]) porMes[chave].produtos[nome] = 0;
      porMes[chave].produtos[nome] += Number(it.v_liquido)||0;
    });
  });
  function topProdutos(mapa, n){
    return Object.keys(mapa).sort(function(a,b){ return mapa[b]-mapa[a]; }).slice(0,n);
  }
  var mesesOrdenados = Object.keys(porMes).sort().reverse().slice(0,6);

  /* próxima ação — pendências ordenadas pela data mais próxima */
  var pendencias = ints.filter(function(x){ return x.proximo_passo && !x.concluido; })
    .sort(function(a,b){
      if(!a.data_proximo_passo) return 1;
      if(!b.data_proximo_passo) return -1;
      return a.data_proximo_passo < b.data_proximo_passo ? -1 : 1;
    });
  var notas = ints.filter(function(x){ return x.tipo === 'outro'; });

  var h = '';

  /* ---- cabeçalho ---- */
  var iniciais = (c.razao_social||"??").trim().split(/\s+/).slice(0,2).map(function(w){return w[0]||"";}).join("").toUpperCase();
  h += '<div class="ficha-card" id="fiCabecalho" style="margin-bottom:10px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">'+
      '<div style="display:flex;align-items:center;gap:10px;min-width:0">'+
        '<div style="width:34px;height:34px;flex:none;border-radius:50%;background:#EAF3EA;'+
          'box-shadow:0 0 0 2px #DCEEDD;display:flex;align-items:center;justify-content:center;'+
          'font-size:12.5px;font-weight:800;color:#3E7C45">'+esc(iniciais)+'</div>'+
        '<div style="min-width:0">'+
          '<div style="font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+
            esc(c.razao_social)+
            (c.segmento ? ' <span class="tag" style="background:'+
              (c.segmento==='varejo'?'#DCEEDD;color:#2E5E33':c.segmento==='marketplace'?'#FBE9DA;color:#A05A1E':
               c.segmento==='terceirizacao'?'#F6EFDB;color:#8A6B1E':'#F1ECE3;color:#5F5E58')+
              ';font-size:9.5px;padding:2px 8px;margin-left:4px">'+
              esc(SEG_ROTULO[c.segmento]||c.segmento)+'</span>' : '')+
          '</div>'+
          '<div class="mono" style="font-size:10.5px;color:var(--tinta2);margin-top:1px">'+
            (c.municipio ? esc(c.municipio)+(c.uf?'/'+esc(c.uf):'')+' · ' : '')+
            (c.documento ? esc(c.documento) : 'sem CNPJ — ainda não faturado')+
          '</div>'+
        '</div>'+
      '</div>'+
      '<button class="s mini" onclick="abrirEditarClienteFicha()">✏️ Editar</button>'+
    '</div>'+
    '<div id="fiCabecalhoExtra" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--linha);'+
      'font-size:12px;display:flex;gap:16px;flex-wrap:wrap;color:var(--tinta2)">'+
      '<span style="color:#B8862B">'+estrelasHtml(c.classificacao_estrelas)+'</span>'+
      '<span>'+(c.site ? '<a href="'+esc(c.site)+'" target="_blank" rel="noopener">'+esc(c.site)+'</a>' : 'site não informado')+'</span>'+
      '<span>'+(c.condicao_pagamento ? esc(c.condicao_pagamento) : 'condição não informada')+'</span>'+
      '<span class="tag" style="background:'+(CREDITO_COR[c.situacao_credito]||'#7A6A57')+'">crédito: '+
        (CREDITO_ROTULO[c.situacao_credito]||CREDITO_ROTULO.nao_necessario)+'</span>'+
    '</div></div>';

  if(c.segmento === 'marketplace' || c.segmento === 'terceirizacao'){
    h += '<div class="card" style="--u:#D9772B">Este cadastro é um '+
      esc(SEG_ROTULO[c.segmento])+', não um cliente final — os números abaixo '+
      'agregam vários compradores ou um contrato industrial.</div>';
  }

  ST.cache.fichaContatos = cts;
  ST.cache.fichaOportunidades = ops;

  /* ---- cockpit: painéis clicáveis ---- */
  var opAberta = ops.filter(function(x){ return x.etapa.indexOf('fechado') !== 0; });
  var painelProxAcao = pendencias.length
    ? dataBR(pendencias[0].data_proximo_passo)+' · '+esc(pendencias[0].proximo_passo)
    : 'nada agendado';
  h += '<div class="cockpit">'+
    painelCockpit('secContatos', '#7A6A57', '👥', 'Contatos', inte(cts.length), cts.length?esc(cts[0].nome)+(cts.length>1?' +'+(cts.length-1):''):'nenhum') +
    painelCockpit('secProxima', '#D9772B', '🗓️', 'Próxima ação', pendencias.length?dataBR(pendencias[0].data_proximo_passo):'—', painelProxAcao) +
    painelCockpit('secOportunidades', '#B8862B', '🎯', 'Oportunidades', inte(opAberta.length), opAberta.length?'R$ '+brl(opAberta.reduce(function(a,x){return a+(Number(x.valor_estimado)||0);},0)):'nenhuma aberta') +
    painelCockpit('secCompras', '#B8862B', '📈', 'Faturado', 'R$ '+brl(faturado), inte(vendasNf.length)+' nota(s)') +
    painelCockpit('secDocumentos', '#22303A', '📄', 'Documentos', inte(docs.length), docs.length?'ver arquivos':'nenhum') +
    painelCockpit('secNotas', '#C63A3A', '📝', 'Notas', inte(notas.length), notas.length?'ver anotações':'nenhuma') +
    '</div>';

  /* ---- KPIs (como antes) ---- */
  h += '<div class="kpis">'+
    '<div class="kpi"><div class="r">Em carteira</div><div class="v">R$ '+brl(vAberto)+'</div>'+
      '<div class="n">'+inte(abertos.length)+' linha(s) em aberto</div></div>'+
    '<div class="kpi bom"><div class="r">Já faturado</div><div class="v">R$ '+brl(faturado)+'</div>'+
      '<div class="n">'+inte(nfs.length)+' nota(s)</div></div>'+
    '<div class="kpi'+(diasSemComprar !== null && diasSemComprar > 60 ? ' ruim':'')+'">'+
      '<div class="r">Último pedido</div><div class="v">'+
      (diasSemComprar === null ? '—' : inte(diasSemComprar)+'d')+'</div>'+
      '<div class="n">'+(ultimoPed ? dataBR(ultimoPed) : 'nunca')+'</div></div>'+
    '<div class="kpi"><div class="r">Última NF</div><div class="v mono" style="font-size:16px">'+
      dataBR(ultimaNf)+'</div><div class="n">'+(ultimaNf?'faturamento':'sem faturamento')+'</div></div>'+
    '</div>';

  h += '<div class="conta">R$ '+brl(vTotal)+' pedido no total &nbsp;−&nbsp; '+
       '<span class="p">R$ '+brl(vTotal - vAberto)+'</span> já baixado &nbsp;=&nbsp; '+
       '<b>R$ '+brl(vAberto)+' em aberto</b></div>';

  /* ---- contatos (inserir e editar direto na ficha, além de WhatsApp/E-mail) ---- */
  var hE = '', hD = '';
  hD += secaoFicha('secContatos', 'Contatos', cts.length,
    cts.map(function(x){ return notaContatoFicha(x); }).join(""), 'Nenhum contato cadastrado.');
  hD += '<div class="card" style="--u:#7A6A57"><h3 style="font-size:15px">Novo contato</h3>'+
    '<label for="ncNome">Nome</label><input id="ncNome" placeholder="Nome do contato">'+
    '<div style="display:flex;gap:8px">'+
      '<div style="flex:1"><label for="ncCargo">Cargo (opcional)</label><input id="ncCargo" placeholder="Ex.: Comprador"></div>'+
      '<div style="flex:1"><label for="ncTelefone">Telefone (opcional)</label><input id="ncTelefone" placeholder="(00) 00000-0000"></div>'+
    '</div>'+
    '<label for="ncEmail">E-mail (opcional)</label><input id="ncEmail" type="email">'+
    '<label style="display:flex;align-items:center;gap:8px;margin-top:14px;text-transform:none;letter-spacing:0;font-size:14px;font-weight:500">'+
      '<input type="checkbox" id="ncDecisor" style="width:auto"> É decisor de compra'+
    '</label>'+
    '<button class="b" style="margin-top:12px" onclick="salvarNovoContatoFicha(\''+cid+'\')">Cadastrar</button></div>';

  /* ---- próxima ação ---- */
  hD += secaoFicha('secProxima', 'Próxima ação', pendencias.length,
    pendencias.map(function(x){
      return '<div class="card" style="--u:#D9772B">'+
        '<b>'+dataBR(x.data_proximo_passo)+'</b> · '+esc(x.proximo_passo)+
        '<div style="font-size:13px;color:var(--tinta2);margin-top:3px">canal: '+esc(TIPO_ROTULO[x.tipo]||x.tipo)+'</div></div>';
    }).join(""), 'Nada agendado.');
  hD += '<div class="card" style="--u:#D9772B"><h3 style="font-size:15px">Agendar nova ação</h3>'+
    '<label for="paCanal">Canal</label><select id="paCanal">'+
      '<option value="whatsapp">WhatsApp</option><option value="ligacao">Ligação</option>'+
      '<option value="email">E-mail</option><option value="visita">Visita</option>'+
      '<option value="reuniao">Reunião</option><option value="outro">Outro</option></select>'+
    '<label for="paData">Data</label><input id="paData" type="date">'+
    '<label for="paTexto">O que fazer</label><input id="paTexto" placeholder="Ex.: Enviar catálogo novo">'+
    '<button class="b" style="margin-top:12px" onclick="salvarProximaAcao(\''+cid+'\')">Agendar</button></div>';

  /* ---- carteira em aberto ---- */
  hE += secaoFicha(null, 'Em carteira', abertos.length,
    abertos.length ? '<div class="tw"><table class="cards"><thead><tr>'+
      '<th>Pedido</th><th>Produto</th><th style="text-align:right">Qtd</th>'+
      '<th style="text-align:right">Valor</th><th>Entrega</th></tr></thead><tbody>'+
      abertos.map(function(x){
        var d = diasAte(x.entrega);
        var atras = d !== null && d < 0;
        return '<tr><td class="mono">'+esc(x.pedido_numero||'—')+'</td>'+
          '<td data-r="Produto">'+esc(x.produto_nome||'—')+'</td>'+
          '<td data-r="Qtd" class="n">'+inte(x.qtd)+
            (Number(x.qtd_separada)>0?' <span style="color:var(--pist)">('+inte(x.qtd_separada)+' sep.)</span>':'')+'</td>'+
          '<td data-r="Valor" class="n">'+brl(vl(x))+'</td>'+
          '<td data-r="Entrega" class="mono"'+(atras?' style="color:var(--mor);font-weight:700"':'')+'>'+
            dataBR(x.entrega)+(atras?' ⚠':'')+'</td></tr>';
      }).join("")+'</tbody></table></div>' : '', 'Nada em aberto.');

async function abrirNovoClienteFicha(){
  var alvo = $("fiCorpo");
  if(!alvo) return;
  alvo.innerHTML = '<div class="vazio">Carregando…</div>';
  var rr = await sb.from("representantes").select("id,nome").order("nome");
  ST.cache.representantesFicha = rr.data || [];
  alvo.innerHTML = formClienteFicha(null);
  var el = $("fcRazao"); if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
}
async function abrirEditarClienteFicha(){
  var atual = ST.cache.fichaClienteAtual;
  if(!atual) return;
  var alvo = $("fiCorpo");
  if(!alvo) return;
  alvo.innerHTML = '<div class="vazio">Carregando…</div>';
  var rr = await sb.from("representantes").select("id,nome").order("nome");
  ST.cache.representantesFicha = rr.data || [];
  // busca o registro completo — abrirFicha() só seleciona um subconjunto de colunas
  var rc = await sb.from("clientes").select("*").eq("id", atual.id).single();
  if(rc.error || !rc.data){ msg("Não consegui carregar o cadastro completo: "+(rc.error?rc.error.message:""), true); return; }
  alvo.innerHTML = formClienteFicha(rc.data);
  var el = $("fcRazao"); if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
}
async function salvarClienteFicha(){
  var id = $("fcId").value.trim();
  var doc = $("fcDoc").value.replace(/\D/g,"");
  var razao = $("fcRazao").value.trim();
  if(!razao) return msg("Razão social é obrigatória", true);
  if(!doc) return msg("Documento é obrigatório", true);

  var estrelasVal = $("fcEstrelas").value;
  var dados = {
    tipo_doc: $("fcTipo").value,
    documento: doc,
    razao_social: razao,
    nome_fantasia: $("fcFantasia").value.trim() || null,
    municipio: $("fcMunicipio").value.trim() || null,
    uf: $("fcUf").value.trim().toUpperCase() || null,
    segmento: $("fcSegmento").value || null,
    classificacao: $("fcClassificacao").value || null,
    representante_id: $("fcRepresentante").value || null,
    classificacao_estrelas: estrelasVal === "" ? null : Number(estrelasVal),
    site: $("fcSite").value.trim() || null,
    condicao_pagamento: $("fcCondicao").value.trim() || null,
    situacao_credito: $("fcCredito").value || "nao_necessario",
    observacao: $("fcObs").value.trim() || null
  };

  var r, novoId = null, criouNovo = false;
  if(id){
    r = await sb.from("clientes").update(dados).eq("id", id);
  } else {
    // avisa se já existe outro cliente com o mesmo CNPJ/CPF, em vez de duplicar
    var rDup = await sb.from("clientes").select("id,razao_social").eq("documento", doc).limit(1);
    if(rDup.data && rDup.data.length){
      if(!confirm('Já existe um cliente com esse documento: "'+rDup.data[0].razao_social+'". Deseja editar aquele registro em vez de criar um novo?')) return;
      id = rDup.data[0].id;
      r = await sb.from("clientes").update(dados).eq("id", id);
    } else {
      dados.criado_por = ST.email;
      r = await sb.from("clientes").insert(dados).select("id").single();
      novoId = r.data && r.data.id;
      criouNovo = true;
    }
  }
  if(r.error) return msg("Não deu para salvar: "+r.error.message, true);
  msg(criouNovo ? "Cliente cadastrado" : "Cliente atualizado");

  var alvoId = novoId || id;
  await telaFicha();      // recarrega o seletor de clientes (inclui o novo, se houver)
  $("fiCliente").value = alvoId;
  abrirFicha();
}

async function enviarDocumento(cid){
  var input = $("docArquivo");
  var arq = input && input.files && input.files[0];
  if(!arq){ msg("Escolha um arquivo antes de anexar.", true); return; }
  var caminho = cid+"/"+Date.now()+"_"+arq.name;
  var up = await sb.storage.from("documentos-clientes").upload(caminho, arq);
  if(up.error){ msg("Não consegui enviar o arquivo: "+up.error.message, true); return; }

/* Reaproveitado por Contatos, Agenda e Oportunidades. Mesmos critérios da
   tela Clientes: nome, cidade ou documento. */
function campoBuscaCliente(idBusca, idSelect){
  return '<label for="'+idBusca+'">Buscar cliente</label>'+
    '<input id="'+idBusca+'" placeholder="Nome, cidade ou CNPJ" '+
      'oninput="filtraSelectCliente(\''+idBusca+'\',\''+idSelect+'\')">';
}
function opcoesCliente(L){
  return '<option value="">Selecione o cliente…</option>' +
    (L||[]).map(function(c){
      return '<option value="'+c.id+'">'+esc(c.razao_social)+
             (c.municipio ? ' — '+esc(c.municipio)+(c.uf?'/'+esc(c.uf):'') : '')+'</option>';
    }).join("");
}
function filtraSelectCliente(idBusca, idSelect){
  var campo = $(idBusca), sel = $(idSelect);
  if(!campo || !sel) return;
  var q = campo.value.toLowerCase().trim();
  var qNum = q.replace(/\D/g,"");
  var L = (ST.cache.clientesSelect||[]).filter(function(c){
    if(!q) return true;
    return (c.razao_social||"").toLowerCase().indexOf(q) >= 0
        || (c.municipio||"").toLowerCase().indexOf(q) >= 0
        || (qNum && (c.documento||"").indexOf(qNum) >= 0);
  });
  var selecionado = sel.value;
  sel.innerHTML = opcoesCliente(L);
  // preserva a escolha se ela continuar na lista filtrada
  if(selecionado && L.some(function(c){ return c.id === selecionado; })) sel.value = selecionado;
  if(q && L.length === 1) sel.value = L[0].id;
  if(sel.onchange) sel.onchange();
}

async function carregarContatos(){
  var r = await sb.schema("crm").from("contatos")
    .select("id,cliente_id,nome,cargo,telefone,email,decisor,ativo")
    .order("nome");
  var lista = $("ctLista");
  if(r.error){
    if(lista) lista.innerHTML = '<div class="card" style="--u:#C63A3A">Não consegui ler os contatos: '+esc(r.error.message)+'</div>';
    return;
  }
  var porCliente = {};
  (ST.cache.clientesSelect||[]).forEach(function(c){ porCliente[c.id] = c.razao_social; });
  ST.cache.contatos = (r.data||[]).map(function(x){
    x._cliente = porCliente[x.cliente_id] || "—";
    return x;
  });
  filtraContatos();
}
function filtraContatos(){
  var q = ($("ctBusca") ? $("ctBusca").value : "").toLowerCase().trim();
  var L = (ST.cache.contatos||[]).filter(function(x){
    if(!x.ativo) return false;
    if(!q) return true;
    return (x.nome||"").toLowerCase().indexOf(q) >= 0
        || (x._cliente||"").toLowerCase().indexOf(q) >= 0;
  });
  var lista = $("ctLista");
  if(!lista) return;
  if(!L.length){ lista.innerHTML = '<div class="vazio">Nenhum contato encontrado.</div>'; return; }
  lista.innerHTML = '<div class="tw"><table class="cards"><thead><tr>'+
    '<th>Nome</th><th>Cliente</th><th>Cargo</th><th>Telefone</th><th>E-mail</th><th></th>'+
    '</tr></thead><tbody>'+
    L.map(function(x){
      return '<tr><td>'+esc(x.nome)+(x.decisor?' <span class="tag" style="background:#B8862B">decisor</span>':'')+'</td>'+
        '<td data-r="Cliente">'+esc(x._cliente)+'</td>'+
        '<td data-r="Cargo">'+esc(x.cargo||"—")+'</td>'+
        '<td data-r="Telefone" class="mono">'+esc(x.telefone||"—")+'</td>'+
        '<td data-r="E-mail">'+esc(x.email||"—")+'</td>'+
        '<td><button class="s" onclick="inativarContato(\''+x.id+'\')">Inativar</button></td></tr>';
    }).join("")+'</tbody></table></div>';
}
async function salvarContato(){
  var clienteId = $("ctCliente").value;
  var nome = $("ctNome").value.trim();
  if(!clienteId) return msg("Escolha o cliente", true);
  if(!nome) return msg("O nome é obrigatório", true);
  var r = await sb.schema("crm").from("contatos").insert({
    cliente_id: clienteId,
    nome: nome,
    cargo: $("ctCargo").value.trim() || null,
    telefone: $("ctTelefone").value.trim() || null,
    email: $("ctEmail").value.trim() || null,
    decisor: $("ctDecisor").checked,
    observacoes: $("ctObs").value.trim() || null,
    criado_por: ST.email
  });
  if(r.error) return msg("Não deu para cadastrar: "+r.error.message, true);
  msg("Contato cadastrado");
  $("ctNome").value=""; $("ctCargo").value=""; $("ctTelefone").value="";
  $("ctEmail").value=""; $("ctDecisor").checked=false; $("ctObs").value="";
  carregarContatos();
}
async function inativarContato(id){
  var r = await sb.schema("crm").from("contatos").update({ativo:false}).eq("id", id);
  if(r.error) return msg("Não deu para inativar: "+r.error.message, true);
  msg("Contato inativado");
  carregarContatos();
}

function hojeISO(){
  var d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function diasAte(dataISO){
  if(!dataISO) return null;
  var h = new Date(hojeISO()+"T00:00:00");
  var d = new Date(String(dataISO).slice(0,10)+"T00:00:00");
  return Math.round((d - h) / 86400000);
}

var TIPO_COR_QUADRO = {

function notaQuadroDia(x, nomeCliente, contatoObj){

  return '<div class="nota" style="background:'+cor.fundo+';border-left:5px solid '+cor.tarja+'">'+
    '<div class="tipo">'+cor.ic+' '+esc(TIPO_ROTULO[x.tipo]||x.tipo)+'</div>'+
    '<div class="cliente">'+esc(nomeCliente[x.cliente_id]||"—")+'</div>'+
    '<div class="passo">'+esc(x.proximo_passo)+'</div>'+
    (ct ? '<div class="contato">'+esc(ct.nome)+'</div>' : '')+
    '<div class="acoes">'+acoes+'</div>'+
    '</div>';

function cardInteracaoPendente(x, cor, nomeCliente, nomeContato){
  var d = diasAte(x.data_proximo_passo);
  var quando = x.data_proximo_passo
    ? dataBR(x.data_proximo_passo) + (d < 0 ? ' · '+Math.abs(d)+' dia(s) atrás'
                                    : d === 0 ? ' · hoje' : ' · em '+d+' dia(s)')
    : "sem data";
  return '<div class="card" style="--u:'+cor+'">'+
    '<h3>'+esc(nomeCliente[x.cliente_id] || "—")+'</h3>'+
    '<div style="font-size:13.5px;color:var(--tinta2);margin-bottom:6px">'+
      esc(TIPO_ROTULO[x.tipo]||x.tipo)+' em '+dataBR(x.data_interacao)+
      (x.contato_id && nomeContato[x.contato_id] ? ' · '+esc(nomeContato[x.contato_id]) : '')+
    '</div>'+
    '<div style="margin-bottom:8px">'+esc(x.resumo)+'</div>'+
    '<div class="conta"><b>Próximo passo:</b> '+esc(x.proximo_passo)+' &nbsp;·&nbsp; '+esc(quando)+'</div>'+
    '<button class="s" style="margin-top:8px" onclick="concluirInteracao(\''+x.id+'\')">Marcar como feito</button>'+
    '</div>';
}
async function carregarAgenda(){
  var r = await sb.schema("crm").from("interacoes")
    .select("id,cliente_id,contato_id,tipo,data_interacao,resumo,proximo_passo,data_proximo_passo,concluido")
    .order("data_interacao", {ascending:false});
  var lista = $("agLista");
  if(!lista) return;
  if(r.error){
    lista.innerHTML = '<div class="card" style="--u:#C63A3A">Não consegui ler a agenda: '+esc(r.error.message)+'</div>';
    return;
  }
  var nomeCliente = {}, nomeContato = {}, contatoObj = {};
  (ST.cache.clientesSelect||[]).forEach(function(c){ nomeCliente[c.id] = c.razao_social; });
  (ST.cache.contatosTodos||[]).forEach(function(c){ nomeContato[c.id] = c.nome; contatoObj[c.id] = c; });

  var todas = r.data || [];
  var pendentes = todas.filter(function(x){ return x.proximo_passo && !x.concluido; });
  var semPasso = todas.filter(function(x){ return !x.proximo_passo || x.concluido; });

  // três baldes pela decisão de quando agir — hoje / atrasado / o resto em aberto
  var hojeItens = pendentes.filter(function(x){ return diasAte(x.data_proximo_passo) === 0; })
    .sort(function(a,b){ return String(a.data_proximo_passo).localeCompare(String(b.data_proximo_passo)); });
  var atrasados = pendentes.filter(function(x){ var d=diasAte(x.data_proximo_passo); return d!==null && d<0; })
    .sort(function(a,b){ return String(a.data_proximo_passo||"9999").localeCompare(String(b.data_proximo_passo||"9999")); });
  var restantes = pendentes.filter(function(x){ var d=diasAte(x.data_proximo_passo); return d===null || d>0; });

  var subgrupos = [
    { t:"Próximos 7 dias", cor:"#B8862B", f:function(d){ return d !== null && d >= 1 && d <= 7; } },
    { t:"Mais adiante",    cor:"#3E7C45", f:function(d){ return d !== null && d > 7; } },
    { t:"Sem data marcada",cor:"#7A6A57", f:function(d){ return d === null; } }
  ];
  var restanteHtml = subgrupos.map(function(g){
    var L = restantes.filter(function(x){ return g.f(diasAte(x.data_proximo_passo)); })
                      .sort(function(a,b){ return String(a.data_proximo_passo||"9999").localeCompare(String(b.data_proximo_passo||"9999")); });
    if(!L.length) return '';
    return '<h4 style="margin:14px 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--tinta2)">'+
      esc(g.t)+' · '+inte(L.length)+'</h4>'+
      L.map(function(x){ return cardInteracaoPendente(x, g.cor, nomeCliente, nomeContato); }).join("");
  }).join("");

  var histHtml = semPasso.length ? '<div class="tw"><table class="cards"><thead><tr>'+
    '<th>Cliente</th><th>Tipo</th><th>Data</th><th>Resumo</th></tr></thead><tbody>'+
    semPasso.slice(0,40).map(function(x){
      return '<tr><td>'+esc(nomeCliente[x.cliente_id]||"—")+'</td>'+
        '<td data-r="Tipo">'+esc(TIPO_ROTULO[x.tipo]||x.tipo)+'</td>'+
        '<td data-r="Data" class="mono">'+dataBR(x.data_interacao)+'</td>'+
        '<td data-r="Resumo">'+esc(x.resumo)+'</td></tr>';
    }).join("")+'</tbody></table></div>' : '';

  var h = "";

  /* ---- grade de painéis clicáveis, igual Ficha do cliente — isto é o que ---- */
  /* ---- precisa estar em destaque; o resto vira seção, alcançada por aqui ---- */
  h += '<div class="cockpit">'+
    painelCockpit('secQuadro', '#D9772B', '📌', 'Quadro do dia', inte(hojeItens.length), hojeItens.length?'pendente(s) hoje':'nada hoje') +
    painelCockpit('secAtrasado', '#C63A3A', '⚠️', 'Atrasado', inte(atrasados.length), atrasados.length?'retorno vencido':'em dia') +
    painelCockpit('secRestante', '#7A6A57', '🗓️', 'Em aberto', inte(restantes.length), 'demais pendências') +
    painelCockpit('secHistorico', '#22303A', '📜', 'Histórico', inte(semPasso.length), 'já resolvidas') +
    painelCockpit('secNova', '#3E7C45', '➕', 'Nova interação', 'Registrar', 'cliente e retorno') +
    '</div>';

  h += '<div class="conta">'+inte(todas.length)+' interações &nbsp;−&nbsp; '+
    inte(todas.length - pendentes.length)+' já resolvidas &nbsp;=&nbsp; '+
    '<b>'+inte(pendentes.length)+' aguardando retorno</b></div>';

  h += secaoFicha('secQuadro', 'Quadro do dia · '+dataBR(hojeISO()), hojeItens.length,
    '<div class="quadro-grid">'+hojeItens.map(function(x){ return notaQuadroDia(x, nomeCliente, contatoObj); }).join("")+'</div>',
    'Nada marcado para hoje.');

  h += secaoFicha('secAtrasado', 'Atrasado', atrasados.length,
    atrasados.map(function(x){ return cardInteracaoPendente(x, '#C63A3A', nomeCliente, nomeContato); }).join(""),
    'Nenhum retorno atrasado.');

  h += secaoFicha('secRestante', 'Em aberto', restantes.length, restanteHtml, 'Nada mais em aberto.');

  h += secaoFicha('secHistorico', 'Histórico', semPasso.length, histHtml, 'Nenhuma interação resolvida ainda.');

  /* ---- registrar interação: virou seção no fim, não mais o topo da tela ---- */
  h += '<h3 id="secNova" style="margin:22px 0 8px;font-size:14px;text-transform:uppercase;'+
    'letter-spacing:.09em;color:var(--tinta2);scroll-margin-top:80px">Nova interação</h3>'+
    '<div class="card" style="--u:#3E7C45">'+
    campoBuscaCliente("agBuscaCli","agCliente")+
    '<label for="agCliente">Cliente</label><select id="agCliente" onchange="agContatosDoCliente()">'+opcoesCliente(ST.cache.clientesSelect)+'</select>'+
    '<label for="agContato">Contato (opcional)</label><select id="agContato"><option value="">—</option></select>'+
    '<label for="agTipo">Tipo</label><select id="agTipo">'+
      '<option value="visita">Visita</option><option value="ligacao">Ligação</option>'+
      '<option value="mensagem">Mensagem</option><option value="email">E-mail</option>'+
      '<option value="reuniao">Reunião</option><option value="outro">Outro</option></select>'+
    '<label for="agData">Data da interação</label><input id="agData" type="date" value="'+hojeISO()+'">'+
    '<label for="agResumo">O que foi conversado</label><input id="agResumo" placeholder="Resumo da conversa">'+
    '<label for="agPasso">Próximo passo (opcional)</label><input id="agPasso" placeholder="Ex.: enviar tabela de preços">'+
    '<label for="agPassoData">Quando</label><input id="agPassoData" type="date">'+
    '<button class="b" style="margin-top:14px" onclick="salvarInteracao()">Registrar</button></div>';

  lista.innerHTML = h;
}
async function salvarInteracao(){
  var cid = $("agCliente").value;
  var resumo = $("agResumo").value.trim();
  if(!cid) return msg("Escolha o cliente", true);
  if(!resumo) return msg("Descreva o que foi conversado", true);
  var passo = $("agPasso").value.trim();
  var passoData = $("agPassoData").value;
  if(passoData && !passo) return msg("Escreva qual é o próximo passo", true);
  var r = await sb.schema("crm").from("interacoes").insert({
    cliente_id: cid,
    contato_id: $("agContato").value || null,
    tipo: $("agTipo").value,
    data_interacao: $("agData").value || hojeISO(),
    resumo: resumo,
    proximo_passo: passo || null,
    data_proximo_passo: passoData || null,
    criado_por: ST.email
  });
  if(r.error) return msg("Não deu para registrar: "+r.error.message, true);
  msg("Interação registrada");
  $("agResumo").value=""; $("agPasso").value=""; $("agPassoData").value="";
  carregarAgenda();
}
async function concluirInteracao(id){
  var r = await sb.schema("crm").from("interacoes").update({concluido:true}).eq("id", id);
  if(r.error) return msg("Não deu para concluir: "+r.error.message, true);
  msg("Marcado como feito");
  carregarAgenda();
}
