async function carregarOportunidades(){
  var r = await sb.schema("crm").from("oportunidades")
    .select("id,cliente_id,titulo,produto_acabado_id,valor_estimado,etapa,probabilidade,previsao_fechamento,motivo_perda")
    .order("previsao_fechamento", {ascending:true, nullsFirst:false});
  var lista = $("opLista");
  if(!lista) return;
  if(r.error){
    lista.innerHTML = '<div class="card" style="--u:#C63A3A">Não consegui ler as oportunidades: '+esc(r.error.message)+'</div>';
    return;
  }
  var rCotCont = await sb.schema("crm").from("cotacoes").select("id,oportunidade_id").not("oportunidade_id", "is", null);
  var contagemProp = {};
  (rCotCont.data||[]).forEach(function(x){ contagemProp[x.oportunidade_id] = (contagemProp[x.oportunidade_id]||0)+1; });

  var nomeCliente = {}, nomeProd = {};
  (ST.cache.clientesSelect||[]).forEach(function(c){ nomeCliente[c.id] = c.razao_social; });
  (ST.cache.produtos||[]).forEach(function(p){ nomeProd[p.id] = p.nome; });

  var todas = r.data || [];

  // filtros opcionais (por padrão, sem nada selecionado, mostra tudo — inclusive
  // clientes Prospecção; a classificação só oferece Base/Lead como opção de filtro)
  var fSeg = $("fOpSegmento") ? $("fOpSegmento").value : "";
  var fClass = $("fOpClassificacao") ? $("fOpClassificacao").value : "";
  if(fSeg || fClass){
    var infoCliente = {};
    (ST.cache.clientesSelect||[]).forEach(function(c){ infoCliente[c.id] = c; });
    todas = todas.filter(function(x){
      var c = infoCliente[x.cliente_id];
      if(!c) return false;
      if(fSeg && c.segmento !== fSeg) return false;
      if(fClass && c.classificacao !== fClass) return false;
      return true;
    });
  }

  var abertas = todas.filter(function(x){ return x.etapa.indexOf("fechado") !== 0; });

  var h = '<div class="kanban">';
  ETAPAS.forEach(function(e, idx){
    var L = abertas.filter(function(x){ return x.etapa === e.k; });
    h += '<div class="kanban-col">'+
      '<div class="kanban-head" style="--u:'+e.cor+'"><span>'+esc(e.r)+'</span><b>'+inte(L.length)+'</b></div>'+
      '<div class="kanban-body" ondragover="kbDragOver(event)" ondragleave="kbDragLeave(event)" '+
        'ondrop="kbDrop(event,\''+e.k+'\')">';
    if(!L.length){
      h += '<div class="vazio" style="padding:14px 4px;font-size:13px">Nada aqui</div>';
    }
    L.forEach(function(x){
      var d = diasAte(x.previsao_fechamento);
      var prev = x.previsao_fechamento
        ? dataBR(x.previsao_fechamento) + (d < 0 ? ' · vencida há '+Math.abs(d)+' dia(s)'
                                          : d === 0 ? ' · hoje' : ' · em '+d+' dia(s)')
        : 'sem previsão';
      var corCard = (d !== null && d < 0) ? '#C63A3A' : e.cor;
      h += '<div class="kanban-card" id="kc_'+x.id+'" style="--u:'+corCard+'" draggable="true" '+
        'ondragstart="kbDragStart(event,\''+x.id+'\')" ondragend="kbDragEnd(event)">'+
        '<div class="kc-cliente">'+esc(nomeCliente[x.cliente_id]||"—")+'</div>'+
        '<div class="kc-titulo">'+esc(x.titulo)+'</div>'+
        '<div class="kc-meta">'+
          (x.produto_acabado_id && nomeProd[x.produto_acabado_id] ? esc(nomeProd[x.produto_acabado_id])+' · ' : '')+
          esc(prev)+'</div>'+
        (x.valor_estimado != null
          ? '<div class="kc-vlr">R$ '+brl(x.valor_estimado)+' × '+
            (x.probabilidade != null ? x.probabilidade : e.prob)+'% = R$ '+
            brl((Number(x.valor_estimado)||0) * ((x.probabilidade != null ? x.probabilidade : e.prob)/100))+'</div>'
          : '')+
        (contagemProp[x.id]
          ? '<span class="kc-badge" onclick="abrirNovaProposta(\''+x.id+'\',\''+x.cliente_id+'\',\''+jsAttr(x.titulo)+'\')">📄 '+
            contagemProp[x.id]+' proposta(s)</span>'
          : '')+
        '<div class="kc-acoes">'+
          (idx>0
            ? '<button class="kc-mv" onclick="moverEtapaDireta(\''+x.id+'\','+(idx-1)+')" title="Voltar etapa">‹</button>'
            : '<span class="kc-mv-off">‹</span>')+
          (idx<ETAPAS.length-1
            ? '<button class="kc-mv" onclick="moverEtapaDireta(\''+x.id+'\','+(idx+1)+')" title="Avançar etapa">›</button>'
            : '<span class="kc-mv-off">›</span>')+
          '<button class="kc-prop" onclick="abrirNovaProposta(\''+x.id+'\',\''+x.cliente_id+'\',\''+jsAttr(x.titulo)+'\')">📋 Proposta</button>'+
          '<button class="kc-win" onclick="fecharOportunidade(\''+x.id+'\',true)">✓ Ganhou</button>'+
          '<button class="kc-lose" onclick="fecharOportunidade(\''+x.id+'\',false)">✕ Perdeu</button>'+
        '</div></div>';
    });
    h += '</div></div>';
  });
  h += '</div>';

  lista.innerHTML = h;

  // veio da Ficha do cliente clicando em "Abrir no funil" — rola até o card e pisca
  if(ST.oportunidadeAlvo){
    var alvoId = ST.oportunidadeAlvo;
    ST.oportunidadeAlvo = null;
    setTimeout(function(){
      var el = document.getElementById("kc_"+alvoId);
      if(!el) return;
      el.scrollIntoView({behavior:"smooth", block:"center", inline:"center"});
      el.classList.add("kc-flash");
      setTimeout(function(){ el.classList.remove("kc-flash"); }, 3200);
    }, 60);
  }
}
async function salvarOportunidade(){
  var cid = $("opCliente").value;
  if(!cid) return msg("Escolha o cliente", true);
  var valor = $("opValor").value;
  var prodId = $("opProduto").value;
  var linha = null, prodNome = null;
  if(prodId){
    var p = (ST.cache.produtos||[]).filter(function(y){ return y.id === prodId; })[0];
    if(p){ linha = p.linha || null; prodNome = p.nome; }
  }
  var cliente = (ST.cache.clientesSelect||[]).filter(function(y){ return y.id === cid; })[0];
  var nomeCliente = cliente ? cliente.razao_social : "cliente";
  var titulo = prodNome ? (prodNome + " — " + nomeCliente) : nomeCliente; // não se pergunta mais "o que é": vem do produto + cliente
  var r = await sb.schema("crm").from("oportunidades").insert({
    cliente_id: cid,
    titulo: titulo,
    produto_acabado_id: prodId || null,
    linha: linha,
    valor_estimado: valor !== "" ? Number(valor) : null,
    etapa: $("opEtapa").value,
    previsao_fechamento: $("opPrevisao").value || null,
    observacoes: $("opObs").value.trim() || null
  });
  if(r.error) return msg("Não deu para cadastrar: "+r.error.message, true);
  msg("Oportunidade cadastrada");
  fecharNovaOportunidadeForm();
  carregarOportunidades();
}
async function moverEtapaDireta(id, novoIdx){
  if(novoIdx < 0 || novoIdx >= ETAPAS.length) return;
  var r = await sb.schema("crm").from("oportunidades")
    .update({ etapa: ETAPAS[novoIdx].k, atualizado_em: new Date().toISOString() }).eq("id", id);
  if(r.error) return msg("Não deu para mover: "+r.error.message, true);
  msg("Movida para "+ETAPAS[novoIdx].r);
  carregarOportunidades();
}
/* arraste do quadro — mouse/desktop; celular usa as setas ‹ › do cartão */
var kbDragId = null;
function kbDragStart(ev, id){
  kbDragId = id;
  if(ev.dataTransfer){ ev.dataTransfer.setData("text/plain", id); ev.dataTransfer.effectAllowed = "move"; }
  ev.target.classList.add("arrastando");
}
function kbDragEnd(ev){ ev.target.classList.remove("arrastando"); }
function kbDragOver(ev){ ev.preventDefault(); ev.currentTarget.classList.add("sobre"); }
function kbDragLeave(ev){ ev.currentTarget.classList.remove("sobre"); }
function kbDrop(ev, etapaKey){
  ev.preventDefault();
  ev.currentTarget.classList.remove("sobre");
  var id = (ev.dataTransfer && ev.dataTransfer.getData("text/plain")) || kbDragId;
  kbDragId = null;
  if(!id) return;
  var idx = -1;
  ETAPAS.forEach(function(e, i){ if(e.k === etapaKey) idx = i; });
  if(idx < 0) return;
  moverEtapaDireta(id, idx);
}
async function fecharOportunidade(id, ganhou){
  var motivo = null;
  if(!ganhou){
    motivo = prompt("Por que perdeu? (preço, prazo, concorrente, sem resposta…)");
    if(motivo === null) return;
    motivo = motivo.trim() || null;
  }
  var r = await sb.schema("crm").from("oportunidades").update({
    etapa: ganhou ? "fechado_ganho" : "fechado_perdido",
    motivo_perda: motivo,
    atualizado_em: new Date().toISOString()
  }).eq("id", id);
  if(r.error) return msg("Não deu para fechar: "+r.error.message, true);
  msg(ganhou ? "Marcada como ganha" : "Marcada como perdida");
  carregarOportunidades();
}

async function abrirNovaProposta(oportunidadeId, clienteId, tituloEsc){
  var alvo = $("opPainelContainer");
  if(!alvo) return;
  alvo.innerHTML = '<div class="vazio">Carregando…</div>';
  alvo.scrollIntoView({behavior:"smooth", block:"start"});

  var rCt = await sb.schema("crm").from("contatos").select("id,nome,cargo")

  var rCot = await sb.schema("crm").from("cotacoes")
    .select("id,numero,data_cotacao,validade,status,valor_total,contato_id")

  var rTab = await sb.schema("crm").from("tabelas_preco")
    .select("id,nome,pedido_minimo").eq("ativa", true).order("pedido_minimo", {ascending:true});

  if(rCli.error || !rCli.data){ alvo.innerHTML = '<div class="card" style="--u:#C63A3A">Não consegui abrir o cliente desta oportunidade.</div>'; return; }

  var tabelas = rTab.data || [];
  var tabelaItens = {};
  if(tabelas.length){
    var rTI = await sb.schema("crm").from("tabela_preco_itens")

      .in("tabela_id", tabelas.map(function(t){ return t.id; }));
    (rTI.data||[]).forEach(function(it){
      if(!it.produto_acabado_id) return;
      if(!tabelaItens[it.tabela_id]) tabelaItens[it.tabela_id] = {};
      tabelaItens[it.tabela_id][it.produto_acabado_id] = { preco_unitario: Number(it.preco_unitario)||0, preco_sugerido: Number(it.preco_sugerido)||0 };

  }

  var representante = null;
  if(rCli.data.representante_id){
    var rRep = await sb.from("representantes").select("id,nome,comissao_pct").eq("id", rCli.data.representante_id).single();
    representante = rRep.data || null;
  }

  var rNumCompras = await sb.from("nf_venda").select("id").eq("cliente_id", clienteId).eq("classificacao","venda");
  var numCompras = (rNumCompras.data||[]).length;

  ST.cache.propModoStandalone = false;
  ST.cache.propCliente = rCli.data;
  ST.cache.propContatos = rCt.data || [];
  ST.cache.propPrecoPadrao = {};
  (rPreco.data||[]).forEach(function(p){ ST.cache.propPrecoPadrao[p.produto_acabado_id] = Number(p.preco)||0; });
  ST.cache.propOportunidadeId = oportunidadeId;
  ST.cache.propTitulo = tituloEsc;

  ST.cache.propRepresentante = representante;
  ST.cache.propNumCompras = numCompras;
  ST.cache.propCondicaoSelecionada = "";

  var propostas = rCot.data || [];
  var nomeContato = {};
  ST.cache.propContatos.forEach(function(c){ nomeContato[c.id] = c.nome; });

  var h = '<div class="card" style="--u:#B8862B"><h3>Propostas · '+tituloEsc+'</h3>'+
    '<div style="font-size:13px;color:var(--tinta2);margin-top:-6px;margin-bottom:10px">'+esc(ST.cache.propCliente.razao_social)+'</div>'+
    (propostas.length ? propostas.map(function(x){
      return '<div class="card" style="--u:'+(STATUS_COR_PROP[x.status]||'#DCD2C4')+';margin-bottom:8px">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">'+
          '<div><b>Proposta #'+inte(x.numero)+'</b> · '+dataBR(x.data_cotacao)+
            '<span class="tag" style="background:'+(STATUS_COR_PROP[x.status]||'#7A6A57')+';margin-left:6px">'+esc(STATUS_ROTULO_PROP[x.status]||x.status)+'</span></div>'+
          '<div style="font-weight:800;font-family:ui-monospace,Menlo,monospace">R$ '+brl(x.valor_total)+'</div>'+
        '</div>'+
        (x.contato_id && nomeContato[x.contato_id] ? '<div style="font-size:12.5px;color:var(--tinta2);margin-top:4px">pra '+esc(nomeContato[x.contato_id])+'</div>' : '')+
        '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">'+
          '<button class="s mini" onclick="baixarPdfProposta(\''+x.id+'\')">📄 Baixar PDF</button>'+
          (x.status==='rascunho' ? '<button class="s mini" onclick="enviarProposta(\''+x.id+'\')">📤 Marcar como enviada</button>' : '')+
        '</div>'+
      '</div>';
    }).join("") : '<div class="vazio">Nenhuma proposta ainda pra essa oportunidade.</div>')+
    '</div>';

  h += htmlFormularioProposta();

  alvo.innerHTML = h;
  renderItensProposta();
}

function fecharPainelProposta(){
  if(ST.cache.propModoStandalone){ telaNovaProposta(); return; }

}
function melhorTabelaProposta(valorTotal){
  var elegiveis = (ST.cache.propTabelas||[]).filter(function(t){ return Number(t.pedido_minimo) <= valorTotal; });
  if(!elegiveis.length) return null;
  return elegiveis.reduce(function(a,b){ return Number(b.pedido_minimo) > Number(a.pedido_minimo) ? b : a; });
}
function precoNaTabelaProposta(tabelaId, produtoId){
  var m = ST.cache.propTabelaItens && ST.cache.propTabelaItens[tabelaId];
  return m ? m[produtoId] : null;
}
function condicoesPagamentoDisponiveis(numCompras, valorPedido){
  var opcoes = ["À vista", "Cartão em até 3x sem juros"];
  if(numCompras >= 3){
    var prazos = [14, 21];
    if(valorPedido > 1000) prazos = prazos.concat([28, 35]);
    if(valorPedido > 3000) prazos = prazos.concat([42]);
    prazos.forEach(function(d){ opcoes.push("Boleto "+d+" dias (mediante crédito aprovado)"); });
  }
  return opcoes;
}
function adicionarItemProposta(){
  ST.cache.propItensAtual.push({ produto_acabado_id:"", descricao:"", qtd:1, valor_unitario:0, desconto_pct:0, bonificado:false });
  renderItensProposta();
}
function removerItemProposta(idx){
  ST.cache.propItensAtual.splice(idx, 1);
  renderItensProposta();
}
function selecionarProdutoItem(idx, produtoId){
  var item = ST.cache.propItensAtual[idx];
  if(!item) return;
  item.produto_acabado_id = produtoId;
  var prod = (ST.cache.produtos||[]).filter(function(p){ return p.id === produtoId; })[0];
  item.descricao = prod ? prod.nome : "";
  // sugestão inicial: preço da melhor tabela pro total já somado até aqui; sem tabela elegível, cai no preço padrão
  var totalAtual = (ST.cache.propItensAtual||[]).filter(function(it){ return !it.bonificado; })
    .reduce(function(a,it){ return a + totalItemProposta(it); }, 0);
  var tab = melhorTabelaProposta(totalAtual);
  var precoTab = tab ? precoNaTabelaProposta(tab.id, produtoId) : null;
  if(precoTab){
    item.valor_unitario = precoTab.preco_unitario;
  } else if(ST.cache.propPrecoPadrao && ST.cache.propPrecoPadrao[produtoId] != null){
    item.valor_unitario = ST.cache.propPrecoPadrao[produtoId];
  }
  renderItensProposta();
}
function aplicarTabelaATodosItens(){
  var itens = ST.cache.propItensAtual || [];
  function totalNaoBonificado(){
    return itens.filter(function(it){ return !it.bonificado; }).reduce(function(a,it){ return a + totalItemProposta(it); }, 0);
  }
  for(var passo=0; passo<2; passo++){
    var tab = melhorTabelaProposta(totalNaoBonificado());
    if(!tab) break;
    itens.forEach(function(it){
      if(it.bonificado || !it.produto_acabado_id) return;

function atualizarItemProposta(idx, campo, valor){

function totalItemProposta(item){

function recalcularTotalProposta(){

function atualizarResumoProposta(){

  var totalBonificado = itens.filter(function(it){ return it.bonificado; }).reduce(function(a,it){ return a + totalItemProposta(it); }, 0);

  var menorMinimo = tabelasOrdenadas.length ? Number(tabelasOrdenadas[0].pedido_minimo) : null;

  var opcoesPag = condicoesPagamentoDisponiveis(ST.cache.propNumCompras||0, totalVendido);

  }

  var usaBoleto = ST.cache.propCondicaoSelecionada.indexOf("Boleto") === 0;
  var limiteBonificacao = totalVendido * 0.03;

  var h = '';
  if(menorMinimo !== null && totalVendido < menorMinimo){
    h += '<div class="card" style="--u:#C63A3A;font-size:13px">Pedido de R$ '+brl(totalVendido)+
      ' não atinge o pedido mínimo de R$ '+brl(menorMinimo)+' — não vai ser possível marcar como enviada.</div>';
  } else if(tabela){
    h += '<div class="card" style="--u:#3E7C45;font-size:13px">Tabela aplicada: <b>'+esc(tabela.nome)+'</b> '+
      '(pedido mínimo R$ '+brl(tabela.pedido_minimo)+')'+
      (proxima ? '<br>Faltam <b>R$ '+brl(Number(proxima.pedido_minimo)-totalVendido)+'</b> para acessar a '+esc(proxima.nome)+', com preço unitário melhor.' : '')+
      '</div>';
  }

  h += '<label for="prCondicaoSel">Condição de pagamento</label>'+
    '<select id="prCondicaoSel" onchange="ST.cache.propCondicaoSelecionada=this.value;atualizarResumoProposta()">'+
    opcoesPag.map(function(o){ return '<option value="'+esc(o)+'"'+(o===ST.cache.propCondicaoSelecionada?' selected':'')+'>'+esc(o)+'</option>'; }).join("")+
    '</select>';
  if((ST.cache.propNumCompras||0) < 3){
    h += '<div style="font-size:12px;color:var(--tinta2);margin-top:-8px">Cliente com menos de 3 compras — só à vista/cartão até a 3ª compra.</div>';
  }
  if(usaBoleto){
    h += '<div class="card" style="--u:'+(cliente.situacao_credito==='aprovado'?'#3E7C45':'#D9772B')+';font-size:13px;margin-top:8px">'+
      'Situação de crédito do cliente: <b>'+(CREDITO_ROTULO[cliente.situacao_credito]||CREDITO_ROTULO.nao_necessario)+'</b>'+
      (cliente.situacao_credito!=='aprovado' ? ' — boleto exige crédito aprovado antes do faturamento.' : '')+
      '</div>';
  }

  h += '<div class="conta" style="margin-top:12px">R$ '+brl(totalVendido)+' em itens vendidos'+
    (totalBonificado>0 ? ' &nbsp;+&nbsp; <span style="color:var(--mor)">R$ '+brl(totalBonificado)+' bonificação</span>' : '')+
    ' &nbsp;=&nbsp; <b id="prTotal">R$ '+brl(totalVendido+totalBonificado)+'</b></div>';
  h += '<div style="font-size:12px;color:var(--tinta2);margin-top:4px">Limite de bonificação (3% do vendido): R$ '+brl(limiteBonificacao)+
    (totalBonificado>limiteBonificacao ? ' <b style="color:var(--mor)">— acima do limite</b>' : '')+'</div>';
  h += '<div style="font-size:12px;color:var(--tinta2);margin-top:2px">Frete CIF · faturamento em até '+
    ($("prPrazo")?esc($("prPrazo").value||"7"):"7")+' dias · despacho no dia seguinte ao faturamento.</div>';

  res.innerHTML = h;
}

async function baixarPdfProposta(cotacaoId){
  if(typeof window.jspdf === "undefined"){ msg("Não consegui gerar o PDF.", true); return; }
  var rC = await sb.schema("crm").from("cotacoes")
    .select("id,numero,cliente_id,data_cotacao,validade,condicao_pagamento,frete,prazo_faturamento_dias,situacao_credito,tabela_preco_id,representante_id,comissao_pct_aplicada,valor_total,observacoes")
    .eq("id", cotacaoId).single();
  if(rC.error || !rC.data){ msg("Não consegui carregar a proposta.", true); return; }
  var cot = rC.data;
  var rCli = await sb.from("clientes").select("razao_social").eq("id", cot.cliente_id).single();
  var rI = await sb.schema("crm").from("cotacao_itens")
    .select("descricao,qtd,valor_unitario,desconto_pct,bonificado").eq("cotacao_id", cotacaoId);
  var itens = rI.data || [];
  var clienteNome = (rCli.data && rCli.data.razao_social) || "cliente";

  var tabela = null;
  if(cot.tabela_preco_id){
    var rT = await sb.schema("crm").from("tabelas_preco").select("nome,pedido_minimo").eq("id", cot.tabela_preco_id).single();
    tabela = rT.data || null;
  }
  var repNome = null;
  if(cot.representante_id){
    var rR = await sb.from("representantes").select("nome").eq("id", cot.representante_id).single();
    repNome = rR.data ? rR.data.nome : null;
  }

  var vendidos = itens.filter(function(it){ return !it.bonificado; });
  var bonificados = itens.filter(function(it){ return it.bonificado; });
  var totalBonif = bonificados.reduce(function(a,it){ return a + (Number(it.qtd)||0)*(Number(it.valor_unitario)||0)*(1-(Number(it.desconto_pct)||0)/100); }, 0);

  var doc = new window.jspdf.jsPDF();
  doc.setFontSize(16); doc.text("Proposta comercial #"+cot.numero, 14, 18);
  doc.setFontSize(10);
  doc.text("Cliente: "+clienteNome, 14, 28);
  doc.text("Data: "+dataBR(cot.data_cotacao)+(cot.validade?"   Válida até: "+dataBR(cot.validade):""), 14, 34);

  var linhas = vendidos.map(function(it){
    var vu = Number(it.valor_unitario)||0, qtd = Number(it.qtd)||0, desc = Number(it.desconto_pct)||0;
    var tot = qtd*vu*(1-desc/100);
    return [it.descricao||"—", String(qtd), "R$ "+brl(vu), (desc||0)+"%", "R$ "+brl(tot)];
  });
  doc.autoTable({
    startY: 42, head: [["Produto","Qtd","V. unit.","Desc.","Total"]], body: linhas,
    styles: { fontSize: 9 }, headStyles: { fillColor: [34,48,58] }
  });
  var y = (doc.lastAutoTable ? doc.lastAutoTable.finalY : 60) + 8;

  if(bonificados.length){
    doc.setFontSize(10); doc.text("Bonificação (degustação):", 14, y); y += 5;
    var linhasBonif = bonificados.map(function(it){
      return [it.descricao||"—", String(Number(it.qtd)||0), "R$ "+brl((Number(it.qtd)||0)*(Number(it.valor_unitario)||0))];
    });
    doc.autoTable({
      startY: y, head: [["Produto","Qtd","Valor (não cobrado)"]], body: linhasBonif,
      styles: { fontSize: 9 }, headStyles: { fillColor: [184,134,43] }
    });
    y = (doc.lastAutoTable ? doc.lastAutoTable.finalY : y) + 8;
  }

  doc.setFontSize(12);
  doc.text("Total: R$ "+brl(cot.valor_total), 14, y); y += 10;

  doc.setFillColor(34,48,58);
  doc.rect(14, y-5, 182, 7, "F");
  doc.setTextColor(255,255,255); doc.setFontSize(11);
  doc.text("Tabela e Condições Comerciais", 16, y);
  doc.setTextColor(0,0,0); doc.setFontSize(9.5);
  y += 8;
  var linhasCondicoes = [
    ["Tabela aplicada", tabela ? tabela.nome : "—"],
    ["Pedido mínimo da tabela", tabela ? "R$ "+brl(tabela.pedido_minimo) : "—"],
    ["Valor total do pedido", "R$ "+brl(cot.valor_total)],
    ["Condição de pagamento", cot.condicao_pagamento || "—"],
    ["Situação de crédito", CREDITO_ROTULO[cot.situacao_credito] || "Não necessário"],
    ["Frete", cot.frete || "CIF"],
    ["Prazo de faturamento", "até "+(cot.prazo_faturamento_dias!=null?cot.prazo_faturamento_dias:7)+" dias após confirmação e liberação financeira"],
    ["Despacho", "dia seguinte ao faturamento"],
    ["Bonificação (degustação)", bonificados.length ? "R$ "+brl(totalBonif) : "nenhuma"],
    ["Validade da proposta", cot.validade ? dataBR(cot.validade) : "—"],
    ["Representante", repNome || "—"],
    ["Comissão do representante", cot.comissao_pct_aplicada!=null ? (Number(cot.comissao_pct_aplicada))+"% após liquidação financeira" : "—"]
  ];
  doc.autoTable({
    startY: y, body: linhasCondicoes, theme: "plain",
    styles: { fontSize: 9.5, cellPadding: 1.5 },
    columnStyles: { 0: { fontStyle: "bold", cellWidth: 60 } }
  });
  y = (doc.lastAutoTable ? doc.lastAutoTable.finalY : y) + 8;

  if(cot.observacoes){ doc.setFontSize(10); doc.text("Obs.: "+cot.observacoes, 14, y); }
  doc.save("proposta-"+cot.numero+"-"+clienteNome.replace(/[^a-zA-Z0-9]+/g,"-")+".pdf");
}

async function salvarRepres(){

    nome: nome,

    dados.criado_por = ST.email;

    if(String(r.error.message).indexOf("duplicate") >= 0) return msg("Já existe um representante com esse nome", true);

  }
  msg(id ? "Representante atualizado" : "Representante cadastrado");

var LIQ_STATUS_ROTULO = {
  pendentes:"Precisa de atenção (aberta/atrasada/parcial)", atrasada:"Atrasada", parcial:"Parcial",
  aberta:"Aberta (a vencer)", liquidada:"Liquidada", sem_controle:"Sem controle (sem parcela)", todas:"Todas"
};
var LIQ_STATUS_COR = { atrasada:"#C63A3A", parcial:"#D9772B", aberta:"#B8862B", liquidada:"#3E7C45", sem_controle:"#7A6A57" };

async function telaLiquidacao(){
  ST.cache.liqFiltro = ST.cache.liqFiltro || { status:"pendentes", busca:"" };
  pinta(formFiltroLiquidacao()+'<div id="liqLista" style="margin-top:12px"></div>'+'<div id="liqDetalhe" style="margin-top:14px"></div>');
  buscarLiquidacao();
}
function formFiltroLiquidacao(){
  var f = ST.cache.liqFiltro;
  return '<div class="card" style="--u:#22303A"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">'+
    '<div style="flex:1;min-width:180px"><label for="liqBusca">Buscar (nº da NF ou cliente)</label>'+
      '<input id="liqBusca" value="'+esc(f.busca)+'" onkeydown="if(event.key===\'Enter\')buscarLiquidacaoDoForm()"></div>'+
    '<div><label for="liqStatus">Situação</label><select id="liqStatus" onchange="buscarLiquidacaoDoForm()">'+
      ["pendentes","atrasada","parcial","aberta","liquidada","sem_controle","todas"].map(function(k){
        return '<option value="'+k+'"'+(f.status===k?' selected':'')+'>'+LIQ_STATUS_ROTULO[k]+'</option>';
      }).join("")+
    '</select></div>'+
    '<button class="b" onclick="buscarLiquidacaoDoForm()">Buscar</button>'+
  '</div></div>';
}
function buscarLiquidacaoDoForm(){
  ST.cache.liqFiltro.busca = $("liqBusca").value.trim();
  ST.cache.liqFiltro.status = $("liqStatus").value;
  buscarLiquidacao();
}
async function buscarLiquidacao(){
  var alvo = $("liqLista");
  if(!alvo) return;
  alvo.innerHTML = '<div class="vazio">Buscando…</div>';
  var f = ST.cache.liqFiltro;
  var campos = "nf_id,numero,emissao,cliente_id,v_prod,qtd_parcelas,valor_parcelado,valor_pago,status_liquidacao";

  function aplicaStatus(q){
    if(f.status === "pendentes") return q.in("status_liquidacao", ["aberta","atrasada","parcial"]);
    if(f.status !== "todas") return q.eq("status_liquidacao", f.status);
    return q;
  }

  var linhas = [];
  if(f.busca){
    var q1 = aplicaStatus(sb.from("vw_nf_venda_liquidacao").select(campos).ilike("numero","%"+f.busca+"%"))
      .order("emissao",{ascending:false}).limit(80);
    linhas = (await q1).data || [];
    if(!linhas.length){
      var rCli = await sb.from("clientes").select("id").ilike("razao_social","%"+f.busca+"%");
      var ids = (rCli.data||[]).map(function(c){return c.id;});
      if(ids.length){
        var q2 = aplicaStatus(sb.from("vw_nf_venda_liquidacao").select(campos).in("cliente_id", ids))
          .order("emissao",{ascending:false}).limit(80);
        linhas = (await q2).data || [];
      }
    }
  } else {
    var q0 = aplicaStatus(sb.from("vw_nf_venda_liquidacao").select(campos)).order("emissao",{ascending:false}).limit(80);
    linhas = (await q0).data || [];
  }

  if(!linhas.length){ alvo.innerHTML = '<div class="vazio">Nenhuma NF encontrada com esse filtro.</div>'; return; }

  var clienteIds = Array.from(new Set(linhas.map(function(l){return l.cliente_id;}).filter(Boolean)));
  var nomeCliente = {};
  if(clienteIds.length){
    var rC = await sb.from("clientes").select("id,razao_social").in("id", clienteIds);
    (rC.data||[]).forEach(function(c){ nomeCliente[c.id] = c.razao_social; });
  }
  ST.cache.liqNomeCliente = nomeCliente;

  alvo.innerHTML = '<div class="tw"><table><thead><tr><th>NF</th><th>Cliente</th><th>Emissão</th>'+
    '<th style="text-align:right">Valor</th><th style="text-align:right">Pago</th><th>Situação</th></tr></thead><tbody>'+
    linhas.map(function(l){
      return '<tr style="cursor:pointer" onclick="abrirDetalheLiquidacao(\''+l.nf_id+'\')">'+
        '<td class="mono">'+esc(l.numero)+'</td><td>'+esc(nomeCliente[l.cliente_id]||"—")+'</td>'+
        '<td class="mono">'+dataBR(l.emissao)+'</td>'+
        '<td class="n mono">R$ '+brl(l.v_prod)+'</td><td class="n mono">R$ '+brl(l.valor_pago)+'</td>'+
        '<td><span class="tag" style="background:'+(LIQ_STATUS_COR[l.status_liquidacao]||'#7A6A57')+'">'+
          (LIQ_STATUS_ROTULO[l.status_liquidacao]||l.status_liquidacao)+'</span></td></tr>';
    }).join("")+'</tbody></table></div>';
}
async function abrirDetalheLiquidacao(nfId){

    '<button class="s mini" onclick="$(\'liqDetalhe\').innerHTML=\'\'">✕ Fechar</button></div></div>';

  h += '<div style="margin-top:10px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tinta2)">Parcelas</div>';

  h += '<div class="card" style="--u:#3E7C45;margin-top:10px"><h3 style="font-size:15px">'+

function abrirBaixaParcela(parcelaId){
  var alvo = $("baixaForm_"+parcelaId);
  if(!alvo) return;
  alvo.innerHTML = '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--linha)">'+

async function confirmarBaixaParcela(parcelaId){
  var data = $("bxData_"+parcelaId).value;
  var valor = Number($("bxValor_"+parcelaId).value);
  var forma = $("bxForma_"+parcelaId).value;
  if(!data || !valor){ msg("Preencha data e valor.", true); return; }
  var r = await sb.rpc("baixar_parcela", {
    p_parcela_id: parcelaId, p_data_pagamento: data, p_valor_pago: valor,
    p_forma_pagamento: forma, p_responsavel: ST.email
  });
  if(r.error){ msg("Não deu para baixar: "+r.error.message, true); return; }
  msg("Parcela baixada.");
  abrirDetalheLiquidacao(ST.cache.liqNfAtual.id);
  buscarLiquidacao();
}
function adicionarLinhaPlano(){
  var plano = ST.cache.liqNovoPlano || [];
  var proxNum = (ST.cache.liqParcelasAtual||[]).length + plano.length + 1;
  plano.push({numero: proxNum, valor: 0, vencimento: ""});
  ST.cache.liqNovoPlano = plano;
  renderPlanoParcelas();
}
function atualizarLinhaPlano(idx, campo, valor){
  ST.cache.liqNovoPlano[idx][campo] = valor;
}
function removerLinhaPlano(idx){
  ST.cache.liqNovoPlano.splice(idx,1);
  renderPlanoParcelas();
}
function renderPlanoParcelas(){
  var alvo = $("liqPlanoContainer");
  if(!alvo) return;
  var plano = ST.cache.liqNovoPlano || [];
  alvo.innerHTML = plano.length ? plano.map(function(p, idx){
    return '<div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end;margin-top:8px">'+
      '<div><label>Nº</label><input type="number" min="1" value="'+p.numero+'" oninput="atualizarLinhaPlano('+idx+',\'numero\',Number(this.value))"></div>'+
      '<div><label>Valor</label><input type="number" step="0.01" value="'+p.valor+'" oninput="atualizarLinhaPlano('+idx+',\'valor\',Number(this.value))"></div>'+
      '<div><label>Vencimento</label><input type="date" value="'+p.vencimento+'" oninput="atualizarLinhaPlano('+idx+',\'vencimento\',this.value)"></div>'+
      '<button class="s mini" onclick="removerLinhaPlano('+idx+')">Remover</button></div>';
  }).join("") : '<div class="vazio">Nenhuma parcela nova — clique em "Adicionar parcela".</div>';
}
async function salvarPlanoParcelas(){
  var plano = ST.cache.liqNovoPlano || [];
  if(!plano.length){ msg("Adicione ao menos uma parcela.", true); return; }
  for(var i=0;i<plano.length;i++){
    if(!plano[i].vencimento || !plano[i].valor){ msg("Preencha valor e vencimento de todas as parcelas.", true); return; }
  }
  var r = await sb.rpc("gerar_parcelas_nf", {
    p_nf_id: ST.cache.liqNfAtual.id,
    p_parcelas: plano.map(function(p){ return {numero:p.numero, valor:p.valor, vencimento:p.vencimento}; }),
    p_responsavel: ST.email
  });
  if(r.error){ msg("Não deu para gravar: "+r.error.message, true); return; }
  msg("Parcelas gravadas.");
  abrirDetalheLiquidacao(ST.cache.liqNfAtual.id);
  buscarLiquidacao();
}

  if(!item){
    if(delta <= 0) return;
    var prod = (ST.cache.npProdutos||[]).filter(function(p){ return p.id === produtoId; })[0];
    item = { produto_acabado_id:produtoId, descricao: prod?prod.nome:"", qtd:0, valor_unitario: precoAtualCatalogo(produtoId)||0, desconto_pct:0, bonificado:false };
    itens.push(item);
  }
  item.qtd = Math.max(0, (Number(item.qtd)||0) + delta);
  if(item.qtd === 0){
    ST.cache.propItensAtual = itens.filter(function(it){ return it !== item; });
  } else {
    var preco = precoAtualCatalogo(produtoId);
    if(preco != null) item.valor_unitario = preco;
  }
  renderCatalogoProposta();
  renderResumoCarrinhoProposta();
}
function renderCatalogoProposta(){
  var alvo = $("npLista"); if(!alvo) return;
  var busca = ($("npBusca") ? $("npBusca").value : "").toLowerCase();
  var linha = ST.cache.npFiltroLinha || "Todas";
  var lista = (ST.cache.npProdutos||[]).filter(function(p){
    return (linha==="Todas" || p.linha===linha) && p.nome.toLowerCase().indexOf(busca) >= 0;
  });
  alvo.innerHTML = lista.length ? lista.map(function(p){
    var qtd = qtdNoCarrinho(p.id);
    var preco = precoAtualCatalogo(p.id);
    return '<div style="display:flex;align-items:center;gap:10px;border:1px solid var(--linha);border-radius:12px;padding:10px 12px;margin-bottom:8px">'+
      '<div style="flex:1;min-width:0">'+
        '<div style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.nome)+'</div>'+
        '<div style="font-size:12px;color:var(--tinta2);margin-top:2px">'+(p.linha?esc(p.linha)+' · ':'')+(preco!=null?'R$ '+brl(preco):'sem preço de tabela')+'</div>'+
      '</div>'+
      (qtd>0 ?
        '<div style="display:flex;align-items:center;gap:6px">'+
          '<button class="s mini" onclick="alterarQtdCatalogo(\''+p.id+'\',-1)">−</button>'+
          '<span style="min-width:16px;text-align:center;font-family:ui-monospace,Menlo,monospace">'+qtd+'</span>'+
          '<button class="s mini" onclick="alterarQtdCatalogo(\''+p.id+'\',1)">+</button>'+
        '</div>'
       : '<button class="s mini" onclick="alterarQtdCatalogo(\''+p.id+'\',1)">+ Adicionar</button>')+
    '</div>';
  }).join("") : '<div class="vazio">Nenhum produto encontrado.</div>';
}
function renderResumoCarrinhoProposta(){
  var alvo = $("npResumoCarrinho"); if(!alvo) return;
  var itens = ST.cache.propItensAtual || [];
  var n = itens.reduce(function(a,it){ return a + (Number(it.qtd)||0); }, 0);
  if(!n){
    alvo.innerHTML = "";
    ST.cache.npClienteResolvido = false;
    ST.cache.npClienteEmSelecao = false;
    $("npClienteContainer").innerHTML = "";
    $("npFormularioContainer").innerHTML = "";
    return;
  }
  var total = itens.filter(function(it){ return !it.bonificado; }).reduce(function(a,it){ return a + totalItemProposta(it); }, 0);
  var tab = melhorTabelaCarrinho();
  var tabelasOrd = (ST.cache.propTabelas||[]).slice().sort(function(a,b){ return a.pedido_minimo - b.pedido_minimo; });
  var proxima = tabelasOrd.filter(function(t){ return t.pedido_minimo > total; })[0];

  alvo.innerHTML = '<div class="card" style="--u:#3E7C45">'+
    '<div style="display:flex;justify-content:space-between;align-items:baseline">'+
      '<span style="font-size:13px;color:var(--tinta2)">'+n+' '+(n===1?'item':'itens')+'</span>'+
      '<span style="font-size:20px;font-weight:800;font-family:ui-monospace,Menlo,monospace">R$ '+brl(total)+'</span>'+
    '</div>'+
    (tab ? '<div style="font-size:12.5px;color:var(--tinta2);margin-top:2px">'+esc(tab.nome)+' aplicada'+
        (proxima ? ' · faltam R$ '+brl(Number(proxima.pedido_minimo)-total)+' pra '+esc(proxima.nome) : '')+'</div>' : '')+
    (ST.cache.npClienteResolvido ?
      '<div style="font-size:12.5px;color:var(--tinta2);margin-top:8px">Proposta em andamento pra <b>'+esc((ST.cache.propCliente||{}).razao_social||"")+'</b></div>'+
      '<button class="s mini" style="margin-top:6px" onclick="trocarClienteProposta()">🔄 Trocar cliente</button>'
     : ST.cache.npClienteEmSelecao ?
      '<div style="font-size:12.5px;color:var(--tinta2);margin-top:8px">Escolha o cliente abaixo para continuar ↓</div>'
     : '<button class="b" style="width:100%;margin-top:10px" onclick="iniciarClienteProposta()">Montar proposta →</button>')+
  '</div>';

  // se o formulário já está aberto, mantém a lista de itens e o resumo dele em dia
  if(ST.cache.npClienteResolvido && $("prItens")) renderItensProposta();
}

async function confirmarOportunidadeProposta(){
  var clienteId = ST.cache.npClienteEscolhido;
  var oportunidadeEscolhida = $("npOportunidade") ? $("npOportunidade").value : "";
  var alvo = $("npClienteContainer");
  alvo.innerHTML = '<div class="vazio">Preparando a proposta…</div>';

  var totalCarrinho = (ST.cache.propItensAtual||[]).filter(function(it){ return !it.bonificado; })
    .reduce(function(a,it){ return a + totalItemProposta(it); }, 0);

  var oportunidadeId = oportunidadeEscolhida, titulo = "";
  if(!oportunidadeId){
    var rc = (ST.cache.clientesSelect||[]).filter(function(c){return c.id===clienteId;})[0];
    var rNovaOp = await sb.schema("crm").from("oportunidades").insert({
      cliente_id: clienteId,
      titulo: "Proposta " + new Date().toLocaleDateString("pt-BR") + (rc?" — "+rc.razao_social:""),
      etapa: "proposta",
      valor_estimado: totalCarrinho
    }).select("id,titulo").single();
    if(rNovaOp.error){ alvo.innerHTML = '<div class="card" style="--u:#C63A3A">Não consegui criar a oportunidade: '+esc(rNovaOp.error.message)+'</div>'; return; }
    oportunidadeId = rNovaOp.data.id; titulo = rNovaOp.data.titulo;
  } else {
    var op = (await sb.schema("crm").from("oportunidades").select("titulo").eq("id",oportunidadeId).single()).data;
    titulo = op ? op.titulo : "proposta";
  }

  var rCli = await sb.from("clientes")
    .select("id,razao_social,condicao_pagamento,representante_id,situacao_credito").eq("id", clienteId).single();
  var rCt = await sb.schema("crm").from("contatos").select("id,nome,cargo").eq("cliente_id", clienteId).eq("ativo", true).order("nome");
  var rPreco = await sb.schema("crm").from("preco_padrao").select("produto_acabado_id,preco");
  var representante = null;
  if(rCli.data && rCli.data.representante_id){
    var rRep = await sb.from("representantes").select("id,nome,comissao_pct").eq("id", rCli.data.representante_id).single();
    representante = rRep.data || null;
  }
  var rNumCompras = await sb.from("nf_venda").select("id").eq("cliente_id", clienteId).eq("classificacao","venda");

  ST.cache.propCliente = rCli.data;
  ST.cache.propContatos = rCt.data || [];
  ST.cache.propPrecoPadrao = {};
  (rPreco.data||[]).forEach(function(p){ ST.cache.propPrecoPadrao[p.produto_acabado_id] = Number(p.preco)||0; });
  ST.cache.propOportunidadeId = oportunidadeId;
  ST.cache.propTitulo = esc(titulo);
  ST.cache.propRepresentante = representante;
  ST.cache.propNumCompras = (rNumCompras.data||[]).length;
  ST.cache.propCondicaoSelecionada = "";

  alvo.innerHTML = '<div class="card" style="--u:#3E7C45;font-size:13px">Proposta pra <b>'+esc(rCli.data.razao_social)+'</b> — oportunidade "'+esc(titulo)+'"</div>';
  ST.cache.npClienteResolvido = true;
  renderResumoCarrinhoProposta();
  $("npFormularioContainer").innerHTML = htmlFormularioProposta();
  renderItensProposta();
  $("npFormularioContainer").scrollIntoView({behavior:"smooth", block:"start"});
}

/* ================= importar ================= */
function telaImportar(){
  pinta(
    ''+
    '<div class="drop" id="drop" onclick="document.getElementById(\'arq\').click()">'+
      '<b>Escolher arquivos XML ou .zip</b><span>ou arraste os arquivos para cá — pode mandar vários de uma vez, ou um .zip com tudo dentro</span>'+
    '</div>'+
    '<input id="arq" type="file" accept=".xml,.zip,text/xml,application/xml,application/zip" multiple '+
      'style="position:absolute;left:-9999px" onchange="importar(this.files)">'+
    '<div id="res" style="margin-top:16px"></div>');
  var d = $("drop");
  ["dragenter","dragover"].forEach(function(e){
    d.addEventListener(e, function(ev){ ev.preventDefault(); d.classList.add("over"); });
  });
  ["dragleave","drop"].forEach(function(e){
    d.addEventListener(e, function(ev){ ev.preventDefault(); d.classList.remove("over"); });
  });
  d.addEventListener("drop", function(ev){
    if(ev.dataTransfer && ev.dataTransfer.files) importar(ev.dataTransfer.files);
  });
}

async function importar(files, opts){
  opts = opts || {};
  var criarClientes = opts.criarClientes !== false; // default true (fluxo comercial/B2B, comportamento original)
  var arrOriginal = Array.prototype.slice.call(files || []);
  if(!arrOriginal.length) return;

  /* 0. expandir .zip em .xml (assim não precisa descompactar antes de subir) */
  $("res").innerHTML = '<div class="card"><h3>Preparando arquivos…</h3></div>';
  var arr;
  try {
    arr = await expandirArquivos(arrOriginal, function(msg){
      $("res").innerHTML = '<div class="card"><h3>'+esc(msg)+'</h3></div>';
    });
  } catch(e){
    return $("res").innerHTML = erroCartao("não consegui ler os arquivos (zip corrompido?): "+e.message);
  }
  if(!arr.length) return $("res").innerHTML = '<div class="card" style="--u:#D9772B"><h3>Nenhum XML encontrado</h3><p>Confira se o .zip contém arquivos .xml.</p></div>';
  $("res").innerHTML = '<div class="card"><h3>Lendo '+arr.length+' arquivo(s)…</h3></div>';

  /* 1. ler os XMLs */
  var lidas = [], falhas = [], vistas = {};
  for(var i=0; i<arr.length; i++){
    if(i % 500 === 0) $("res").innerHTML = '<div class="card"><h3>Lendo… '+i+' de '+arr.length+'</h3></div>';
    var texto = arr[i].texto;
    var nf = lerNFe(texto, arr[i].name);
    if(nf.erro){ falhas.push({ arq:arr[i].name, motivo:nf.erro }); continue; }
    if(vistas[nf.chave]){ continue; }
    vistas[nf.chave] = 1;
    lidas.push(nf);
  }
  if(!lidas.length){
    return $("res").innerHTML = cartaoFalhas(falhas, 0, 0);
  }

  /* 2. emitentes conhecidos */
  var re = await sb.from("emitentes").select("*");
  if(re.error) return $("res").innerHTML = erroCartao(re.error.message);
  var emitMap = {}, distribuidores = [];
  (re.data||[]).forEach(function(e){
    emitMap[e.cnpj] = e;
    if(e.distribuidor) distribuidores.push(e.cnpj);
  });
  var semEmitente = {};
  lidas = lidas.filter(function(nf){
    if(!emitMap[nf.emitente_cnpj]){
      semEmitente[nf.emitente_cnpj] = nf.emitente_nome;
      return false;
    }
    return true;
  });
  if(!lidas.length){
    return $("res").innerHTML = cartaoEmitente(semEmitente);
  }

  /* 3. notas que já existem — consultado em blocos (URL tem limite de tamanho) */
  var chaves = lidas.map(function(n){ return n.chave; });
  var jaTem = {};
  for(var c0=0; c0<chaves.length; c0+=200){
    if(elProgresso()) elProgresso().innerHTML = '<div class="card"><h3>Conferindo o que já existe… '+c0+' de '+chaves.length+'</h3></div>';
    var rx = await comRetentativa(function(){ return sb.from("nf_venda").select("chave").in("chave", chaves.slice(c0, c0+200)); });
    if(rx.error) return $("res").innerHTML = erroCartao(rx.error.message);
    (rx.data||[]).forEach(function(x){ jaTem[x.chave] = 1; });
  }
  var novas = lidas.filter(function(n){ return !jaTem[n.chave]; });
  var repetidas = lidas.length - novas.length;

  if(!novas.length){
    return $("res").innerHTML =
      '<div class="card" style="--u:#B8862B"><h3>Nada novo para gravar</h3>'+
      '<p>As '+repetidas+' nota(s) enviada(s) já estavam importadas. Nenhum valor foi duplicado.</p></div>'+
      cartaoFalhas(falhas, 0, repetidas);
  }

  /* 4. clientes — só no fluxo comercial (B2B). E-commerce/marketplace é consumidor
     final avulso e NÃO deve virar cadastro de cliente (poluiria o CRM comercial). */
  var cliId = {};
  var porDoc = {};
  if(criarClientes){
    novas.forEach(function(n){
      if(!n.dest_documento) return;
      porDoc[n.dest_documento] = {
        documento: n.dest_documento, tipo_doc: n.dest_tipo,
        razao_social: n.dest_nome, ie: n.dest_ie,
        logradouro: n.dest_logradouro, numero: n.dest_numero, bairro: n.dest_bairro,
        municipio: n.dest_municipio, uf: n.dest_uf, cep: n.dest_cep,
        criado_por: ST.email
      };
    });
    var listaCli = Object.keys(porDoc).map(function(k){ return porDoc[k]; });
    if(listaCli.length){
      for(var u0=0; u0<listaCli.length; u0+=200){
        var rc = await comRetentativa(function(){ return sb.from("clientes").upsert(listaCli.slice(u0, u0+200), { onConflict:"documento", ignoreDuplicates:true }); });
        if(rc.error) return $("res").innerHTML = erroCartao(rc.error.message);
      }
    }
    var cliDocs = Object.keys(porDoc);
    for(var d0=0; d0<cliDocs.length; d0+=200){
      var rcl = await comRetentativa(function(){ return sb.from("clientes").select("id,documento").in("documento", cliDocs.slice(d0, d0+200)); });
      if(rcl.error) return $("res").innerHTML = erroCartao(rcl.error.message);
      (rcl.data||[]).forEach(function(c){ cliId[c.documento] = c.id; });
    }
  }

  /* 5. de-para de produtos */
  var rd = await sb.from("depara_sku").select("codigo,produto_acabado_id");
  var skuDe = {};
  (rd.data||[]).forEach(function(d){ if(d.produto_acabado_id) skuDe[String(d.codigo)] = d.produto_acabado_id; });

  /* 6. gravar notas */
  var linhasNota = novas.map(function(n){
    var em = emitMap[n.emitente_cnpj];
    var todosBonif = n.itens.every(function(i){ return i.bonificacao; });
    var classif = "venda";
    if(todosBonif) classif = "bonificacao";
    else if(em.proprio && distribuidores.indexOf(n.dest_documento) >= 0) classif = "sell_in";
    return {
      chave:n.chave, emitente_cnpj:n.emitente_cnpj, numero:n.numero, serie:n.serie,
      emissao:n.emissao, dh_emissao:n.dh_emissao, nat_op:n.nat_op,
      tp_nf:n.tp_nf, fin_nfe:n.fin_nfe,
      cliente_id: cliId[n.dest_documento] || null,
      dest_documento:n.dest_documento, dest_nome:n.dest_nome,
      dest_municipio:n.dest_municipio, dest_uf:n.dest_uf,
      v_prod:n.v_prod, v_desc:n.v_desc, v_frete:n.v_frete, v_outro:n.v_outro,
      v_ipi:n.v_ipi, v_st:n.v_st, v_nf:n.v_nf,
      v_icms:n.v_icms, v_pis:n.v_pis, v_cofins:n.v_cofins,
      pedido_numero:n.pedido_numero, classificacao:classif,
      arquivo:n.arquivo, criado_por:ST.email
    };
  });
  /* gravar as notas em blocos — mandar tudo de uma vez estoura a conexão no celular */
  var idPorChave = {};
  for(var b0=0; b0<linhasNota.length; b0+=200){
    if(elProgresso()) elProgresso().innerHTML = '<div class="card"><h3>Gravando notas… '+b0+' de '+linhasNota.length+'</h3></div>';
    var rn = await comRetentativa(function(){ return sb.from("nf_venda").insert(linhasNota.slice(b0, b0+200)).select("id,chave"); });
    if(rn.error) return $("res").innerHTML = erroCartao(rn.error.message);
    (rn.data||[]).forEach(function(x){ idPorChave[x.chave] = x.id; });
  }

  /* 7. gravar itens */
  var linhasItem = [], naoMapeados = {};
  novas.forEach(function(n){
    var nfId = idPorChave[n.chave];
    if(!nfId) return;
    n.itens.forEach(function(i){
      var pa = skuDe[String(i.codigo)] || null;
      if(!pa){
        if(!naoMapeados[i.codigo]) naoMapeados[i.codigo] = { codigo:i.codigo, descricao:i.descricao, qtd:0, valor:0 };
        naoMapeados[i.codigo].qtd += i.qtd;
        naoMapeados[i.codigo].valor += (i.v_prod - i.v_desc);
      }
      linhasItem.push({
        nf_id:nfId, n_item:i.n_item, codigo:i.codigo, descricao:i.descricao,
        produto_acabado_id:pa, cfop:i.cfop, ncm:i.ncm, unidade:i.unidade,
        qtd:i.qtd, v_un:i.v_un, v_prod:i.v_prod, v_desc:i.v_desc,
        bonificacao:i.bonificacao
      });
    });
  });
  for(var k=0; k<linhasItem.length; k+=200){
    if(elProgresso()) elProgresso().innerHTML = '<div class="card"><h3>Gravando itens… '+k+' de '+linhasItem.length+'</h3></div>';
    var ri = await comRetentativa(function(){ return sb.from("nf_venda_item").insert(linhasItem.slice(k, k+200)); });
    if(ri.error) return $("res").innerHTML = erroCartao(ri.error.message);
  }

  /* 8. reconciliar carteira (vendas_pedidos) com as notas recém-importadas —
     casa por pedido_numero contra as notas que acabaram de entrar e, em
     seguida, pelo nome já conhecido em cliente_alias (pedido cancelado ou
     ainda sem nota). Não é bloqueante: se falhar, a importação da nota já
     está gravada e a reconciliação pode ser rodada de novo depois. */
  var reconc = null, reconcErro = null;
  try{
    var rrec = await sb.rpc("fn_reconciliar_clientes_pedidos");
    if(rrec.error) reconcErro = rrec.error.message;
    else reconc = (rrec.data && rrec.data[0]) || null;
  }catch(e){ reconcErro = e.message; }

  /* 9. registrar a importação */
  var somaProd = novas.reduce(function(a,n){ return a + n.v_prod; }, 0);
  var somaDesc = novas.reduce(function(a,n){ return a + n.v_desc; }, 0);
  var listaNM = Object.keys(naoMapeados).map(function(k){ return naoMapeados[k]; });
  await sb.from("importacoes").insert({
    tipo:"nfe", arquivos:arr.length, lidos:lidas.length,
    gravados:novas.length, ignorados:repetidas,
    nao_mapeados: listaNM,
    resultado: { itens:linhasItem.length, v_prod:somaProd, v_desc:somaDesc, falhas:falhas,
      reconciliacao: reconc, reconciliacao_erro: reconcErro },
    criado_por: ST.email
  });

  /* 10. resultado na tela */
  var h = '<div class="card" style="--u:#3E7C45"><h3>'+novas.length+' nota(s) importada(s)</h3>'+
    '<div class="conta"><span class="p">R$ '+brl(somaProd)+'</span> mercadoria '+
    '&nbsp;−&nbsp; <span class="m">R$ '+brl(somaDesc)+'</span> desconto '+
    '&nbsp;=&nbsp; <b>R$ '+brl(somaProd-somaDesc)+'</b> líquido</div>'+
    '<p style="font-size:13.5px;color:#7A6A57">'+linhasItem.length+' itens'+
    (criarClientes ? ' · '+Object.keys(porDoc).length+' cliente(s) no arquivo' : ' · e-commerce, sem cadastro de cliente')+

/* ================= pendências ================= */
async function telaPendencias(){
  var r = await sb.from("nf_venda_item")
    .select("codigo,descricao,qtd,v_liquido").is("produto_acabado_id", null);
  if(r.error) return pinta('<div class="card" style="--u:#C63A3A">'+esc(r.error.message)+'</div>');
  var agg = {};
  (r.data||[]).forEach(function(x){
    var k = String(x.codigo);
    if(!agg[k]) agg[k] = { codigo:k, descricao:x.descricao, qtd:0, valor:0, linhas:0 };
    agg[k].qtd += Number(x.qtd)||0;
    agg[k].valor += Number(x.v_liquido)||0;
    agg[k].linhas++;
  });
  var L = Object.keys(agg).map(function(k){ return agg[k]; })
    .sort(function(a,b){ return b.valor - a.valor; });

  if(!L.length){
    return pinta(
      '<div class="card" style="--u:#3E7C45"><h3>Nada pendente</h3>'+
      '<p>Todo item faturado está ligado a um produto do cadastro.</p></div>');
  }

  var rs = await sb.from("produto_acabado").select("id,nome,linha")
    .eq("ativo", true).order("linha").order("nome");
  ST.cache.skus = rs.data || [];
  var total = L.reduce(function(a,x){ return a + x.valor; }, 0);

  var opts = '<option value="">— escolher produto —</option>' +
    ST.cache.skus.map(function(s){
      return '<option value="'+s.id+'">'+esc(s.linha+" · "+s.nome)+'</option>';
    }).join("");

  pinta(
    ''+
    '<div class="kpis"><div class="kpi ruim"><div class="r">Fora das análises</div>'+
      '<div class="v">R$ '+brl(total)+'</div><div class="n">em '+L.length+' códigos</div></div></div>'+
    L.map(function(x, idx){
      return '<div class="card" style="--u:#D9772B">'+
        '<h3><span class="mono">'+esc(x.codigo)+'</span> · '+esc(x.descricao||"sem descrição")+'</h3>'+
        '<div class="conta">'+inte(x.qtd)+' un &nbsp;·&nbsp; <span class="m">R$ '+brl(x.valor)+
        '</span> fora das análises &nbsp;·&nbsp; '+x.linhas+' linha(s) de nota</div>'+
        '<label for="s'+idx+'">Ligar a um produto já cadastrado</label>'+
        '<select id="s'+idx+'">'+opts+'</select>'+
        '<button class="b" style="margin-top:10px" onclick="ligarCodigo(\''+
          esc(x.codigo)+'\', \'s'+idx+'\', \''+esc(x.descricao||"")+'\')">Ligar código</button>'+
      '</div>';
    }).join("")+
    '<div class="card" style="--u:#7A6A57"><h3>E se o produto não existir na lista?</h3>'+
    '<p>Alguns desses códigos são produtos que nunca foram cadastrados — Pistache 100%, ganaches La Ben, balde de 3 kg. '+
    'Criar SKU novo é decisão de cadastro e afeta receita e MRP, então isso é feito junto com a fábrica, não por aqui.</p></div>');
}

async function ligarCodigo(codigo, selectId, descricao){
  var sel = $(selectId);
  var pa = sel ? sel.value : "";
  if(!pa) return msg("Escolha o produto antes de ligar", true);

  var rex = await sb.from("depara_sku").select("id").eq("codigo", codigo);
  if(rex.error) return msg("Não consegui conferir o de-para: "+rex.error.message, true);

  if(rex.data && rex.data.length){
    var ru = await sb.from("depara_sku").update({ produto_acabado_id: pa }).eq("codigo", codigo);
    if(ru.error) return msg("Não deu para atualizar: "+ru.error.message, true);
  } else {
    var ri = await sb.from("depara_sku").insert({
      codigo: codigo, plataforma: "Varejo", nome_anuncio: descricao || null,
      produto_acabado_id: pa, criado_por: ST.email
    });
    if(ri.error) return msg("Não deu para gravar: "+ri.error.message, true);
  }

  var rr = await sb.from("nf_venda_item").update({ produto_acabado_id: pa })
    .eq("codigo", codigo).is("produto_acabado_id", null);
  if(rr.error) return msg("Código ligado, mas as notas antigas não foram atualizadas: "+rr.error.message, true);

  msg("Código "+codigo+" ligado ao produto");
  telaPendencias();
}

/* ================= controladoria (DRE) ================= */
async function telaControladoria(){
  pinta('<div class="vazio">Carregando…</div>');
  var r = await sb.from("v_dre_notas").select("*").eq("classificacao","venda").order("emissao");
  if(r.error) return pinta('<div class="card" style="--u:#C63A3A">'+esc(r.error.message)+'</div>');
  var N = r.data || [];

  var porMes = {};
  N.forEach(function(n){
    var k = String(n.mes).slice(0,7);
    if(!porMes[k]) porMes[k] = { mes:k, notas:0, bruta:0, liquida:0, icms:0, pis:0, cofins:0 };
    porMes[k].notas++;
    porMes[k].bruta += Number(n.v_nf)||0;
    porMes[k].liquida += Number(n.v_liquido_nf)||0;
    porMes[k].icms += Number(n.v_icms)||0;
    porMes[k].pis += Number(n.v_pis)||0;
    porMes[k].cofins += Number(n.v_cofins)||0;
  });
  var meses = Object.keys(porMes).sort();
  var totalBruta = N.reduce(function(a,n){ return a+(Number(n.v_nf)||0); },0);
  var totalLiquida = N.reduce(function(a,n){ return a+(Number(n.v_liquido_nf)||0); },0);
  var cargaEfetiva = totalBruta ? (100*(totalBruta-totalLiquida)/totalBruta) : 0;

  var h = '<div class="card" style="--u:#22303A"><h3>Importar e-commerce (série UpSeller/marketplace)</h3>'+
    '<p style="font-size:13.5px;color:#7A6A57">Estas notas NÃO criam cadastro de cliente — são consumidor final avulso, ficam só aqui na apuração fiscal.</p>'+
    '<input type="file" id="arqEcommerce" multiple accept=".xml,.zip,application/zip" style="margin-top:10px" onchange="importar(this.files,{criarClientes:false})">'+
    '<p style="font-size:12.5px;color:#7A6A57;margin-top:6px">Aceita .xml soltos ou um .zip com todos dentro — não precisa descompactar antes. Lotes grandes podem levar alguns minutos.</p>'+
    '<div id="res" style="margin-top:10px"></div></div>';

  h += '<div class="card" style="--u:#3E7C45"><h3>DRE — visão consolidada</h3>'+
    '<p class="r">Receita bruta</p><p class="v">R$ '+brl(totalBruta)+'</p>'+
    '<div class="conta">R$ '+brl(totalBruta)+' bruta &nbsp;−&nbsp; R$ '+brl(totalBruta-totalLiquida)+' ICMS+PIS+COFINS &nbsp;=&nbsp; <b>R$ '+brl(totalLiquida)+'</b> líquida</div>'+
    '<p style="font-size:13.5px;color:#7A6A57;margin-top:8px">Carga tributária efetiva: <b>'+cargaEfetiva.toFixed(2)+'%</b> · '+N.length+' nota(s) no total (todas as séries, exclui sell-in e bonificação)</p></div>';

  if(meses.length){
    h += '<div class="tw"><table><thead><tr><th>Mês</th><th style="text-align:right">Notas</th>'+
      '<th style="text-align:right">Bruta</th><th style="text-align:right">ICMS+PIS+COFINS</th>'+
      '<th style="text-align:right">Líquida</th><th style="text-align:right">Carga</th></tr></thead><tbody>'+
      meses.map(function(k){
        var m = porMes[k];
        var imp = m.icms+m.pis+m.cofins;
        var carga = m.bruta ? (100*imp/m.bruta) : 0;
        return '<tr><td class="mono">'+k+'</td><td class="n">'+m.notas+'</td>'+
          '<td class="n">R$ '+brl(m.bruta)+'</td><td class="n">R$ '+brl(imp)+'</td>'+
          '<td class="n">R$ '+brl(m.liquida)+'</td><td class="n">'+carga.toFixed(1)+'%</td></tr>';
      }).join("")+'</tbody></table></div>';
  } else {
    h += '<div class="vazio">Nenhuma nota de venda apurada ainda. Suba os XMLs de e-commerce acima.</div>';
  }

  h += '<p style="font-size:12.5px;color:#7A6A57;margin-top:14px"><b>Como ler:</b> "Bruta" = valor total da nota (vNF). '+
    '"Líquida" = bruta menos ICMS, PIS e COFINS (não desconta IPI/ST, que são repasse, não receita da empresa). '+
    '"Carga tributária efetiva" = imposto pago ÷ receita bruta das notas já importadas — não é alíquota nominal.<br>'+
    '<b>Cobertura:</b> só o que já foi importado aqui aparece; XMLs ainda não subidos não entram na conta.</p>';

  pinta(h);
}

/* ================= Precificação ================= */
var PREC = { produtos:[], insumos:[], skus:[], sel:null, detalhe:null, resumo:null, sim:{}, liberado:false };

function telaPrecPin(erro){
  pinta('<div class="card" style="--u:#B8862B"><h3>🔒 Precificação</h3>'+
    '<p style="font-size:14px;color:#7A6A57">Esta área mostra custo de insumo e formulação valorizada. '+
    'Digite o PIN do gestor para abrir.</p>'+
    '<input id="pinPrec" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" '+
      'onkeydown="if(event.key===\'Enter\')validarPinPrec()" '+
      'style="width:140px;font-size:20px;letter-spacing:.3em;text-align:center;min-height:48px;padding:8px;'+
      'border:1.5px solid #DCD2C4;border-radius:10px;margin-top:12px;font-family:ui-monospace,monospace">'+
    '<div style="margin-top:12px"><button onclick="validarPinPrec()">Abrir</button></div>'+
    (erro ? '<p style="color:#C63A3A;font-size:13.5px;margin-top:10px">'+esc(erro)+'</p>' : '')+
    '<p style="font-size:12.5px;color:#7A6A57;margin-top:14px">O PIN protege de olhar de terceiro num aparelho aberto. '+
    'Quem não tem o papel de controladoria não acessa esses dados nem com o PIN certo.</p></div>');
  var el = $("pinPrec"); if(el) el.focus();
}

async function validarPinPrec(){
  var el = $("pinPrec");
  if(!el) return;
  var v = (el.value||"").trim();
  if(!v) return telaPrecPin("Digite o PIN.");
  var r = await sb.rpc("verificar_pin", { p_nome:"Gestor", p_pin:v });
  if(r.error) return telaPrecPin(r.error.message);
  if(!r.data) return telaPrecPin("PIN incorreto.");
  PREC.liberado = true;
  telaPrecificacao();
}

async function telaPrecificacao(){
  if(!ST.papel.controladoria){
    return pinta('<div class="card" style="--u:#C63A3A"><h3>Acesso restrito</h3>'+
      '<p style="font-size:14px;color:#7A6A57">Preço de custo e formulação valorizada são visíveis só para a controladoria. '+
      'Seu login não tem esse papel.</p></div>');
  }
  if(!PREC.liberado){ return telaPrecPin(""); }
  pinta('<div class="vazio">Carregando…</div>');

  var rp = await sb.from("produtos").select("id,nome").order("nome");
  if(rp.error) return pinta('<div class="card" style="--u:#C63A3A">'+esc(rp.error.message)+'</div>');

  var rr = await sb.from("receita_itens").select("produto_id");
  if(rr.error) return pinta('<div class="card" style="--u:#C63A3A">'+esc(rr.error.message)+'</div>');
  var comReceita = {};
  (rr.data||[]).forEach(function(x){ comReceita[x.produto_id] = true; });
  PREC.produtos = (rp.data||[]).filter(function(p){ return comReceita[p.id]; });

  var ri = await sb.from("itens").select("id,nome,unidade,categoria")
    .in("categoria",["materia_prima","embalagem"]).order("categoria").order("nome");
  if(ri.error) return pinta('<div class="card" style="--u:#C63A3A">'+esc(ri.error.message)+'</div>');

  var rc = await sb.from("item_custo").select("item_id,preco_kg,origem,atualizado_em");
  if(rc.error) return pinta('<div class="card" style="--u:#C63A3A">'+esc(rc.error.message)+'</div>');
  var custos = {};
  (rc.data||[]).forEach(function(c){ custos[c.item_id] = c; });

  PREC.insumos = (ri.data||[]).map(function(i){
    var c = custos[i.id];
    return { id:i.id, nome:i.nome, unidade:i.unidade, categoria:i.categoria,
             preco_ref_kg: c ? c.preco_kg : null,
             preco_ref_origem: c ? c.origem : null,
             preco_ref_atualizado_em: c ? c.atualizado_em : null };
  });

  var rs = await sb.from("produto_acabado").select("id,nome,linha,embalagem,peso_pote_kg,produto_id")
    .eq("ativo", true).not("produto_id","is",null).order("nome");
  PREC.skus = (rs.error ? [] : (rs.data||[]));

  desenharPrecificacao();
}

function desenharPrecificacao(){
  var comPreco = PREC.insumos.filter(function(i){ return i.preco_ref_kg != null; }).length;
  var total = PREC.insumos.length;
  var pct = total ? Math.round(100*comPreco/total) : 0;
  var corPct = pct >= 90 ? "#3E7C45" : (pct >= 60 ? "#B8862B" : "#C63A3A");

  var h = '<div class="card" style="--u:'+corPct+'"><h3>Preços de insumo cadastrados</h3>'+
    '<p class="r">INSUMOS COM PREÇO DE REFERÊNCIA</p>'+
    '<p class="v">'+comPreco+' de '+total+'</p>'+
    '<div class="conta">'+comPreco+' com preço &nbsp;+&nbsp; '+(total-comPreco)+' sem preço &nbsp;=&nbsp; <b>'+total+' insumos</b> &nbsp;·&nbsp; '+pct+'% cobertos</div>'+
    '<p style="font-size:13px;color:#7A6A57;margin-top:8px">Insumo sem preço entra na fórmula com custo zero — o custo do produto sai <b>subestimado</b> até você preencher.</p></div>';

  h += '<div class="card" style="--u:#22303A"><h3>Escolha o produto</h3>'+
    '<select id="selProd" onchange="carregarCustoProduto(this.value)" style="width:100%;min-height:44px;font-size:15px;padding:8px;border:1.5px solid #DCD2C4;border-radius:10px;margin-top:8px">'+
    '<option value="">— selecione uma fórmula —</option>'+
    PREC.produtos.map(function(p){
      return '<option value="'+esc(p.id)+'"'+(PREC.sel===p.id?" selected":"")+'>'+esc(p.nome)+'</option>';
    }).join("")+'</select>'+
    '<p style="font-size:12.5px;color:#7A6A57;margin-top:6px">'+PREC.produtos.length+' produto(s) com fórmula cadastrada. Produto sem fórmula não aparece aqui — não há como custear.</p>'+
    '</div><div id="boxCusto"></div>';

  h += '<div class="card" style="--u:#3E7C45"><h3>Custo do pote pronto (fórmula + embalagem)</h3>'+
    '<select id="selSku" onchange="carregarCustoPote(this.value)" style="width:100%;min-height:44px;font-size:15px;padding:8px;border:1.5px solid #DCD2C4;border-radius:10px;margin-top:8px">'+
    '<option value="">— selecione um SKU —</option>'+
    PREC.skus.map(function(s){
      return '<option value="'+esc(s.id)+'">'+esc(s.nome)+(s.linha?' · '+esc(s.linha):'')+'</option>';
    }).join("")+'</select>'+
    '<p style="font-size:12.5px;color:#7A6A57;margin-top:6px">'+PREC.skus.length+' SKU(s) com fórmula. Custo do pote = (custo/kg da fórmula × peso do pote) + embalagem.</p>'+
    '<div id="boxPote" style="margin-top:10px"></div></div>';

  var mp = PREC.insumos.filter(function(i){ return i.categoria==="materia_prima"; });
  var emb = PREC.insumos.filter(function(i){ return i.categoria==="embalagem"; });

  h += tabelaPrecos("Preço de matéria-prima — R$/kg", mp, "#B8862B");
  h += tabelaPrecos("Preço de embalagem — R$/unidade", emb, "#D9772B");

  h += '<p style="font-size:12.5px;color:#7A6A57;margin-top:14px"><b>Como ler:</b> "Custo/kg" = soma de (quantidade do insumo na fórmula × preço), '+
    'descendo por receitas aninhadas e por baldes intermediários até o insumo bruto. "% precificado" = quanto do peso da fórmula tem preço cadastrado — abaixo de 100%, o custo é piso, não o custo real.<br>'+
    '<b>Não inclui:</b> mão de obra, energia, frete de despacho e depreciação — é custo de material, não custo industrial completo.</p>';

  pinta(h);
}

function tabelaPrecos(titulo, lista, cor){
  if(!lista.length) return "";
  return '<div class="card" style="--u:'+cor+'"><h3>'+esc(titulo)+'</h3>'+
    '<p style="font-size:13px;color:#7A6A57">Origem <b>compra</b> = veio das notas fiscais. <b>manual</b> = você digitou. Editar recalcula tudo que usa o item.</p>'+
    '<div class="tw" style="margin-top:10px"><table><thead><tr><th>Item</th><th style="text-align:right">Preço</th><th>Origem</th><th></th></tr></thead><tbody>'+
    lista.map(function(i){
      var val = i.preco_ref_kg != null ? Number(i.preco_ref_kg).toFixed(2) : "";
      var org = i.preco_ref_origem || "—";
      var corOrg = org === "compra" ? "#3E7C45" : (org === "manual" ? "#B8862B" : "#C63A3A");
      return '<tr><td>'+esc(i.nome)+'</td>'+
        '<td class="n"><input id="pr_'+esc(i.id)+'" type="number" step="0.01" min="0" value="'+val+'" placeholder="—" '+
          'style="width:100px;text-align:right;font-family:ui-monospace,monospace;min-height:36px;padding:4px 8px;border:1.5px solid #DCD2C4;border-radius:8px"></td>'+
        '<td><span style="font-size:12px;font-weight:700;color:'+corOrg+'">'+esc(org)+'</span></td>'+
        '<td><button class="s" style="min-height:36px;padding:5px 12px;font-size:13px" onclick="salvarPreco(\''+esc(i.id)+'\')">Salvar</button></td></tr>';
    }).join("")+'</tbody></table></div>'+
    '<div id="resPreco_'+esc(cor.replace("#",""))+'" class="resPreco" style="margin-top:10px"></div></div>';
}

async function carregarCustoPote(id){
  if(!id){ $("boxPote").innerHTML = ""; return; }
  $("boxPote").innerHTML = '<div class="vazio">Calculando…</div>';
  var r = await sb.rpc("fn_custo_pote", { p_pa:id });
  if(r.error){ $("boxPote").innerHTML = '<div style="color:#C63A3A;font-size:13.5px">'+esc(r.error.message)+'</div>'; return; }
  var d = r.data || {};
  if(d.erro){ $("boxPote").innerHTML = '<div style="color:#C63A3A;font-size:13.5px">⚠️ '+esc(d.erro)+'</div>'; return; }

  var pct = d.pct_kg_precificado != null ? Number(d.pct_kg_precificado) : 0;
  var semPrecoEmb = Number(d.embalagem_itens_sem_preco||0);
  var completo = pct >= 100 && semPrecoEmb === 0;

  var h = '<p class="r">CUSTO TOTAL POR POTE'+(completo?"":" (INCOMPLETO)")+'</p>'+
    '<p class="v">R$ '+brl(Number(d.custo_total_pote)||0)+'</p>'+
    '<div class="conta">R$ '+brl(Number(d.custo_formula_pote)||0)+' fórmula ('+Number(d.peso_pote_kg).toFixed(3)+' kg) &nbsp;+&nbsp; '+
      'R$ '+brl(Number(d.custo_embalagem_pote)||0)+' embalagem &nbsp;=&nbsp; <b>R$ '+brl(Number(d.custo_total_pote)||0)+' por pote</b></div>';

  if(!completo){
    h += '<p style="font-size:13px;color:#C63A3A;margin-top:8px">⚠️ Piso, não custo real: '+
      pct.toFixed(1)+'% do peso da fórmula precificado'+
      (semPrecoEmb ? ' · '+semPrecoEmb+' item(ns) de embalagem sem preço' : '')+'.</p>';
  }

  var det = (d.embalagem && d.embalagem.detalhe) || [];
  if(det.length){
    h += '<div class="tw" style="margin-top:10px"><table><thead><tr><th>Embalagem</th><th style="text-align:right">Qtd</th>'+
      '<th style="text-align:right">R$/un</th><th style="text-align:right">Custo</th></tr></thead><tbody>'+
      det.map(function(x){
        return '<tr'+(x.tem_preco?'':' style="background:#FBEAEA"')+'><td>'+esc(x.item_nome)+'</td>'+
          '<td class="n">'+Number(x.qtd_por_pote)+'</td>'+
          '<td class="n">'+(x.preco_un!=null?'R$ '+brl(x.preco_un):'—')+'</td>'+
          '<td class="n">R$ '+brl(x.custo)+'</td></tr>';
      }).join("")+'</tbody></table></div>';
  }
  $("boxPote").innerHTML = h;
}

async function carregarCustoProduto(id){
  PREC.sel = id || null;
  PREC.sim = {};
  if(!id){ $("boxCusto").innerHTML = ""; return; }
  $("boxCusto").innerHTML = '<div class="vazio">Calculando…</div>';

  var rd = await sb.rpc("fn_custo_produto_detalhe", { p_produto:id, p_kg:100 });
  if(rd.error){ $("boxCusto").innerHTML = '<div class="card" style="--u:#C63A3A">'+esc(rd.error.message)+'</div>'; return; }
  var rs = await sb.rpc("fn_custo_produto_resumo", { p_produto:id, p_kg:100 });
  if(rs.error){ $("boxCusto").innerHTML = '<div class="card" style="--u:#C63A3A">'+esc(rs.error.message)+'</div>'; return; }

  PREC.detalhe = (rd.data||[]).filter(function(l){ return l.item_id; });
  PREC.resumo = rs.data;
  desenharCusto();
}

function custoSimulado(){
  var total = 0;
  PREC.detalhe.forEach(function(l){
    var p = (PREC.sim[l.item_id] != null) ? PREC.sim[l.item_id] : (l.preco_kg != null ? Number(l.preco_kg) : 0);
    total += Number(l.kg) * p;
  });
  return total;
}

function desenharCusto(){
  var R = PREC.resumo;
  if(!R) return;
  var prod = PREC.produtos.filter(function(p){ return p.id === PREC.sel; })[0];
  var pct = R.pct_kg_precificado != null ? Number(R.pct_kg_precificado) : 0;
  var cor = pct >= 100 ? "#3E7C45" : (pct >= 80 ? "#B8862B" : "#C63A3A");
  var custoBase = Number(R.custo_total)||0;
  var custoSim = custoSimulado();
  var mudou = Math.abs(custoSim - custoBase) > 0.005;

  var h = '<div class="card" style="--u:'+cor+'"><h3>'+esc(prod ? prod.nome : "Produto")+' — custo da fórmula</h3>'+
    '<p class="r">CUSTO POR KG'+(mudou?" (SIMULADO)":"")+'</p>'+
    '<p class="v">R$ '+brl(mudou ? custoSim/100 : Number(R.custo_por_kg)||0)+'</p>'+
    '<div class="conta">Base 100 kg &nbsp;·&nbsp; custo total R$ '+brl(mudou?custoSim:custoBase)+' &nbsp;÷&nbsp; 100 kg &nbsp;=&nbsp; <b>R$ '+brl((mudou?custoSim:custoBase)/100)+'/kg</b></div>';

  if(mudou){
    var dif = custoSim - custoBase;
    var sinal = dif >= 0 ? "+" : "−";
    h += '<div class="conta" style="margin-top:8px">Preço gravado: R$ '+brl(custoBase/100)+'/kg &nbsp;'+sinal+'&nbsp; R$ '+brl(Math.abs(dif)/100)+' &nbsp;=&nbsp; <b>R$ '+brl(custoSim/100)+'/kg simulado</b>'+
      ' <button class="s" style="margin-left:10px;min-height:32px;padding:4px 10px;font-size:12.5px" onclick="limparSimulacao()">Limpar simulação</button></div>';
  }

  h += '<p style="font-size:13px;color:#7A6A57;margin-top:8px"><b>'+pct.toFixed(1)+'%</b> do peso da fórmula tem preço cadastrado';
  if(R.insumos_sem_preco && R.insumos_sem_preco.length){
    h += ' — faltam: '+R.insumos_sem_preco.map(function(x){ return esc(x.item_nome); }).join(", ");
  }
  h += '</p></div>';

  h += '<div class="card" style="--u:#22303A"><h3>Formulação — 100 kg</h3>'+
    '<p style="font-size:13px;color:#7A6A57">Edite o "R$/kg simulado" pra testar cenário sem gravar nada no sistema.</p>'+
    '<div class="tw" style="margin-top:10px"><table><thead><tr><th>Insumo</th><th style="text-align:right">kg/100kg</th>'+
    '<th style="text-align:right">R$/kg</th><th style="text-align:right">Simular R$/kg</th><th style="text-align:right">Custo</th></tr></thead><tbody>'+
    PREC.detalhe.slice().sort(function(a,b){ return Number(b.kg)-Number(a.kg); }).map(function(l){
      var pAtual = l.preco_kg != null ? Number(l.preco_kg) : null;
      var pUsar = (PREC.sim[l.item_id] != null) ? PREC.sim[l.item_id] : (pAtual != null ? pAtual : 0);
      var custo = Number(l.kg) * pUsar;
      var semPreco = pAtual == null;
      return '<tr'+(semPreco?' style="background:#FBEAEA"':'')+'>'+
        '<td>'+esc(l.item_nome)+(semPreco?' <span style="color:#C63A3A;font-size:11.5px;font-weight:700">sem preço</span>':'')+'</td>'+
        '<td class="n">'+Number(l.kg).toFixed(3)+'</td>'+
        '<td class="n">'+(pAtual != null ? "R$ "+brl(pAtual) : "—")+'</td>'+
        '<td class="n"><input type="number" step="0.01" min="0" placeholder="—" value="'+(PREC.sim[l.item_id] != null ? PREC.sim[l.item_id] : "")+'" '+
          'oninput="simular(\''+esc(l.item_id)+'\', this.value)" '+
          'style="width:90px;text-align:right;font-family:ui-monospace,monospace;min-height:34px;padding:4px 6px;border:1.5px solid #DCD2C4;border-radius:8px"></td>'+
        '<td class="n">R$ '+brl(custo)+'</td></tr>';
    }).join("")+'</tbody></table></div></div>';

  $("boxCusto").innerHTML = h;
}

function simular(itemId, v){
  if(v === "" || v == null){ delete PREC.sim[itemId]; }
  else {
    var n = Number(v);
    if(isNaN(n) || n < 0) return;
    PREC.sim[itemId] = n;
  }
  desenharCusto();
}

function limparSimulacao(){ PREC.sim = {}; desenharCusto(); }

async function salvarPreco(itemId){
  var el = $("pr_"+itemId);
  if(!el) return;
  var boxes = document.querySelectorAll(".resPreco");
  function aviso(html){ Array.prototype.forEach.call(boxes, function(b){ b.innerHTML = html; }); }
  var v = el.value;
  if(v === "" || v == null) return aviso('<span style="color:#C63A3A;font-size:13px">Digite um preço antes de salvar.</span>');
  var n = Number(v);
  if(isNaN(n) || n < 0) return aviso('<span style="color:#C63A3A;font-size:13px">Preço inválido.</span>');

  aviso('<span style="color:#7A6A57;font-size:13px">Salvando…</span>');
  var r = await sb.rpc("atualizar_preco_ref", { p_item_id:itemId, p_preco:n, p_responsavel:ST.email||"controladoria", p_origem:"manual" });
  if(r.error) return aviso('<span style="color:#C63A3A;font-size:13px">'+esc(r.error.message)+'</span>');

  aviso('<span style="color:#3E7C45;font-size:13px">✓ '+esc(r.data && r.data.nome ? r.data.nome : "Preço")+' atualizado para R$ '+brl(n)+'.</span>');
  PREC.insumos.forEach(function(i){
    if(i.id === itemId){ i.preco_ref_kg = n; i.preco_ref_origem = "manual"; }
  });
  if(PREC.sel) await carregarCustoProduto(PREC.sel);
  var sku = $("selSku");
  if(sku && sku.value) await carregarCustoPote(sku.value);
}

/* ================= checagem de versão (resolve cache do celular) =================
   GitHub Pages não deixa configurar Cache-Control no servidor — então o jeito
   definitivo é o próprio app se checar: busca a si mesmo ignorando cache, compara
   a versão publicada com a que está rodando na tela, e avisa se estiver desatualizado.
   Roda ao abrir, ao voltar de outro app (visibilitychange — o gatilho mais comum no
   celular), e a cada 5 minutos com o app aberto. */
var APP_VERSION = document.querySelector('meta[name="app-version"]').content;
async function verificarAtualizacao(silencioso){
  try{
    var r = await fetch(location.pathname + "?_=" + Date.now(), {cache:"no-store"});
    var texto = await r.text();
    var m = texto.match(/<meta name="app-version" content="([^"]+)"/);
    if(m && m[1] && m[1] !== APP_VERSION){
      mostrarBannerAtualizacao();
    } else if(!silencioso){
      msg("Você já está na versão mais recente.");
    }
  }catch(e){ /* sem internet ou erro de rede — ignora silenciosamente */ }
}
function mostrarBannerAtualizacao(){
  if(document.getElementById("bannerAtualizacao")) return;
  var b = document.createElement("div");
  b.id = "bannerAtualizacao";
  b.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;"+
    "background:var(--ard);color:#fff;border-radius:var(--raio);padding:14px 16px;"+
    "display:flex;align-items:center;justify-content:space-between;gap:12px;"+
    "box-shadow:0 4px 18px rgba(0,0,0,.25)";
  b.innerHTML = '<span style="font-size:13.5px;font-weight:700">🔄 Nova versão disponível</span>'+
    '<button onclick="location.reload(true)" style="background:#fff;color:var(--ard);'+
    'border:none;border-radius:9px;padding:9px 16px;font-weight:800;font-family:inherit;'+
    'font-size:13px">Atualizar agora</button>';
  document.body.appendChild(b);
}
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible") verificarAtualizacao(true);
});
setInterval(function(){ verificarAtualizacao(true); }, 5*60*1000);
setTimeout(function(){ verificarAtualizacao(true); }, 1500);

  if(typeof supabase === "undefined" || !supabase.createClient){

      'Confira a internet e recarregue a página.</p></div></div>';
    return;
  }
  sb = supabase.createClient(URL_SB, KEY_SB);
  var s = await sb.auth.getSession();
  if(s.data && s.data.session){
    ST.email = s.data.session.user.email || "";
    await carregarPapel();
    ir(ST.papel.comercial ? "inicio" : "controladoria");
  } else {
    telaLogin();
  }
})();
