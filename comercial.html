/* ===== PEDIDO RÁPIDO + PAINEL COMERCIAL (17/11/2026) ===========================
   Pedido: tela única da Talita — 1 cliente → 2 itens → 3 salvar e enviar o PDF.
   Sem tabela nova: tudo em crm.cotacoes, com os estados que já existiam.
     rascunho  = salvo, mas abaixo do pedido mínimo (não vai ao cliente)
     enviada   = aguardando aprovação do cliente (atualizado_em = quando foi enviado)
     pedido    = cliente aprovou → fila de faturar (pedido_gerado_em = aprovação)
     exportado = planilha UpSeller gerada, aguardando a NF voltar
   Preço: faixa pelo valor do pedido (melhorTabelaProposta) — mesma regra da Nova proposta.
   Faturar, ficha UpSeller e planilha reaproveitam as funções da Carteira. */
var PQ = { base:null, cli:null, itens:[], bonif:[], desc:0, transp:"", editando:null, cond:"", obs:"", numCompras:0, contato:null, rep:null, sel:{}, aberto:null };
/* Bonificação na UpSeller: não vai com o código do pote, vai num de dois SKUs genéricos
   de degustação. GO e Integral (e qualquer paçoca) = pastas; o resto (cremas) = cremes. */
var UPS_SKU_DEGUST = { pastas:"S9SSN10212", cremes:"S9SSN10211" };
function grupoDegustacao(linha, nome){
  return (/^(go|integral)$/i.test(String(linha||"").trim()) || /pa[cç]oca/i.test(String(nome||""))) ? "pastas" : "cremes";
}

function semAcento(s){ return String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase(); }
function rs(v){ return "R$ "+brl(v); }
function diasDesde(ts){
  if(!ts) return null;
  var d = new Date(ts); if(isNaN(d)) return null;
  var a = new Date(gerIsoData(d)+"T00:00:00"), b = new Date(hojeISO()+"T00:00:00");
  return Math.round((b - a)/86400000);
}
function isoLocal(ts){ if(!ts) return null; var d = new Date(ts); return isNaN(d) ? null : gerIsoData(d); }
function voltarTelaPedidoOuCarteira(){ if(telaAtual === "pedidos") telaPedidos(); else telaCarteira(); }

/* catálogo com código: preço das tabelas ativas + código vigente da UpSeller */
async function carregarBasePedido(){
  var rTab = await sb.schema("crm").from("tabelas_preco")
    .select("id,nome,pedido_minimo").eq("ativa", true).order("pedido_minimo", {ascending:true});
  if(rTab.error) throw new Error(rTab.error.message);
  var tabelas = rTab.data || [], tabelaItens = {}, codTabela = {};
  if(tabelas.length){
    var rTI = await sb.schema("crm").from("tabela_preco_itens")
      .select("tabela_id,produto_acabado_id,preco_unitario,codigo_origem")
      .in("tabela_id", tabelas.map(function(t){ return t.id; }));
    if(rTI.error) throw new Error(rTI.error.message);
    (rTI.data||[]).forEach(function(it){
      if(!it.produto_acabado_id) return;
      if(!tabelaItens[it.tabela_id]) tabelaItens[it.tabela_id] = {};
      tabelaItens[it.tabela_id][it.produto_acabado_id] = { preco_unitario:Number(it.preco_unitario)||0 };
      if(it.codigo_origem && !codTabela[it.produto_acabado_id]) codTabela[it.produto_acabado_id] = String(it.codigo_origem);
    });
  }
  var ids = Object.keys(codTabela);
  var rP = await sb.from("produto_acabado").select("id,nome,linha").eq("ativo", true);
  var rS = await sb.from("depara_sku").select("codigo,produto_acabado_id").eq("vigente", true);
  var vig = {}; (rS.data||[]).forEach(function(s){ vig[s.produto_acabado_id] = s.codigo; });
  var prods = (rP.data||[]).filter(function(p){ return ids.indexOf(p.id) >= 0; }).map(function(p){
    var cod = vig[p.id] || codTabela[p.id] || "";
    return { id:p.id, nome:p.nome, linha:p.linha||"", cod:cod, grupo:grupoDegustacao(p.linha, p.nome), chave:semAcento(cod+" "+p.nome+" "+(p.linha||"")) };
  }).sort(function(a,b){ return a.nome.localeCompare(b.nome); });
  ST.cache.propTabelas = tabelas;
  ST.cache.propTabelaItens = tabelaItens;
  var rBf = await sb.schema("crm").from("bonificacao_faixas").select("valor_minimo,qtd_potes").eq("ativa", true).order("valor_minimo", {ascending:true});
  var rTr = await sb.schema("crm").from("transportadoras").select("id,razao_social,documento,tipo,ie,uf,municipio,endereco").eq("ativo", true).order("razao_social");
  PQ.faixasBonif = rBf.data || [];
  PQ.transps = rTr.data || [];
  PQ.base = { tabelas:tabelas, prods:prods };
  return PQ.base;
}
function pqProd(id){ return (PQ.base.prods||[]).filter(function(p){ return p.id === id; })[0] || null; }
function pqTotalBruto(){ return PQ.itens.reduce(function(s,it){ return s + Math.round((Number(it.qtd)||0)*(Number(it.preco)||0)*100)/100; }, 0); }
/* bruto a preço de tabela: a faixa (R$ 1.000/1.500/3.000) é escolhida por ele, mesmo com preço manual */
function pqTotalBrutoTabela(){ return PQ.itens.reduce(function(s,it){ return s + Math.round((Number(it.qtd)||0)*(Number(it.precoTab)||0)*100)/100; }, 0); }
function pqDescAtivo(){ return /vista/i.test(PQ.cond||"") ? Math.min(100, Math.max(0, Number(PQ.desc)||0)) : 0; }
/* mesma conta do banco: cotacao_itens.valor_total = round(qtd × preço × (1 − desc/100), 2) */
function pqTotalLiquido(){
  var d = pqDescAtivo();
  return PQ.itens.reduce(function(s,it){ return s + Math.round((Number(it.qtd)||0)*(Number(it.preco)||0)*(1-d/100)*100)/100; }, 0);
}
function pqTotalBonif(){ return PQ.bonif.reduce(function(s,it){ return s + Math.round((Number(it.qtd)||0)*(Number(it.preco)||0)*100)/100; }, 0); }
function pqPrecoTabela(pid){
  var p = PQ.tabela ? precoNaTabelaProposta(PQ.tabela.id, pid) : null;
  var tabs = (ST.cache.propTabelas||[]).slice().sort(function(a,b){ return a.pedido_minimo - b.pedido_minimo; });
  for(var i=0;i<tabs.length && !p;i++) p = precoNaTabelaProposta(tabs[i].id, pid);
  return p ? p.preco_unitario : 0;
}
/* a faixa depende do total, e o total depende da faixa: tenta da maior para a menor */
function pqTabelaFinal(){
  var tabs = (ST.cache.propTabelas||[]).slice().sort(function(a,b){ return b.pedido_minimo - a.pedido_minimo; });
  for(var i=0;i<tabs.length;i++){
    var t = tabs[i], tot = 0, ok = true;
    PQ.itens.forEach(function(it){
      var p = precoNaTabelaProposta(t.id, it.pid);
      if(!p){ ok = false; return; }
      tot += Math.round((Number(it.qtd)||0)*p.preco_unitario*100)/100;
    });
    if(ok && tot >= Number(t.pedido_minimo)) return t;
  }
  return null;
}
function pqAplicarPrecos(){
  var t = pqTabelaFinal();
  var tabs = (ST.cache.propTabelas||[]).slice().sort(function(a,b){ return a.pedido_minimo - b.pedido_minimo; });
  PQ.itens.forEach(function(it){
    var p = t ? precoNaTabelaProposta(t.id, it.pid) : null;
    if(!p){ for(var i=0;i<tabs.length && !p;i++) p = precoNaTabelaProposta(tabs[i].id, it.pid); }
    it.precoTab = p ? p.preco_unitario : 0;
    /* preço manual (condição especial, 18/11/2026): a tabela não sobrescreve */
    it.preco = it.manual ? (Number(it.precoMan)||0) : it.precoTab;
  });
  PQ.tabela = t;
  PQ.bonif.forEach(function(it){ it.preco = pqPrecoTabela(it.pid); });
}

async function telaPedidos(){
  PQ.form = false;
  pinta('<div class="ios"><div class="vazio">Carregando pedidos…</div></div>');
  try{ await carregarBasePedido(); }
  catch(e){ pinta('<div class="card" style="--u:#C63A3A">Não consegui carregar a tabela de preço: '+esc(e.message)+'</div>'); return; }
  var r = await sb.schema("crm").from("cotacoes")
    .select("id,numero,cliente_id,status,valor_total,criado_em,atualizado_em,pedido_gerado_em,faturado_em,numero_pedido_loja,condicao_pagamento,arquivo_exportacao")
    .in("status", ["rascunho","enviada","pedido","exportado"]).order("numero", {ascending:false}).limit(400);
  if(r.error){ pinta('<div class="card" style="--u:#C63A3A">Não consegui carregar os pedidos: '+esc(r.error.message)+'</div>'); return; }
  var L = r.data || [];
  var ids = Array.from(new Set(L.map(function(x){ return x.cliente_id; }).filter(Boolean)));
  var nomes = {};
  if(ids.length){
    var rc = await sb.from("clientes").select("id,razao_social").in("id", ids);
    (rc.data||[]).forEach(function(c){ nomes[c.id] = c.razao_social; });
  }
  var numsExp = L.filter(function(x){ return x.status === "exportado" && x.numero_pedido_loja; }).map(function(x){ return x.numero_pedido_loja; });
  var comNF = {};
  if(numsExp.length){
    var rn = await sb.from("nf_venda").select("pedido_numero").in("pedido_numero", numsExp);
    (rn.data||[]).forEach(function(n){ comNF[n.pedido_numero] = true; });
  }
  /* volumes da NF (colunas AB quantidade e X espécie da planilha) já gravados na ficha UpSeller */
  var idsAf = L.map(function(x){ return x.id; });
  var fichas = {};
  if(idsAf.length){
    var rf = await sb.schema("crm").from("pedido_upseller").select("cotacao_id,campos").in("cotacao_id", idsAf);
    (rf.data||[]).forEach(function(f){ fichas[f.cotacao_id] = f.campos || {}; });
  }
  var rm = await sb.schema("crm").from("pedido_upseller").select("campos").order("atualizado_em", {ascending:false}).limit(20);
  /* tipo de pacote da UpSeller é sempre "Volume(s)" (dono, 19/11/2026) */
  PQ.espPadrao = "Volume(s)";
  PQ.fichas = fichas;
  PQ.lista = L; PQ.nomes = nomes; PQ.comNF = comNF;
  renderPedidos();
}

async function pqFaturar(ids){
  var sem = [], grava = [], semLoja = [];
  ids.forEach(function(id){
    var xl = (PQ.lista||[]).filter(function(c){ return c.id === id; })[0];
    if(xl && !lojaEmpresa(($("loja-"+id)||{}).value)) semLoja.push(xl.numero_pedido_loja || ("#"+xl.numero));
  });
  if(semLoja.length){ msg("Escolha por qual empresa faturar (Nutríssima ou LBR): "+semLoja.join(", "), true); return; }
  ids.forEach(function(id){
    var x = (PQ.lista||[]).filter(function(c){ return c.id === id; })[0]; if(!x) return;
    var v = Math.round(Number(($("vol-"+id)||{}).value)||0), esp = ($("esp-"+id)||{}).value || PQ.espPadrao || "Volume(s)";
    var lj = ($("loja-"+id)||{}).value;
    grava.push({ x:x, v:v, esp:esp, loja:lj }); if(!(v > 0)) sem.push(x.numero_pedido_loja || ("#"+x.numero));
  });
  if(sem.length && !confirm("Sem quantidade de volumes: "+sem.join(", ")+".\n\nA nota sai sem volume. Faturar assim mesmo?")) return;
  for(var i=0;i<grava.length;i++){
    var g = grava[i];
    var rf = await sb.schema("crm").from("pedido_upseller").select("campos,itens").eq("cotacao_id", g.x.id).maybeSingle();
    if(rf.error){ msg("Não consegui ler os dados UpSeller: "+rf.error.message, true); return; }
    var campos = (rf.data && rf.data.campos) || {};
    if(g.v > 0){ campos.AB = String(g.v); campos.X = g.esp; }
    campos.B = g.loja;
    var u = await sb.schema("crm").from("pedido_upseller").upsert({
      cotacao_id:g.x.id, cliente_id:g.x.cliente_id, campos:campos, itens:(rf.data && rf.data.itens) || {},
      atualizado_em:new Date().toISOString(), atualizado_por:ST.email
    }).select("cotacao_id");
    if(u.error || !(u.data||[]).length){ msg("Não consegui gravar os volumes de "+(g.x.numero_pedido_loja||"")+(u.error ? ": "+u.error.message : "")+". Nada foi faturado.", true); return; }
  }
  PQ.sel = {};
  faturarPedidos(ids);
}

async function pqAprovar(id){

  var agora = new Date().toISOString();

    status:"pedido", numero_pedido_loja:num, pedido_gerado_em:agora, atualizado_em:agora
  }).eq("id", id).eq("status", "enviada").select("id");
  if(u.error){ msg("Não deu para aprovar: "+u.error.message, true); return; }

}

async function pqCliSalvar(){

  var val = function(id){ return String(($(id)||{}).value||"").trim(); };

  if(!razao){ msg("Informe a razão social.", true); return; }
  if((tipo === "CNPJ" && doc.length !== 14) || (tipo === "CPF" && doc.length !== 11)){ msg(tipo+" com "+(tipo==="CNPJ"?14:11)+" dígitos.", true); return; }
  var ufTxt = val("pcUf"), uf = ufTxt ? ufSigla(ufTxt) : null;
  if(ufTxt && !uf){ msg("UF inválida (ex.: SP).", true); return; }
  var dados = {
    tipo_doc:tipo, documento:doc, razao_social:razao,
    nome_fantasia: val("pcFant") || null, ie: val("pcIe") || null,
    cep: digitos(val("pcCep")) || null, logradouro: val("pcLog") || null, numero: val("pcNum") || null,
    complemento: val("pcComp") || null, bairro: val("pcBairro") || null,
    municipio: val("pcCid") || null, uf: uf
  };
  var ctNome = val("pcCtNome"), ctTel = val("pcCtTel"), ctEmail = val("pcCtEmail");
  if(!ed && (ctTel || ctEmail) && !ctNome){ msg("Informe o nome do contato.", true); return; }
  var id;
  if(ed){
    var ru = await sb.from("clientes").update(dados).eq("id", ed.id).select("id");
    if(ru.error || !(ru.data||[]).length){ msg("Não consegui salvar o cadastro: "+(ru.error ? ru.error.message : "nenhuma linha alterada"), true); return; }
    id = ed.id;
  } else {
    var rd = await sb.from("clientes").select("id,razao_social").eq("documento", doc).limit(1);
    if(rd.data && rd.data.length){
      if(!confirm('Já existe um cliente com esse documento: "'+rd.data[0].razao_social+'". Usar esse cadastro no pedido?')) return;
      PQ.cliForm = null; await pqEscolherCli(rd.data[0].id); pqRenderResumo(); return;
    }
    dados.criado_por = ST.email;
    var ri = await sb.from("clientes").insert(dados).select("id").single();
    if(ri.error || !ri.data){ msg("Não consegui cadastrar: "+(ri.error ? ri.error.message : "sem retorno"), true); return; }
    id = ri.data.id;
    if(ctNome){
      var rc = await sb.schema("crm").from("contatos").insert({ cliente_id:id, nome:ctNome, telefone:ctTel || null, email:ctEmail || null, decisor:true, criado_por:ST.email }).select("id");
      if(rc.error || !(rc.data||[]).length) msg("Cliente cadastrado, mas o contato não gravou"+(rc.error ? ": "+rc.error.message : "")+". Cadastre em Clientes.", true);
    }
  }
  /* atualiza a busca do passo 1 sem recarregar a tela */
  var linha = { id:id, razao_social:razao, nome_fantasia:dados.nome_fantasia, municipio:dados.municipio, uf:dados.uf, documento:doc };
  linha.chave = semAcento([linha.razao_social, linha.nome_fantasia, linha.municipio, linha.uf].join(" "))+" "+doc;
  ST.cache.pqClientes = (ST.cache.pqClientes||[]).filter(function(c){ return c.id !== id; }).concat([linha])
    .sort(function(a,b){ return String(a.razao_social).localeCompare(String(b.razao_social)); });
  ST.cache.clientes = null;
  PQ.cliForm = null;
  msg(ed ? "Cadastro do cliente atualizado." : "Cliente cadastrado.");

function pqFiltraCli(){

  }).join("") : '<p class="lb">Nenhum cliente encontrado — use "+ Cadastrar cliente novo" abaixo.</p>';
}

async function pqSalvarTransp(editId){
  var nome = String(($("trNome")||{}).value||"").trim(), doc = digitos(($("trDoc")||{}).value);
  var uf = ufSigla(($("trUf")||{}).value||"");
  if(!nome){ msg("Informe a razão social.", true); return; }
  if(doc.length !== 14 && doc.length !== 11){ msg("CNPJ com 14 dígitos (ou CPF com 11).", true); return; }
  if(!uf){ msg("Informe a UF (ex.: SP).", true); return; }
  if(editId){
    var ru = await sb.schema("crm").from("transportadoras").update({
      razao_social:nome, ie: String(($("trIe")||{}).value||"").trim() || null, uf:uf,
      municipio: String(($("trCid")||{}).value||"").trim() || null,
      endereco: String(($("trEnd")||{}).value||"").trim() || null,
      atualizado_em:new Date().toISOString(), atualizado_por:ST.email
    }).eq("id", editId).select("id,razao_social,documento,tipo,ie,uf,municipio,endereco");
    if(ru.error || !(ru.data||[]).length){ msg("Não consegui salvar: "+(ru.error ? ru.error.message : "nenhuma linha alterada"), true); return; }
    PQ.transps = (PQ.transps||[]).map(function(t){ return t.id === editId ? ru.data[0] : t; });
    msg("Transportadora atualizada."); pqRenderTransp(); return;
  }
  if((PQ.transps||[]).some(function(t){ return digitos(t.documento) === doc; })){ msg("Essa transportadora já está cadastrada.", true); return; }
  var r = await sb.schema("crm").from("transportadoras").insert({
    razao_social:nome, documento:doc, tipo: doc.length === 11 ? "CPF" : "CNPJ",
    ie: String(($("trIe")||{}).value||"").trim() || null, uf:uf,
    municipio: String(($("trCid")||{}).value||"").trim() || null,
    endereco: String(($("trEnd")||{}).value||"").trim() || null,
    fonte:"tela Pedidos", ativo:true, atualizado_por:ST.email
  }).select("id,razao_social,documento,tipo,ie,uf,municipio,endereco").single();
  if(r.error || !r.data){ msg("Não consegui cadastrar: "+(r.error ? r.error.message : "sem retorno"), true); return; }
  PQ.transps = (PQ.transps||[]).concat([r.data]).sort(function(a,b){ return a.razao_social.localeCompare(b.razao_social); });
  PQ.transp = r.data.id;
  msg("Transportadora cadastrada.");
  pqRenderTransp();
}
/* grava a transportadora escolhida nas colunas AH–AN da ficha UpSeller do pedido */
async function pqGravarTransp(id){
  var rf = await sb.schema("crm").from("pedido_upseller").select("campos,itens").eq("cotacao_id", id).maybeSingle();
  if(rf.error) return "ficha: "+rf.error.message;
  var campos = (rf.data && rf.data.campos) || {};
  ["AH","AI","AJ","AK","AL","AM","AN"].forEach(function(k){ delete campos[k]; });
  var t = (PQ.transps||[]).filter(function(x){ return x.id === PQ.transp; })[0];
  var vol = Math.round(Number(PQ.vol)||0);
  if(vol > 0){ campos.AB = String(vol); campos.X = "Volume(s)"; } else { delete campos.AB; }
  if(lojaEmpresa(PQ.loja)) campos.B = PQ.loja;
  if(t){
    var doc = digitos(t.documento);
    campos.AH = doc.length === 11 ? "CPF" : "CNPJ"; campos.AI = doc; campos.AJ = t.razao_social;
    if(t.ie) campos.AK = t.ie;
    if(t.uf) campos.AL = ufExtenso(t.uf);
    if(t.municipio) campos.AM = t.municipio;
    if(t.endereco) campos.AN = t.endereco;
  } else if(!rf.data && !(vol > 0) && !campos.B) return "";
  var u = await sb.schema("crm").from("pedido_upseller").upsert({
    cotacao_id:id, cliente_id:PQ.cli.id, campos:campos, itens:(rf.data && rf.data.itens) || {},
    atualizado_em:new Date().toISOString(), atualizado_por:ST.email
  }).select("cotacao_id");
  if(u.error) return "transportadora: "+u.error.message;
  if(!(u.data||[]).length) return "transportadora: nenhuma linha gravada";
  return "";
}

async function pqSalvar(){

  var tot = itens.reduce(function(s,i){ return s + Math.round(i.qtd*i.preco*(1-d/100)*100)/100; }, 0);
  var tabs = (ST.cache.propTabelas||[]).slice().sort(function(a,b){ return a.pedido_minimo - b.pedido_minimo; });
  var minimo = tabs.length ? Number(tabs[0].pedido_minimo) : 0;
  var agora = new Date().toISOString();

    cliente_id: PQ.cli.id,

    valor_total: Math.round(tot*100)/100,
    status: "rascunho",

  };
  var id;
  if(PQ.editando){
    id = PQ.editando.id;

    if(u.error){ msg("Não consegui salvar: "+u.error.message, true); return; }
    if(!(u.data||[]).length){ msg("O banco não aceitou a mudança (nenhuma linha alterada). Ele pode já ter sido aprovado.", true); return; }
    var dl = await sb.schema("crm").from("cotacao_itens").delete().eq("cotacao_id", id).select("id");
    if(dl.error){ msg("Não consegui trocar os itens: "+dl.error.message, true); return; }
  } else {
    var c = await sb.schema("crm").from("cotacoes").insert(dados).select("id,numero").single();
    if(c.error || !c.data){ msg("Não consegui salvar: "+(c.error ? c.error.message : "sem retorno"), true); return; }
    id = c.data.id;
  }
  var linhas = itens.map(function(i){
    return { cotacao_id:id, produto_acabado_id:i.pid, descricao:i.nome, qtd:i.qtd, valor_unitario:i.preco, desconto_pct:d, bonificado:false,
             preco_manual:!!i.manual, preco_tabela:Number(i.precoTab)||null, motivo_preco:i.manual ? String(i.motivo).trim() : null };
  }).concat(bonif.map(function(i){
    return { cotacao_id:id, produto_acabado_id:i.pid, descricao:i.nome, qtd:i.qtd, valor_unitario:i.preco, desconto_pct:0, bonificado:true,
             preco_manual:false, preco_tabela:Number(i.preco)||null, motivo_preco:null };
  }));
  var ri = await sb.schema("crm").from("cotacao_itens").insert(linhas).select("id");
  if(ri.error || (ri.data||[]).length !== linhas.length){
    msg("O pedido foi salvo, mas os itens não gravaram inteiros"+(ri.error ? ": "+ri.error.message : "")+". Abra e salve de novo.", true);
    telaPedidos(); return;
  }
  var avT = await pqGravarTransp(id);
  var enviado = false, aviso = "";
  if(tot >= minimo){
    var e = await sb.schema("crm").from("cotacoes").update({ status:"enviada", atualizado_em:new Date().toISOString() }).eq("id", id).select("id");
    if(e.error) aviso = e.error.message;
    else if(!(e.data||[]).length) aviso = "nenhuma linha alterada";
    else enviado = true;
  }
  if(avT) msg("Pedido salvo, mas a "+avT+". Escolha de novo em Editar.", true);
  PQ.editando = null;
  pqTelaSalvo(id, enviado, tot, minimo, aviso);
}

function pqBaixarBlob(blob, nome){

/* ================= PAINEL COMERCIAL (layout do app financeiro) =================
   Decisão primeiro: alertas do que está parado → 4 números do período →
   gráfico por dia → por representante → listas. Tudo abre a gaveta do pedido. */
var PN = { de:null, ate:null, atalho:"semana", sel:null, grupo:null };
function pnSegunda(iso){
  var d = new Date(iso+"T12:00:00"); var w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return gerIsoData(d);
}
function pnPeriodo(atalho){
  var h = hojeISO(); PN.atalho = atalho;
  if(atalho === "hoje"){ PN.de = h; PN.ate = h; }
  else if(atalho === "semana"){ PN.de = pnSegunda(h); PN.ate = somaDiasISO(PN.de, 6); }
  else if(atalho === "mes"){ PN.de = h.slice(0,8)+"01"; var d = new Date(h.slice(0,4), Number(h.slice(5,7)), 0); PN.ate = gerIsoData(d); }
  else if(atalho === "30"){ PN.de = somaDiasISO(h, -29); PN.ate = h; }
  PN.sel = null; PN.grupo = null;
}
function pnDias(){ return Math.round((new Date(PN.ate+"T12:00:00") - new Date(PN.de+"T12:00:00"))/86400000) + 1; }
function pnDeslocar(s){ var n = pnDias(); PN.de = somaDiasISO(PN.de, s*n); PN.ate = somaDiasISO(PN.ate, s*n); PN.atalho = ""; PN.sel = null; renderPainelCom(); }

async function telaPainelCom(){

    (rn.data||[]).forEach(function(n){ comNF[n.pedido_numero] = true; });
  }
  /* carteira LBR (pedidos digitados na LBR, importados pela planilha do Varejo) — 17/11/2026 */

    var rv = await sb.from("vendas_pedidos")
      .select("id,pedido_numero,cliente,cidade,emissao,entrega,qtd,qtd_separada,valor_unitario,status,baixado_em,produto_nome,produto_acabado_id,produto_acabado(nome,saldo_potes)")
      .eq("canal","Varejo").in("status",["aberto","baixado"]).order("id").range(pg*1000, pg*1000+999);
    if(rv.error){ lbrErro = rv.error.message; break; }

function pnNoPeriodo(iso){ return iso && iso >= PN.de && iso <= PN.ate; }

/* ===== Carteira LBR no Painel comercial ===== */
function lbrPedidos(){
  var hoje = hojeISO(), L = PN.lbr || [];
  var ab = L.filter(function(x){ return x.status === "aberto"; });
  /* estoque servido na ordem da entrega: quem entrega antes consome o saldo primeiro (mesma regra da Carteira da fábrica) */
  var saldo = {};
  ab.forEach(function(x){ if(x.produto_acabado_id && saldo[x.produto_acabado_id] == null) saldo[x.produto_acabado_id] = Number((x.produto_acabado||{}).saldo_potes)||0; });
  var ord = ab.slice().sort(function(a,b){ return String(a.entrega||"9999").localeCompare(String(b.entrega||"9999")) || String(a.pedido_numero).localeCompare(String(b.pedido_numero)); });
  var P = {};
  ord.forEach(function(x){
    var k = x.pedido_numero;
    if(!P[k]) P[k] = { num:k, cliente:x.cliente, cidade:x.cidade, entrega:x.entrega, emissao:x.emissao, v:0, potes:0, falta:0, semSku:0, sep:0, itens:[] };
    var q = Number(x.qtd)||0, sp = Math.min(Number(x.qtd_separada)||0, q), resto = q - sp, f = 0;
    if(!x.produto_acabado_id){ f = resto; P[k].semSku += resto; }
    else { var usa = Math.min(resto, Math.max(saldo[x.produto_acabado_id], 0)); saldo[x.produto_acabado_id] -= usa; f = resto - usa; }
    P[k].v += q*(Number(x.valor_unitario)||0); P[k].potes += q; P[k].falta += f; P[k].sep += sp;
    if(x.entrega && (!P[k].entrega || x.entrega < P[k].entrega)) P[k].entrega = x.entrega;
    P[k].itens.push({ nome:(x.produto_acabado||{}).nome || x.produto_nome || "sem SKU", q:q, sp:sp, falta:f, v:q*(Number(x.valor_unitario)||0), semSku:!x.produto_acabado_id });
  });
  var lista = Object.keys(P).map(function(k){
    var p = P[k];
    p.dias = p.entrega ? Math.round((new Date(p.entrega+"T12:00:00") - new Date(hoje+"T12:00:00"))/864e5) : null;
    p.vencido = p.dias != null && p.dias < 0;
    p.separado = p.sep >= p.potes && p.potes > 0;
    /* urgência calculada: prazo × cobertura do estoque, não o status da planilha */
    p.cor = p.separado ? "#3E7C45" : (p.falta > 0 && (p.vencido || (p.dias != null && p.dias <= 2))) ? "#C63A3A" : (p.falta > 0 || p.vencido || p.dias == null) ? "#B8862B" : "#3E7C45";
    return p;
  }).sort(function(a,b){ return String(a.entrega||"9999").localeCompare(String(b.entrega||"9999")); });
  PN.lbrP = P;
  return lista;
}
function lbrBloco(){

      (semEst.length ? '<b style="color:#B8862B">'+semEst.length+' dependem de envase</b>' : 'estoque cobre todos')+'</div>'+

    (lista.length ? lista.map(function(p){
      var pr = p.separado ? 'separado, aguardando faturar' : p.dias == null ? 'sem data de entrega' : p.vencido ? 'vencido há '+(-p.dias)+' dia'+(-p.dias>1?'s':'') : p.dias===0 ? 'entrega hoje' : 'entrega em '+p.dias+' dia'+(p.dias>1?'s':'');
      var es = p.separado ? '' : p.semSku > 0 ? ' · código sem de-para na planilha' : p.falta > 0 ? ' · falta '+inte(p.falta)+' pote'+(p.falta>1?'s':'') : ' · estoque cobre';
      return '<button class="rw lnk" style="border-left:4px solid '+p.cor+';padding-left:8px" onclick="lbrGaveta(\''+jsAttr(p.num)+'\')"><span style="text-align:left;min-width:0">'+esc(p.cliente||"cliente")+
        '<span class="lb" style="display:block">'+esc(p.num)+' · '+(p.entrega?dataBR(p.entrega).slice(0,5)+' · ':'')+esc(pr)+esc(es)+'</span></span>'+
        '<span class="nm" style="white-space:nowrap">'+rs(p.v)+'</span></button>';
    }).join("") : '<p class="lb" style="margin-top:6px">Nenhum pedido da LBR em aberto.</p>')+
    '</div></article>';
  return h;
}

      return '<div class="rw" style="font-size:13px"><span>'+esc(it.descricao||"—")+' <span class="lb" style="display:inline">'+inte(it.qtd)+' × '+rs(it.valor_unitario)+(it.bonificado?' · bonificado':'')+'</span></span><span class="nm">'+(it.bonificado?'—':rs(tot))+'</span></div>';
    }).join("")+

    '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">'+

    '</div>';

/* ================= importar ================= */
function telaImportar(){
  pinta(
    ''+
    '<div class="drop" id="drop" onclick="document.getElementById(\'arq\').click()">'+
      '<b>Escolher arquivos XML ou .zip</b><span>ou arraste os arquivos para cá — pode mandar vários de uma vez, ou um .zip com tudo dentro</span>'+
    '</div>'+
    '<input id="arq" type="file" accept=".xml,.zip,text/xml,application/xml,application/zip" multiple '+
      'style="position:absolute;left:-9999px" onchange="importar(this.files)">'+
    '<div id="res" style="margin-top:16px"></div>');
  var d = $("drop");
  ["dragenter","dragover"].forEach(function(e){
    d.addEventListener(e, function(ev){ ev.preventDefault(); d.classList.add("over"); });
  });
  ["dragleave","drop"].forEach(function(e){
    d.addEventListener(e, function(ev){ ev.preventDefault(); d.classList.remove("over"); });
  });
  d.addEventListener("drop", function(ev){
    if(ev.dataTransfer && ev.dataTransfer.files) importar(ev.dataTransfer.files);
  });
}

async function importar(files, opts){
  opts = opts || {};
  var criarClientes = opts.criarClientes !== false; // default true (fluxo comercial/B2B, comportamento original)
  var arrOriginal = Array.prototype.slice.call(files || []);
  if(!arrOriginal.length) return;

  /* 0. expandir .zip em .xml (assim não precisa descompactar antes de subir) */
  $("res").innerHTML = '<div class="card"><h3>Preparando arquivos…</h3></div>';
  var arr;
  try {
    arr = await expandirArquivos(arrOriginal, function(msg){
      $("res").innerHTML = '<div class="card"><h3>'+esc(msg)+'</h3></div>';
    });
  } catch(e){
    return $("res").innerHTML = erroCartao("não consegui ler os arquivos (zip corrompido?): "+e.message);
  }
  if(!arr.length) return $("res").innerHTML = '<div class="card" style="--u:#D9772B"><h3>Nenhum XML encontrado</h3><p>Confira se o .zip contém arquivos .xml.</p></div>';
  $("res").innerHTML = '<div class="card"><h3>Lendo '+arr.length+' arquivo(s)…</h3></div>';

  /* 1. ler os XMLs */
  var lidas = [], falhas = [], vistas = {};
  for(var i=0; i<arr.length; i++){
    if(i % 500 === 0) $("res").innerHTML = '<div class="card"><h3>Lendo… '+i+' de '+arr.length+'</h3></div>';
    var texto = arr[i].texto;
    var nf = lerNFe(texto, arr[i].name);
    if(nf.erro){ falhas.push({ arq:arr[i].name, motivo:nf.erro }); continue; }
    if(vistas[nf.chave]){ continue; }
    vistas[nf.chave] = 1;
    lidas.push(nf);
  }
  if(!lidas.length){
    return $("res").innerHTML = cartaoFalhas(falhas, 0, 0);
  }

  /* 2. emitentes conhecidos */
  var re = await sb.from("emitentes").select("*");
  if(re.error) return $("res").innerHTML = erroCartao(re.error.message);
  var emitMap = {}, distribuidores = [];
  (re.data||[]).forEach(function(e){
    emitMap[e.cnpj] = e;
    if(e.distribuidor) distribuidores.push(e.cnpj);
  });
  var semEmitente = {};
  lidas = lidas.filter(function(nf){
    if(!emitMap[nf.emitente_cnpj]){
      semEmitente[nf.emitente_cnpj] = nf.emitente_nome;
      return false;
    }
    return true;
  });
  if(!lidas.length){
    return $("res").innerHTML = cartaoEmitente(semEmitente);
  }

  /* 3. notas que já existem — consultado em blocos (URL tem limite de tamanho) */
  var chaves = lidas.map(function(n){ return n.chave; });
  var jaTem = {};
  for(var c0=0; c0<chaves.length; c0+=200){
    if(elProgresso()) elProgresso().innerHTML = '<div class="card"><h3>Conferindo o que já existe… '+c0+' de '+chaves.length+'</h3></div>';
    var rx = await comRetentativa(function(){ return sb.from("nf_venda").select("chave").in("chave", chaves.slice(c0, c0+200)); });
    if(rx.error) return $("res").innerHTML = erroCartao(rx.error.message);
    (rx.data||[]).forEach(function(x){ jaTem[x.chave] = 1; });
  }
  var novas = lidas.filter(function(n){ return !jaTem[n.chave]; });
  var repetidas = lidas.length - novas.length;

  if(!novas.length){
    return $("res").innerHTML =
      '<div class="card" style="--u:#B8862B"><h3>Nada novo para gravar</h3>'+
      '<p>As '+repetidas+' nota(s) enviada(s) já estavam importadas. Nenhum valor foi duplicado.</p></div>'+
      cartaoFalhas(falhas, 0, repetidas);
  }

  /* 4. clientes — só no fluxo comercial (B2B). E-commerce/marketplace é consumidor
     final avulso e NÃO deve virar cadastro de cliente (poluiria o CRM comercial). */
  var cliId = {};
  var porDoc = {};
  if(criarClientes){
    novas.forEach(function(n){
      if(!n.dest_documento) return;
      porDoc[n.dest_documento] = {
        documento: n.dest_documento, tipo_doc: n.dest_tipo,
        razao_social: n.dest_nome, ie: n.dest_ie,
        logradouro: n.dest_logradouro, numero: n.dest_numero, bairro: n.dest_bairro,
        municipio: n.dest_municipio, uf: n.dest_uf, cep: n.dest_cep,
        criado_por: ST.email
      };
    });
    var listaCli = Object.keys(porDoc).map(function(k){ return porDoc[k]; });
    if(listaCli.length){
      for(var u0=0; u0<listaCli.length; u0+=200){
        var rc = await comRetentativa(function(){ return sb.from("clientes").upsert(listaCli.slice(u0, u0+200), { onConflict:"documento", ignoreDuplicates:true }); });
        if(rc.error) return $("res").innerHTML = erroCartao(rc.error.message);
      }
    }
    var cliDocs = Object.keys(porDoc);
    for(var d0=0; d0<cliDocs.length; d0+=200){
      var rcl = await comRetentativa(function(){ return sb.from("clientes").select("id,documento").in("documento", cliDocs.slice(d0, d0+200)); });
      if(rcl.error) return $("res").innerHTML = erroCartao(rcl.error.message);
      (rcl.data||[]).forEach(function(c){ cliId[c.documento] = c.id; });
    }
  }

  /* 5. de-para de produtos */
  var rd = await sb.from("depara_sku").select("codigo,produto_acabado_id");
  var skuDe = {};
  (rd.data||[]).forEach(function(d){ if(d.produto_acabado_id) skuDe[String(d.codigo)] = d.produto_acabado_id; });

  /* 6. gravar notas */
  var linhasNota = novas.map(function(n){
    var em = emitMap[n.emitente_cnpj];
    var todosBonif = n.itens.every(function(i){ return i.bonificacao; });
    var classif = "venda";
    if(todosBonif) classif = "bonificacao";
    else if(em.proprio && distribuidores.indexOf(n.dest_documento) >= 0) classif = "sell_in";
    return {
      chave:n.chave, emitente_cnpj:n.emitente_cnpj, numero:n.numero, serie:n.serie,
      emissao:n.emissao, dh_emissao:n.dh_emissao, nat_op:n.nat_op,
      tp_nf:n.tp_nf, fin_nfe:n.fin_nfe,
      cliente_id: cliId[n.dest_documento] || null,
      dest_documento:n.dest_documento, dest_nome:n.dest_nome,
      dest_municipio:n.dest_municipio, dest_uf:n.dest_uf,
      v_prod:n.v_prod, v_desc:n.v_desc, v_frete:n.v_frete, v_outro:n.v_outro,
      v_ipi:n.v_ipi, v_st:n.v_st, v_nf:n.v_nf,
      v_icms:n.v_icms, v_pis:n.v_pis, v_cofins:n.v_cofins,
      pedido_numero:n.pedido_numero, classificacao:classif,
      arquivo:n.arquivo, criado_por:ST.email
    };
  });
  /* gravar as notas em blocos — mandar tudo de uma vez estoura a conexão no celular */
  var idPorChave = {};
  for(var b0=0; b0<linhasNota.length; b0+=200){
    if(elProgresso()) elProgresso().innerHTML = '<div class="card"><h3>Gravando notas… '+b0+' de '+linhasNota.length+'</h3></div>';
    var rn = await comRetentativa(function(){ return sb.from("nf_venda").insert(linhasNota.slice(b0, b0+200)).select("id,chave"); });
    if(rn.error) return $("res").innerHTML = erroCartao(rn.error.message);
    (rn.data||[]).forEach(function(x){ idPorChave[x.chave] = x.id; });
  }

  /* 7. gravar itens */
  var linhasItem = [], naoMapeados = {};
  novas.forEach(function(n){
    var nfId = idPorChave[n.chave];
    if(!nfId) return;
    n.itens.forEach(function(i){
      var pa = skuDe[String(i.codigo)] || null;
      if(!pa){
        if(!naoMapeados[i.codigo]) naoMapeados[i.codigo] = { codigo:i.codigo, descricao:i.descricao, qtd:0, valor:0 };
        naoMapeados[i.codigo].qtd += i.qtd;
        naoMapeados[i.codigo].valor += (i.v_prod - i.v_desc);
      }
      linhasItem.push({
        nf_id:nfId, n_item:i.n_item, codigo:i.codigo, descricao:i.descricao,
        produto_acabado_id:pa, cfop:i.cfop, ncm:i.ncm, unidade:i.unidade,
        qtd:i.qtd, v_un:i.v_un, v_prod:i.v_prod, v_desc:i.v_desc,
        bonificacao:i.bonificacao
      });
    });
  });
  for(var k=0; k<linhasItem.length; k+=200){
    if(elProgresso()) elProgresso().innerHTML = '<div class="card"><h3>Gravando itens… '+k+' de '+linhasItem.length+'</h3></div>';
    var ri = await comRetentativa(function(){ return sb.from("nf_venda_item").insert(linhasItem.slice(k, k+200)); });
    if(ri.error) return $("res").innerHTML = erroCartao(ri.error.message);
  }

  /* 8. reconciliar carteira (vendas_pedidos) com as notas recém-importadas —
     casa por pedido_numero contra as notas que acabaram de entrar e, em
     seguida, pelo nome já conhecido em cliente_alias (pedido cancelado ou
     ainda sem nota). Não é bloqueante: se falhar, a importação da nota já
     está gravada e a reconciliação pode ser rodada de novo depois. */
  var reconc = null, reconcErro = null;
  try{
    var rrec = await sb.rpc("fn_reconciliar_clientes_pedidos");
    if(rrec.error) reconcErro = rrec.error.message;
    else reconc = (rrec.data && rrec.data[0]) || null;
  }catch(e){ reconcErro = e.message; }

  /* 9. registrar a importação */
  var somaProd = novas.reduce(function(a,n){ return a + n.v_prod; }, 0);
  var somaDesc = novas.reduce(function(a,n){ return a + n.v_desc; }, 0);
  var listaNM = Object.keys(naoMapeados).map(function(k){ return naoMapeados[k]; });
  await sb.from("importacoes").insert({
    tipo:"nfe", arquivos:arr.length, lidos:lidas.length,
    gravados:novas.length, ignorados:repetidas,
    nao_mapeados: listaNM,
    resultado: { itens:linhasItem.length, v_prod:somaProd, v_desc:somaDesc, falhas:falhas,
      reconciliacao: reconc, reconciliacao_erro: reconcErro },
    criado_por: ST.email
  });

  /* 10. resultado na tela */
  var h = '<div class="card" style="--u:#3E7C45"><h3>'+novas.length+' nota(s) importada(s)</h3>'+
    '<div class="conta"><span class="p">R$ '+brl(somaProd)+'</span> mercadoria '+
    '&nbsp;−&nbsp; <span class="m">R$ '+brl(somaDesc)+'</span> desconto '+
    '&nbsp;=&nbsp; <b>R$ '+brl(somaProd-somaDesc)+'</b> líquido</div>'+
    '<p style="font-size:13.5px;color:#7A6A57">'+linhasItem.length+' itens'+
    (criarClientes ? ' · '+Object.keys(porDoc).length+' cliente(s) no arquivo' : ' · e-commerce, sem cadastro de cliente')+
    (repetidas ? ' · '+repetidas+' nota(s) já existiam e foram ignoradas' : '')+'</p>'+
    (reconc && reconc.via_nota ? '<p style="font-size:13.5px;color:#3E7C45">🔗 '+reconc.via_nota+' pedido(s) da carteira ligado(s) a cliente por esta nota</p>' : '')+
    (reconcErro ? '<p style="font-size:13.5px;color:#D9772B">⚠️ carteira não reconciliada automaticamente: '+esc(reconcErro)+'</p>' : '')+
    '<button class="b" style="margin-top:6px" onclick="ir(\''+(criarClientes?"inicio":"controladoria")+'\')">Ver o resultado</button></div>';

  if(listaNM.length){
    var somaNM = listaNM.reduce(function(a,x){ return a + x.valor; }, 0);
    h += '<div class="card" style="--u:#D9772B"><h3>'+listaNM.length+
      ' código(s) sem cadastro — R$ '+brl(somaNM)+'</h3>'+
      '<p>As notas foram gravadas por inteiro. Estes itens só não entram nas análises por produto até serem ligados a um SKU.</p>'+
      '<div class="tw" style="margin-top:8px"><table><thead><tr><th>Código</th><th>Produto</th>'+
      '<th style="text-align:right">Un</th><th style="text-align:right">Líquido</th></tr></thead><tbody>'+
      listaNM.sort(function(a,b){ return b.valor-a.valor; }).map(function(x){
        return '<tr><td class="mono">'+esc(x.codigo)+'</td><td>'+esc(x.descricao)+'</td>'+
          '<td class="n">'+inte(x.qtd)+'</td><td class="n">'+brl(x.valor)+'</td></tr>';
      }).join("")+'</tbody></table></div>'+
      '<button class="s" style="margin-top:10px" onclick="ir(\'pendencias\')">Cadastrar agora</button></div>';
  }
  if(Object.keys(semEmitente).length) h += cartaoEmitente(semEmitente);
  h += cartaoFalhas(falhas, novas.length, repetidas);
  $("res").innerHTML = h;
  msg(novas.length+" nota(s) importada(s)");
}

function erroCartao(m){
  return '<div class="card" style="--u:#C63A3A"><h3>O banco recusou a gravação</h3>'+
    '<p class="mono" style="font-size:12.5px">'+esc(m)+'</p>'+
    '<p>Nada foi gravado pela metade — pode tentar de novo com os mesmos arquivos.</p></div>';
}
function cartaoFalhas(falhas){
  if(!falhas || !falhas.length) return "";
  return '<div class="card" style="--u:#C63A3A"><h3>'+falhas.length+' arquivo(s) não foram lidos</h3>'+
    falhas.map(function(f){
      return '<div style="font-size:13.5px;padding:3px 0"><b>'+esc(f.arq)+'</b> — '+esc(f.motivo)+'</div>';
    }).join("")+'</div>';
}
function cartaoEmitente(mapa){
  var cnpjs = Object.keys(mapa);
  if(!cnpjs.length) return "";
  return '<div class="card" style="--u:#C63A3A"><h3>Emitente não cadastrado</h3>'+
    '<p>Estas notas foram deixadas de fora porque o sistema ainda não sabe se o emitente é a fábrica ou um distribuidor — e essa diferença decide se o valor entra no faturamento ou não.</p>'+
    cnpjs.map(function(c){
      return '<div class="mono" style="font-size:13px;padding:3px 0">'+esc(c)+' · '+esc(mapa[c]||"")+'</div>';
    }).join("")+
    '<p style="margin-top:8px">Peça o cadastro desse emitente antes de importar de novo.</p></div>';
}

/* ================= pendências ================= */
async function telaPendencias(){
  var r = await sb.from("nf_venda_item")
    .select("codigo,descricao,qtd,v_liquido").is("produto_acabado_id", null);
  if(r.error) return pinta('<div class="card" style="--u:#C63A3A">'+esc(r.error.message)+'</div>');
  var agg = {};
  (r.data||[]).forEach(function(x){
    var k = String(x.codigo);
    if(!agg[k]) agg[k] = { codigo:k, descricao:x.descricao, qtd:0, valor:0, linhas:0 };
    agg[k].qtd += Number(x.qtd)||0;
    agg[k].valor += Number(x.v_liquido)||0;
    agg[k].linhas++;
  });
  var L = Object.keys(agg).map(function(k){ return agg[k]; })
    .sort(function(a,b){ return b.valor - a.valor; });

  if(!L.length){
    return pinta(
      '<div class="card" style="--u:#3E7C45"><h3>Nada pendente</h3>'+
      '<p>Todo item faturado está ligado a um produto do cadastro.</p></div>');
  }

  var rs = await sb.from("produto_acabado").select("id,nome,linha")
    .eq("ativo", true).order("linha").order("nome");
  ST.cache.skus = rs.data || [];
  var total = L.reduce(function(a,x){ return a + x.valor; }, 0);

  var opts = '<option value="">— escolher produto —</option>' +
    ST.cache.skus.map(function(s){
      return '<option value="'+s.id+'">'+esc(s.linha+" · "+s.nome)+'</option>';
    }).join("");

  pinta(
    ''+
    '<div class="kpis"><div class="kpi ruim"><div class="r">Fora das análises</div>'+
      '<div class="v">R$ '+brl(total)+'</div><div class="n">em '+L.length+' códigos</div></div></div>'+
    L.map(function(x, idx){
      return '<div class="card" style="--u:#D9772B">'+
        '<h3><span class="mono">'+esc(x.codigo)+'</span> · '+esc(x.descricao||"sem descrição")+'</h3>'+
        '<div class="conta">'+inte(x.qtd)+' un &nbsp;·&nbsp; <span class="m">R$ '+brl(x.valor)+
        '</span> fora das análises &nbsp;·&nbsp; '+x.linhas+' linha(s) de nota</div>'+
        '<label for="s'+idx+'">Ligar a um produto já cadastrado</label>'+
        '<select id="s'+idx+'">'+opts+'</select>'+
        '<button class="b" style="margin-top:10px" onclick="ligarCodigo(\''+
          esc(x.codigo)+'\', \'s'+idx+'\', \''+esc(x.descricao||"")+'\')">Ligar código</button>'+
      '</div>';
    }).join("")+
    '<div class="card" style="--u:#7A6A57"><h3>E se o produto não existir na lista?</h3>'+
    '<p>Alguns desses códigos são produtos que nunca foram cadastrados — Pistache 100%, ganaches La Ben, balde de 3 kg. '+
    'Criar SKU novo é decisão de cadastro e afeta receita e MRP, então isso é feito junto com a fábrica, não por aqui.</p></div>');
}

async function ligarCodigo(codigo, selectId, descricao){
  var sel = $(selectId);
  var pa = sel ? sel.value : "";
  if(!pa) return msg("Escolha o produto antes de ligar", true);

  var rex = await sb.from("depara_sku").select("id").eq("codigo", codigo);
  if(rex.error) return msg("Não consegui conferir o de-para: "+rex.error.message, true);

  if(rex.data && rex.data.length){
    var ru = await sb.from("depara_sku").update({ produto_acabado_id: pa }).eq("codigo", codigo);
    if(ru.error) return msg("Não deu para atualizar: "+ru.error.message, true);
  } else {
    var ri = await sb.from("depara_sku").insert({
      codigo: codigo, plataforma: "Varejo", nome_anuncio: descricao || null,
      produto_acabado_id: pa, criado_por: ST.email
    });
    if(ri.error) return msg("Não deu para gravar: "+ri.error.message, true);
  }

  /* .select() é obrigatório: sem ele o Supabase não devolve as linhas afetadas, e
     update recusado por RLS volta sem erro e com zero linhas — foi assim que o botão
     ficou meses dizendo "ligado" sem ligar nada (corrigido em 18/09/2026). */
  var rr = await sb.from("nf_venda_item").update({ produto_acabado_id: pa })
    .eq("codigo", codigo).is("produto_acabado_id", null).select("id");
  if(rr.error) return msg("Código ligado no de-para, mas as notas antigas não foram atualizadas: "+rr.error.message, true);
  var n = (rr.data || []).length;

  /* Pedidos importados antes de o codigo existir tambem ficam orfaos. Sem este
     segundo update, eles sumiam das analises para sempre (18/09/2026). */
  var rp = await sb.from("vendas_pedidos").update({ produto_acabado_id: pa })
    .eq("codigo", codigo).is("produto_acabado_id", null).select("id");
  var np = (rp.error ? 0 : (rp.data || []).length);

  if(!n && !np){
    msg("Código "+codigo+" gravado no de-para, mas NENHUMA linha de nota ou pedido foi "+
        "atualizada — pode ser permissão ou o código já estar ligado. Confira antes de seguir.", true);
    telaPendencias();
    return;
  }

  msg("Código "+codigo+" ligado ao produto · "+n+" linha(s) de nota e "+np+" de pedido atualizada(s)"+
      (rp.error ? " · pedidos falharam: "+rp.error.message : ""), rp.error ? true : false);
  telaPendencias();
}

/* ================= controladoria (DRE) ================= */
async function telaControladoria(){
  pinta('<div class="vazio">Carregando…</div>');
  var r = await sb.from("v_dre_notas").select("*").eq("classificacao","venda").order("emissao");
  if(r.error) return pinta('<div class="card" style="--u:#C63A3A">'+esc(r.error.message)+'</div>');
  var N = r.data || [];

  var porMes = {};
  N.forEach(function(n){
    var k = String(n.mes).slice(0,7);
    if(!porMes[k]) porMes[k] = { mes:k, notas:0, bruta:0, liquida:0, icms:0, pis:0, cofins:0 };
    porMes[k].notas++;
    porMes[k].bruta += Number(n.v_nf)||0;
    porMes[k].liquida += Number(n.v_liquido_nf)||0;
    porMes[k].icms += Number(n.v_icms)||0;
    porMes[k].pis += Number(n.v_pis)||0;
    porMes[k].cofins += Number(n.v_cofins)||0;
  });
  var meses = Object.keys(porMes).sort();
  var totalBruta = N.reduce(function(a,n){ return a+(Number(n.v_nf)||0); },0);
  var totalLiquida = N.reduce(function(a,n){ return a+(Number(n.v_liquido_nf)||0); },0);
  var cargaEfetiva = totalBruta ? (100*(totalBruta-totalLiquida)/totalBruta) : 0;

  var h = '<div class="card" style="--u:#22303A"><h3>Importar e-commerce (série UpSeller/marketplace)</h3>'+
    '<p style="font-size:13.5px;color:#7A6A57">Estas notas NÃO criam cadastro de cliente — são consumidor final avulso, ficam só aqui na apuração fiscal.</p>'+
    '<input type="file" id="arqEcommerce" multiple accept=".xml,.zip,application/zip" style="margin-top:10px" onchange="importar(this.files,{criarClientes:false})">'+
    '<p style="font-size:12.5px;color:#7A6A57;margin-top:6px">Aceita .xml soltos ou um .zip com todos dentro — não precisa descompactar antes. Lotes grandes podem levar alguns minutos.</p>'+
    '<div id="res" style="margin-top:10px"></div></div>';

  h += '<div class="card" style="--u:#3E7C45"><h3>DRE — visão consolidada</h3>'+
    '<p class="r">Receita bruta</p><p class="v">R$ '+brl(totalBruta)+'</p>'+
    '<div class="conta">R$ '+brl(totalBruta)+' bruta &nbsp;−&nbsp; R$ '+brl(totalBruta-totalLiquida)+' ICMS+PIS+COFINS &nbsp;=&nbsp; <b>R$ '+brl(totalLiquida)+'</b> líquida</div>'+
    '<p style="font-size:13.5px;color:#7A6A57;margin-top:8px">Carga tributária efetiva: <b>'+cargaEfetiva.toFixed(2)+'%</b> · '+N.length+' nota(s) no total (todas as séries, exclui sell-in e bonificação)</p></div>';

  if(meses.length){
    h += '<div class="tw"><table><thead><tr><th>Mês</th><th style="text-align:right">Notas</th>'+
      '<th style="text-align:right">Bruta</th><th style="text-align:right">ICMS+PIS+COFINS</th>'+
      '<th style="text-align:right">Líquida</th><th style="text-align:right">Carga</th></tr></thead><tbody>'+
      meses.map(function(k){
        var m = porMes[k];
        var imp = m.icms+m.pis+m.cofins;
        var carga = m.bruta ? (100*imp/m.bruta) : 0;
        return '<tr><td class="mono">'+k+'</td><td class="n">'+m.notas+'</td>'+
          '<td class="n">R$ '+brl(m.bruta)+'</td><td class="n">R$ '+brl(imp)+'</td>'+
          '<td class="n">R$ '+brl(m.liquida)+'</td><td class="n">'+carga.toFixed(1)+'%</td></tr>';
      }).join("")+'</tbody></table></div>';
  } else {
    h += '<div class="vazio">Nenhuma nota de venda apurada ainda. Suba os XMLs de e-commerce acima.</div>';
  }

  h += '<p style="font-size:12.5px;color:#7A6A57;margin-top:14px"><b>Como ler:</b> "Bruta" = valor total da nota (vNF). '+
    '"Líquida" = bruta menos ICMS, PIS e COFINS (não desconta IPI/ST, que são repasse, não receita da empresa). '+
    '"Carga tributária efetiva" = imposto pago ÷ receita bruta das notas já importadas — não é alíquota nominal.<br>'+
    '<b>Cobertura:</b> só o que já foi importado aqui aparece; XMLs ainda não subidos não entram na conta.</p>';

  pinta(h);
}

/* ================= Precificação ================= */
var PREC = { produtos:[], insumos:[], skus:[], sel:null, detalhe:null, resumo:null, sim:{}, liberado:false };

function telaPrecPin(erro){
  pinta('<div class="card" style="--u:#B8862B"><h3>🔒 Precificação</h3>'+
    '<p style="font-size:14px;color:#7A6A57">Esta área mostra custo de insumo e formulação valorizada. '+
    'Digite o PIN do gestor para abrir.</p>'+
    '<input id="pinPrec" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" '+
      'onkeydown="if(event.key===\'Enter\')validarPinPrec()" '+
      'style="width:140px;font-size:20px;letter-spacing:.3em;text-align:center;min-height:48px;padding:8px;'+
      'border:1.5px solid #DCD2C4;border-radius:10px;margin-top:12px;font-family:ui-monospace,monospace">'+
    '<div style="margin-top:12px"><button onclick="validarPinPrec()">Abrir</button></div>'+
    (erro ? '<p style="color:#C63A3A;font-size:13.5px;margin-top:10px">'+esc(erro)+'</p>' : '')+
    '<p style="font-size:12.5px;color:#7A6A57;margin-top:14px">O PIN protege de olhar de terceiro num aparelho aberto. '+
    'Quem não tem o papel de controladoria não acessa esses dados nem com o PIN certo.</p></div>');
  var el = $("pinPrec"); if(el) el.focus();
}

async function validarPinPrec(){
  var el = $("pinPrec");
  if(!el) return;
  var v = (el.value||"").trim();
  if(!v) return telaPrecPin("Digite o PIN.");
  var r = await sb.rpc("verificar_pin", { p_nome:"Gestor", p_pin:v });
  if(r.error) return telaPrecPin(r.error.message);
  if(!r.data) return telaPrecPin("PIN incorreto.");
  PREC.liberado = true;
  telaPrecificacao();
}

async function telaPrecificacao(){
  if(!ST.papel.controladoria){
    return pinta('<div class="card" style="--u:#C63A3A"><h3>Acesso restrito</h3>'+
      '<p style="font-size:14px;color:#7A6A57">Preço de custo e formulação valorizada são visíveis só para a controladoria. '+
      'Seu login não tem esse papel.</p></div>');
  }
  if(!PREC.liberado){ return telaPrecPin(""); }
  pinta('<div class="vazio">Carregando…</div>');

  var rp = await sb.from("produtos").select("id,nome").order("nome");
  if(rp.error) return pinta('<div class="card" style="--u:#C63A3A">'+esc(rp.error.message)+'</div>');

  var rr = await sb.from("receita_itens").select("produto_id");
  if(rr.error) return pinta('<div class="card" style="--u:#C63A3A">'+esc(rr.error.message)+'</div>');
  var comReceita = {};
  (rr.data||[]).forEach(function(x){ comReceita[x.produto_id] = true; });
  PREC.produtos = (rp.data||[]).filter(function(p){ return comReceita[p.id]; });

  var ri = await sb.from("itens").select("id,nome,unidade,categoria")
    .in("categoria",["materia_prima","embalagem"]).order("categoria").order("nome");
  if(ri.error) return pinta('<div class="card" style="--u:#C63A3A">'+esc(ri.error.message)+'</div>');

  var rc = await sb.from("item_custo").select("item_id,preco_kg,origem,atualizado_em");
  if(rc.error) return pinta('<div class="card" style="--u:#C63A3A">'+esc(rc.error.message)+'</div>');
  var custos = {};
  (rc.data||[]).forEach(function(c){ custos[c.item_id] = c; });

  PREC.insumos = (ri.data||[]).map(function(i){
    var c = custos[i.id];
    return { id:i.id, nome:i.nome, unidade:i.unidade, categoria:i.categoria,
             preco_ref_kg: c ? c.preco_kg : null,
             preco_ref_origem: c ? c.origem : null,
             preco_ref_atualizado_em: c ? c.atualizado_em : null };
  });

  var rs = await sb.from("produto_acabado").select("id,nome,linha,embalagem,peso_pote_kg,produto_id")
    .eq("ativo", true).not("produto_id","is",null).order("nome");
  PREC.skus = (rs.error ? [] : (rs.data||[]));

  desenharPrecificacao();
}

function opcoesSkuHtml(){
  var lista = PREC.sel ? PREC.skus.filter(function(s){ return s.produto_id === PREC.sel; }) : PREC.skus;
  return '<option value="">— selecione um SKU —</option>'+
    lista.map(function(s){ return '<option value="'+esc(s.id)+'">'+esc(s.nome)+(s.linha?' · '+esc(s.linha):'')+'</option>'; }).join("");
}
function skuInfoTexto(){
  var lista = PREC.sel ? PREC.skus.filter(function(s){ return s.produto_id === PREC.sel; }) : PREC.skus;
  return PREC.sel
    ? (lista.length+' SKU(s) dessa fórmula.'+(lista.length===0?' Nenhum SKU liga essa fórmula a uma embalagem ainda.':''))
    : (PREC.skus.length+' SKU(s) com fórmula, no catálogo inteiro. Escolha uma fórmula acima pra ver só os dela.');
}
function desenharPrecificacao(){
  var comPreco = PREC.insumos.filter(function(i){ return i.preco_ref_kg != null; }).length;
  var total = PREC.insumos.length;
  var pct = total ? Math.round(100*comPreco/total) : 0;
  var corPct = pct >= 90 ? "#3E7C45" : (pct >= 60 ? "#B8862B" : "#C63A3A");

  var h = '<div class="card" style="--u:'+corPct+'"><h3>Preços de insumo cadastrados</h3>'+
    '<p class="r">INSUMOS COM PREÇO DE REFERÊNCIA</p>'+
    '<p class="v">'+comPreco+' de '+total+'</p>'+
    '<div class="conta">'+comPreco+' com preço &nbsp;+&nbsp; '+(total-comPreco)+' sem preço &nbsp;=&nbsp; <b>'+total+' insumos</b> &nbsp;·&nbsp; '+pct+'% cobertos</div>'+
    '<p style="font-size:13px;color:#7A6A57;margin-top:8px">Insumo sem preço entra na fórmula com custo zero — o custo do produto sai <b>subestimado</b> até você preencher.</p></div>';

  h += '<div class="card" style="--u:#22303A"><h3>Escolha o produto</h3>'+
    '<select id="selProd" onchange="carregarCustoProduto(this.value)" style="width:100%;min-height:44px;font-size:15px;padding:8px;border:1.5px solid #DCD2C4;border-radius:10px;margin-top:8px">'+
    '<option value="">— selecione uma fórmula —</option>'+
    PREC.produtos.map(function(p){
      return '<option value="'+esc(p.id)+'"'+(PREC.sel===p.id?" selected":"")+'>'+esc(p.nome)+'</option>';
    }).join("")+'</select>'+
    '<p style="font-size:12.5px;color:#7A6A57;margin-top:6px">'+PREC.produtos.length+' produto(s) com fórmula cadastrada. Produto sem fórmula não aparece aqui — não há como custear.</p>'+
    '</div><div id="boxCusto"></div>';

  h += '<div class="card" style="--u:#3E7C45"><h3>Custo do pote pronto (fórmula + embalagem)</h3>'+
    '<select id="selSku" onchange="carregarCustoPote(this.value)" style="width:100%;min-height:44px;font-size:15px;padding:8px;border:1.5px solid #DCD2C4;border-radius:10px;margin-top:8px">'+
    opcoesSkuHtml()+'</select>'+
    '<p id="skuInfo" style="font-size:12.5px;color:#7A6A57;margin-top:6px">'+skuInfoTexto()+' Custo do pote = (custo/kg da fórmula × peso do pote) + embalagem.</p>'+
    '<div id="boxPote" style="margin-top:10px"></div></div>';

  var mp = PREC.insumos.filter(function(i){ return i.categoria==="materia_prima"; });
  var emb = PREC.insumos.filter(function(i){ return i.categoria==="embalagem"; });

  h += tabelaPrecos("Preço de matéria-prima — R$/kg", mp, "#B8862B");
  h += tabelaPrecos("Preço de embalagem — R$/unidade", emb, "#D9772B");

  h += '<p style="font-size:12.5px;color:#7A6A57;margin-top:14px"><b>Como ler:</b> "Custo/kg" = soma de (quantidade do insumo na fórmula × preço), '+
    'descendo por receitas aninhadas e por baldes intermediários até o insumo bruto. "% precificado" = quanto do peso da fórmula tem preço cadastrado — abaixo de 100%, o custo é piso, não o custo real.<br>'+
    '<b>Não inclui:</b> mão de obra, energia, frete de despacho e depreciação — é custo de material, não custo industrial completo.</p>';

  pinta(h);
}

function tabelaPrecos(titulo, lista, cor){
  if(!lista.length) return "";
  return '<div class="card" style="--u:'+cor+'"><h3>'+esc(titulo)+'</h3>'+
    '<p style="font-size:13px;color:#7A6A57">Origem <b>compra</b> = veio de nota fiscal. <b>manual</b> = estimativa digitada. Marque "nota fiscal" antes de salvar quando o valor vier de uma compra de verdade — senão fica registrado como manual.</p>'+
    '<div class="tw" style="margin-top:10px"><table><thead><tr><th>Item</th><th style="text-align:right">Preço</th><th>Origem atual</th><th style="text-align:center">É nota fiscal?</th><th></th></tr></thead><tbody>'+
    lista.map(function(i){
      var val = i.preco_ref_kg != null ? Number(i.preco_ref_kg).toFixed(2) : "";
      var org = i.preco_ref_origem || "—";
      var corOrg = org === "compra" ? "#3E7C45" : (org === "manual" ? "#B8862B" : "#C63A3A");
      return '<tr><td>'+esc(i.nome)+'</td>'+
        '<td class="n"><input id="pr_'+esc(i.id)+'" type="number" step="0.01" min="0" value="'+val+'" placeholder="—" '+
          'style="width:100px;text-align:right;font-family:ui-monospace,monospace;min-height:36px;padding:4px 8px;border:1.5px solid #DCD2C4;border-radius:8px"></td>'+
        '<td><span style="font-size:12px;font-weight:700;color:'+corOrg+'">'+esc(org)+'</span></td>'+
        '<td style="text-align:center"><input type="checkbox" id="ori_'+esc(i.id)+'" style="width:20px;height:20px" title="Marque se esse preço vem de uma nota fiscal de compra"></td>'+
        '<td><button class="s" style="min-height:36px;padding:5px 12px;font-size:13px" onclick="salvarPreco(\''+esc(i.id)+'\')">Salvar</button></td></tr>';
    }).join("")+'</tbody></table></div>'+
    '<div id="resPreco_'+esc(cor.replace("#",""))+'" class="resPreco" style="margin-top:10px"></div></div>';
}

async function carregarCustoPote(id){
  if(!id){ $("boxPote").innerHTML = ""; return; }
  $("boxPote").innerHTML = '<div class="vazio">Calculando…</div>';
  var r = await sb.rpc("fn_custo_pote", { p_pa:id });
  if(r.error){ $("boxPote").innerHTML = '<div style="color:#C63A3A;font-size:13.5px">'+esc(r.error.message)+'</div>'; return; }
  var d = r.data || {};
  if(d.erro){ $("boxPote").innerHTML = '<div style="color:#C63A3A;font-size:13.5px">⚠️ '+esc(d.erro)+'</div>'; return; }

  var pct = d.pct_kg_precificado != null ? Number(d.pct_kg_precificado) : 0;
  var semPrecoEmb = Number(d.embalagem_itens_sem_preco||0);
  var completo = pct >= 100 && semPrecoEmb === 0;

  var h = '<p class="r">CUSTO TOTAL POR POTE'+(completo?"":" (INCOMPLETO)")+'</p>'+
    '<p class="v">R$ '+brl(Number(d.custo_total_pote)||0)+'</p>'+
    '<div class="conta">R$ '+brl(Number(d.custo_formula_pote)||0)+' fórmula ('+Number(d.peso_pote_kg).toFixed(3)+' kg) &nbsp;+&nbsp; '+
      'R$ '+brl(Number(d.custo_embalagem_pote)||0)+' embalagem &nbsp;=&nbsp; <b>R$ '+brl(Number(d.custo_total_pote)||0)+' por pote</b></div>';

  if(!completo){
    h += '<p style="font-size:13px;color:#C63A3A;margin-top:8px">⚠️ Piso, não custo real: '+
      pct.toFixed(1)+'% do peso da fórmula precificado'+
      (semPrecoEmb ? ' · '+semPrecoEmb+' item(ns) de embalagem sem preço' : '')+'.</p>';
  }

  var det = (d.embalagem && d.embalagem.detalhe) || [];
  if(det.length){
    h += '<div class="tw" style="margin-top:10px"><table><thead><tr><th>Embalagem</th><th style="text-align:right">Qtd</th>'+
      '<th style="text-align:right">R$/un</th><th style="text-align:right">Custo</th></tr></thead><tbody>'+
      det.map(function(x){
        return '<tr'+(x.tem_preco?'':' style="background:#FBEAEA"')+'><td>'+esc(x.item_nome)+'</td>'+
          '<td class="n">'+Number(x.qtd_por_pote)+'</td>'+
          '<td class="n">'+(x.preco_un!=null?'R$ '+brl(x.preco_un):'—')+'</td>'+
          '<td class="n">R$ '+brl(x.custo)+'</td></tr>';
      }).join("")+'</tbody></table></div>';
  }
  $("boxPote").innerHTML = h;
}

async function carregarCustoProduto(id){
  PREC.sel = id || null;
  PREC.sim = {};
  var selSku = $("selSku"), skuInfo = $("skuInfo"), boxPote = $("boxPote");
  if(selSku){ selSku.value = ""; selSku.innerHTML = opcoesSkuHtml(); }
  if(skuInfo) skuInfo.textContent = skuInfoTexto()+" Custo do pote = (custo/kg da fórmula × peso do pote) + embalagem.";
  if(boxPote) boxPote.innerHTML = "";
  if(!id){ $("boxCusto").innerHTML = ""; return; }
  $("boxCusto").innerHTML = '<div class="vazio">Calculando…</div>';

  var rd = await sb.rpc("fn_custo_produto_detalhe", { p_produto:id, p_kg:100 });
  if(rd.error){ $("boxCusto").innerHTML = '<div class="card" style="--u:#C63A3A">'+esc(rd.error.message)+'</div>'; return; }
  var rs = await sb.rpc("fn_custo_produto_resumo", { p_produto:id, p_kg:100 });
  if(rs.error){ $("boxCusto").innerHTML = '<div class="card" style="--u:#C63A3A">'+esc(rs.error.message)+'</div>'; return; }

  PREC.detalhe = (rd.data||[]).filter(function(l){ return l.item_id; });
  PREC.resumo = rs.data;
  desenharCusto();
}

function custoSimulado(){
  var total = 0;
  PREC.detalhe.forEach(function(l){
    var p = (PREC.sim[l.item_id] != null) ? PREC.sim[l.item_id] : (l.preco_kg != null ? Number(l.preco_kg) : 0);
    total += Number(l.kg) * p;
  });
  return total;
}

function desenharCusto(){
  var R = PREC.resumo;
  if(!R) return;
  var prod = PREC.produtos.filter(function(p){ return p.id === PREC.sel; })[0];
  var pct = R.pct_kg_precificado != null ? Number(R.pct_kg_precificado) : 0;
  var cor = pct >= 100 ? "#3E7C45" : (pct >= 80 ? "#B8862B" : "#C63A3A");
  var custoBase = Number(R.custo_total)||0;
  var custoSim = custoSimulado();
  var mudou = Math.abs(custoSim - custoBase) > 0.005;

  var h = '<div class="card" style="--u:'+cor+'"><h3>'+esc(prod ? prod.nome : "Produto")+' — custo da fórmula</h3>'+
    '<p class="r">CUSTO POR KG'+(mudou?" (SIMULADO)":"")+'</p>'+
    '<p class="v">R$ '+brl(mudou ? custoSim/100 : Number(R.custo_por_kg)||0)+'</p>'+
    '<div class="conta">Base 100 kg &nbsp;·&nbsp; custo total R$ '+brl(mudou?custoSim:custoBase)+' &nbsp;÷&nbsp; 100 kg &nbsp;=&nbsp; <b>R$ '+brl((mudou?custoSim:custoBase)/100)+'/kg</b></div>';

  if(mudou){
    var dif = custoSim - custoBase;
    var sinal = dif >= 0 ? "+" : "−";
    h += '<div class="conta" style="margin-top:8px">Preço gravado: R$ '+brl(custoBase/100)+'/kg &nbsp;'+sinal+'&nbsp; R$ '+brl(Math.abs(dif)/100)+' &nbsp;=&nbsp; <b>R$ '+brl(custoSim/100)+'/kg simulado</b>'+
      ' <button class="s" style="margin-left:10px;min-height:32px;padding:4px 10px;font-size:12.5px" onclick="limparSimulacao()">Limpar simulação</button></div>';
  }

  h += '<p style="font-size:13px;color:#7A6A57;margin-top:8px"><b>'+pct.toFixed(1)+'%</b> do peso da fórmula tem preço cadastrado';
  if(R.insumos_sem_preco && R.insumos_sem_preco.length){
    h += ' — faltam: '+R.insumos_sem_preco.map(function(x){ return esc(x.item_nome); }).join(", ");
  }
  h += '</p></div>';

  h += '<div class="card" style="--u:#22303A"><h3>Formulação — 100 kg</h3>'+
    '<p style="font-size:13px;color:#7A6A57">Edite o "R$/kg simulado" pra testar cenário sem gravar nada no sistema.</p>'+
    '<div class="tw" style="margin-top:10px"><table><thead><tr><th>Insumo</th><th style="text-align:right">kg/100kg</th>'+
    '<th style="text-align:right">R$/kg</th><th style="text-align:right">Simular R$/kg</th><th style="text-align:right">Custo</th></tr></thead><tbody>'+
    PREC.detalhe.slice().sort(function(a,b){ return Number(b.kg)-Number(a.kg); }).map(function(l){
      var pAtual = l.preco_kg != null ? Number(l.preco_kg) : null;
      var pUsar = (PREC.sim[l.item_id] != null) ? PREC.sim[l.item_id] : (pAtual != null ? pAtual : 0);
      var custo = Number(l.kg) * pUsar;
      var semPreco = pAtual == null;
      return '<tr'+(semPreco?' style="background:#FBEAEA"':'')+'>'+
        '<td>'+esc(l.item_nome)+(semPreco?' <span style="color:#C63A3A;font-size:11.5px;font-weight:700">sem preço</span>':'')+'</td>'+
        '<td class="n">'+Number(l.kg).toFixed(3)+'</td>'+
        '<td class="n">'+(pAtual != null ? "R$ "+brl(pAtual) : "—")+'</td>'+
        '<td class="n"><input type="number" step="0.01" min="0" placeholder="—" value="'+(PREC.sim[l.item_id] != null ? PREC.sim[l.item_id] : "")+'" '+
          'oninput="simular(\''+esc(l.item_id)+'\', this.value)" '+
          'style="width:90px;text-align:right;font-family:ui-monospace,monospace;min-height:34px;padding:4px 6px;border:1.5px solid #DCD2C4;border-radius:8px"></td>'+
        '<td class="n">R$ '+brl(custo)+'</td></tr>';
    }).join("")+'</tbody></table></div></div>';

  $("boxCusto").innerHTML = h;
}

function simular(itemId, v){
  if(v === "" || v == null){ delete PREC.sim[itemId]; }
  else {
    var n = Number(v);
    if(isNaN(n) || n < 0) return;
    PREC.sim[itemId] = n;
  }
  desenharCusto();
}

function limparSimulacao(){ PREC.sim = {}; desenharCusto(); }

async function salvarPreco(itemId){
  var el = $("pr_"+itemId);
  if(!el) return;
  var boxes = document.querySelectorAll(".resPreco");
  function aviso(html){ Array.prototype.forEach.call(boxes, function(b){ b.innerHTML = html; }); }
  var v = el.value;
  if(v === "" || v == null) return aviso('<span style="color:#C63A3A;font-size:13px">Digite um preço antes de salvar.</span>');
  var n = Number(v);
  if(isNaN(n) || n < 0) return aviso('<span style="color:#C63A3A;font-size:13px">Preço inválido.</span>');
  var chk = $("ori_"+itemId);
  var origemEscolhida = (chk && chk.checked) ? "compra" : "manual";

  aviso('<span style="color:#7A6A57;font-size:13px">Salvando…</span>');
  var r = await sb.rpc("atualizar_preco_ref", { p_item_id:itemId, p_preco:n, p_responsavel:ST.email||"controladoria", p_origem:origemEscolhida });
  if(r.error) return aviso('<span style="color:#C63A3A;font-size:13px">'+esc(r.error.message)+'</span>');

  aviso('<span style="color:#3E7C45;font-size:13px">✓ '+esc(r.data && r.data.nome ? r.data.nome : "Preço")+' atualizado para R$ '+brl(n)+' ('+(origemEscolhida==="compra"?"nota fiscal":"manual")+').</span>');
  PREC.insumos.forEach(function(i){
    if(i.id === itemId){ i.preco_ref_kg = n; i.preco_ref_origem = origemEscolhida; }
  });
  if(PREC.sel) await carregarCustoProduto(PREC.sel);
  var sku = $("selSku");
  if(sku && sku.value) await carregarCustoPote(sku.value);
}

/* ================= checagem de versão (resolve cache do celular) =================
   GitHub Pages não deixa configurar Cache-Control no servidor — então o jeito
   definitivo é o próprio app se checar: busca a si mesmo ignorando cache, compara
   a versão publicada com a que está rodando na tela, e avisa se estiver desatualizado.
   Roda ao abrir, ao voltar de outro app (visibilitychange — o gatilho mais comum no
   celular), e a cada 5 minutos com o app aberto. */
var APP_VERSION = document.querySelector('meta[name="app-version"]').content;
async function verificarAtualizacao(silencioso){
  try{
    var r = await fetch(location.pathname + "?_=" + Date.now(), {cache:"no-store"});
    var texto = await r.text();
    var m = texto.match(/<meta name="app-version" content="([^"]+)"/);
    if(m && m[1] && m[1] !== APP_VERSION){
      mostrarBannerAtualizacao();
    } else if(!silencioso){
      msg("Você já está na versão mais recente.");
    }
  }catch(e){ /* sem internet ou erro de rede — ignora silenciosamente */ }
}
function mostrarBannerAtualizacao(){
  if(document.getElementById("bannerAtualizacao")) return;
  var b = document.createElement("div");
  b.id = "bannerAtualizacao";
  b.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;"+
    "background:var(--ard);color:#fff;border-radius:var(--raio);padding:14px 16px;"+
    "display:flex;align-items:center;justify-content:space-between;gap:12px;"+
    "box-shadow:0 4px 18px rgba(0,0,0,.25)";
  b.innerHTML = '<span style="font-size:13.5px;font-weight:700">🔄 Nova versão disponível</span>'+
    '<button onclick="location.reload(true)" style="background:#fff;color:var(--ard);'+
    'border:none;border-radius:9px;padding:9px 16px;font-weight:800;font-family:inherit;'+
    'font-size:13px">Atualizar agora</button>';
  document.body.appendChild(b);
}
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible") verificarAtualizacao(true);
});
setInterval(function(){ verificarAtualizacao(true); }, 5*60*1000);
setTimeout(function(){ verificarAtualizacao(true); }, 1500);

/* ================= partida ================= */
(async function(){
  if(typeof supabase === "undefined" || !supabase.createClient){
    $("app").innerHTML = '<div class="login"><div class="cx">'+
      '<h1>Sem conexão</h1><p>Não consegui carregar a biblioteca do banco. '+
      'Confira a internet e recarregue a página.</p></div></div>';
    return;
  }
  sb = supabase.createClient(URL_SB, KEY_SB);
  var s = await sb.auth.getSession();
  if(s.data && s.data.session){
    ST.email = s.data.session.user.email || "";
    await carregarPapel();
    ir(ST.papel.comercial ? "inicio" : "controladoria");
  } else {
    telaLogin();
  }
})();
