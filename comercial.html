function renderPainelMargem(){
  var alvo = $("prMargemContainer");
  if(!alvo) return;
  var itens = ST.cache.propItensAtual || [];
  var totalVendido = itens.filter(function(it){ return !it.bonificado; }).reduce(function(a,it){ return a + totalItemProposta(it); }, 0);
  var totalBonifTabela = itens.filter(function(it){ return it.bonificado; }).reduce(function(a,it){ return a + totalItemProposta(it); }, 0);

  if(ST.cache.propMargemRegime === undefined) ST.cache.propMargemRegime = "nutrissima_real";
  if(ST.cache.propMargemImpostos === undefined) ST.cache.propMargemImpostos = ST.cache.propMargemRegime==="nutrissima_real" ? 23 : "";
  if(ST.cache.propMargemCmv === undefined) ST.cache.propMargemCmv = 35;

  var cmvPct = Number(ST.cache.propMargemCmv) || 0;
  var impPct = Number(ST.cache.propMargemImpostos) || 0;
  var comissaoPct = (ST.cache.propRepresentante ? Number(ST.cache.propRepresentante.comissao_pct) : 0) || 0;

  var custosRef = ST.cache.propCustosRef || {};
  function cmvDoGrupo(lista){
    var custo = 0, valorComCusto = 0, valorTotal = 0;
    lista.forEach(function(it){
      var v = totalItemProposta(it);
      valorTotal += v;
      var c = custosRef[it.produto_acabado_id];
      if(c != null){
        custo += (Number(it.qtd)||0) * c;
        valorComCusto += v;
      } else {
        custo += v * cmvPct/100;
      }
    });
    return { custo: custo, valorComCusto: valorComCusto, valorTotal: valorTotal };
  }
  var itensVendidos = itens.filter(function(it){ return !it.bonificado; });
  var itensBonif = itens.filter(function(it){ return it.bonificado; });
  var cmvGrupoVendido = cmvDoGrupo(itensVendidos);
  var cmvGrupoBonif = cmvDoGrupo(itensBonif);

  var cmv = cmvGrupoVendido.custo;
  var margemBruta = totalVendido - cmv;
  var impostos = totalVendido * impPct/100;
  var comissao = totalVendido * comissaoPct/100;
  var custoBonif = cmvGrupoBonif.custo;
  var margemContribuicao = margemBruta - impostos - comissao - custoBonif;
  var pctContribuicao = totalVendido>0 ? (margemContribuicao/totalVendido*100) : 0;
  var cmvPctEfetivo = totalVendido>0 ? (cmv/totalVendido*100) : 0;
  var pctCoberturaCustoReal = totalVendido>0 ? (cmvGrupoVendido.valorComCusto/totalVendido*100) : 0;

  var tabelasOrd = (ST.cache.propTabelas||[]).slice().sort(function(a,b){ return a.pedido_minimo - b.pedido_minimo; });
  var proxTabela = tabelasOrd.filter(function(t){ return t.pedido_minimo > totalVendido; })[0];
  var faixasOrd = (ST.cache.propFaixasBonif||[]).slice().sort(function(a,b){ return a.valor_minimo - b.valor_minimo; });
  var proxFaixaBonif = faixasOrd.filter(function(f){ return f.valor_minimo > totalVendido; })[0];

  alvo.innerHTML = '<div class="card" style="--u:#22303A"><h3 style="font-size:15px">Margem deste pedido (visão do gestor)</h3>'+
    '<label for="mgRegime">Faturado por</label><select id="mgRegime" onchange="ST.cache.propMargemRegime=this.value;ST.cache.propMargemImpostos=(this.value===\'nutrissima_real\'?23:\'\');renderPainelMargem();">'+
      '<option value="nutrissima_real"'+(ST.cache.propMargemRegime==="nutrissima_real"?" selected":"")+'>Nutríssima (Lucro Real)</option>'+
      '<option value="lbr_simples"'+(ST.cache.propMargemRegime==="lbr_simples"?" selected":"")+'>LBR (Simples Nacional)</option>'+
    '</select>'+
    '<label for="mgImpostos">% impostos sobre a venda'+((ST.cache.propCliente&&ST.cache.propCliente.uf)?' · cliente em '+esc(ST.cache.propCliente.uf):"")+'</label>'+
    '<input id="mgImpostos" type="number" step="0.1" value="'+esc(String(ST.cache.propMargemImpostos))+'" oninput="ST.cache.propMargemImpostos=this.value;renderPainelMargem();">'+
    '<label for="mgCmv">% CMV fallback (só para SKU sem custo cadastrado)</label>'+
    '<input id="mgCmv" type="number" step="0.1" value="'+cmvPct+'" oninput="ST.cache.propMargemCmv=this.value;renderPainelMargem();">'+
    '<div class="conta" style="margin-top:10px">'+
      'R$ '+brl(totalVendido)+' vendido − R$ '+brl(cmv)+' CMV ('+cmvPctEfetivo.toFixed(1)+'% efetivo) = <b>R$ '+brl(margemBruta)+' margem bruta</b><br>'+
      '− R$ '+brl(impostos)+' impostos ('+impPct+'%) − R$ '+brl(comissao)+' comissão ('+comissaoPct+'%) − R$ '+brl(custoBonif)+' custo da bonificação'+
      ' = <b>R$ '+brl(margemContribuicao)+' margem de contribuição ('+pctContribuicao.toFixed(1)+'%)</b>'+
    '</div>'+
    '<div style="font-size:12px;color:var(--tinta2);margin-top:8px">'+pctCoberturaCustoReal.toFixed(0)+'% do valor vendido usa custo real por SKU (planilha de custo sem impostos, 31/08/2026); o restante usa o % manual acima, por falta de custo cadastrado pra esse SKU. Margem líquida de verdade (depois de custo fixo — aluguel, folha etc.) não é calculável ainda: falta esse dado no sistema. O que está acima é a margem de contribuição desse pedido específico.</div>'+
    '<div style="margin-top:12px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tinta2)">Oportunidades</div>'+
    (proxTabela ? '<div style="font-size:13px;margin-top:4px">Faltam <b>R$ '+brl(Number(proxTabela.pedido_minimo)-totalVendido)+'</b> pra tabela '+esc(proxTabela.nome)+'</div>' : '<div style="font-size:13px;margin-top:4px;color:var(--tinta2)">Já está na melhor tabela de preço.</div>')+
    (proxFaixaBonif ? '<div style="font-size:13px;margin-top:2px">Faltam <b>R$ '+brl(Number(proxFaixaBonif.valor_minimo)-totalVendido)+'</b> pra '+proxFaixaBonif.qtd_potes+' pote(s) de bonificação</div>' : '')+
  '</div>';
}
function atualizarItemProposta(idx, campo, valor){
  var item = ST.cache.propItensAtual[idx];
  if(!item) return;
  item[campo] = valor;
  recalcularTotalProposta();
}
function totalItemProposta(item){
  var qtd = Number(item.qtd)||0, vu = Number(item.valor_unitario)||0, desc = Number(item.desconto_pct)||0;
  return qtd * vu * (1 - desc/100);
}
function recalcularTotalProposta(){
  var alvo = $("prTotal");
  var itens = ST.cache.propItensAtual || [];
  var totalVendido = itens.filter(function(it){ return !it.bonificado; }).reduce(function(a,it){ return a + totalItemProposta(it); }, 0);
  if(alvo) alvo.textContent = "R$ " + brl(totalVendido);
  atualizarResumoProposta();
}
function atualizarResumoProposta(){
  var res = $("prResumo");
  if(!res) return;
  var itens = ST.cache.propItensAtual || [];
  var totalVendido = itens.filter(function(it){ return !it.bonificado; }).reduce(function(a,it){ return a + totalItemProposta(it); }, 0);
  var totalBonificado = itens.filter(function(it){ return it.bonificado; }).reduce(function(a,it){ return a + totalItemProposta(it); }, 0);
  var tabela = melhorTabelaProposta(totalVendido);
  ST.cache.propTabelaAtual = tabela;

  var tabelasOrdenadas = (ST.cache.propTabelas||[]).slice().sort(function(a,b){ return Number(a.pedido_minimo)-Number(b.pedido_minimo); });
  var proxima = tabelasOrdenadas.filter(function(t){ return Number(t.pedido_minimo) > totalVendido; })[0];
  var menorMinimo = tabelasOrdenadas.length ? Number(tabelasOrdenadas[0].pedido_minimo) : null;

  var opcoesPag = condicoesPagamentoDisponiveis(ST.cache.propNumCompras||0, totalVendido);
  if(opcoesPag.indexOf(ST.cache.propCondicaoSelecionada) < 0){
    ST.cache.propCondicaoSelecionada = opcoesPag[0] || "";
  }

  var cliente = ST.cache.propCliente || {};
  var usaBoleto = ST.cache.propCondicaoSelecionada.indexOf("Boleto") === 0;
  var limiteBonificacao = totalVendido * 0.03;

  var h = '';
  if(menorMinimo !== null && totalVendido < menorMinimo){
    h += '<div class="card" style="--u:#C63A3A;font-size:13px">Pedido de R$ '+brl(totalVendido)+
      ' não atinge o pedido mínimo de R$ '+brl(menorMinimo)+' — não vai ser possível marcar como enviada.</div>';
  } else if(tabela){
    h += '<div class="card" style="--u:#3E7C45;font-size:13px">Tabela aplicada: <b>'+esc(tabela.nome)+'</b> '+
      '(pedido mínimo R$ '+brl(tabela.pedido_minimo)+')'+
      (proxima ? '<br>Faltam <b>R$ '+brl(Number(proxima.pedido_minimo)-totalVendido)+'</b> para acessar a '+esc(proxima.nome)+', com preço unitário melhor.' : '')+
      '</div>';
  }

  h += '<label for="prCondicaoSel">Condição de pagamento</label>'+
    '<select id="prCondicaoSel" onchange="ST.cache.propCondicaoSelecionada=this.value;atualizarResumoProposta()">'+
    opcoesPag.map(function(o){ return '<option value="'+esc(o)+'"'+(o===ST.cache.propCondicaoSelecionada?' selected':'')+'>'+esc(o)+'</option>'; }).join("")+
    '</select>';
  if((ST.cache.propNumCompras||0) < 3){
    h += '<div style="font-size:12px;color:var(--tinta2);margin-top:-8px">Cliente com menos de 3 compras — só à vista/cartão até a 3ª compra.</div>';
  }
  if(usaBoleto){
    h += '<div class="card" style="--u:'+(cliente.situacao_credito==='aprovado'?'#3E7C45':'#D9772B')+';font-size:13px;margin-top:8px">'+
      'Situação de crédito do cliente: <b>'+(CREDITO_ROTULO[cliente.situacao_credito]||CREDITO_ROTULO.nao_necessario)+'</b>'+
      (cliente.situacao_credito!=='aprovado' ? ' — boleto exige crédito aprovado antes do faturamento.' : '')+
      '</div>';
  }

  h += '<div class="conta" style="margin-top:12px">R$ '+brl(totalVendido)+' em itens vendidos'+
    (totalBonificado>0 ? ' &nbsp;+&nbsp; <span style="color:var(--mor)">R$ '+brl(totalBonificado)+' bonificação</span>' : '')+
    ' &nbsp;=&nbsp; <b id="prTotal">R$ '+brl(totalVendido+totalBonificado)+'</b></div>';
  h += '<div style="font-size:12px;color:var(--tinta2);margin-top:4px">Limite de bonificação (3% do vendido): R$ '+brl(limiteBonificacao)+
    (totalBonificado>limiteBonificacao ? ' <b style="color:var(--mor)">— acima do limite</b>' : '')+'</div>';
  h += '<div style="font-size:12px;color:var(--tinta2);margin-top:2px">Frete CIF · faturamento em até '+
    ($("prPrazo")?esc($("prPrazo").value||"7"):"7")+' dias · despacho no dia seguinte ao faturamento.</div>';

  res.innerHTML = h;
}
function renderItensProposta(){
  var alvo = $("prItens");
  if(!alvo) return;
  var itens = ST.cache.propItensAtual || [];
  var opcoesProduto = '<option value="">Escolha o SKU…</option>' +
    (ST.cache.produtos||[]).map(function(p){ return '<option value="'+p.id+'">'+esc(p.nome)+'</option>'; }).join("");
  alvo.innerHTML = itens.length ? itens.map(function(it, idx){
    return '<div class="card" style="--u:'+(it.bonificado?'#B8862B':'#DCD2C4')+';margin-bottom:8px">'+
      '<div style="display:grid;grid-template-columns:2fr 1fr;gap:8px">'+
        '<div><label>Produto</label><select onchange="selecionarProdutoItem('+idx+', this.value)">'+
          opcoesProduto.replace('value="'+it.produto_acabado_id+'"', 'value="'+it.produto_acabado_id+'" selected')+
        '</select></div>'+
        '<div><label>Qtd</label><input type="number" min="1" value="'+it.qtd+'" oninput="atualizarItemProposta('+idx+',\'qtd\',this.value)"></div>'+
      '</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">'+
        '<div><label>Valor unitário</label><input type="number" step="0.01" value="'+it.valor_unitario+'" oninput="atualizarItemProposta('+idx+',\'valor_unitario\',this.value)"></div>'+
        '<div><label>Desconto %</label><input type="number" step="0.1" min="0" max="100" value="'+it.desconto_pct+'" oninput="atualizarItemProposta('+idx+',\'desconto_pct\',this.value)"></div>'+
      '</div>'+
      '<label style="display:flex;align-items:center;gap:8px;margin-top:8px;text-transform:none;letter-spacing:0;font-size:13px;font-weight:500">'+
        '<input type="checkbox" style="width:auto" '+(it.bonificado?'checked':'')+' '+
          'onchange="atualizarItemProposta('+idx+',\'bonificado\',this.checked)"> Bonificação (degustação, não cobrado)'+
      '</label>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">'+
        '<span style="font-size:13px;color:var(--tinta2)">Subtotal: <b>R$ '+brl(totalItemProposta(it))+'</b></span>'+
        '<button class="s mini" onclick="removerItemProposta('+idx+')">Remover</button>'+
      '</div></div>';
  }).join("") : '<div class="vazio" style="padding:14px">Nenhum item ainda — clique em "Adicionar item".</div>';
  recalcularTotalProposta();
}
async function editarProposta(cotacaoId){
  var rC = await sb.schema("crm").from("cotacoes").select("*").eq("id", cotacaoId).single();
  if(rC.error || !rC.data){ msg("Não consegui carregar a proposta.", true); return; }
  var cot = rC.data;
  var rI = await sb.schema("crm").from("cotacao_itens")
    .select("produto_acabado_id,descricao,qtd,valor_unitario,desconto_pct,bonificado")
    .eq("cotacao_id", cotacaoId);

  ST.cache.propItensAtual = (rI.data||[]).map(function(it){
    return { produto_acabado_id: it.produto_acabado_id, descricao: it.descricao, qtd: Number(it.qtd)||0,
      valor_unitario: Number(it.valor_unitario)||0, desconto_pct: Number(it.desconto_pct)||0, bonificado: !!it.bonificado };
  });
  ST.cache.propCotacaoEditando = cotacaoId;
  ST.cache.propCotacaoAtual = cot;
  ST.cache.propCondicaoSelecionada = cot.condicao_pagamento || "";
  ST.cache.propMargemRegime = cot.regime_faturamento || "nutrissima_real";
  ST.cache.propMargemImpostos = cot.impostos_pct != null ? cot.impostos_pct : (ST.cache.propMargemRegime==="nutrissima_real" ? 23 : "");
  ST.cache.propMargemCmv = cot.cmv_pct != null ? cot.cmv_pct : 35;
  ST.cache.margemDesbloqueada = false;

  var alvoForm = $(ST.cache.propModoStandalone ? "npFormularioContainer" : "formPropostaContainer");
  if(!alvoForm){ msg("Não achei onde abrir a edição — tenta pela tela Nova proposta.", true); return; }
  alvoForm.innerHTML = htmlFormularioProposta();
  renderItensProposta();
  msg("Editando proposta #"+cot.numero+".");
  alvoForm.scrollIntoView({behavior:"smooth", block:"start"});
}
async function salvarPropostaOportunidade(){
  var itens = ST.cache.propItensAtual || [];
  if(!itens.length){ msg("Adicione ao menos um item antes de salvar.", true); return; }
  for(var i=0;i<itens.length;i++){
    if(!itens[i].produto_acabado_id){ msg("Escolha o produto de todos os itens.", true); return; }
  }
  var totalVendido = itens.filter(function(it){ return !it.bonificado; }).reduce(function(a,it){ return a + totalItemProposta(it); }, 0);
  var rep = ST.cache.propRepresentante;
  var dadosCotacao = {
    cliente_id: ST.cache.propCliente.id,
    oportunidade_id: ST.cache.propOportunidadeId,
    contato_id: $("prContato").value || null,
    validade: $("prValidade").value || null,
    condicao_pagamento: ST.cache.propCondicaoSelecionada || null,
    frete: $("prFrete").value.trim() || "CIF",
    prazo_faturamento_dias: Number($("prPrazo").value) || 7,
    situacao_credito: ST.cache.propCliente.situacao_credito || "nao_necessario",
    tabela_preco_id: ST.cache.propTabelaAtual ? ST.cache.propTabelaAtual.id : null,
    representante_id: rep ? rep.id : null,
    comissao_pct_aplicada: rep ? rep.comissao_pct : null,
    regime_faturamento: ST.cache.propMargemRegime || "nutrissima_real",
    impostos_pct: (ST.cache.propMargemImpostos !== undefined && ST.cache.propMargemImpostos !== "") ? Number(ST.cache.propMargemImpostos) : null,
    cmv_pct: ST.cache.propMargemCmv !== undefined ? Number(ST.cache.propMargemCmv) : 35,
    observacoes: $("prObs").value.trim() || null,
    valor_total: totalVendido,
    status: "rascunho"
  };

  var cotacaoId, editando = !!ST.cache.propCotacaoEditando;
  if(editando){
    cotacaoId = ST.cache.propCotacaoEditando;
    var rU = await sb.schema("crm").from("cotacoes").update(dadosCotacao).eq("id", cotacaoId);
    if(rU.error){ msg("Não consegui atualizar a proposta: "+rU.error.message, true); return; }
    var rD = await sb.schema("crm").from("cotacao_itens").delete().eq("cotacao_id", cotacaoId);
    if(rD.error){ msg("Não consegui limpar os itens antigos: "+rD.error.message, true); return; }
  } else {
    var rC = await sb.schema("crm").from("cotacoes").insert(dadosCotacao).select("id").single();
    if(rC.error){ msg("Não consegui salvar a proposta: "+rC.error.message, true); return; }
    cotacaoId = rC.data.id;
  }
  var linhas = itens.map(function(it){
    return {
      cotacao_id: cotacaoId, produto_acabado_id: it.produto_acabado_id, descricao: it.descricao,
      qtd: Number(it.qtd)||0, valor_unitario: Number(it.valor_unitario)||0, desconto_pct: Number(it.desconto_pct)||0,
      bonificado: !!it.bonificado
    };
  });
  var rI = await sb.schema("crm").from("cotacao_itens").insert(linhas);
  if(rI.error){ msg("Proposta salva, mas os itens falharam: "+rI.error.message, true); return; }
  ST.cache.propCotacaoEditando = null;
  msg(editando ? "Proposta atualizada." : "Proposta salva como rascunho.");
  if(ST.cache.propModoStandalone){
    var fAlvo = $("npFormularioContainer");
    if(fAlvo) fAlvo.innerHTML = '<div class="card" style="--u:#3E7C45">Proposta '+(editando?"atualizada":"salva")+'.'+
      '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">'+
        '<button class="b" onclick="baixarPdfProposta(\''+cotacaoId+'\')">📄 Baixar PDF</button>'+
        '<button class="s" onclick="editarProposta(\''+cotacaoId+'\')">✏️ Editar</button>'+
        '<button class="s" onclick="telaNovaProposta()">+ Nova proposta</button>'+
      '</div></div>';
    return;
  }
  var opId = ST.cache.propOportunidadeId, cliId = ST.cache.propCliente.id, tit = ST.cache.propTitulo;
  await carregarOportunidades(); // atualiza o badge de propostas no card
  abrirNovaProposta(opId, cliId, tit); // reabre já com a proposta nova na lista
}
async function enviarProposta(cotacaoId){
  var r = await sb.schema("crm").from("cotacoes").update({ status: "enviada" }).eq("id", cotacaoId);
  if(r.error){
    msg(r.error.message.indexOf("mínimo") >= 0 ? r.error.message : "Não deu para marcar como enviada: "+r.error.message, true);
    return;
  }
  msg("Proposta marcada como enviada.");
  var opId = ST.cache.propOportunidadeId, cliId = ST.cache.propCliente.id, tit = ST.cache.propTitulo;
  abrirNovaProposta(opId, cliId, tit);
}

async function baixarPdfProposta(cotacaoId, opts){
  opts = opts || {};
  if(typeof window.jspdf === "undefined"){ msg("Não consegui gerar o PDF.", true); return null; }
  var rC = await sb.schema("crm").from("cotacoes")
    .select("id,numero,status,cliente_id,data_cotacao,validade,condicao_pagamento,frete,prazo_faturamento_dias,situacao_credito,tabela_preco_id,representante_id,comissao_pct_aplicada,valor_total,observacoes")
    .eq("id", cotacaoId).single();
  if(rC.error || !rC.data){ msg("Não consegui carregar a proposta.", true); return null; }
  var cot = rC.data;
  var rCli = await sb.from("clientes")
    .select("razao_social,nome_fantasia,documento,tipo_doc,ie,cep,logradouro,numero,complemento,bairro,municipio,uf")
    .eq("id", cot.cliente_id).single();
  /* contato do cliente no PDF (19/11/2026): decisor primeiro, depois quem tem telefone/e-mail */
  var rCt = await sb.schema("crm").from("contatos").select("nome,telefone,email,decisor").eq("cliente_id", cot.cliente_id).eq("ativo", true);
  var contatoPdf = (rCt.data||[]).filter(function(c){ return c.telefone || c.email; })
    .sort(function(a,b){ return (b.decisor?1:0) - (a.decisor?1:0); })[0] || null;
  var rI = await sb.schema("crm").from("cotacao_itens")
    .select("descricao,qtd,valor_unitario,desconto_pct,bonificado").eq("cotacao_id", cotacaoId);
  var itens = rI.data || [];
  var clienteNome = (rCli.data && rCli.data.razao_social) || "cliente";

  var tabela = null;
  if(cot.tabela_preco_id){
    var rT = await sb.schema("crm").from("tabelas_preco").select("nome,pedido_minimo").eq("id", cot.tabela_preco_id).single();
    tabela = rT.data || null;
  }

  var vendidos = itens.filter(function(it){ return !it.bonificado; });
  var bonificados = itens.filter(function(it){ return it.bonificado; });
  var totalBonif = bonificados.reduce(function(a,it){ return a + (Number(it.qtd)||0)*(Number(it.valor_unitario)||0)*(1-(Number(it.desconto_pct)||0)/100); }, 0);

  var doc = new window.jspdf.jsPDF();
  try{ doc.addImage(LOGO_NUTRISSIMA, "PNG", 150, 7, 46, 18); }catch(eLogo){ /* sem logo, segue o PDF */ }
  doc.setFontSize(16); doc.text((opts.titulo || "Proposta comercial")+" #"+cot.numero, 14, 18);
  doc.setFontSize(10);
  /* bloco do cliente: CNPJ, endereço e contato (pedido do dono, 19/11/2026) */
  var cli = rCli.data || {};
  var dd = digitos(cli.documento);
  var docFmt = dd.length === 14 ? dd.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, "$1.$2.$3/$4-$5")
             : dd.length === 11 ? dd.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, "$1.$2.$3-$4") : (cli.documento || "");
  var cepD = digitos(cli.cep), cepFmt = cepD.length === 8 ? cepD.replace(/^(\d{5})(\d{3})$/, "$1-$2") : (cli.cep || "");
  var end = [
    [cli.logradouro, cli.numero].filter(Boolean).join(", "),
    cli.complemento, cli.bairro,
    [cli.municipio, cli.uf].filter(Boolean).join("/"),
    cepFmt ? "CEP "+cepFmt : ""
  ].filter(function(x){ return x && String(x).trim(); }).join(" – ");
  var linhasCli = [];
  linhasCli.push("Cliente: "+clienteNome+(cli.nome_fantasia && cli.nome_fantasia !== clienteNome ? " ("+cli.nome_fantasia+")" : ""));
  linhasCli.push((dd.length === 11 ? "CPF: " : "CNPJ: ")+(docFmt || "—")+(cli.ie ? "   IE: "+cli.ie : ""));
  linhasCli.push("Endereço: "+(end || "—"));
  linhasCli.push("Contato: "+(contatoPdf
    ? [contatoPdf.nome, contatoPdf.telefone, contatoPdf.email].filter(Boolean).join(" · ")
    : "—"));
  var yCli = 30;
  linhasCli.forEach(function(t){
    var partes = doc.splitTextToSize(t, 182);
    doc.text(partes, 14, yCli);
    yCli += 5 * partes.length;
  });
  doc.text("Data: "+dataBR(cot.data_cotacao)+(cot.validade?"   Válida até: "+dataBR(cot.validade):""), 14, yCli + 1);

  var linhas = vendidos.map(function(it){
    var vu = Number(it.valor_unitario)||0, qtd = Number(it.qtd)||0, desc = Number(it.desconto_pct)||0;
    var tot = qtd*vu*(1-desc/100);
    return [it.descricao||"—", String(qtd), "R$ "+brl(vu), (desc||0)+"%", "R$ "+brl(tot)];
  });
  doc.autoTable({
    startY: yCli + 8, head: [["Produto","Qtd","V. unit.","Desc.","Total"]], body: linhas,
    styles: { fontSize: 9 }, headStyles: { fillColor: [34,48,58] }
  });
  var y = (doc.lastAutoTable ? doc.lastAutoTable.finalY : 60) + 8;

  if(bonificados.length){
    doc.setFontSize(10); doc.text("Bonificação (degustação):", 14, y); y += 5;
    var linhasBonif = bonificados.map(function(it){
      return [it.descricao||"—", String(Number(it.qtd)||0), "R$ "+brl((Number(it.qtd)||0)*(Number(it.valor_unitario)||0))];
    });
    doc.autoTable({
      startY: y, head: [["Produto","Qtd","Valor (não cobrado)"]], body: linhasBonif,
      styles: { fontSize: 9 }, headStyles: { fillColor: [184,134,43] }
    });
    y = (doc.lastAutoTable ? doc.lastAutoTable.finalY : y) + 8;
  }

  doc.setFontSize(12);
  doc.text("Total: R$ "+brl(cot.valor_total), 14, y); y += 10;

  doc.setFillColor(34,48,58);
  doc.rect(14, y-5, 182, 7, "F");
  doc.setTextColor(255,255,255); doc.setFontSize(11);
  doc.text("Tabela e Condições Comerciais", 16, y);
  doc.setTextColor(0,0,0); doc.setFontSize(9.5);
  y += 8;
  /* Valor cheio (cartão/boleto) = itens vendidos sem o desconto à vista; PIX = 5% a menos (ou o total gravado, se já é PIX). */
  var cf = condicaoEForma(cot.condicao_pagamento);
  var valorCheio = itens.filter(function(it){ return !it.bonificado; }).reduce(function(a,it){
    return a + Math.round((Number(it.qtd)||0)*(Number(it.valor_unitario)||0)*100)/100; }, 0);
  var valorPix = Math.round(valorCheio*(1-PIX_DESCONTO_PCT/100)*100)/100;
  /* pedido já em PIX e gravado com desconto (tela de Pedidos): vale o total gravado */
  if(cot.condicao_pagamento === COND_PIX && Number(cot.valor_total) > 0 && Number(cot.valor_total) < valorCheio) valorPix = Number(cot.valor_total);
  var linhasCondicoes = [
    ["Valor total do pedido", "R$ "+brl(valorCheio)+" (cartão ou boleto)"],
    ["Valor total à vista no PIX", "R$ "+brl(valorPix)+" ("+PIX_DESCONTO_PCT+"% de desconto)"],
    ["Condição de pagamento", cf.condicao],
    ["Forma de pagamento", cf.forma],
    ["Situação de crédito", CREDITO_ROTULO[cot.situacao_credito] || "Não necessário"],
    ["Frete", cot.frete || "CIF"],
    ["Prazo de faturamento", "até "+(cot.prazo_faturamento_dias!=null?cot.prazo_faturamento_dias:7)+" dias após confirmação e liberação financeira"],
    ["Despacho", "dia seguinte ao faturamento"],
    ["Bonificação (degustação)", bonificados.length ? "R$ "+brl(totalBonif) : "nenhuma"],
    ["Validade da proposta", cot.validade ? dataBR(cot.validade) : "—"]
  ];
  /* Pedido (já virou pedido, ou PDF "Pedido para aprovação"): sem situação de crédito, prazo de faturamento e validade
     (pedido do dono, 19/11/2026). Orçamento/proposta mantém as três linhas. */
  var ehPedido = Boolean(opts.titulo) || ["rascunho","enviada","aceita","recusada","expirada"].indexOf(cot.status) < 0;
  if(ehPedido){
    var foraDoPedido = ["Situação de crédito","Prazo de faturamento","Validade da proposta"];
    linhasCondicoes = linhasCondicoes.filter(function(l){ return foraDoPedido.indexOf(l[0]) < 0; });
  }
  doc.autoTable({
    startY: y, body: linhasCondicoes, theme: "plain",
    styles: { fontSize: 9.5, cellPadding: 1.5 },
    columnStyles: { 0: { fontStyle: "bold", cellWidth: 60 } }
  });
  y = (doc.lastAutoTable ? doc.lastAutoTable.finalY : y) + 8;

  if(cot.observacoes){ doc.setFontSize(10); var obsL = doc.splitTextToSize("Obs.: "+cot.observacoes, 182); doc.text(obsL, 14, y); y += obsL.length*5 + 4; }
  if(opts.rodape){ doc.setFontSize(10); doc.setFont(undefined, "bold"); doc.text(doc.splitTextToSize(opts.rodape, 182), 14, y); doc.setFont(undefined, "normal"); }
  var nomePdf = (opts.titulo ? "pedido" : "proposta")+"-"+cot.numero+"-"+clienteNome.replace(/[^a-zA-Z0-9]+/g,"-")+".pdf";
  if(opts.blob) return { blob: doc.output("blob"), nome: nomePdf };
  doc.save(nomePdf);
  return true;
}

/* ================= representantes ================= */
/* ===== PEDIDO DE VENDA → UPSELLER (18/09/2026, refeito 07/10/2026) ==========
   Carteira = o fluxo inteiro num lugar só:
     1 Orçamentos  → gerar, ver, editar, marcar enviado, gerar pedido
     2 Pedidos     → ficha UpSeller (todas as colunas da planilha) → faturar
     3 Faturados   → baixar de novo, reabrir se a UpSeller recusou
   Ficha: crm.pedido_upseller (campos por LETRA de coluna da planilha).
   Campo vazio = automático (cadastro, cálculo ou padrão). A ficha mais recente
   do cliente (e, para campos de operação, a mais recente de qualquer cliente)
   pré-preenche o próximo pedido — o operador não repete o que já digitou.
   Nada trava: faltando obrigatório, o app avisa e o operador decide. */

var UPS_LOJA = "Loja Padrão";
/* Empresa que fatura = loja da UpSeller (coluna B "Nome da Loja"). Nomes exatos como estão na
   UpSeller, informados pelo dono em 19/11/2026. A Talita escolhe no passo 4 do pedido. */
var UPS_LOJAS = [ { emp:"Nutríssima", loja:"Nutrissima Fisica" }, { emp:"LBR", loja:"Loja Padrão" } ];
function lojaEmpresa(loja){ var x = UPS_LOJAS.filter(function(l){ return l.loja === loja; })[0]; return x ? x.emp : ""; }
var UF_EXTENSO = {AC:"Acre",AL:"Alagoas",AP:"Amapá",AM:"Amazonas",BA:"Bahia",CE:"Ceará",
  DF:"Distrito Federal",ES:"Espírito Santo",GO:"Goiás",MA:"Maranhão",MT:"Mato Grosso",

function somaDiasISO(iso, d){
  var p = String(iso).split("-");
  var dt = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
  dt.setDate(dt.getDate() + (Number(d)||0));

/* Parcelas: a condição é texto ("Boleto 28 dias", "À vista",
   "Cartão em até 3x sem juros"). Cartão não vira boleto — vira 1 lançamento
   na data do faturamento, com a observação dizendo que foi no cartão. */
function calcularParcelas(cond, total, dataBase){
  var txt = String(cond||"");
  var cartao = /cart/i.test(txt);
  /* PIX/à vista: 1 lançamento na emissão (o "5%" do texto não é prazo). Só conta número antes do parêntese. */
  var aVista = /pix|vista/i.test(txt);
  var prazos = (cartao || aVista) ? [0] : (txt.split("(")[0].match(/\d+/g)||[]).map(Number).filter(function(n){ return n > 0; });
  if(!prazos.length) prazos = [0];
  var n = prazos.length;
  var cent = Math.round((Number(total)||0)*100);
  var base = Math.floor(cent/n), out = [];
  for(var i=0;i<n;i++){
    var v = (i === n-1) ? (cent - base*(n-1)) : base;
    out.push({
      numero_parcela: i+1, total_parcelas: n, prazo_dias: prazos[i],
      valor: v/100, vencimento: somaDiasISO(dataBase, prazos[i])
    });
  }
  return out;
}
function textoObservacaoPagamento(cond, parcelas, numped){
  var t = "PAGAMENTO: "+String(cond||"a combinar").toUpperCase();
  if(parcelas.length === 1 && !parcelas[0].prazo_dias){
    t += " — R$ "+brl(parcelas[0].valor)+" NA EMISSAO";
  }else{
    t += " — "+parcelas.length+"x: "+parcelas.map(function(p){
      return "R$ "+brl(p.valor)+" venc. "+dataBR(p.vencimento);
    }).join(" · ");
  }
  return t+". PEDIDO ERP "+numped+".";
}

/* ---------- carregar pedido + ficha + memória ---------- */
async function carregarPedido(cotacaoId){
  var rC = await sb.schema("crm").from("cotacoes")
    .select("id,numero,cliente_id,oportunidade_id,status,condicao_pagamento,frete,valor_total,numero_pedido_loja,faturado_em,faturado_por,arquivo_exportacao")
    .eq("id", cotacaoId).single();
  if(rC.error || !rC.data) return null;
  var cot = rC.data;
  var rCli = await sb.from("clientes")
    .select("id,razao_social,nome_fantasia,documento,tipo_doc,ie,cep,uf,municipio,bairro,numero,logradouro,complemento")
    .eq("id", cot.cliente_id).single();
  var rI = await sb.schema("crm").from("cotacao_itens")
    .select("produto_acabado_id,descricao,qtd,valor_unitario,desconto_pct,bonificado")
    .eq("cotacao_id", cot.id);
  var itens = rI.data || [];
  var ids = itens.map(function(i){ return i.produto_acabado_id; }).filter(Boolean);
  var sku = {}, peso = {}, linhaP = {}, nomeP = {};
  if(ids.length){
    /* vigente = o código de hoje na loja. Um produto tem vários códigos históricos
       (até 4) sob a mesma plataforma; filtrar por plataforma pegaria um qualquer. */
    var rS = await sb.from("depara_sku").select("codigo,produto_acabado_id")
      .eq("vigente", true).in("produto_acabado_id", ids);
    (rS.data||[]).forEach(function(s){ sku[s.produto_acabado_id] = s.codigo; });
    var rP = await sb.from("produto_acabado").select("id,peso_pote_kg,linha,nome").in("id", ids);
    (rP.data||[]).forEach(function(p){ peso[p.id] = Number(p.peso_pote_kg)||0; linhaP[p.id] = p.linha||""; nomeP[p.id] = p.nome||""; });
  }
  var rCt = await sb.schema("crm").from("contatos").select("telefone")
    .eq("cliente_id", cot.cliente_id).eq("ativo", true).limit(1);

  /* ficha deste pedido, última ficha do cliente, última ficha de qualquer cliente */
  var rF = await sb.schema("crm").from("pedido_upseller").select("campos,itens,atualizado_em,atualizado_por")
    .eq("cotacao_id", cot.id).maybeSingle();
  var rMc = await sb.schema("crm").from("pedido_upseller").select("campos")
    .eq("cliente_id", cot.cliente_id).neq("cotacao_id", cot.id)
    .order("atualizado_em", {ascending:false}).limit(1);
  var rMg = await sb.schema("crm").from("pedido_upseller").select("campos")
    .neq("cotacao_id", cot.id).order("atualizado_em", {ascending:false}).limit(1);

  return { cot:cot, cli:rCli.data||{}, itens:itens, sku:sku, peso:peso, linhaP:linhaP, nomeP:nomeP,
           tel:((rCt.data||[])[0]||{}).telefone || "",
           ficha: rF.data || null,
           memCli: ((rMc.data||[])[0]||{}).campos || {},
           memGer: ((rMg.data||[])[0]||{}).campos || {},
           fichaErro: rF.error ? rF.error.message : "" };
}

function itensVendaveis(P){ return P.itens.filter(function(it){ return !it.bonificado; }); }
function totalCobradoPedido(P){
  return itensVendaveis(P).reduce(function(s,it){
    return s + precoLiquidoItem(it)*(Number(it.qtd)||0);
  }, 0);
}
function pesoCalculadoG(P){
  return Math.round(itensVendaveis(P).reduce(function(s,it){
    return s + (P.peso[it.produto_acabado_id]||0)*(Number(it.qtd)||0)*1000;
  }, 0));
}
function pagtoPelaCondicao(cond){
  var t = String(cond||"");
  if(/cart.*d[eé]bito/i.test(t)) return "Cartão de Débito";
  if(/cart/i.test(t)) return "Cartão de Crédito";
  if(/pix/i.test(t)) return "PIX";
  if(/transf|ted|dep[oó]sito/i.test(t)) return "Transferência Bancária";
  return "Outros";
}
function freteCodigoPelaProposta(frete){
  var f = String(frete||"CIF").toUpperCase();
  if(f.indexOf("FOB") >= 0) return "1";
  if(f.indexOf("SEM") >= 0) return "9";
  return "0";
}

/* Valor sugerido de cada coluna, na ordem: ficha deste pedido → cadastro do
   cliente (campos 'cad') → memória do cliente → memória geral (só 'mem') → padrão. */
function valorSugerido(P, f){
  var fic = (P.ficha && P.ficha.campos) || {};
  if(fic[f.c] != null && fic[f.c] !== "") return String(fic[f.c]);
  var c = P.cli || {};
  if(f.c === "C") return P.cot.numero_pedido_loja || numeroPedidoLoja(P.cot.numero);
  if(f.o === "cad"){
    var v = c[f.k];
    if(f.c === "H"){ v = String(c.tipo_doc||"").toUpperCase().indexOf("CPF") >= 0 ? "CPF" : (c.documento ? (digitos(c.documento).length === 11 ? "CPF" : "CNPJ") : ""); }
    if(f.c === "I") v = digitos(c.documento||"");
    if(f.c === "M") v = c.uf ? ufExtenso(c.uf) : "";
    if(v) return String(v);
    if(P.memCli[f.c]) return String(P.memCli[f.c]);
    return "";
  }
  if(f.o === "mem"){
    if(P.memCli[f.c] != null && P.memCli[f.c] !== "") return String(P.memCli[f.c]);
    var geral = ["B","E","S","X","Z","AE","AF","AG","AH","AI","AJ","AK","AL","AM","AN"];
    if(geral.indexOf(f.c) >= 0 && P.memGer[f.c] != null && P.memGer[f.c] !== "") return String(P.memGer[f.c]);
  }
  if(f.c === "B") return UPS_LOJA;
  if(f.c === "E") return "SIM";
  if(f.c === "G") return P.tel || "";
  if(f.c === "W") return freteCodigoPelaProposta(P.cot.frete);
  if(f.c === "AO") return pagtoPelaCondicao(P.cot.condicao_pagamento);
  return "";
}
/* valor que vai na planilha (peso vazio = calculado) */
function valorFinal(P, f){
  var v = valorSugerido(P, f);
  if((f.c === "AC" || f.c === "AD") && !v){ var g = pesoCalculadoG(P); return g > 0 ? String(g) : ""; }
  return v;
}
function skuItem(P, it){
  var fi = (P.ficha && P.ficha.itens) || {};
  var x = fi[it.produto_acabado_id];
  if(x && x.T) return String(x.T);
  return P.sku[it.produto_acabado_id] || "";
}

/* O que falta, por nível. Não trava nada: serve para avisar. */
function pendenciasPedido(P){
  var nfe = valorFinal(P, {c:"E", o:"mem"}) !== "NÃO";
  var falta = { S:[], N:[], R:[] };
  UPS_CAMPOS.forEach(function(f){
    if(f.n === "O") return;
    if((f.n === "N" || f.n === "R") && !nfe) return;
    if(!valorFinal(P, f)) falta[f.n].push(f.r);
  });
  var semSku = itensVendaveis(P).filter(function(it){ return !skuItem(P, it); });
  if(semSku.length) falta.S.push(semSku.length+" item(ns) sem SKU UpSeller");
  if(!itensVendaveis(P).length) falta.S.push("nenhum item cobrado");
  return falta;
}
function resumoPendencias(p){
  var t = [];
  if(p.S.length) t.push(p.S.length+" obrigatório(s)");
  if(p.N.length) t.push(p.N.length+" obrigatório(s) p/ NF-e");
  if(p.R.length) t.push(p.R.length+" recomendado(s)");
  return t.join(" · ");
}

/* ---------- planilha ---------- */
function linhasUpseller(P, parcelas){
  var numped = P.cot.numero_pedido_loja || numeroPedidoLoja(P.cot.numero);
  var obsAuto = textoObservacaoPagamento(P.cot.condicao_pagamento, parcelas, numped);
  var obsExtra = valorSugerido(P, {c:"D", o:"ped"});
  var obs = obsExtra ? obsAuto+" "+obsExtra : obsAuto;
  return itensVendaveis(P).map(function(it, idx){
    var L = []; for(var i=0;i<44;i++) L.push("");
    UPS_CAMPOS.forEach(function(f){
      if(f.um && idx > 0) return;
      var v = f.c === "D" ? obs : valorFinal(P, f);
      if(v === "") return;
      if(f.t === "num"){ var n = Number(String(v).replace(",", ".")); L[colIdx(f.c)] = isNaN(n) ? v : n; }
      else L[colIdx(f.c)] = v;
    });
    L[colIdx("T")] = skuItem(P, it);
    L[colIdx("U")] = Number(it.qtd)||0;
    L[colIdx("V")] = precoLiquidoItem(it);
    return L;
  }).concat(linhasBonificacaoUpseller(P));
}
/* Bonificação (17/11/2026): sai como OUTRO pedido na mesma planilha (NUT-000123-B), para a
   UpSeller emitir nota própria (CFOP 5.910/6.910, configurado lá). O pote vira um dos dois SKUs
   genéricos de degustação (pastas / cremes); quantidade somada por SKU; valor = preço de tabela
   (nunca zerado). Peso calculado só dos bonificados; volumes e medidas ficam no pedido de venda. */
function linhasBonificacaoUpseller(P){
  var bon = P.itens.filter(function(it){ return it.bonificado && (Number(it.qtd)||0) > 0; });
  if(!bon.length) return [];
  var ag = {}, ordem = [], pesoG = 0;
  bon.forEach(function(it){
    var pid = it.produto_acabado_id;
    var sku = UPS_SKU_DEGUST[grupoDegustacao((P.linhaP||{})[pid], (P.nomeP||{})[pid] || it.descricao)];
    if(!ag[sku]){ ag[sku] = { qtd:0, valor:0 }; ordem.push(sku); }
    ag[sku].qtd += Number(it.qtd)||0;
    ag[sku].valor += (Number(it.qtd)||0)*(Number(it.valor_unitario)||0);
    pesoG += ((P.peso||{})[pid]||0)*(Number(it.qtd)||0)*1000;
  });
  var base = P.cot.numero_pedido_loja || numeroPedidoLoja(P.cot.numero);
  var numped = base+"-B";
  var obs = "MERCADORIA ENVIADA A TITULO DE BONIFICACAO. NAO GERA DIREITO A CREDITO/DEBITO FINANCEIRO. REF. PEDIDO "+base+".";
  return ordem.map(function(sku, idx){
    var L = []; for(var i=0;i<44;i++) L.push("");
    UPS_CAMPOS.forEach(function(f){
      if(f.um && idx > 0) return;
      if(["AB","AE","AF","AG","AP","AQ","AR"].indexOf(f.c) >= 0) return;
      var v;
      if(f.c === "C") v = numped;
      else if(f.c === "D") v = obs;
      else if(f.c === "AO") v = "Outros";
      else if(f.c === "AC" || f.c === "AD") v = pesoG > 0 ? String(Math.round(pesoG)) : "";
      else v = valorFinal(P, f);
      if(v === "" || v == null) return;
      if(f.t === "num"){ var n = Number(String(v).replace(",", ".")); L[colIdx(f.c)] = isNaN(n) ? v : n; }
      else L[colIdx(f.c)] = v;
    });
    var a = ag[sku];
    L[colIdx("T")] = sku;
    L[colIdx("U")] = a.qtd;
    L[colIdx("V")] = Math.round(a.valor/a.qtd*100)/100;
    return L;
  });
}
function gerarXlsxUpseller(linhas, nomeArquivo){
  if(typeof XLSX === "undefined") throw new Error("biblioteca de planilha não carregou");
  var aoa = [[UPS_OBS], UPS_CAT.slice(), UPS_CAB.slice()];
  linhas.forEach(function(l){ aoa.push(l); });
  var ws = XLSX.utils.aoa_to_sheet(aoa);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "order_");

}

/* ---------- estados ---------- */
async function gerarPedido(cotacaoId){
  var r = await sb.schema("crm").from("cotacoes").select("numero,status").eq("id", cotacaoId).single();
  if(r.error || !r.data){ msg("Não consegui abrir o orçamento.", true); return; }
  var st = r.data.status;
  if(["recusada","expirada"].indexOf(st) >= 0){ msg("Orçamento recusado ou expirado não vira pedido.", true); return; }
  if(["rascunho","enviada","aceita"].indexOf(st) < 0){ msg("Esse orçamento já virou pedido.", true); return; }
  if(!confirm("Gerar o pedido "+numeroPedidoLoja(r.data.numero)+"?\n\nDepois disso itens e preços ficam congelados."+
     (st === "rascunho" ? "\n\nO orçamento ainda é rascunho: ele será marcado como enviado (confere o pedido mínimo)." : ""))) return;
  if(st === "rascunho"){
    var e = await sb.schema("crm").from("cotacoes").update({ status:"enviada" }).eq("id", cotacaoId).select("id");
    if(e.error){ msg(e.error.message.indexOf("mínimo") >= 0 ? e.error.message : "Não deu para gerar o pedido: "+e.error.message, true); return; }
    if(!(e.data||[]).length){ msg("O banco não aceitou a mudança (nenhuma linha alterada).", true); return; }
  }
  var u = await sb.schema("crm").from("cotacoes").update({
    status: "pedido",
    numero_pedido_loja: numeroPedidoLoja(r.data.numero),
    pedido_gerado_em: new Date().toISOString()
  }).eq("id", cotacaoId).select("id");
  if(u.error){ msg("Não deu para gerar o pedido: "+u.error.message, true); return; }
  if(!(u.data||[]).length){ msg("O banco não aceitou a mudança (nenhuma linha alterada).", true); return; }
  msg("Pedido "+numeroPedidoLoja(r.data.numero)+" gerado. Preencha os dados UpSeller e fature.");
  CART.aberto = cotacaoId;
  if(telaAtual === "carteira") telaCarteira(); else ir("carteira");
}
async function voltarParaProposta(cotacaoId){
  if(!confirm("Voltar este pedido para orçamento? Ele sai da fila de faturamento. Os dados UpSeller ficam guardados.")) return;
  var u = await sb.schema("crm").from("cotacoes")
    .update({ status:"enviada", numero_pedido_loja:null, pedido_gerado_em:null }).eq("id", cotacaoId).select("id");
  if(u.error || !(u.data||[]).length){ msg("Não consegui voltar: "+(u.error ? u.error.message : "nenhuma linha alterada"), true); return; }
  msg("Voltou para orçamento."); voltarTelaPedidoOuCarteira();
}
/* Reabrir: a UpSeller recusou a importação → volta a "pedido" para corrigir e faturar de novo. */
async function reabrirFaturamento(cotacaoId){
  if(!confirm("Reabrir este pedido?\n\nUse quando a UpSeller recusou a importação. As parcelas calculadas são apagadas e ele volta para \"a faturar\".")) return;
  var d = await sb.schema("crm").from("pedido_parcela").delete().eq("cotacao_id", cotacaoId);
  if(d.error){ msg("Não consegui apagar as parcelas: "+d.error.message, true); return; }
  var u = await sb.schema("crm").from("cotacoes")
    .update({ status:"pedido", faturado_em:null, faturado_por:null, arquivo_exportacao:null })
    .eq("id", cotacaoId).eq("status","exportado").select("id");
  if(u.error || !(u.data||[]).length){ msg("Não consegui reabrir: "+(u.error ? u.error.message : "nenhuma linha alterada"), true); return; }
  msg("Reaberto. Corrija os dados e fature de novo."); CART.aberto = cotacaoId; voltarTelaPedidoOuCarteira();
}
async function marcarEnviadoCarteira(cotacaoId){
  var r = await sb.schema("crm").from("cotacoes").update({ status:"enviada" }).eq("id", cotacaoId).select("id");
  if(r.error){ msg(r.error.message.indexOf("mínimo") >= 0 ? r.error.message : "Não deu para marcar como enviado: "+r.error.message, true); return; }

async function editarDaCarteira(cotacaoId){

/* FATURAR: gera o arquivo primeiro; só grava o estado depois que ele saiu.
   Não recusa pedido incompleto: avisa e deixa o operador decidir. */
async function faturarPedidos(ids){
  if(!ids || !ids.length){ msg("Marque os pedidos que vão ser faturados.", true); return; }
  var hoje = hojeISO(), pacote = [], avisos = [];
  for(var i=0;i<ids.length;i++){
    var P = await carregarPedido(ids[i]);
    if(!P){ msg("Não consegui abrir um dos pedidos. Nada foi faturado.", true); return; }
    if(P.cot.status !== "pedido"){ continue; }
    var pend = pendenciasPedido(P);
    var numped = P.cot.numero_pedido_loja || numeroPedidoLoja(P.cot.numero);
    if(pend.S.length || pend.N.length){
      avisos.push(numped+": falta "+pend.S.concat(pend.N).join(", "));
    }
    var total = totalCobradoPedido(P);
    pacote.push({ P:P, parcelas: calcularParcelas(P.cot.condicao_pagamento, total, hoje), total: total });
  }
  if(!pacote.length){ msg("Nenhum pedido a faturar na seleção.", true); return; }
  var pergunta = "Faturar "+pacote.length+" pedido(s) com data de hoje ("+dataBR(hoje)+")?\n\nOs vencimentos serão calculados a partir dessa data.";
  if(avisos.length){
    pergunta += "\n\n⚠️ A UpSeller deve RECUSAR na importação:\n• "+avisos.join("\n• ")+
      "\n\nSe recusar, use \"Reabrir\" na Carteira, complete e fature de novo.\n\nFaturar assim mesmo?";
  }
  if(!confirm(pergunta)) return;

  var linhas = [];
  pacote.forEach(function(x){ linhas = linhas.concat(linhasUpseller(x.P, x.parcelas)); });
  var nome = "upseller_"+hoje.replace(/-/g,"")+"_"+pacote.length+"pedido"+(pacote.length>1?"s":"")+".xlsx";
  try{ gerarXlsxUpseller(linhas, nome); }
  catch(e){ msg("Não consegui gerar a planilha: "+e.message+". Nada foi marcado como faturado.", true); return; }

  var falhas = [];
  for(var j=0;j<pacote.length;j++){
    var x = pacote[j], id = x.P.cot.id;
    await sb.schema("crm").from("pedido_parcela").delete().eq("cotacao_id", id);
    var rows = x.parcelas.map(function(p){
      return { cotacao_id:id, numero_parcela:p.numero_parcela, total_parcelas:p.total_parcelas,
               prazo_dias:p.prazo_dias, valor:p.valor, vencimento:p.vencimento,
               status:"aberta", criado_por:ST.email,
               observacao:String(x.P.cot.condicao_pagamento||"") };
    });
    var rp = await sb.schema("crm").from("pedido_parcela").insert(rows).select("id");
    var ru = await sb.schema("crm").from("cotacoes").update({
      status:"exportado", faturado_em:hoje, faturado_por:ST.email, arquivo_exportacao:nome
    }).eq("id", id).select("id");
    if(rp.error || ru.error || !(ru.data||[]).length) falhas.push(x.P.cot.numero_pedido_loja || ("#"+x.P.cot.numero));
  }
  var t = "Planilha gerada: "+nome+" · "+pacote.length+" pedido(s), "+linhas.length+" linha(s).";
  if(falhas.length) t += " ATENÇÃO: o arquivo saiu, mas não consegui gravar o estado de "+falhas.join(", ")+" — confira antes de importar.";
  msg(t, falhas.length ? true : false);
  CART.sel = {};
  voltarTelaPedidoOuCarteira();
}

/* Baixar de novo o MESMO arquivo: não recalcula parcelas, lê as gravadas. */
async function baixarPlanilhaNovamente(cotacaoId){
  var P = await carregarPedido(cotacaoId);
  if(!P){ msg("Não consegui abrir o pedido.", true); return; }
  var rp = await sb.schema("crm").from("pedido_parcela")
    .select("numero_parcela,total_parcelas,prazo_dias,valor,vencimento")
    .eq("cotacao_id", cotacaoId).order("numero_parcela");
  var parcelas = rp.data || [];
  if(!parcelas.length){ msg("Esse pedido não tem parcelas gravadas.", true); return; }
  try{ gerarXlsxUpseller(linhasUpseller(P, parcelas), P.cot.arquivo_exportacao || ("upseller_"+P.cot.numero_pedido_loja+".xlsx")); }
  catch(e){ msg("Não consegui gerar: "+e.message, true); return; }
  msg("Arquivo gerado de novo com as mesmas parcelas.");
}

function inputFicha(f, v, so){
  var id = "ups_"+f.c, dis = so ? " disabled" : "";
  var st = 'style="width:100%;padding:8px 10px;font-size:14px;min-height:38px"';
  if(f.t === "ro") return '<input id="'+id+'" '+st+' value="'+esc(v)+'" disabled>';
  if(f.t === "area") return '<textarea id="'+id+'" rows="2" '+st+dis+' placeholder="Somado ao texto automático das parcelas">'+esc(v)+'</textarea>';
  if(f.t === "sel"){
    var ops = UPS_LISTA[f.l].map(function(o){ return Array.isArray(o) ? o : [o,o]; });
    var temV = ops.some(function(o){ return o[0] === v; });
    return '<select id="'+id+'" '+st+dis+'><option value="">—</option>'+
      (v && !temV ? '<option value="'+esc(v)+'" selected>'+esc(v)+' (fora da lista!)</option>' : '')+

      '</select>';

  return '<input id="'+id+'" '+st+dis+ph+(f.t==="num"?' inputmode="decimal"':'')+' value="'+esc(v)+'">';
}

async function salvarFichaUpseller(cotacaoId, faturarDepois){
  var P = CART.fichaP;
  if(!P || P.cot.id !== cotacaoId){ msg("Abra a ficha de novo.", true); return; }
  var campos = {};
  UPS_CAMPOS.forEach(function(f){
    if(f.c === "C") return;
    var el = $("ups_"+f.c); if(!el) return;
    var v = String(el.value||"").trim();
    if(f.c === "I" || f.c === "AI") v = digitos(v);
    if(v !== "") campos[f.c] = v;
  });
  var itens = {}, novosDepara = [];
  var gravaDepara = $("ups_grava_depara") && $("ups_grava_depara").checked;
  Array.prototype.forEach.call(document.querySelectorAll("input[data-sku]"), function(el){
    var pid = el.getAttribute("data-sku"), vig = el.getAttribute("data-vig"), v = String(el.value||"").trim();
    if(!pid || !v) return;
    if(v !== vig) itens[pid] = { T:v };
    if(!vig && gravaDepara) novosDepara.push({ pid:pid, codigo:v });
  });

  var up = await sb.schema("crm").from("pedido_upseller").upsert({
    cotacao_id: cotacaoId, cliente_id: P.cot.cliente_id, campos: campos, itens: itens,
    atualizado_em: new Date().toISOString(), atualizado_por: ST.email
  }, { onConflict:"cotacao_id" }).select("cotacao_id");
  if(up.error){ msg("Não consegui salvar: "+up.error.message, true); return; }
  if(!(up.data||[]).length){ msg("O banco não gravou a ficha (nenhuma linha). Confira o acesso.", true); return; }
  var avisos = [];

  /* completar o cadastro do cliente: só o que está vazio lá */
  if($("ups_completa_cad") && $("ups_completa_cad").checked){
    var c = P.cli || {}, patch = {};
    UPS_CAMPOS.forEach(function(f){
      if(f.o !== "cad" || !campos[f.c]) return;
      if(c[f.k]) return;
      var v = campos[f.c];
      if(f.c === "M") v = ufSigla(v) || v;
      patch[f.k] = v;
    });
    if(Object.keys(patch).length){
      var rc = await sb.from("clientes").update(patch).eq("id", P.cot.cliente_id).select("id");
      if(rc.error || !(rc.data||[]).length) avisos.push("cadastro do cliente não foi completado"+(rc.error?" ("+rc.error.message+")":""));
      else avisos.push("cadastro do cliente completado ("+Object.keys(patch).length+" campo(s))");
    }
  }
  /* de-para: SKU novo para produto sem código vigente */
  for(var i=0;i<novosDepara.length;i++){
    var d = novosDepara[i];
    var ex = await sb.from("depara_sku").select("id,produto_acabado_id").eq("codigo", d.codigo).maybeSingle();
    if(ex.error){ avisos.push("de-para "+d.codigo+": "+ex.error.message); continue; }
    if(ex.data && ex.data.produto_acabado_id && ex.data.produto_acabado_id !== d.pid){
      avisos.push("SKU "+d.codigo+" já é de outro produto no de-para — ficou só neste pedido"); continue;
    }
    var rd = ex.data
      ? await sb.from("depara_sku").update({ vigente:true, produto_acabado_id:d.pid }).eq("id", ex.data.id).select("id")
      : await sb.from("depara_sku").insert({ codigo:d.codigo, produto_acabado_id:d.pid, plataforma:"Varejo", vigente:true,
          nome_anuncio:"via ficha UpSeller", criado_por:"FICHA_UPSELLER "+ST.email }).select("id");
    if(rd.error || !(rd.data||[]).length) avisos.push("de-para "+d.codigo+" não gravou"+(rd.error?": "+rd.error.message:""));
    else avisos.push("SKU "+d.codigo+" gravado no de-para");
  }
  msg("Dados UpSeller salvos."+(avisos.length ? " "+avisos.join(" · ")+"." : ""), avisos.some(function(a){ return /não|outro produto/.test(a); }));
  if(faturarDepois){ await faturarPedidos([cotacaoId]); return; }

var CART = { sel:{}, aberto:null, filtroOrc:"abertos" };

  rascunho:{r:"Rascunho", c:"#7A6A57"}, enviada:{r:"Orçamento enviado", c:"#B8862B"},
  aceita:{r:"Orçamento aceito", c:"#B8862B"}, pedido:{r:"Pedido a faturar", c:"#C97A1E"},
  exportado:{r:"Faturado, sem NF", c:"#6B46C1"}, faturado:{r:"Faturado com NF", c:"#3E7C45"},
  recusada:{r:"Recusado", c:"#C63A3A"}, expirada:{r:"Expirado", c:"#C63A3A"}

async function telaCarteira(){
  var r = await sb.schema("crm").from("cotacoes")
    .select("id,numero,cliente_id,oportunidade_id,status,valor_total,data_cotacao,validade,condicao_pagamento,numero_pedido_loja,pedido_gerado_em,faturado_em,faturado_por,arquivo_exportacao")
    .order("numero", {ascending:false}).limit(400);
  if(r.error){ pinta('<div class="card" style="--u:#C63A3A">Não consegui carregar a carteira: '+esc(r.error.message)+'</div>'); return; }
  var L = r.data || [];
  var ids = L.map(function(x){ return x.cliente_id; }).filter(Boolean);
  var nomes = {};
  if(ids.length){
    var rc = await sb.from("clientes").select("id,razao_social").in("id", ids);
    (rc.data||[]).forEach(function(c){ nomes[c.id] = c.razao_social; });
  }
  /* situação da ficha de cada pedido a faturar (avisa, não trava) */
  var pend = {};
  var aFat = L.filter(function(x){ return x.status === "pedido"; });
  for(var i=0;i<aFat.length;i++){
    var P = await carregarPedido(aFat[i].id);
    if(P) pend[aFat[i].id] = { p: pendenciasPedido(P), temFicha: !!P.ficha };
  }
  CART.lista = L; CART.nomes = nomes; CART.pend = pend;
  renderCarteira();
  if(CART.aberto && $("ficha-"+CART.aberto)){
    var alvo = CART.aberto; CART.aberto = null;
    abrirFichaUpseller(alvo);
    var el = $("ficha-"+alvo); if(el) el.scrollIntoView({behavior:"smooth", block:"center"});
  }
}

      var b = '<button class="s mini" onclick="baixarPdfProposta(\''+x.id+'\')">📄 PDF</button>'+

  /* 2 · Pedidos a faturar */

      var grave = pe.p.S.length || pe.p.N.length;

      var resumo = resumoPendencias(pe.p);
      var sub = '<div style="font-size:12.5px;margin-top:4px;color:'+cor+'"><b>'+

  var fat = L.filter(function(x){ return x.status === "exportado" || x.status === "faturado"; });
  h += '<div class="card" style="--u:#6B46C1"><h3>3 · Faturados ('+fat.length+')</h3>'+
    (fat.length ? fat.map(function(x){

        (x.status==="exportado" ? '<button class="s mini" onclick="reabrirFaturamento(\''+x.id+'\')">↩️ Reabrir (UpSeller recusou)</button>' : '');
      return cartLinha(x, b, { tag:tag, cor: atras ? "#C63A3A" : null,

    '<div style="font-size:12px;color:var(--tinta2);margin-top:8px"><b>Como ler:</b> a cor não é o status — pedido faturado há 3 dias ou mais ainda sem NF fica vermelho. '+
    'Pedido a faturar fica vermelho quando falta campo obrigatório da UpSeller, amarelo quando falta só recomendado.</div></div>';
  pinta(h);
}

async function salvarRepres(){
  var id = $("rId") ? $("rId").value.trim() : "";
  var nome = $("rn").value.trim();
  if(!nome) return msg("O nome é obrigatório", true);
  var comissao = Number($("rc").value);
  if(isNaN(comissao) || comissao < 0 || comissao > 100) return msg("Comissão precisa ser um número entre 0 e 100", true);
  var dados = {
    nome: nome,
    regiao: $("rr").value.trim() || null,
    telefone: $("rt").value.trim() || null,
    email: $("re").value.trim() || null,
    comissao_pct: comissao
  };
  var r;
  if(id){
    r = await sb.from("representantes").update(dados).eq("id", id);
  } else {
    dados.criado_por = ST.email;
    r = await sb.from("representantes").insert(dados);
  }
  if(r.error){
    if(String(r.error.message).indexOf("duplicate") >= 0) return msg("Já existe um representante com esse nome", true);
    return msg("Não deu para salvar: "+r.error.message, true);
  }
  msg(id ? "Representante atualizado" : "Representante cadastrado");
  telaRepres();
}

function formFiltroLiquidacao(){

  return '<div class="card" style="--u:#22303A"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">'+
    '<div style="flex:1;min-width:180px"><label for="liqBusca">Buscar (nº da NF ou cliente)</label>'+
      '<input id="liqBusca" value="'+esc(f.busca)+'" onkeydown="if(event.key===\'Enter\')buscarLiquidacaoDoForm()"></div>'+
    '<div><label for="liqStatus">Situação</label><select id="liqStatus" onchange="buscarLiquidacaoDoForm()">'+
      ["pendentes","atrasada","parcial","aberta","liquidada","sem_controle","todas"].map(function(k){
        return '<option value="'+k+'"'+(f.status===k?' selected':'')+'>'+LIQ_STATUS_ROTULO[k]+'</option>';
      }).join("")+
    '</select></div>'+
    '<button class="b" onclick="buscarLiquidacaoDoForm()">Buscar</button>'+

function buscarLiquidacaoDoForm(){
  ST.cache.liqFiltro.busca = $("liqBusca").value.trim();
  ST.cache.liqFiltro.status = $("liqStatus").value;
  buscarLiquidacao();
}
async function buscarLiquidacao(){
  var alvo = $("liqLista");
  if(!alvo) return;
  alvo.innerHTML = '<div class="vazio">Buscando…</div>';
  var f = ST.cache.liqFiltro;
  var campos = "nf_id,numero,emissao,cliente_id,v_prod,qtd_parcelas,valor_parcelado,valor_pago,status_liquidacao";

  function aplicaStatus(q){
    if(f.status === "pendentes") return q.in("status_liquidacao", ["aberta","atrasada","parcial"]);
    if(f.status !== "todas") return q.eq("status_liquidacao", f.status);
    return q;
  }

  var linhas = [];
  if(f.busca){
    var q1 = aplicaStatus(sb.from("vw_nf_venda_liquidacao").select(campos).ilike("numero","%"+f.busca+"%"))
      .order("emissao",{ascending:false}).limit(80);
    linhas = (await q1).data || [];
    if(!linhas.length){
      var rCli = await sb.from("clientes").select("id").ilike("razao_social","%"+f.busca+"%");
      var ids = (rCli.data||[]).map(function(c){return c.id;});
      if(ids.length){
        var q2 = aplicaStatus(sb.from("vw_nf_venda_liquidacao").select(campos).in("cliente_id", ids))
          .order("emissao",{ascending:false}).limit(80);
        linhas = (await q2).data || [];
      }
    }
  } else {
    var q0 = aplicaStatus(sb.from("vw_nf_venda_liquidacao").select(campos)).order("emissao",{ascending:false}).limit(80);
    linhas = (await q0).data || [];
  }

  if(!linhas.length){ alvo.innerHTML = '<div class="vazio">Nenhuma NF encontrada com esse filtro.</div>'; return; }

  var clienteIds = Array.from(new Set(linhas.map(function(l){return l.cliente_id;}).filter(Boolean)));
  var nomeCliente = {};
  if(clienteIds.length){
    var rC = await sb.from("clientes").select("id,razao_social").in("id", clienteIds);
    (rC.data||[]).forEach(function(c){ nomeCliente[c.id] = c.razao_social; });
  }
  ST.cache.liqNomeCliente = nomeCliente;

  alvo.innerHTML = '<div class="tw"><table><thead><tr><th>NF</th><th>Cliente</th><th>Emissão</th>'+
    '<th style="text-align:right">Valor</th><th style="text-align:right">Pago</th><th>Situação</th></tr></thead><tbody>'+
    linhas.map(function(l){
      return '<tr style="cursor:pointer" onclick="abrirDetalheLiquidacao(\''+l.nf_id+'\')">'+
        '<td class="mono">'+esc(l.numero)+'</td><td>'+esc(nomeCliente[l.cliente_id]||"—")+'</td>'+
        '<td class="mono">'+dataBR(l.emissao)+'</td>'+
        '<td class="n mono">R$ '+brl(l.v_prod)+'</td><td class="n mono">R$ '+brl(l.valor_pago)+'</td>'+
        '<td><span class="tag" style="background:'+(LIQ_STATUS_COR[l.status_liquidacao]||'#7A6A57')+'">'+
          (LIQ_STATUS_ROTULO[l.status_liquidacao]||l.status_liquidacao)+'</span></td></tr>';
    }).join("")+'</tbody></table></div>';
}
async function abrirDetalheLiquidacao(nfId){
  var alvo = $("liqDetalhe");
  if(!alvo) return;
  alvo.innerHTML = '<div class="vazio">Carregando…</div>';
  alvo.scrollIntoView({behavior:"smooth", block:"start"});

  var rNf = await sb.from("nf_venda").select("id,numero,emissao,v_prod,cliente_id").eq("id", nfId).single();
  var rP = await sb.from("nf_venda_parcela").select("*").eq("nf_id", nfId).order("numero_parcela");
  if(rNf.error || !rNf.data){ alvo.innerHTML = '<div class="card" style="--u:#C63A3A">Não consegui abrir a NF.</div>'; return; }
  var nf = rNf.data, parcelas = rP.data || [];
  var nomeCli = ST.cache.liqNomeCliente ? ST.cache.liqNomeCliente[nf.cliente_id] : null;

  ST.cache.liqNfAtual = nf;
  ST.cache.liqParcelasAtual = parcelas;
  ST.cache.liqNovoPlano = parcelas.length ? [] : [{numero:1, valor:Number(nf.v_prod)||0, vencimento:""}];

  var h = '<div class="ficha-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">'+
    '<div><div style="font-size:15px;font-weight:700">NF '+esc(nf.numero)+' · '+esc(nomeCli||"cliente")+'</div>'+
    '<div class="mono" style="font-size:11px;color:var(--tinta2)">Emitida '+dataBR(nf.emissao)+' · R$ '+brl(nf.v_prod)+'</div></div>'+
    '<button class="s mini" onclick="$(\'liqDetalhe\').innerHTML=\'\'">✕ Fechar</button></div></div>';

  h += '<div style="margin-top:10px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tinta2)">Parcelas</div>';
  h += '<div id="liqParcelasLista" style="margin-top:6px"></div>';

  h += '<div class="card" style="--u:#3E7C45;margin-top:10px"><h3 style="font-size:15px">'+
    (parcelas.length ? "Adicionar parcela" : "Gerar plano de parcelas")+'</h3>'+
    '<div id="liqPlanoContainer"></div>'+
    '<button class="s" style="margin-top:8px" onclick="adicionarLinhaPlano()">+ Adicionar parcela</button>'+
    '<button class="b" style="margin-top:12px" onclick="salvarPlanoParcelas()">Salvar parcelas</button>'+
    '</div>';

  alvo.innerHTML = h;
  renderParcelasLista();
  renderPlanoParcelas();
}
function renderParcelasLista(){
  var alvo = $("liqParcelasLista");
  if(!alvo) return;
  var parcelas = ST.cache.liqParcelasAtual || [];
  if(!parcelas.length){ alvo.innerHTML = '<div class="vazio">Nenhuma parcela cadastrada ainda.</div>'; return; }
  var hoje = new Date().toISOString().slice(0,10);
  alvo.innerHTML = parcelas.map(function(p){
    var atrasada = p.status === "aberta" && p.vencimento < hoje;
    var cor = p.status==="paga" ? "#3E7C45" : p.status==="cancelada" ? "#7A6A57" : atrasada ? "#C63A3A" : "#B8862B";
    var rotuloSit = p.status==="paga" ? "paga" : p.status==="cancelada" ? "cancelada" : atrasada ? "atrasada" : "aberta";
    return '<div class="card" style="--u:'+cor+';margin-bottom:6px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">'+
        '<div><b>Parcela '+p.numero_parcela+'</b> · vence '+dataBR(p.vencimento)+
          '<span class="tag" style="background:'+cor+';margin-left:6px">'+rotuloSit+'</span></div>'+
        '<div class="mono">R$ '+brl(p.valor)+'</div></div>'+
      (p.status==="paga" ? '<div style="font-size:12px;color:var(--tinta2);margin-top:4px">baixada em '+dataBR(p.pago_em)+
         (p.forma_pagamento?' · '+esc(p.forma_pagamento):'')+'</div>'
       : p.status==="aberta" ? '<div style="margin-top:8px"><button class="s mini" onclick="abrirBaixaParcela(\''+p.id+'\')">💰 Baixar</button></div>' : '')+
      '<div id="baixaForm_'+p.id+'"></div></div>';
  }).join("");
}
function abrirBaixaParcela(parcelaId){
  var alvo = $("baixaForm_"+parcelaId);
  if(!alvo) return;
  alvo.innerHTML = '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--linha)">'+
    '<label>Data do pagamento</label><input type="date" id="bxData_'+parcelaId+'" value="'+new Date().toISOString().slice(0,10)+'">'+
    '<label>Valor pago</label><input type="number" step="0.01" id="bxValor_'+parcelaId+'">'+
    '<label>Forma de pagamento</label><select id="bxForma_'+parcelaId+'">'+
      ["boleto","pix","cartao","dinheiro","outro"].map(function(f){return '<option value="'+f+'">'+f+'</option>';}).join("")+
    '</select>'+
    '<button class="b mini" style="margin-top:8px" onclick="confirmarBaixaParcela(\''+parcelaId+'\')">Confirmar baixa</button></div>';
}
async function confirmarBaixaParcela(parcelaId){
  var data = $("bxData_"+parcelaId).value;
  var valor = Number($("bxValor_"+parcelaId).value);
  var forma = $("bxForma_"+parcelaId).value;
  if(!data || !valor){ msg("Preencha data e valor.", true); return; }
  var r = await sb.rpc("baixar_parcela", {
    p_parcela_id: parcelaId, p_data_pagamento: data, p_valor_pago: valor,
    p_forma_pagamento: forma, p_responsavel: ST.email
  });
  if(r.error){ msg("Não deu para baixar: "+r.error.message, true); return; }
  msg("Parcela baixada.");
  abrirDetalheLiquidacao(ST.cache.liqNfAtual.id);
  buscarLiquidacao();
}
function adicionarLinhaPlano(){
  var plano = ST.cache.liqNovoPlano || [];
  var proxNum = (ST.cache.liqParcelasAtual||[]).length + plano.length + 1;
  plano.push({numero: proxNum, valor: 0, vencimento: ""});
  ST.cache.liqNovoPlano = plano;
  renderPlanoParcelas();
}
function atualizarLinhaPlano(idx, campo, valor){
  ST.cache.liqNovoPlano[idx][campo] = valor;
}
function removerLinhaPlano(idx){
  ST.cache.liqNovoPlano.splice(idx,1);
  renderPlanoParcelas();
}
function renderPlanoParcelas(){
  var alvo = $("liqPlanoContainer");
  if(!alvo) return;
  var plano = ST.cache.liqNovoPlano || [];
  alvo.innerHTML = plano.length ? plano.map(function(p, idx){
    return '<div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end;margin-top:8px">'+
      '<div><label>Nº</label><input type="number" min="1" value="'+p.numero+'" oninput="atualizarLinhaPlano('+idx+',\'numero\',Number(this.value))"></div>'+
      '<div><label>Valor</label><input type="number" step="0.01" value="'+p.valor+'" oninput="atualizarLinhaPlano('+idx+',\'valor\',Number(this.value))"></div>'+
      '<div><label>Vencimento</label><input type="date" value="'+p.vencimento+'" oninput="atualizarLinhaPlano('+idx+',\'vencimento\',this.value)"></div>'+
      '<button class="s mini" onclick="removerLinhaPlano('+idx+')">Remover</button></div>';
  }).join("") : '<div class="vazio">Nenhuma parcela nova — clique em "Adicionar parcela".</div>';
}
async function salvarPlanoParcelas(){
  var plano = ST.cache.liqNovoPlano || [];
  if(!plano.length){ msg("Adicione ao menos uma parcela.", true); return; }
  for(var i=0;i<plano.length;i++){
    if(!plano[i].vencimento || !plano[i].valor){ msg("Preencha valor e vencimento de todas as parcelas.", true); return; }
  }
  var r = await sb.rpc("gerar_parcelas_nf", {
    p_nf_id: ST.cache.liqNfAtual.id,
    p_parcelas: plano.map(function(p){ return {numero:p.numero, valor:p.valor, vencimento:p.vencimento}; }),
    p_responsavel: ST.email
  });
  if(r.error){ msg("Não deu para gravar: "+r.error.message, true); return; }
  msg("Parcelas gravadas.");
  abrirDetalheLiquidacao(ST.cache.liqNfAtual.id);
  buscarLiquidacao();
}

async function telaNovaProposta(){
  ST.cache.propModoStandalone = true;
  ST.cache.propItensAtual = [];
  ST.cache.npFiltroLinha = "Todas";
  ST.cache.npClienteResolvido = false;
  ST.cache.npClienteEmSelecao = false;
  ST.cache.margemDesbloqueada = false;
  ST.cache.propMargemRegime = undefined;
  ST.cache.propMargemImpostos = undefined;
  ST.cache.propMargemCmv = undefined;
  ST.cache.propCotacaoEditando = null;
  ST.cache.propCotacaoAtual = null;
  pinta('<div class="vazio">Carregando catálogo…</div>');

  var rFaixas = await sb.schema("crm").from("bonificacao_faixas")
    .select("id,valor_minimo,qtd_potes").eq("ativa", true).order("valor_minimo", {ascending:true});
  ST.cache.propFaixasBonif = rFaixas.data || [];

  var rCustoRef = await sb.from("sku_custo_referencia_externa").select("produto_acabado_id,custo_pote");
  ST.cache.propCustosRef = {};
  (rCustoRef.data||[]).forEach(function(c){ ST.cache.propCustosRef[c.produto_acabado_id] = Number(c.custo_pote)||0; });

  var rTab = await sb.schema("crm").from("tabelas_preco")
    .select("id,nome,pedido_minimo").eq("ativa", true).order("pedido_minimo", {ascending:true});
  var tabelas = rTab.data || [];
  var tabelaItens = {};
  if(tabelas.length){
    var rTI = await sb.schema("crm").from("tabela_preco_itens")
      .select("tabela_id,produto_acabado_id,preco_unitario,preco_sugerido")
      .in("tabela_id", tabelas.map(function(t){ return t.id; }));
    (rTI.data||[]).forEach(function(it){
      if(!it.produto_acabado_id) return;
      if(!tabelaItens[it.tabela_id]) tabelaItens[it.tabela_id] = {};
      tabelaItens[it.tabela_id][it.produto_acabado_id] = { preco_unitario:Number(it.preco_unitario)||0, preco_sugerido:Number(it.preco_sugerido)||0 };
    });
  }
  var idsComPreco = Array.from(new Set(
    Object.keys(tabelaItens).reduce(function(acc,tid){ return acc.concat(Object.keys(tabelaItens[tid])); }, [])
  ));
  var rP = await sb.from("produto_acabado").select("id,nome,linha").eq("ativo", true);
  ST.cache.produtos = rP.data || [];
  var produtosCatalogo = (rP.data||[]).filter(function(p){ return idsComPreco.indexOf(p.id) >= 0; })
    .sort(function(a,b){ return a.nome.localeCompare(b.nome); });

  ST.cache.propTabelas = tabelas;
  ST.cache.propTabelaItens = tabelaItens;
  ST.cache.npProdutos = produtosCatalogo;
  ST.cache.npLinhas = ["Todas"].concat(
    Array.from(new Set(produtosCatalogo.map(function(p){ return p.linha; }).filter(Boolean))).sort()
  );

  var menorMinimo = tabelas.length ? tabelas[0].pedido_minimo : 1000;
  var h = '<div class="card" style="--u:#22303A">'+
      '<label for="npBusca">Buscar produto</label>'+
      '<input id="npBusca" placeholder="Nome do produto…" oninput="renderCatalogoProposta()">'+
      '<div id="npChips" style="display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px"></div>'+
    '</div>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">'+
      '<span class="tag" style="background:#7A6A57">🚚 Frete CIF</span>'+
      '<span class="tag" style="background:#7A6A57">🎁 Bonificação até 3%</span>'+
      '<span class="tag" style="background:#7A6A57">🤝 Comissão padrão 5%</span>'+
      '<span class="tag" style="background:#7A6A57">📦 Mínimo R$ '+brl(menorMinimo)+'</span>'+
    '</div>'+
    '<details style="margin-top:8px;font-size:12.5px;color:var(--tinta2)"><summary style="cursor:pointer">Condição de pagamento por histórico de compras</summary>'+
      '<div class="tw" style="margin-top:6px"><table><tbody>'+
        '<tr><td>1ª–3ª compra</td><td>PIX à vista (5% de desconto) ou cartão 3x sem juros</td></tr>'+
        '<tr><td>4ª+, até R$ 1.000</td><td>Boleto 14/21 dias (crédito aprovado)</td></tr>'+
        '<tr><td>4ª+, R$ 1.000,01–3.000</td><td>Boleto 14/21/28/35 dias</td></tr>'+
        '<tr><td>4ª+, acima de R$ 3.000</td><td>Boleto 14/21/28/35/42 dias</td></tr>'+
      '</tbody></table></div>'+
    '</details>'+
    '<div id="npLista" style="margin-top:10px"></div>'+
    '<div id="npResumoCarrinho" style="margin-top:10px"></div>'+
    '<div id="npClienteContainer" style="margin-top:12px"></div>'+
    '<div id="npFormularioContainer" style="margin-top:12px"></div>';
  pinta(h);
  renderChipsCatalogoProposta();
  renderCatalogoProposta();
  renderResumoCarrinhoProposta();
}
function renderChipsCatalogoProposta(){
  var alvo = $("npChips"); if(!alvo) return;
  alvo.innerHTML = (ST.cache.npLinhas||["Todas"]).map(function(l){
    var ativo = l === ST.cache.npFiltroLinha;
    return '<button class="'+(ativo?"b":"s")+' mini" style="white-space:nowrap" '+
      'onclick="ST.cache.npFiltroLinha='+"'"+l.replace(/'/g,"\\'")+"'"+';renderChipsCatalogoProposta();renderCatalogoProposta();">'+esc(l)+'</button>';
  }).join("");
}
function melhorTabelaCarrinho(){
  var total = (ST.cache.propItensAtual||[]).filter(function(it){ return !it.bonificado; })
    .reduce(function(a,it){ return a + totalItemProposta(it); }, 0);
  return melhorTabelaProposta(total);
}
function precoAtualCatalogo(produtoId){
  var tab = melhorTabelaCarrinho();
  if(tab){
    var p = precoNaTabelaProposta(tab.id, produtoId);
    if(p) return p.preco_unitario;
  }
  var tabelas = (ST.cache.propTabelas||[]).slice().sort(function(a,b){ return a.pedido_minimo - b.pedido_minimo; });
  for(var i=0;i<tabelas.length;i++){
    var p2 = precoNaTabelaProposta(tabelas[i].id, produtoId);
    if(p2) return p2.preco_unitario;
  }
  return null;
}
function qtdNoCarrinho(produtoId){
  var item = (ST.cache.propItensAtual||[]).filter(function(it){ return it.produto_acabado_id === produtoId; })[0];
  return item ? Number(item.qtd)||0 : 0;
}
function alterarQtdCatalogo(produtoId, delta){
  var itens = ST.cache.propItensAtual;
  var item = itens.filter(function(it){ return it.produto_acabado_id === produtoId; })[0];
  if(!item){
    if(delta <= 0) return;
    var prod = (ST.cache.npProdutos||[]).filter(function(p){ return p.id === produtoId; })[0];
    item = { produto_acabado_id:produtoId, descricao: prod?prod.nome:"", qtd:0, valor_unitario: precoAtualCatalogo(produtoId)||0, desconto_pct:0, bonificado:false };
    itens.push(item);
  }
  item.qtd = Math.max(0, (Number(item.qtd)||0) + delta);
  if(item.qtd === 0){
    ST.cache.propItensAtual = itens.filter(function(it){ return it !== item; });
  } else {
    var preco = precoAtualCatalogo(produtoId);
    if(preco != null) item.valor_unitario = preco;
  }
  renderCatalogoProposta();
  renderResumoCarrinhoProposta();
}
function renderCatalogoProposta(){
  var alvo = $("npLista"); if(!alvo) return;
  var busca = ($("npBusca") ? $("npBusca").value : "").toLowerCase();
  var linha = ST.cache.npFiltroLinha || "Todas";
  var lista = (ST.cache.npProdutos||[]).filter(function(p){
    return (linha==="Todas" || p.linha===linha) && p.nome.toLowerCase().indexOf(busca) >= 0;
  });
  alvo.innerHTML = lista.length ? lista.map(function(p){
    var qtd = qtdNoCarrinho(p.id);
    var preco = precoAtualCatalogo(p.id);
    return '<div style="display:flex;align-items:center;gap:10px;border:1px solid var(--linha);border-radius:12px;padding:10px 12px;margin-bottom:8px">'+
      '<div style="flex:1;min-width:0">'+
        '<div style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.nome)+'</div>'+
        '<div style="font-size:12px;color:var(--tinta2);margin-top:2px">'+(p.linha?esc(p.linha)+' · ':'')+(preco!=null?'R$ '+brl(preco):'sem preço de tabela')+'</div>'+
      '</div>'+
      (qtd>0 ?
        '<div style="display:flex;align-items:center;gap:6px">'+
          '<button class="s mini" onclick="alterarQtdCatalogo(\''+p.id+'\',-1)">−</button>'+
          '<span style="min-width:16px;text-align:center;font-family:ui-monospace,Menlo,monospace">'+qtd+'</span>'+
          '<button class="s mini" onclick="alterarQtdCatalogo(\''+p.id+'\',1)">+</button>'+
        '</div>'
       : '<button class="s mini" onclick="alterarQtdCatalogo(\''+p.id+'\',1)">+ Adicionar</button>')+
    '</div>';
  }).join("") : '<div class="vazio">Nenhum produto encontrado.</div>';
}
function renderResumoCarrinhoProposta(){
  var alvo = $("npResumoCarrinho"); if(!alvo) return;
  var itens = ST.cache.propItensAtual || [];
  var n = itens.reduce(function(a,it){ return a + (Number(it.qtd)||0); }, 0);
  if(!n){
    alvo.innerHTML = "";
    ST.cache.npClienteResolvido = false;
    ST.cache.npClienteEmSelecao = false;
    $("npClienteContainer").innerHTML = "";
    $("npFormularioContainer").innerHTML = "";
    return;
  }
  var total = itens.filter(function(it){ return !it.bonificado; }).reduce(function(a,it){ return a + totalItemProposta(it); }, 0);
  var tab = melhorTabelaCarrinho();
  var tabelasOrd = (ST.cache.propTabelas||[]).slice().sort(function(a,b){ return a.pedido_minimo - b.pedido_minimo; });
