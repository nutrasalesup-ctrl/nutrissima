<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#33200F">
<title>Nutríssima · Pedir compra</title>
<style>
:root{--cacau:#33200F;--leite:#FFFDF9;--casca:#EFE7DC;--pistache:#3E7C45;--pistache-esc:#2E5F34;--morango:#C63A3A;--mel:#B8862B;--laranja:#D9772B;--linha:#DCD2C4;--raio:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--leite)}
body{font-family:-apple-system,system-ui,'Segoe UI',sans-serif;color:var(--cacau);min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--cacau);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 20px}
header small{display:block;opacity:.7;font-size:13px;font-weight:600;margin-bottom:4px}
header h1{font-size:24px;font-weight:900;line-height:1.15}
header p{font-size:14px;opacity:.85;margin-top:6px;line-height:1.4;max-width:34em}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.campo{margin-bottom:20px}
label.t{display:block;font-weight:800;font-size:16px;margin-bottom:8px}
label.t span{font-weight:500;color:#7A6A58;font-size:14px}
input,textarea{width:100%;padding:13px 14px;font-size:17px;border:1.5px solid var(--linha);border-radius:12px;font-family:inherit;background:#fff;color:var(--cacau)}
textarea{min-height:88px;resize:vertical;line-height:1.4}
input:focus,textarea:focus{outline:none;border-color:var(--pistache)}
.dupla{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;align-items:start}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--linha);background:#fff;font:600 15px inherit;font-family:inherit;color:var(--cacau);cursor:pointer}
.chips button.sel{background:#E9DCC8;border-color:#C9AF8C;font-weight:900}
.urg{display:grid;gap:10px}
.urg button{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;min-height:64px;border-radius:var(--raio);border:1.5px solid var(--linha);border-left:8px solid var(--linha);background:#fff;font-family:inherit;color:var(--cacau);cursor:pointer}
.urg b{display:block;font-size:17px}
.urg em{display:block;font-style:normal;font-size:13px;color:#7A6A58;margin-top:2px}
.urg button[data-u=normal]{border-left-color:var(--mel)}
.urg button[data-u=urgente]{border-left-color:var(--laranja)}
.urg button[data-u=parada]{border-left-color:var(--morango)}
.urg button.sel[data-u=normal]{background:#F6ECD6;border-color:var(--mel)}
.urg button.sel[data-u=urgente]{background:#FBE6D6;border-color:var(--laranja)}
.urg button.sel[data-u=parada]{background:#FBEAEA;border-color:var(--morango)}
.codigo input{font-family:ui-monospace,Menlo,monospace;letter-spacing:.3em;font-size:22px;text-align:center;max-width:220px}
.btnP{width:100%;min-height:58px;font-size:18px;font-weight:900;border:none;border-radius:16px;background:var(--pistache);color:#fff;cursor:pointer;font-family:inherit}
.btnP:disabled{opacity:.55}
.btnSec{width:100%;min-height:50px;font-size:16px;font-weight:700;border:1.5px solid var(--linha);border-radius:14px;background:#fff;cursor:pointer;font-family:inherit;color:var(--cacau);margin-top:10px}
.erro{background:#FBEAEA;color:var(--morango);border-left:6px solid var(--morango);border-radius:10px;padding:12px 14px;font-weight:700;margin-bottom:14px;display:none}
.ok{display:none;text-align:center;padding:30px 6px}
.ok .num{font-family:ui-monospace,Menlo,monospace;font-size:44px;font-weight:700;color:var(--pistache-esc);margin:14px 0 6px}
.ok h2{font-size:22px}
.ok p{color:#5D4C3A;line-height:1.5;margin:10px auto;max-width:28em}
.ok .resumo{background:#fff;border:1.5px solid var(--linha);border-left:8px solid var(--pistache);border-radius:var(--raio);padding:14px 16px;text-align:left;margin:18px 0}
.lembrar{font-size:13px;color:#7A6A58;margin-top:6px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #9CC3A0;outline-offset:2px}
</style>
</head>
<body>
<header>
  <small>Nutríssima</small>
  <h1>Pedir compra</h1>
  <p>Precisa de algo que está acabando ou faltou? Registre aqui. A Raquel recebe na hora e responde pelo sistema.</p>
</header>

<main>
  <form id="f" autocomplete="off" novalidate>
    <div class="erro" id="erro"></div>

    <div class="campo">
      <label class="t" for="nome">Seu nome</label>
      <input id="nome" maxlength="80" autocomplete="name">
    </div>

    <div class="campo">
      <label class="t" for="desc">O que precisa</label>
      <textarea id="desc" maxlength="300" placeholder="Ex.: luva nitrílica tamanho M, fita adesiva, pote 450g"></textarea>
    </div>

    <div class="campo">
      <label class="t">Quantidade <span>(se souber)</span></label>
      <div class="dupla">
        <input id="qtd" inputmode="decimal" placeholder="0">
        <div class="chips" id="unid">
          <button type="button" data-v="un">un</button>
          <button type="button" data-v="cx">cx</button>
          <button type="button" data-v="kg">kg</button>
          <button type="button" data-v="pct">pct</button>
          <button type="button" data-v="L">L</button>
          <button type="button" data-v="rolo">rolo</button>
        </div>
      </div>
    </div>

    <div class="campo">
      <label class="t">Para quando</label>
      <div class="chips" id="quando">
        <button type="button" data-d="0">Hoje</button>
        <button type="button" data-d="1">Amanhã</button>
        <button type="button" data-d="3">Em 3 dias</button>
        <button type="button" data-d="7">Em 1 semana</button>
        <button type="button" data-d="x">Outra data</button>
      </div>
      <input id="data" type="date" style="display:none;margin-top:10px">
    </div>

    <div class="campo">
      <label class="t">Urgência</label>
      <div class="urg" id="urg">
        <button type="button" data-u="normal" class="sel"><div><b>Normal</b><em>Está acabando, dá para esperar a compra de rotina</em></div></button>
        <button type="button" data-u="urgente"><div><b>Urgente</b><em>Vai faltar nos próximos dias</em></div></button>
        <button type="button" data-u="parada"><div><b>Produção parada</b><em>Já faltou e está travando o trabalho</em></div></button>
      </div>
    </div>

    <div class="campo">
      <label class="t" for="motivo">Observação <span>(opcional)</span></label>
      <textarea id="motivo" maxlength="500" style="min-height:64px" placeholder="Ex.: marca que funciona melhor, onde vai ser usado"></textarea>
    </div>

    <div class="campo codigo">
      <label class="t" for="cod">Código da fábrica</label>
      <input id="cod" inputmode="numeric" maxlength="12" autocomplete="off">
      <div class="lembrar">Fica guardado neste celular depois do primeiro envio.</div>
    </div>

    <button class="btnP" id="enviar" type="submit">Enviar pedido de compra</button>
  </form>

  <div class="ok" id="ok">
    <h2>Pedido enviado</h2>
    <div class="num" id="okNum"></div>
    <p>Anote este número. É por ele que a Raquel e você falam deste pedido.</p>
    <div class="resumo" id="okResumo"></div>
    <button class="btnP" id="outro" type="button">Fazer outro pedido</button>
  </div>
</main>

<script>
(function(){
  var URL_RPC = 'https://nfzospymzvlwzlcpgolm.supabase.co/rest/v1/rpc/solicitar_compra';
  var CHAVE = 'sb_publishable_tNe4G9C0re2YDN9lsnRQXg_zQgFLmzn';
  var $ = function(id){ return document.getElementById(id); };
  var estado = { unidade: null, dias: null, urgencia: 'normal' };

  function ler(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
  function gravar(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  $('nome').value = ler('sc_nome');
  $('cod').value = ler('sc_codigo');

  function hojeLocal(somar){
    var d = new Date(); d.setDate(d.getDate() + somar);
    var m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + dd;
  }
  $('data').min = hojeLocal(0);

  function grupo(id, attr, aoEscolher){
    var botoes = $(id).querySelectorAll('button');
    botoes.forEach(function(b){
      b.addEventListener('click', function(){
        var jaSel = b.classList.contains('sel');
        botoes.forEach(function(x){ x.classList.remove('sel'); });
        if (jaSel && id !== 'urg') { aoEscolher(null); return; }
        b.classList.add('sel');
        aoEscolher(b.getAttribute(attr));
      });
    });
  }
  grupo('unid', 'data-v', function(v){ estado.unidade = v; });
  grupo('urg', 'data-u', function(v){ estado.urgencia = v; });
  grupo('quando', 'data-d', function(v){
    estado.dias = v;
    $('data').style.display = (v === 'x') ? 'block' : 'none';
    if (v === 'x') $('data').focus();
  });

  function mostrarErro(t){
    var e = $('erro'); e.textContent = t; e.style.display = 'block';
    e.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function dataEscolhida(){
    if (estado.dias === null) return null;
    if (estado.dias === 'x') return $('data').value || null;
    return hojeLocal(parseInt(estado.dias, 10));
  }

  function fmtData(iso){
    if (!iso) return 'sem data';
    var p = iso.split('-'); return p[2] + '/' + p[1];
  }

  function esc(t){
    return String(t).replace(/[&<>"']/g, function(c){
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  $('f').addEventListener('submit', function(ev){
    ev.preventDefault();
    $('erro').style.display = 'none';
    var nome = $('nome').value.trim(), desc = $('desc').value.trim(), cod = $('cod').value.trim();
    var qtdTxt = $('qtd').value.trim().replace(',', '.');
    var qtd = qtdTxt === '' ? null : Number(qtdTxt);
    var data = dataEscolhida();

    if (nome.length < 2) return mostrarErro('Escreva seu nome.');
    if (desc.length < 2) return mostrarErro('Escreva o que precisa comprar.');
    if (qtd !== null && (!isFinite(qtd) || qtd <= 0)) return mostrarErro('A quantidade precisa ser um número maior que zero.');
    if (estado.dias === 'x' && !data) return mostrarErro('Escolha a data ou toque em outra opção de prazo.');
    if (!cod) return mostrarErro('Digite o código da fábrica. Peça a um responsável se não souber.');

    var corpo = {
      p_codigo: cod, p_solicitante: nome, p_descricao: desc,
      p_quantidade: qtd, p_unidade: estado.unidade, p_precisa_ate: data,
      p_urgencia: estado.urgencia, p_motivo: $('motivo').value.trim() || null
    };
    var btn = $('enviar'); btn.disabled = true; btn.textContent = 'Enviando…';

    fetch(URL_RPC, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': CHAVE },
      body: JSON.stringify(corpo)
    }).then(function(r){
      return r.json().then(function(j){ return { status: r.status, j: j }; });
    }).then(function(res){
      var j = res.j || {};
      if (res.status !== 200) throw new Error((j && j.message) || ('Servidor respondeu ' + res.status));
      if (!j.ok) { mostrarErro(j.erro || 'Não foi possível enviar.'); return; }
      gravar('sc_nome', nome); gravar('sc_codigo', cod);
      var urgTxt = { normal: 'Normal', urgente: 'Urgente', parada: 'Produção parada' }[estado.urgencia];
      $('okNum').textContent = j.numero;
      $('okResumo').innerHTML =
        '<b>' + esc(desc) + '</b><br>' +
        (qtd !== null ? esc(qtd + ' ' + (estado.unidade || '')) + '<br>' : '') +
        'Para: ' + esc(fmtData(data)) + '<br>Urgência: ' + esc(urgTxt);
      $('f').style.display = 'none'; $('ok').style.display = 'block';
      window.scrollTo(0, 0);
    }).catch(function(e){
      mostrarErro('Sem conexão com o sistema. Confira a internet e tente de novo. (' + e.message + ')');
    }).finally(function(){
      btn.disabled = false; btn.textContent = 'Enviar pedido de compra';
    });
  });

  $('outro').addEventListener('click', function(){
    $('desc').value = ''; $('qtd').value = ''; $('motivo').value = ''; $('data').value = '';
    estado.unidade = null; estado.dias = null; estado.urgencia = 'normal';
    document.querySelectorAll('#unid button, #quando button').forEach(function(b){ b.classList.remove('sel'); });
    document.querySelectorAll('#urg button').forEach(function(b){ b.classList.toggle('sel', b.getAttribute('data-u') === 'normal'); });
    $('data').style.display = 'none';
    $('ok').style.display = 'none'; $('f').style.display = 'block';
    window.scrollTo(0, 0);
  });
})();
</script>
</body>
</html>
